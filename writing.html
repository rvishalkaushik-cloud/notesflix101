<style>
:root{--bg:#0b0b0f;--panel:#14141b;--panel2:#1b1b24;--line:rgba(255,255,255,.1);--ink:#f5f5f7;--dim:#a7a7b5;--red:#e50914;--green:#22c55e;--amber:#f5b301;--violet:#b847ff;--teal:#14d6c3;--blue:#4da3ff;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.hide{display:none !important}
.note{color:var(--dim);font-size:13px}

.btn.small{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* hub */
.cls{margin:0 0 22px}
.cls h2{display:flex;align-items:center;gap:10px}
.cls h2 i{font-style:normal;font:800 11px var(--body);letter-spacing:.12em;color:var(--dim)}

.sub{display:block;text-decoration:none;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .15s ease,border-color .15s ease}
.sub:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25)}
.sub::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--red))}
.sub b{display:block;font:800 16px/1.3 var(--body)}
.sub span{display:block;color:var(--dim);font-size:13px;margin-top:4px}
.sub .prog{margin-top:10px;height:5px;border-radius:9px;background:var(--panel2);overflow:hidden}
.sub .prog i{display:block;height:100%;background:var(--green)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 26px}
.how .card{padding:14px}
.how .card b{display:block;margin-bottom:4px}
.how .card p{margin:0;color:var(--dim);font-size:14px}
.how .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--red);font:800 13px var(--body);margin-bottom:8px}
/* subject page */
.rules{margin:0 0 20px}
.rules summary{cursor:pointer;font:800 16px var(--body);list-style:none;display:flex;align-items:center;gap:8px}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:"＋";margin-left:auto;color:var(--dim)}
.rules[open] summary::after{content:"－"}
.rules ul{margin:12px 0 0;padding-left:20px}
.rules li{margin:0 0 8px;color:#e4e4ea}
.rules li b{color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font:700 13px var(--body);color:var(--dim)}
.fchip.on{background:#fff;color:#000;border-color:#fff}
select.fsel{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font:700 13px var(--body);max-width:100%}

.qi .qt{flex:1;min-width:0}
.qi .qt b{display:block;font:700 15px/1.45 var(--body)}
.qi .qt span{display:block;color:var(--dim);font-size:12px;margin-top:4px}
.qi .st{flex:0 0 auto;font:800 12px var(--body);color:var(--dim);white-space:nowrap}

.pill.amb{background:rgba(245,179,1,.18);color:#ffe7a3}
.qtext{font:700 19px/1.5 var(--body);margin:0 0 12px}
.ask{border-left:3px solid var(--amber);padding:8px 12px;background:rgba(245,179,1,.07);border-radius:0 10px 10px 0;margin:0 0 18px;font-size:14px;color:#f3e7c4}

.step .sh .note{margin-left:auto}

.wc{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--dim)}
.wc b.ok{color:var(--green)}.wc b.lo{color:var(--amber)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}

.tab small{display:block;font:700 12px var(--body);margin-top:4px;color:var(--dim)}
.tab.on.weak{border-color:#ff5470;background:rgba(255,84,112,.14)}
.tab.on.good{border-color:var(--amber);background:rgba(245,179,1,.12)}
.tab.on.full{border-color:var(--green);background:rgba(34,197,94,.12)}
.ans{border-radius:14px;padding:16px;border:1px solid var(--line);background:#101016}
.ans .sc{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.ans .sc .big{font:800 26px/1 var(--body)}
.ans.weak .big{color:#ff8fa3}.ans.good .big{color:#ffd66b}.ans.full .big{color:#7ee2a0}
.ans .body{font-size:15.5px;line-height:1.7;color:#ececf1}
.ans .body p{margin:0 0 8px}
.ans .body table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:14px}
.ans .body th,.ans .body td{border:1px solid rgba(255,255,255,.18);padding:6px 8px;text-align:left;vertical-align:top}
.ans .body th{background:rgba(255,255,255,.06)}
.mp{background:rgba(34,197,94,.10);box-shadow:inset 3px 0 0 var(--green);border-radius:3px;padding:1px 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mp[data-p]::after{content:attr(data-p);font:800 10px var(--body);color:#04210f;background:var(--green);border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:super}
.notes{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.notes li{font-size:14px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);display:flex;gap:8px}
.notes li i{font-style:normal;flex:0 0 auto}
.check{display:grid;gap:8px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.ck .bx{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--dim);display:grid;place-items:center;font:800 13px var(--body)}
.ck.on{border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.1)}
.ck.on .bx{background:var(--green);border-color:var(--green);color:#04210f}
.ck .pt{flex:1;font-size:14.5px}
.ck .pm{font:800 12px var(--body);color:var(--dim)}
.ck .hint{display:block;font:700 11px var(--body);color:var(--teal);margin-top:3px}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding:12px;border-radius:12px;background:linear-gradient(120deg,rgba(229,9,20,.12),rgba(184,71,255,.1));border:1px solid rgba(229,9,20,.3)}
.score .v{font:800 24px var(--body)}
.mist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.mist li{padding:9px 12px;border-radius:10px;background:rgba(255,84,112,.08);border:1px solid rgba(255,84,112,.25);font-size:14px}
.tip{padding:10px 12px;border-radius:10px;background:rgba(20,214,195,.08);border:1px solid rgba(20,214,195,.3);font-size:14px;margin-top:10px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:20px}
@media (max-width:640px){
  h1{font-size:27px}.qtext{font-size:17px}
  .tab{font-size:13px;padding:9px 4px}
  .step .sh .note{display:none}
}
</style>

    { slug:"ix-hin", cls:"IX", subject:"Hindi (Ganga)", c:"#ff5470", lang:"hi" }
  ];
  var L = {
    en:{ try:"Write your answer first", tryN:"Try it before you peek. Your draft is saved on this device.", words:"words", aim:"Aim for", compare:"Compare three answers", weak:"Weak answer", good:"Good answer", full:"Full-marks answer", check:"Mark your own answer", checkN:"Tick each point your answer covers.", found:"found in your answer", your:"Your score", mist:"Common mistakes", tipT:"Examiner's tip", prev:"← Previous", next:"Next →", all:"All", marks:"marks", mk:"M", wants:"What the examiner wants:", reveal:"Show the answers", done:"Done", todo:"Not tried", rules:"How to write answers in this subject", allCh:"All chapters", qs:"questions", back:"← All subjects", list:"← Questions", save:"Save my score", saved:"Saved" },
    hi:{ try:"पहले अपना उत्तर लिखिए", tryN:"उत्तर देखने से पहले खुद लिखिए। आपका उत्तर इसी डिवाइस पर सुरक्षित रहता है।", words:"शब्द", aim:"लक्ष्य", compare:"तीन उत्तरों की तुलना कीजिए", weak:"कमज़ोर उत्तर", good:"अच्छा उत्तर", full:"पूरे अंकों वाला उत्तर", check:"अपने उत्तर को स्वयं जाँचिए", checkN:"जो बिंदु आपके उत्तर में हैं, उन पर टिक कीजिए।", found:"आपके उत्तर में मिला", your:"आपके अंक", mist:"आम गलतियाँ", tipT:"परीक्षक की सलाह", prev:"← पिछला", next:"अगला →", all:"सभी", marks:"अंक", mk:"अंक", wants:"परीक्षक क्या चाहता है:", reveal:"उत्तर दिखाइए", done:"हो गया", todo:"बाकी", rules:"इस विषय में उत्तर कैसे लिखें", allCh:"सभी पाठ", qs:"प्रश्न", back:"← सभी विषय", list:"← प्रश्न", save:"मेरे अंक सहेजें", saved:"सहेजा गया" }
  };
  var DATA = {};
  window.NFWrite = { register:function(d){ DATA[d.slug] = d; } };

  var STORE = "notesflix101.write";
  function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
  function save(s){ try{ localStorage.setItem(STORE, JSON.stringify(s)); }catch(e){} }
  var state = load();
  function rec(slug, qid){ state[slug] = state[slug] || {}; state[slug][qid] = state[slug][qid] || {}; return state[slug][qid]; }

  var app = document.getElementById("app");
  var backBtn = document.getElementById("backBtn");
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function meta(slug){ for(var i=0;i<SUBJECTS.length;i++) if(SUBJECTS[i].slug === slug) return SUBJECTS[i]; return null; }
  function words(t){ var m = String(t||"").trim().match(/\S+/g); return m ? m.length : 0; }
  function aimWords(m, d){ if(d && d.words && d.words[m]) return d.words[m]; return ({1:"20–30",2:"40–50",3:"60–80",4:"80–100",5:"120–150",6:"150–200"})[m] || "80–120"; }
  function track(ev, p){ try{ if(window.gtag) gtag("event", ev, p || {}); }catch(e){} }

  function loadScript(slug, cb){
    if(DATA[slug]) return cb();
    var s = document.createElement("script");
    s.src = "writing/data/" + slug + ".js";
    s.onload = cb; s.onerror = function(){ app.innerHTML = '<p class="note">This subject is coming soon.</p>'; };
    document.head.appendChild(s);
  }

  function route(){
    var p = new URLSearchParams(location.search);
    var slug = p.get("s"), q = location.hash.replace(/^#/, "");
    window.scrollTo(0, 0);
    if(!slug){ backBtn.href = "index.html"; backBtn.textContent = "← Home"; return hub(); }
    loadScript(slug, function(){
      var d = DATA[slug]; if(!d) return;
      var lang = L[d.lang || "en"];
      document.documentElement.lang = d.lang || "en";
      if(q){ backBtn.href = "writing.html?s=" + slug; backBtn.textContent = lang.list; return question(d, q); }
      backBtn.href = "writing.html"; backBtn.textContent = lang.back;
      subject(d);

  }

  function hub(){
    document.title = "Answer Writing Lab | Notesflix 101";
    var h = '<div class="kick">Answer Writing Lab</div><h1>Write answers that score full marks</h1>'
      + '<p class="lead">Knowing the content is half the job. For real board-style questions, see a weak answer, a good answer and a full-marks answer side by side, and exactly what earned or lost each mark.</p>'

      + '<div class="card"><span class="n">1</span><b>Write your answer</b><p>Attempt the question in the box, with a word-count guide.</p></div>'

      + '</div>';
    ["XII","XI","X","IX"].forEach(function(c){
      var list = SUBJECTS.filter(function(s){ return s.cls === c; });
      h += '<section class="cls"><h2>Class ' + c + ' <i>' + list.length + ' SUBJECTS</i></h2><div class="subs">';

    });
    app.innerHTML = h;
  }

  var filt = { m:"all", ch:"" };
  function subject(d){
    var lang = L[d.lang || "en"], m = meta(d.slug) || {};
    document.title = "Answer Writing Lab · Class " + d.cls + " " + d.subject + " | Notesflix 101";
    var st = state[d.slug] || {};
    var marksSet = []; d.questions.forEach(function(q){ if(marksSet.indexOf(q.marks) < 0) marksSet.push(q.marks); }); marksSet.sort();
    var chs = []; d.questions.forEach(function(q){ if(!chs.some(function(c){ return c[0] === q.ch; })) chs.push([q.ch, q.chTitle]); });
    var h = '<div class="kick">Answer Writing Lab · Class ' + esc(d.cls) + '</div><h1>' + esc(d.subject) + '</h1>'

    d.questions.forEach(function(q){
      if(filt.m !== "all" && String(q.marks) !== String(filt.m)) return;

  }

  function question(d, qid){
    var lang = L[d.lang || "en"];
    var idx = -1; d.questions.forEach(function(q, i){ if(q.id === qid) idx = i; });
    if(idx < 0){ location.hash = ""; return; }
    var q = d.questions[idx], r = rec(d.slug, q.id);
    document.title = "Q" + (idx + 1) + " · " + d.subject + " Answer Writing Lab | Notesflix 101";
    track("write_open", { subject:d.slug, q:q.id });
    var h = '<div class="qhead"><span class="pill red">' + q.marks + ' ' + lang.marks + '</span><span class="pill amb">' + esc(q.cmd) + '</span><span class="pill">' + esc(q.chTitle) + '</span><span class="pill">' + (idx + 1) + ' / ' + d.questions.length + '</span></div>'
      + '<p class="qtext">' + q.q + '</p>'
      + '<div class="ask"><b>' + lang.wants + '</b> ' + q.ask + '</div>'
      + '<section class="step"><div class="sh"><span class="n">1</span><h3>' + lang.try + '</h3><span class="note">' + lang.aim + ' ' + aimWords(q.marks, d) + ' ' + lang.words + '</span></div>'
      + '<p class="note" style="margin:0 0 8px">' + lang.tryN + '</p>'
      + '<textarea id="draft" placeholder="…">' + esc(r.draft || "") + '</textarea>'
      + '<div class="wc"><span id="wcount"></span><button class="btn small" id="reveal">' + lang.reveal + '</button></div></section>'
      + '<section class="step" id="cmpStep"><div class="sh"><span class="n">2</span><h3>' + lang.compare + '</h3></div>'
      + '<div class="tabs">'
      + ['weak','good','full'].map(function(k){ return '<button class="tab ' + k + '" data-k="' + k + '">' + lang[k] + '<small>' + q.answers[k].score + ' / ' + q.marks + '</small></button>'; }).join("")
      + '</div><div id="ansBox"></div></section>'
      + '<section class="step"><div class="sh"><span class="n">3</span><h3>' + lang.check + '</h3></div>'
      + '<p class="note" style="margin:0 0 8px">' + lang.checkN + '</p><div class="check" id="check"></div>'
      + '<div class="score"><span>' + lang.your + ':</span><span class="v" id="sv">0 / ' + q.marks + '</span><span class="sp"></span><button class="btn small" id="saveSc">' + lang.save + '</button></div></section>';
    if(q.mistakes && q.mistakes.length) h += '<section class="step"><div class="sh"><span class="n">!</span><h3>' + lang.mist + '</h3></div><ul class="mist">' + q.mistakes.map(function(x){ return '<li>' + x + '</li>'; }).join("") + '</ul>' + (q.tip ? '<div class="tip"><b>' + lang.tipT + ':</b> ' + q.tip + '</div>' : '') + '</section>';
    h += '<div class="nav"><button class="btn ghost" id="prevQ"' + (idx === 0 ? " disabled" : "") + '>' + lang.prev + '</button><button class="btn ghost" id="nextQ"' + (idx === d.questions.length - 1 ? " disabled" : "") + '>' + lang.next + '</button></div>';
    app.innerHTML = h;

    var ta = document.getElementById("draft"), wc = document.getElementById("wcount");
    var aim = aimWords(q.marks, d).split(/[–-]/).map(Number);
    function upd(){
      var n = words(ta.value), cls = n >= aim[0] ? "ok" : "lo";
      wc.innerHTML = '<b class="' + cls + '">' + n + '</b> ' + lang.words + ' · ' + lang.aim + ' ' + aimWords(q.marks, d);
      r.draft = ta.value; save(state); paintCheck();
    }
    ta.addEventListener("input", upd);

    var cur = "full";
    function showAns(k){
      cur = k;
      app.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.getAttribute("data-k") === k); });
      var a = q.answers[k];
      document.getElementById("ansBox").innerHTML = '<div class="ans ' + k + '"><div class="sc"><span class="big">' + a.score + ' / ' + q.marks + '</span><span class="note">' + lang[k] + '</span></div>'
        + '<div class="body">' + a.text + '</div>'
        + '<ul class="notes">' + (a.notes || []).map(function(n){ return '<li><i>' + (k === "full" ? "✅" : k === "good" ? "⚠️" : "❌") + '</i><span>' + n + '</span></li>'; }).join("") + '</ul></div>';
    }
    app.querySelectorAll(".tab").forEach(function(t){ t.onclick = function(){ showAns(t.getAttribute("data-k")); track("write_compare", { subject:d.slug, q:q.id, k:t.getAttribute("data-k") }); }; });
    var cmp = document.getElementById("cmpStep");
    var opened = !!r.revealed || !!(r.draft && r.draft.trim());
    if(!opened) cmp.classList.add("hide");
    document.getElementById("reveal").onclick = function(){ r.revealed = true; save(state); cmp.classList.remove("hide"); showAns("weak"); cmp.scrollIntoView({ behavior:"smooth", block:"start" }); track("write_reveal", { subject:d.slug, q:q.id }); };
    showAns(opened ? "full" : "weak");

    r.ticks = r.ticks || [];
    function paintCheck(){
      var draft = (ta.value || "").toLowerCase(), tot = 0;
      document.getElementById("check").innerHTML = q.points.map(function(p, i){
        var on = r.ticks.indexOf(i) >= 0; if(on) tot += p.m;
        var hit = (p.k || []).some(function(k){ return draft.indexOf(String(k).toLowerCase()) >= 0; });
        return '<button class="ck' + (on ? " on" : "") + '" data-i="' + i + '"><span class="bx">' + (on ? "✓" : "") + '</span><span class="pt">' + p.p + (hit && draft ? '<span class="hint">● ' + lang.found + '</span>' : '') + '</span><span class="pm">' + p.m + ' ' + lang.mk + '</span></button>';
      }).join("");
      document.getElementById("sv").textContent = tot + " / " + q.marks;
      app.querySelectorAll(".ck").forEach(function(b){ b.onclick = function(){ var i = +b.getAttribute("data-i"), j = r.ticks.indexOf(i); if(j >= 0) r.ticks.splice(j, 1); else r.ticks.push(i); save(state); paintCheck(); }; });
    }
    upd();
    document.getElementById("saveSc").onclick = function(){
      var tot = 0; r.ticks.forEach(function(i){ tot += q.points[i].m; });
      r.score = Math.min(tot, q.marks); save(state); this.textContent = "✓ " + lang.saved;
      track("write_score", { subject:d.slug, q:q.id, score:r.score, of:q.marks });
    };
    document.getElementById("prevQ").onclick = function(){ location.hash = d.questions[idx - 1].id; };
    document.getElementById("nextQ").onclick = function(){ location.hash = d.questions[idx + 1].id; };
  }

  window.addEventListener("hashchange", route);
  window.addEventListener("popstate", route);
  route();
})();
</script>
</body>
</html>
