<!doctype html>
<html lang="en">
<head><script async src="https://www.googletagmanager.com/gtag/js?id=G-GGM18EJQC8"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-GGM18EJQC8");</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Previous Year Questions | Notesflix 101</title>
<meta name="description" content="Real CBSE board questions from 2023 to 2026, sorted chapter-wise, with year, set and how often each chapter is asked.">
<meta name="theme-color" content="#0b0b0f">
<link rel="canonical" href="https://notesflix101.com/pyq.html">
<link rel="icon" href="img/icon-192.png">
<style>
:root{--bg:#0b0b0f;--panel:#14141b;--panel2:#1b1b24;--line:rgba(255,255,255,.1);--ink:#f5f5f7;--dim:#a7a7b5;--red:#e50914;--green:#22c55e;--amber:#f5b301;--violet:#b847ff;--teal:#14d6c3;--blue:#4da3ff;--body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:30;background:rgba(11,11,15,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font:800 22px/1 var(--body);letter-spacing:.02em;text-decoration:none;color:var(--red)}.logo span{color:#fff}
.sp{flex:1}
.back{color:var(--dim);text-decoration:none;font:700 13px var(--body);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.back:hover{color:#fff;border-color:rgba(255,255,255,.3)}
main{max-width:1100px;margin:0 auto;padding:22px 16px 80px}
.kick{font:800 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
h1{font:800 34px/1.08 var(--body);margin:6px 0 8px;letter-spacing:-.02em}
h2{font:800 20px/1.25 var(--body);margin:0 0 12px}
.lead{color:var(--dim);margin:0 0 18px;max-width:760px}
.note{color:var(--dim);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:0 0 24px}
.sub{display:block;text-decoration:none;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .15s ease,border-color .15s ease}
.sub:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25)}
.sub::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--teal))}
.sub b{display:block;font:800 16px/1.3 var(--body)}.sub span{display:block;color:var(--dim);font-size:13px;margin-top:4px}
.src{font-size:12.5px;color:var(--dim);border:1px dashed rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;margin:0 0 18px}
.src a{color:#9fe8df}
/* heat */
.heat{display:grid;gap:7px;margin:0 0 20px}
.hrow{display:grid;grid-template-columns:minmax(120px,240px) 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:4px 6px;border-radius:8px}
.hrow:hover{background:rgba(255,255,255,.04)}
.hrow.on{background:rgba(20,214,195,.1)}
.hrow .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .bar{height:10px;border-radius:9px;background:var(--panel2);overflow:hidden}
.hrow .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--violet))}
.hrow .ct{font:800 12px var(--body);color:var(--dim);white-space:nowrap}
.hot{font:800 10px var(--body);color:#2a1c00;background:var(--amber);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
details.heatbox summary{cursor:pointer;font:800 16px var(--body);list-style:none;display:flex;gap:8px;align-items:center;margin:0 0 10px}
details.heatbox summary::-webkit-details-marker{display:none}
details.heatbox summary::after{content:"＋";margin-left:auto;color:var(--dim)}
details.heatbox[open] summary::after{content:"－"}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font:700 13px var(--body);color:var(--dim)}
.fchip.on{background:#fff;color:#000;border-color:#fff}
select.fsel,input.fsrch{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:600 13px var(--body);max-width:100%}
input.fsrch{flex:1;min-width:180px}
.count{margin:6px 0 12px;font-size:13px;color:var(--dim)}
.ql{display:grid;gap:12px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.q.done{border-color:rgba(34,197,94,.45)}
.qh{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.pill{font:800 11px var(--body);letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--dim)}
.pill.mk{background:rgba(229,9,20,.2);color:#ffc2c5}
.pill.yr{background:rgba(20,214,195,.14);color:#a6f3ea}
.pill.ch{background:rgba(184,71,255,.15);color:#e3c4ff}
.pill.img{background:rgba(245,179,1,.16);color:#ffe7a3}
.qt{white-space:pre-wrap;font-size:15px;line-height:1.6;color:#ececf1;overflow-x:auto}
.or{margin-top:10px}
.or summary{cursor:pointer;font:800 12px var(--body);color:var(--amber);letter-spacing:.06em}
.or .qt{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.15)}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qa a,.qa button{font:700 12.5px var(--body);text-decoration:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 11px;color:#dcdce4}
.qa a:hover,.qa button:hover{border-color:rgba(255,255,255,.3)}
.qa button.on{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.6);color:#bdf5cf}
.seen{font-size:12px;color:var(--dim);margin-top:6px}
.more{display:block;margin:16px auto 0;border:0;border-radius:10px;padding:10px 18px;font:800 14px var(--body);background:var(--teal);color:#05211e}
@media (max-width:640px){h1{font-size:27px}.hrow{grid-template-columns:110px 1fr auto}.qt{font-size:14.5px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="index.html">NOTES<span>FLIX</span> 101</a><span class="sp"></span>
  <a class="back" id="backBtn" href="index.html">← Home</a>
</div></header>
<main id="app"><p class="note">Loading…</p></main>
<script>
(function(){
  "use strict";
  var SUBJ = [
    { slug:"xii-bst", cls:"XII", name:"Business Studies", c:"#e50914", w:"xii-bst" },
    { slug:"xii-acc", cls:"XII", name:"Accountancy", c:"#22c55e", w:"xii-acc" },
    { slug:"xii-eco", cls:"XII", name:"Economics", c:"#4da3ff", w:"xii-eco" },
    { slug:"xii-ent", cls:"XII", name:"Entrepreneurship", c:"#f5b301", w:"xii-ent" },
    { slug:"xii-chem", cls:"XII", name:"Chemistry", c:"#14d6c3", w:"xii-chem" },
    { slug:"xii-legal", cls:"XII", name:"Legal Studies", c:"#b847ff", w:"xii-legal" },
    { slug:"x-sci", cls:"X", name:"Science", c:"#14d6c3", w:"x-sci" },
    { slug:"x-sst", cls:"X", name:"Social Science (SST)", c:"#f5b301", w:"x-sst" }
  ];
  var ARENA_URL = "arena/?ch=";
  var PAGE = 25;
  var app = document.getElementById("app"), backBtn = document.getElementById("backBtn");
  var STORE = "notesflix101.pyq";
  function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
  function save(s){ try{ localStorage.setItem(STORE, JSON.stringify(s)); }catch(e){} }
  var state = load();
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function meta(slug){ for(var i=0;i<SUBJ.length;i++) if(SUBJ[i].slug === slug) return SUBJ[i]; return null; }
  function track(ev, p){ try{ if(window.gtag) gtag("event", ev, p || {}); }catch(e){} }
  var SRC = '<div class="src">📜 Questions are taken from <b>official CBSE board papers</b> (main, compartment and second board exams, 2023–2026) published at <a href="https://www.cbse.gov.in/cbsenew/question-paper.html" target="_blank" rel="noopener">cbse.gov.in</a>. The text was extracted from the PDFs, so pictures, maps, graphs and some symbols or tables may be missing; the set code on each question tells you which original paper to open.</div>';

  function route(){
    var slug = new URLSearchParams(location.search).get("s");
    window.scrollTo(0, 0);
    if(!slug) return hub();
    var m = meta(slug); if(!m){ return hub(); }
    backBtn.href = "pyq.html"; backBtn.textContent = "← All subjects";
    app.innerHTML = '<p class="note">Loading questions…</p>';
    fetch("pyq/data/" + slug + ".json").then(function(r){ return r.json(); }).then(function(d){ subject(d, m); })
      .catch(function(){ app.innerHTML = '<p class="note">Could not load this subject. Check your connection and try again.</p>'; });
  }

  function hub(){
    backBtn.href = "index.html"; backBtn.textContent = "← Home";
    document.title = "Previous Year Questions | Notesflix 101";
    var h = '<div class="kick">Previous Year Questions</div><h1>Real board questions, chapter by chapter</h1>'
      + '<p class="lead">Every question from CBSE\'s board papers of 2023 to 2026, sorted by chapter, with the year and set it came from. See which chapters CBSE asks most, and practise those first.</p>' + SRC;
    ["XII","X"].forEach(function(c){
      h += '<h2>Class ' + c + '</h2><div class="subs">';
      SUBJ.filter(function(s){ return s.cls === c; }).forEach(function(s){
        var n = Object.keys(state[s.slug] || {}).length;
        h += '<a class="sub" style="--c:' + s.c + '" href="pyq.html?s=' + s.slug + '"><b>' + esc(s.name) + '</b><span>' + (n ? n + ' marked done' : 'Open the question bank') + '</span></a>';
      });
      h += '</div>';
    });
    h += '<p class="note">Class 9 and 11 have no CBSE board exam, so there are no official previous-year papers for them.</p>';
    app.innerHTML = h;
  }

  function kindOf(t){
    if(/Assertion\s*\(A\)/i.test(t)) return "ar";
    if(/\(A\)[\s\S]*\(B\)[\s\S]*\(C\)[\s\S]*\(D\)/.test(t)) return "mcq";
    if(/(Read the (following|given) (text|passage|source|case)|case|situation|following information)/i.test(t)) return "case";
    return "other";
  }

  function subject(d, m){
    document.title = "Class " + d.cls + " " + d.subject + " · Previous Year Questions | Notesflix 101";
    var f = { ch:"", mk:"", yr:"", kind:"", q:"", n:PAGE };
    var done = state[d.slug] = state[d.slug] || {};
    var years = {}; d.qs.forEach(function(q){ q.seen.forEach(function(s){ years[s[0]] = 1; }); q.kind = kindOf(q.text); });
    years = Object.keys(years).sort().reverse();
    var marks = {}; d.qs.forEach(function(q){ if(q.marks) marks[q.marks] = 1; }); marks = Object.keys(marks).sort();
    // chapter heat: number of distinct papers (year+exam+set) in which a chapter appeared
    var heat = {}, totalPapers = d.papers.length || 1;
    d.qs.forEach(function(q){ var h = heat[q.ch] = heat[q.ch] || { n:0, marks:0, papers:{} }; h.n++; q.seen.forEach(function(s){ h.papers[s.join("|")] = 1; h.marks += (q.marks || 0); }); });
    var chs = Object.keys(d.chapters).filter(function(c){ return heat[c]; }).sort(function(a, b){ return (b === "other" ? -1 : 0) - (a === "other" ? -1 : 0) || heat[b].marks - heat[a].marks; });
    var maxM = Math.max.apply(null, chs.filter(function(c){ return c !== "other"; }).map(function(c){ return heat[c].marks / totalPapers; }).concat([1]));
    var topSet = chs.filter(function(c){ return c !== "other"; }).slice(0, 3);

    function chapterLinks(ch){
      if(!ch || ch === "other" || /^acc-x-/.test(ch)) return "";
      return '<a href="index.html#' + ch + '">📖 Notes</a><a href="' + ARENA_URL + ch + '">⚔️ Revision Arena</a>';
    }
    function render(){
      var list = d.qs.filter(function(q){
        if(f.ch && q.ch !== f.ch) return false;
        if(f.mk && String(q.marks) !== f.mk) return false;
        if(f.yr && !q.seen.some(function(s){ return String(s[0]) === f.yr; })) return false;
        if(f.kind && q.kind !== f.kind) return false;
        if(f.q && (q.text + " " + q.alts.join(" ")).toLowerCase().indexOf(f.q) < 0) return false;
        return true;
      });
      var box = document.getElementById("ql");
      document.getElementById("cnt").textContent = list.length + " question" + (list.length === 1 ? "" : "s") + (f.ch ? " in " + d.chapters[f.ch] : "");
      box.innerHTML = list.slice(0, f.n).map(function(q){
        var yrs = {}; q.seen.forEach(function(s){ var k = s[0] + " " + s[1]; (yrs[k] = yrs[k] || []).push(s[2]); });
        var first = Object.keys(yrs)[0];
        return '<article class="q' + (done[q.id] ? " done" : "") + '" data-id="' + q.id + '"><div class="qh">'
          + (q.marks ? '<span class="pill mk">' + q.marks + ' mark' + (q.marks > 1 ? "s" : "") + '</span>' : '')
          + '<span class="pill yr">' + esc(first) + '</span>'
          + '<span class="pill ch">' + esc(d.chapters[q.ch] || "Other") + '</span>'
          + (q.img ? '<span class="pill img">🖼 picture in original</span>' : '')
          + '</div><div class="qt">' + esc(q.text) + '</div>'
          + (q.alts.length ? q.alts.map(function(a){ return '<details class="or"><summary>OR (internal choice)</summary><div class="qt">' + esc(a) + '</div></details>'; }).join("") : '')
          + '<div class="seen">Asked in: ' + Object.keys(yrs).map(function(k){ return esc(k) + ' (set ' + yrs[k].map(esc).join(", ") + ')'; }).join(" · ") + '</div>'
          + '<div class="qa"><button class="dn' + (done[q.id] ? " on" : "") + '">' + (done[q.id] ? "✓ Done" : "Mark done") + '</button>' + chapterLinks(q.ch)
          + '<a href="writing.html?s=' + m.w + '">✍️ How to write it</a></div></article>';
      }).join("") || '<p class="note">No questions match these filters.</p>';
      document.getElementById("moreBtn").style.display = list.length > f.n ? "block" : "none";
      box.querySelectorAll(".dn").forEach(function(b){ b.onclick = function(){
        var id = b.closest(".q").getAttribute("data-id");
        if(done[id]) delete done[id]; else done[id] = 1; save(state);
        b.classList.toggle("on", !!done[id]); b.textContent = done[id] ? "✓ Done" : "Mark done"; b.closest(".q").classList.toggle("done", !!done[id]);
        track("pyq_done", { subject:d.slug });
      }; });
    }

    var h = '<div class="kick">Previous Year Questions · Class ' + esc(d.cls) + '</div><h1>' + esc(d.subject) + '</h1>'
      + '<p class="lead">' + d.qs.length + ' different questions from ' + d.papers.length + ' official CBSE papers (2023–2026). Start with the chapters CBSE asks most.</p>' + SRC
      + '<details class="card heatbox" open><summary>🔥 How often each chapter is asked</summary><p class="note" style="margin:0 0 10px">Average marks per paper from each chapter. Tap a chapter to see its questions.</p><div class="heat">'
      + chs.map(function(c){ var v = heat[c].marks / totalPapers; return '<button class="hrow" data-ch="' + esc(c) + '"><span class="nm">' + esc(d.chapters[c]) + (topSet.indexOf(c) >= 0 ? '<span class="hot">TOP</span>' : '') + '</span><span class="bar"><i style="width:' + (c === "other" ? 0 : Math.max(4, Math.round(v / maxM * 100))) + '%"></i></span><span class="ct">' + (c === "other" ? heat[c].n + " Qs" : "≈ " + v.toFixed(1) + " marks") + '</span></button>'; }).join("")
      + '</div></details><br>'
      + '<div class="filters"><select class="fsel" id="fch"><option value="">All chapters</option>' + chs.map(function(c){ return '<option value="' + esc(c) + '">' + esc(d.chapters[c]) + '</option>'; }).join("") + '</select>'
      + '<select class="fsel" id="fyr"><option value="">All years</option>' + years.map(function(y){ return '<option>' + y + '</option>'; }).join("") + '</select>'
      + '<select class="fsel" id="fkind"><option value="">All types</option><option value="mcq">MCQ</option><option value="ar">Assertion–Reason</option><option value="case">Case / source based</option><option value="other">Written answer</option></select></div>'
      + '<div class="filters"><button class="fchip on" data-mk="">All marks</button>' + marks.map(function(x){ return '<button class="fchip" data-mk="' + x + '">' + x + ' mark' + (x > 1 ? "s" : "") + '</button>'; }).join("") + '</div>'
      + '<div class="filters"><input class="fsrch" id="fq" type="search" placeholder="Search a word, e.g. delegation, repo rate, goodwill"></div>'
      + '<div class="count" id="cnt"></div><div class="ql" id="ql"></div><button class="more" id="moreBtn">Show more</button>';
    app.innerHTML = h;
    function setCh(c){ f.ch = c; f.n = PAGE; document.getElementById("fch").value = c; app.querySelectorAll(".hrow").forEach(function(r){ r.classList.toggle("on", r.getAttribute("data-ch") === c && !!c); }); render(); }
    app.querySelectorAll(".hrow").forEach(function(r){ r.onclick = function(){ var c = r.getAttribute("data-ch"); setCh(f.ch === c ? "" : c); document.getElementById("cnt").scrollIntoView({ behavior:"smooth", block:"start" }); track("pyq_chapter", { subject:d.slug, ch:c }); }; });
    document.getElementById("fch").onchange = function(){ setCh(this.value); };
    document.getElementById("fyr").onchange = function(){ f.yr = this.value; f.n = PAGE; render(); };
    document.getElementById("fkind").onchange = function(){ f.kind = this.value; f.n = PAGE; render(); };
    app.querySelectorAll("[data-mk]").forEach(function(b){ b.onclick = function(){ f.mk = b.getAttribute("data-mk"); f.n = PAGE; app.querySelectorAll("[data-mk]").forEach(function(x){ x.classList.toggle("on", x === b); }); render(); }; });
    var tmr; document.getElementById("fq").oninput = function(){ var v = this.value; clearTimeout(tmr); tmr = setTimeout(function(){ f.q = v.trim().toLowerCase(); f.n = PAGE; render(); }, 200); };
    document.getElementById("moreBtn").onclick = function(){ f.n += PAGE; render(); };
    var hc = location.hash.replace("#", ""); if(hc && d.chapters[hc]) setCh(hc); else render();
    track("pyq_open", { subject:d.slug });
  }
  window.addEventListener("popstate", route);
  route();
})();
</script>
</body>
</html>
