<div class="sc" id="sc" hidden></div>
<script>
const $=s=>document.querySelector(s);
const fm=n=>(n<0?'(':'')+Math.abs(Math.round(n)).toLocaleString('en-IN')+(n<0?')':'');
const STEPS=['What is a partnership?','Partnership deed','When the deed is silent','Charge against profit','Appropriation of profit','The Appropriation A/c','Build it yourself 1','Capital accounts','Appropriation meets Capital','Interest on capital','Build it yourself 2'];
const NS=STEPS.length;
const mp=c=>`<div class="chips">${STEPS.map((s,i)=>`<a class="chip ${i+1===c?'on':''}" href="#s${i+1}">${i+1}. ${s}</a>`).join('')}</div>`;
const head=(n,t,sub)=>`${mp(n)}<div class="sh"><div class="num">${n}</div><div><div class="lab">Step ${n} of ${NS}</div><h2>${t}</h2></div></div>${sub?`<p class="mute">${sub}</p>`:''}`;
const OPTS=['a','b','c','d'];
function mcq(o){return `<div class="card q" data-ans="${o.ans}" ${o.score===false?'':'data-score="1"'}>
 <div class="qh">${o.predict?'<span class="badge" style="background:var(--am);color:#2b2a6b">THINK FIRST</span>':`<span class="badge">${o.tag} · ${o.marks||'1M'}</span>`}</div>
 <p>${o.q}</p>${o.opts.map((t,i)=>`<button class="opt" data-i="${i}">(${OPTS[i]}) ${t}</button>`).join('')}<div class="fb" hidden>${o.why}</div></div>`}
const pre=(q,opts,ans,why)=>mcq({predict:1,score:false,q,opts,ans,why});
const arq=(tag,a,r,ans,why)=>mcq({tag,q:`<b>Assertion (A):</b> ${a}<br><b>Reason (R):</b> ${r}`,opts:['Both A and R are true, and R is the correct explanation of A','Both A and R are true, but R is not the correct explanation of A','A is true, but R is false','A is false, but R is true'],ans,why});
const flips=a=>`<div class="flips">${a.map(([f,b])=>`<button class="flip"><span class="fi"><span>${f}</span><span>${b}</span></span></button>`).join('')}</div>`;
function two(dr,cr,h=['Dr.','Cr.']){const n=Math.max(dr.length,cr.length);let td=0,tc=0,r='';
 for(let i=0;i<n;i++){const a=dr[i]||['',''],b=cr[i]||['',''];td+=+a[1]||0;tc+=+b[1]||0;r+=`<tr><td>${a[0]}</td><td class="n">${a[1]===''?'':fm(a[1])}</td><td>${b[0]}</td><td class="n">${b[1]===''?'':fm(b[1])}</td></tr>`}
 return `<div class="tw"><table><tr><th>${h[0]} Particulars</th><th>₹</th><th>${h[1]} Particulars</th><th>₹</th></tr>${r}<tr class="t"><td>Total</td><td class="n">${fm(td)}</td><td>Total</td><td class="n">${fm(tc)}</td></tr></table></div>`}
const num=(tag,marks,q,ans)=>`<div class="card"><div class="qh"><span class="badge">${tag} · ${marks}</span></div><p>${q}</p><details><summary>Try it on paper first, then open the answer</summary>${ans}</details></div>`;
const castC=['#f26b21','#3bb5a0','#2b2a6b','#f9b91a','#d6568a','#6b5bd6'];
const cast=[['I','Ishaan','Partner · invested ₹4,00,000'],['N','Naina','Partner · invested ₹2,00,000, runs the shop'],['T','Tara Handlooms','The firm · sells handloom sarees'],['K','Kesari Cotton Mills','Supplier of yarn'],['G','Gomti Bank','Lends to the firm'],['M','Mrs Bedi','Regular customer']];
const hero=`<svg viewBox="0 0 520 220" role="img" aria-label="Flat illustration of Tara Handlooms shop with two partners"><polygon points="60,110 260,200 460,110 260,20" fill="#fdeccb" stroke="#f0dcb6" stroke-width="3"/><polygon points="110,100 110,150 260,200 260,150" fill="#3bb5a0"/><polygon points="260,150 260,200 410,150 410,100" fill="#2b2a6b"/><polygon points="110,100 260,150 410,100 260,50" fill="#f9b91a"/><polygon points="120,104 260,152 260,134 120,88" fill="#f26b21"/><polygon points="260,152 400,104 400,88 260,134" fill="#d9540f"/><text x="188" y="168" font-family="Baloo 2" font-weight="800" font-size="17" fill="#fff6e5" transform="rotate(20 188 168)">TARA HANDLOOMS</text><g transform="translate(40,70)"><circle cx="20" cy="14" r="13" fill="#f6c9a0"/><rect x="4" y="28" width="32" height="46" rx="12" fill="#f26b21"/><text x="20" y="100" text-anchor="middle" font-family="Poppins" font-size="12" fill="#2b2a6b">Ishaan</text></g><g transform="translate(440,70)"><circle cx="20" cy="14" r="13" fill="#e8b48a"/><rect x="4" y="28" width="32" height="46" rx="12" fill="#3bb5a0"/><text x="20" y="100" text-anchor="middle" font-family="Poppins" font-size="12" fill="#2b2a6b">Naina</text></g></svg>`;

/* ======== BUILD-IT-YOURSELF ENGINE ======== */
const QS={};
const sumK=(v,ks)=>ks.reduce((s,k)=>s+v(k),0);
function mkAppr(c){
 const R=c.ratio,sr=R.reduce((a,b)=>a+b,0),np=c.np,keys=c.items.map(x=>x.k);
 const div=np-c.items.reduce((s,x)=>s+x.a,0);
 const NP=v=>c.npIn?v('np'):np;
 const dr=c.items.map(x=>[x.l,{k:x.k,a:x.a,ft:x.ft}]);
 const shk=c.names.map((n,i)=>'sh'+i);
 c.names.forEach((n,i)=>dr.push([`To ${n}'s ${c.acct} A/c`,{k:'sh'+i,a:div*R[i]/sr,ft:v=>(c.items.length?v('div'):NP(v))*R[i]/sr}]));
 const cr=[['By Net Profit',c.npIn?{k:'np',a:np,ft:c.npFt}:{g:np}]];
 const out=[];
 if(c.pre)out.push(...c.pre);
 out.push({t:'two',title:'Profit and Loss Appropriation Account for the year ended 31st March 2026',dr,cr,td:{k:'tot',a:np,ft:v=>sumK(v,keys)+sumK(v,shk),w:.5},tc:{k:'tot2',a:np,ft:NP,w:.5}});
 if(c.items.length)out.push({t:'line',label:'Working: profit left to share ('+R.join(' : ')+')',cell:{k:'div',a:div,ft:v=>NP(v)-sumK(v,keys)}});
 const amt={};c.items.forEach(x=>amt[x.k]=x.a);return {blocks:out,div,R,sr,names:c.names,amt};
}
function mkLedger(ap,i,p){ // p:{method,open:{cr|dr},draw,ioc,sal,com}
 const f=p.method==='fixed',nm=ap.names[i];
 const dr=[],cr=[];let sc=0,sd=0;
 if(p.open&&p.open.dr){dr.push(['To Balance b/d',{g:p.open.dr}]);sd+=p.open.dr}
 if(p.draw){dr.push(['To Drawings',{g:p.draw}]);sd+=p.draw}
 if(p.open&&p.open.cr){cr.push(['By Balance b/d',{g:p.open.cr}]);sc+=p.open.cr}
 const ent=[];
 if(p.ioc){ent.push(['By Interest on Capital','ioc'+i,ap.amt['ioc'+i]])}
 if(p.sal){ent.push(['By Salary','sal'+i,ap.amt['sal'+i]])}
 if(p.com){ent.push(['By Commission','com'+i,ap.amt['com'+i]])}
 ent.push(['By Profit share','sh'+i,ap.div*ap.R[i]/ap.sr]);
 const ck=[];
 ent.forEach(e=>{cr.push([e[0],{k:'L'+i+e[1],a:e[2],ft:v=>v(e[1])}]);sc+=e[2];ck.push('L'+i+e[1])});
 const cd=sc-sd;
 const gdr=(p.open&&p.open.dr||0)+(p.draw||0),gcr=p.open&&p.open.cr||0;
 dr.push(['To Balance c/d',{k:'cd'+i,a:cd,ft:v=>gcr+sumK(v,ck)-gdr}]);
 return {t:'two',title:`${nm}'s ${f?'Current':'Capital'} A/c`,dr,cr,td:{k:'dt'+i,a:sc,ft:v=>gdr+v('cd'+i),w:.5},tc:{k:'ct'+i,a:sc,ft:v=>gcr+sumK(v,ck),w:.5}};
}
function cellHTML(c){
 if(c===''||c==null)return '';
 if(typeof c==='number')return fm(c);
 if(c.g!=null)return fm(c.g);
 return `<input class="in" type="text" inputmode="numeric" autocomplete="off" data-k="${c.k}" aria-label="your answer">`;
}
function blockHTML(b){
 if(b.t==='line')return `<div class="row" style="margin:10px 0 4px"><span style="flex:1;min-width:200px"><b>${b.label}</b></span><span style="width:150px">${cellHTML(b.cell)}</span></div>`;
 const n=Math.max(b.dr.length,b.cr.length);let r='';
 for(let i=0;i<n;i++){const a=b.dr[i]||['',''],c=b.cr[i]||['',''];
  r+=`<tr><td>${a[0]}</td><td class="n">${cellHTML(a[1])}</td><td>${c[0]}</td><td class="n">${cellHTML(c[1])}</td></tr>`}
 r+=`<tr class="t"><td>Total</td><td>${cellHTML(b.td)}</td><td>Total</td><td>${cellHTML(b.tc)}</td></tr>`;
 return `<div class="cap">${b.title}</div><div class="tw"><table><tr><th>Dr. Particulars</th><th>₹</th><th>Cr. Particulars</th><th>₹</th></tr>${r}</table></div>`;
}
function collect(blocks){const m={};blocks.forEach(b=>{if(b.t==='line')m[b.cell.k]=b.cell;else{[...b.dr,...b.cr].forEach(r=>{const c=r[1];if(c&&c.k)m[c.k]=c});m[b.td.k]=b.td;m[b.tc.k]=b.tc}});return m}
function byCard(q){
 q.cells=collect(q.blocks);
 return `<div class="card by" id="${q.id}" hidden><div class="qh"><span class="badge" style="background:var(--o);color:#fff">${q.level}</span><span class="badge">${q.marks} Marks</span></div>
 <p>${q.text}</p>${q.blocks.map(blockHTML).join('')}
 <div class="row" style="margin-top:12px"><button class="btn" data-act="sub">Submit for marking</button><button class="btn alt" data-act="try">Try again</button></div>
 <div class="fb by-res" hidden></div></div>`;
}
function byPanel(id,list,intro){
 list.forEach(q=>QS[q.id]=q);
 $('#'+id).innerHTML=`<div class="card"><p>${intro}</p></div><div class="tabs" role="tablist">${list.map((q,i)=>`<button class="tab ${i?'':'on'}" data-q="${q.id}">${q.short}</button>`).join('')}</div>${list.map(byCard).join('')}`;
 document.getElementById(list[0].id).hidden=false;
 $('#'+id).onclick=e=>{
  const t=e.target.closest('.tab');
  if(t){$('#'+id).querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));$('#'+id).querySelectorAll('.by').forEach(x=>x.hidden=x.id!==t.dataset.q);return}
  const b=e.target.closest('[data-act]');if(!b)return;const card=b.closest('.by'),q=QS[card.id];
  if(b.dataset.act==='try'){card.querySelectorAll('input.in').forEach(i=>{i.value='';i.disabled=false;i.className='in';});card.querySelectorAll('small').forEach(s=>s.remove());const r=card.querySelector('.by-res');r.hidden=true;r.innerHTML='';return}
  mark(card,q);
 };
}
function mark(card,q){
 const inputs=[...card.querySelectorAll('input.in')];
 const v=k=>{const el=card.querySelector(`[data-k="${k}"]`);const s=(el.value||'').replace(/[,\s₹()]/g,'');return s===''?NaN:Number(s)};
 let tot=0,got=0,okn=0,ftn=0;
 card.querySelectorAll('small').forEach(s=>s.remove());
 inputs.forEach(el=>{const c=q.cells[el.dataset.k],w=c.w==null?1:c.w,val=v(c.k);tot+=w;
  const exact=Math.abs(val-c.a)<.5;let st='bad';

const S=[];
S.push(`<div class="top"><span class="brand">Notesflix 101 · Accountancy</span><button class="tg" id="th">Light / Dark</button></div>
<section class="hero"><div class="lab">Class 12 · Partnership Fundamentals · Part 1</div><h1>Two friends, one shop, no paper</h1>
<p class="mute">Ishaan has the money. Naina has the skill. Together they open <b>Tara Handlooms</b> on a handshake. A year later they cannot agree who should get what.</p>${hero}
${pre('What could Ishaan and Naina have done on day one to avoid the fight?',['Nothing, fights are normal','Written down their agreement in a partnership deed','Registered a company'],1,'A <b>partnership deed</b>. This part of the chapter shows what a partnership is, what the deed contains, and how profit is then divided and posted to partners\' accounts.')}
<h3>The cast</h3><div class="cast">${cast.map((c,i)=>`<div class="card"><div class="av" style="background:${castC[i]}">${c[0]}</div><b>${c[1]}</b><span class="role">${c[2]}</span></div>`).join('')}</div>
<div class="card"><h3>Today's journey</h3><p class="mute" style="margin-bottom:8px">Basics first, then the Appropriation A/c, then capital accounts and interest on capital. Two "Build it yourself" stops let you practise by typing the answers.</p>${mp(0)}</div></section>`);

S.push(`<section class="step" id="s1">${head(1,'What is a partnership?','The idea behind the firm.')}
${anim('an1')}
<div class="card read"><h3>📖 Read it: Partnership</h3>
<div class="df"><b>Definition (Section 4, Indian Partnership Act, 1932):</b> "Partnership is the relation between persons who have agreed to share the profits of a business carried on by all or any of them acting for all."</div>
<ul><li><b>Partners</b> are the individuals. The <b>firm</b> is the name they trade under (Tara Handlooms).</li>
<li><b>Agreement:</b> a partnership is created by agreement, oral or written, not by status.</li>
<li><b>Two or more persons:</b> at least 2 and at most 50 partners.</li>
<li><b>Lawful business:</b> the activity must be legal and carried on to earn profit.</li>
<li><b>Profit sharing:</b> partners agree to share profit (and loss) in an agreed ratio.</li>
<li><b>Mutual agency:</b> each partner is both an agent and a principal for the others.</li>
<li><b>Unlimited liability:</b> partners are personally liable for the firm's debts.</li></ul></div>
${pre('Three friends take a holiday together and share the costs equally. Is that a partnership?',['Yes, they share money','No, there is no business'],1,'No. A partnership needs a <b>business</b> and an agreement to share its profits.')}
<div class="card"><p><b>Definition (Section 4, Indian Partnership Act, 1932):</b> the relation between persons who have agreed to share the profits of a business carried on by all or any of them acting for all.</p></div>
${flips([['🤝 Agreement','Partners agree to run a business together. It can be oral or written.'],['👥 Two or more persons','Minimum 2 partners. Maximum 50.'],['🏪 Lawful business','The business must be legal. A holiday club is not a business.'],['💰 Profit sharing','Partners agree to share the profit (and loss) of the business.'],['🔁 Mutual agency','Each partner is an <b>agent</b> of the others and a <b>principal</b> too. Each can bind the firm.'],['⚠️ Unlimited liability','If the firm cannot pay its debts, partners\' personal assets can be used.']])}
<div class="card"><h3>Try it: is it a partnership?</h3><div id="pcase"></div></div>
<h3>Practice</h3>
${mcq({tag:'Q1.1',q:'Mutual agency in a partnership means that every partner is:',opts:['Only an agent of the firm','Only a principal','Both an agent and a principal','Neither'],ans:2,why:'(c). Each partner acts for the others (agent) and is bound by the acts of the others (principal).'})}
${mcq({tag:'Q1.2',q:'The maximum number of partners in a partnership firm (other than banking) is:',opts:['10','20','50','No limit'],ans:2,why:'(c). The limit is 50.'})}
${mcq({tag:'Q1.3',q:'The liability of partners in a partnership firm is:',opts:['Limited to capital','Unlimited','Limited to profits','Nil'],ans:1,why:'(b). Partners are personally liable for the firm\'s debts.'})}
</section>`);

S.push(`<section class="step" id="s2">${head(2,'The partnership deed','The written rulebook of the firm.')}
${anim('an2')}
<div class="card read"><h3>📖 Read it: Partnership deed</h3>
<div class="df"><b>Partnership deed</b> is the written agreement among the partners that sets out the terms of their partnership.</div>
<ul><li><b>Usually contains:</b> name and nature of the business, names and addresses of partners, capital of each partner, profit sharing ratio, interest on capital and drawings, salary or commission, interest on loans, and rules on admission, retirement and death.</li>
<li><b>Is it compulsory?</b> No. An oral agreement is valid, but a written deed avoids disputes.</li>
<li><b>Why it matters in accounts:</b> every item in the Appropriation A/c (ratio, interest, salary, commission) comes from the deed.</li>
<li><b>If it is silent</b> on a point, the Partnership Act fills the gap (next step).</li></ul></div>
${pre('Is a written partnership deed compulsory by law?',['Yes, always','No, but it is strongly advised'],1,'No. An oral agreement is valid. A written deed avoids fights, so partners almost always make one.')}
<div class="card"><p>A <b>partnership deed</b> is the written agreement among the partners. It lists the terms they agreed on.</p></div>
${flips([['💵 Money terms','Capital each partner brings. Profit sharing ratio. Interest on capital and drawings. Salary or commission.'],['🧑‍🤝‍🧑 People terms','Names and addresses. Duties of each partner. Rules for admission, retirement and death.'],['📋 Business terms','Name and nature of the business. Place of business. Accounting year. Who operates the bank account.'],['❓ Why it matters','The deed decides how the Appropriation A/c is prepared. If a point is missing, the Act fills the gap (next step).']])}
<h3>Practice</h3>
${mcq({tag:'Q2.1',q:'A partnership deed is:',opts:['A government licence','A written agreement among the partners','A contract with customers','A bank loan document'],ans:1,why:'(b). It is the written agreement among partners.'})}
${mcq({tag:'Q2.2',q:'Which of the following is normally mentioned in a partnership deed?',opts:['Profit sharing ratio','Income tax slab of customers','Price of products','Suppliers\' addresses'],ans:0,why:'(a). The profit sharing ratio is a core term of the deed.'})}
</section>`);

S.push(`<section class="step" id="s3">${head(3,'When the deed is silent','No deed, or a deed that says nothing about a point? The Act fills the gap.')}
${anim('an3')}
<div class="card read"><h3>📖 Read it: When the deed is silent</h3>
<div class="df">If there is no deed, or the deed says nothing on a point, <b>Section 13 of the Partnership Act, 1932</b> applies.</div>
<ul><li><b>Profit and loss sharing:</b> equal among all partners, whatever their capitals.</li>
<li><b>Interest on capital:</b> not allowed.</li>
<li><b>Interest on drawings:</b> not charged.</li>
<li><b>Salary or commission:</b> not allowed to any partner.</li>
<li><b>Interest on a partner's loan to the firm:</b> allowed at <b>6% p.a.</b></li></ul>
<p class="mute"><b>Exam tip:</b> read the question for the words "deed is silent" or "no agreement". Then share profit equally and ignore interest and salary.</p></div>
${pre('Naina works full-time. Ishaan only invests. There is no deed. Does Naina get a salary?',['Yes, she works harder','No, no partner gets a salary unless agreed'],1,'Right. Section 13: no salary without an agreement.')}
${flips([['💰 Profit sharing','<b>Equal</b>, whatever the capital. Three partners: 1/3 each.'],['🚫 Interest on capital','Not allowed unless the deed says so.'],['🚫 Salary / commission','Not allowed unless the deed says so.'],['✅ Interest on partner\'s loan','The one exception: <b>6% p.a.</b> is payable, even with no deed.']])}
<div class="card"><h3>Try it: allowed if the deed is silent?</h3><div id="sil"></div></div>
<h3>Practice</h3>
${mcq({tag:'Q3.1',q:'Three partners have no partnership deed. The firm\'s profit is ₹84,000. How much does each partner get?',opts:['₹42,000','₹28,000','₹21,000','Cannot be found without capitals'],ans:1,why:'(b). Equal sharing: ₹84,000 ÷ 3 = ₹28,000.'})}
${arq('Q3.2','In the absence of an agreement, a partner is not entitled to a salary.','Section 13 of the Indian Partnership Act, 1932 provides that no partner is entitled to remuneration for taking part in the business.',0,'(a). Both are correct and R is exactly why A holds.')}
</section>`);

S.push(`<section class="step" id="s4">${head(4,'Charge against profit','Payments the firm must make before it can even say how much profit it earned.')}
${anim('an4')}
<div class="card read"><h3>📖 Read it: Charge against profit</h3>
<div class="df"><b>Charge against profit</b> is an expense or payment that the firm must make, whether it earns a profit or a loss. It is debited to the <b>Profit and Loss A/c</b> before net profit is found.</div>
<ul><li><b>Paid even in a loss.</b> The firm owes it as a debt or a business cost.</li>
<li><b>Reduces net profit.</b> Net profit is worked out after deducting it.</li>
<li><b>Where it appears:</b> the debit side of the P&amp;L A/c, not the Appropriation A/c.</li>
<li><b>Common examples:</b> interest on a partner's loan, rent to a partner, a manager's commission, and all normal business expenses.</li></ul>
<div class="je">Interest on Partner's Loan A/c   Dr.
   To Partner's Loan A/c
Profit and Loss A/c   Dr.
   To Interest on Partner's Loan A/c</div>
<p class="mute"><b>Remember:</b> the partner is acting as a lender or landlord here, not as an owner.</p></div>
${pre('Naina lent ₹50,000 to the firm. The firm makes a loss this year. Is interest on her loan still payable?',['No, there is no profit','Yes, the lender is paid first'],1,'Yes. A loan is a debt. Its interest is a <b>charge</b> against profit, paid even in a loss year.')}
<div class="card"><p><b>Charge against profit</b> = an expense or payment the firm <b>must</b> make, whether it earns a profit or a loss. It is debited to the <b>Profit and Loss A/c</b>, so net profit is found <u>after</u> deducting it.</p></div>
<div class="card"><div class="cap">Profit and Loss Account of Tara Handlooms (extract)<br><span class="mute" style="font-weight:400">for the year ended 31st March 2026</span></div>
<div class="tw"><table><tr><th>Dr. Particulars</th><th>₹</th><th>Cr. Particulars</th><th>₹</th></tr>
<tr><td>To Salaries</td><td class="n">60,000</td><td>By Gross Profit</td><td class="n">3,00,000</td></tr>
<tr class="chg"><td>To Rent to Ishaan (his shop)<span class="tagc">CHARGE</span></td><td class="n">24,000</td><td></td><td></td></tr>
<tr class="chg"><td>To Interest on Naina's loan (₹50,000 × 6%)<span class="tagc">CHARGE</span></td><td class="n">3,000</td><td></td><td></td></tr>
<tr class="chg"><td>To Manager's commission<span class="tagc">CHARGE</span></td><td class="n">6,000</td><td></td><td></td></tr>
<tr><td>To General expenses</td><td class="n">27,000</td><td></td><td></td></tr>
<tr><td><b>To Net Profit (to Appropriation A/c)</b></td><td class="n"><b>1,80,000</b></td><td></td><td></td></tr>
<tr class="t"><td>Total</td><td class="n">3,00,000</td><td>Total</td><td class="n">3,00,000</td></tr></table></div>
<p class="mute" style="margin-top:8px">The orange rows are charges. They sit inside the P&amp;L A/c, so the net profit of ₹1,80,000 is already <b>after</b> them.</p></div>
${flips([['🏦 Interest on partner\'s loan','A partner who lends money to the firm is a <b>lender</b> first. Interest (6% p.a. if the deed is silent) is a charge.'],['🏠 Rent to a partner','If a partner\'s building houses the shop, rent is the price of using it. A charge.'],['👔 Manager\'s commission','The manager is an employee, so his commission is an operating cost. A charge.'],['🧪 Quick test','Would an outsider doing the same thing be paid, profit or no profit? Then it is a <b>charge</b>.']])}
<div class="card"><h3>Try it: is it a charge?</h3><div id="chg"></div></div>
<h3>Practice</h3>
${mcq({tag:'Q4.1',q:'Which of the following is a charge against profit?',opts:['Interest on capital','Salary to a partner','Interest on partner\'s loan','Transfer to general reserve'],ans:2,why:'(c). Interest on a partner\'s loan is a charge. The others are appropriations.'})}
${arq('Q4.2','Interest on a partner\'s loan is payable even if the firm has incurred a loss.','Interest on a partner\'s loan is a charge against profit.',0,'(a). Because it is a charge, it is debited to the P&L A/c whether or not there is profit.')}
${mcq({tag:'Q4.3',q:'Rent paid to a partner for using his building for the firm is debited to:',opts:['Profit and Loss A/c','Profit and Loss Appropriation A/c','Partner\'s Capital A/c','Partner\'s Drawings A/c'],ans:0,why:'(a). Rent is a charge against profit, so it goes to the P&L A/c.'})}
</section>`);

S.push(`<section class="step" id="s5">${head(5,'Appropriation of profit','What is left after the charges is the net profit. Appropriation is how that profit is cut up and handed to the partners.')}
${anim('an5')}
<div class="card read"><h3>📖 Read it: Appropriation of profit</h3>
<div class="df"><b>Appropriation of profit</b> means dividing the net profit among the partners and setting some of it aside. It is shown in the <b>Profit and Loss Appropriation A/c</b>, after net profit is found.</div>
<ul><li><b>Paid only out of profit.</b> No profit, no appropriation.</li>
<li><b>Not a cost of running the business.</b> It is a share of what the business earned.</li>
<li><b>Items on the debit side:</b> interest on capital, partner's salary, partner's commission, transfer to reserve, and each partner's share of profit.</li>
<li><b>Interest on drawings</b> is the one item on the credit side (Part 2).</li></ul>
<div class="je">Profit and Loss Appropriation A/c   Dr.
   To Partners' Capital / Current A/cs</div>
<p class="mute"><b>Charge vs appropriation:</b> a charge is paid before profit and even in a loss. An appropriation is paid out of profit.</p></div>
${pre('Naina is allowed a salary by the deed, but the firm earned no profit. Does she get the salary?',['Yes, always','No, appropriations are paid only out of profit'],1,'Right. Appropriations come <b>out of</b> profit. No profit, no appropriation. (If the profit is short, the rules come in a later part.)')}
<div class="card"><p><b>Appropriation of profit</b> = dividing the net profit among the partners and setting some aside. It is not a cost of running the business. It is debited to the <b>Profit and Loss Appropriation A/c</b>, <u>after</u> net profit is found.</p></div>
<div class="card"><h3>Picture it: the profit cake</h3><p class="mute" style="margin-bottom:10px">Tara Handlooms: net profit ₹1,80,000 cut into slices.</p>
<div class="grid2" style="align-items:center"><div class="pie" style="background:conic-gradient(#3bb5a0 0 20%,#f26b21 20% 35%,#d6568a 35% 40%,#6b5bd6 40% 50%,#2b2a6b 50% 100%)" role="img" aria-label="Pie chart of net profit slices"></div>
<div class="legend"><span><i style="background:#3bb5a0"></i>Interest on capital ₹36,000</span><span><i style="background:#f26b21"></i>Partner's salary ₹27,000</span><span><i style="background:#d6568a"></i>Partner's commission ₹9,000</span><span><i style="background:#6b5bd6"></i>Transfer to reserve ₹18,000</span><span><i style="background:#2b2a6b"></i>Share of profit ₹90,000 (3 : 2)</span></div></div></div>
${flips([['💰 Interest on capital','A return on the money partners put in. Debit in the Appropriation A/c.'],['🧑‍💼 Partner\'s salary','Pay for a partner who works in the firm, as the deed allows.'],['🎯 Partner\'s commission','A reward linked to sales or profit, paid to a partner.'],['🏦 Transfer to reserve','Profit kept back in the firm for the future. It is not paid to anyone now.']])}
<div class="card"><h3>Charge vs appropriation</h3><div class="tw"><table><tr><th>Basis</th><th>Charge</th><th>Appropriation</th></tr>
<tr><td>Meaning</td><td>Cost the firm must bear</td><td>Division of profit among partners</td></tr>
<tr><td>Debited to</td><td>Profit and Loss A/c</td><td>Profit and Loss Appropriation A/c</td></tr>
<tr><td>When paid</td><td>Even in a loss</td><td>Only out of profit</td></tr>
<tr><td>Effect on net profit</td><td>Reduces it</td><td>Net profit is the starting point</td></tr>
<tr><td>Examples</td><td>Interest on partner's loan, rent to partner, manager's commission</td><td>Interest on capital, salary, commission, reserve, share of profit</td></tr></table></div>
<p class="mute" style="margin-top:8px"><b>Lender &amp; landlord first. Partners eat what is left.</b></p></div>

<div class="card read"><h3>📖 Read it: Capital accounts</h3>
<div class="df">Partners' capitals can be kept in two ways: the <b>fixed capital method</b> or the <b>fluctuating capital method</b>.</div>
<ul><li><b>Fixed capital:</b> each partner has a <b>Capital A/c</b> and a <b>Current A/c</b>. The Capital A/c stays the same year after year. It changes only when capital is added or withdrawn by agreement. Profit share, salary, interest and drawings all go to the <b>Current A/c</b>.</li>
<li><b>Fluctuating capital:</b> each partner has only a <b>Capital A/c</b>. Every adjustment goes there, so the balance changes every year.</li>
<li><b>Which to use:</b> if the question does not say capitals are fixed, treat them as fluctuating.</li></ul>
<p class="mute">A Current A/c can have a debit balance. That means the partner has taken out more than he earned.</p></div>
${pre('Under which method does a partner\'s Capital A/c stay the same all year?',['Fixed capital','Fluctuating capital'],0,'Fixed. Under this method, a second account, the <b>Current A/c</b>, takes all the changes.')}
${flips([['🏺 Fixed capital','Two accounts per partner. <b>Capital A/c</b> never changes. All adjustments go to the <b>Current A/c</b>.'],['🌊 Fluctuating capital','One account per partner. Everything goes to the <b>Capital A/c</b>, so it goes up and down every year.'],['Which one?','Read the question. If it does not say capitals are fixed, treat them as fluctuating.'],['Capital changes in fixed method','Only when partners agree to bring in or take out capital.']])}

 const b=$('#chg');b.innerHTML=rows.map((r,i)=>`<div class="row" style="justify-content:space-between;border-top:1.5px solid var(--line);padding:6px 0"><span style="flex:1;min-width:150px">${r[0]}</span><span class="row"><button class="btn alt sm" data-i="${i}" data-v="1">Charge</button><button class="btn alt sm" data-i="${i}" data-v="0">Not a charge</button></span><span id="cg${i}" style="width:100%"></span></div>`).join('');
 b.onclick=e=>{const t=e.target.closest('button');if(!t)return;const i=+t.dataset.i,ok=+t.dataset.v===rows[i][1];$('#cg'+i).innerHTML=ok?'✅ Correct'+(rows[i][1]?' (a charge, debited to P&L A/c)':' (an appropriation, from profit)'):'❌ Try the other one'}})();
document.querySelectorAll('.an').forEach(el=>{const a=ANS[el.id],n=a.caps.length;let cur=0,timer=null,seen=false;const pb=el.querySelector('[data-a=play]');
 const set=k=>{cur=k;el.querySelectorAll('.s').forEach(g=>g.classList.toggle('on',+g.dataset.s<=k));el.querySelector('.cp').textContent=k?a.caps[k-1]:'Press Play to watch.';el.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<k))};
 const lab=()=>{pb.textContent=timer?'❚❚ Pause':(cur>=n?'↻ Replay':'▶ Play')};
 const stop=()=>{clearInterval(timer);timer=null;lab()};
 const play=()=>{if(timer){stop();return}if(cur>=n)set(0);set(cur+1);timer=setInterval(()=>{if(cur<n)set(cur+1);if(cur>=n)stop()},2600);lab()};
 pb.onclick=play;el.querySelector('[data-a=next]').onclick=()=>{stop();set(cur>=n?0:cur+1);lab()};
 set(0);
 if('IntersectionObserver' in window)new IntersectionObserver((es,o)=>{if(es[0].isIntersecting&&!seen){seen=true;play();o.disconnect()}},{threshold:.6}).observe(el);
});
</script>
