<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>F.W. Taylor Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: dark navy app shell (sidebar + dashboard grid) with bright white study panels, one accent colour per principle */
:root{--bg:#0a1038;--bg2:#141c6b;--side:#101757;--panel:#ffffff;--ink:#1b1b45;--muted:#5b6088;--line:#e4e7f6;--soft:#f4f6ff;--gold:#ffc928;--good:#12a56b;--bad:#e5484d;--c:#ffc928;--cink:#3a2a00;
--f1:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;--f2:'Nunito','Segoe UI',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 20% -10%,#26309a 0%,transparent 60%),var(--bg);color:#fff;font-family:var(--f2);font-weight:700;font-size:14px;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px));padding-block:10px 24px;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 4px 12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f1);font-size:26px;font-weight:700;margin-right:auto;white-space:nowrap}
.logo svg{width:44px;height:36px}
.chip{border:2px solid #3c4bd0;border-radius:12px;padding:7px 16px;background:#0f1760;font-size:14px;white-space:nowrap}
.chip b{color:var(--gold)}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;border-radius:20px;border:2px solid #4150d6;background:#0d1558;color:#fff;font:inherit;padding:8px 14px 8px 38px}
.search input::placeholder{color:#a9b0ea}
.search:before{content:"🔍";position:absolute;left:12px;top:7px;font-size:15px}
.sres{position:absolute;z-index:30;left:0;right:0;top:44px;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 12px 30px #0008;overflow:hidden}
.sres button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 14px;color:var(--ink)}
.sres button:hover{background:var(--soft)}
.sres small{display:block;color:var(--muted);font-weight:600}
.xp{display:flex;align-items:center;gap:6px;border:2px solid #3c4bd0;border-radius:14px;background:#0f1760;padding:5px 14px;font-family:var(--f1);font-size:17px;white-space:nowrap}
.bar{display:flex;align-items:center;gap:8px;border:2px solid #3c4bd0;border-radius:14px;background:#0f1760;padding:6px 12px;min-width:170px}
.bar i{display:block;flex:1;height:14px;border-radius:9px;background:#27307f;overflow:hidden}
.bar i b{display:block;height:100%;width:0;background:linear-gradient(90deg,#2be08a,#ffe14a);border-radius:9px;transition:width .6s}
.gear{width:40px;height:40px;border-radius:12px;border:2px solid #3c4bd0;background:#0f1760;font-size:20px;position:relative}
.menu{position:absolute;right:0;top:46px;z-index:30;background:#fff;color:var(--ink);border-radius:14px;padding:8px;min-width:210px;box-shadow:0 12px 30px #0008;text-align:left}
.menu button{display:block;width:100%;background:none;border:0;padding:9px 10px;text-align:left;color:var(--ink);border-radius:8px}
.menu button:hover{background:var(--soft)}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:12px;align-items:start}
.side{background:linear-gradient(#111a62,#0d1450);border:2px solid #263090;border-radius:18px;padding:10px;position:sticky;top:8px;display:flex;flex-direction:column;gap:6px}
.sbrand{display:flex;gap:8px;align-items:center;font-family:var(--f1);font-size:17px;line-height:1.15;padding:4px}
.sbrand span{font-size:30px}
.part{align-self:flex-start;margin:0 0 4px 4px;background:#ff3d8e;border-radius:12px;padding:3px 12px;font-size:13px}
.nv{display:flex;align-items:center;gap:10px;border:0;border-radius:14px;background:#1a2373;padding:7px 10px;text-align:left;font-size:14px;line-height:1.15;width:100%}
.nv i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f1);background:#19c0b0;color:#06312d;font-size:15px}
.nv.on{background:var(--gold);color:#3a2a00}
.nv.on i{background:#3a2a00;color:#fff}
.nv.tool i{border-radius:9px;background:#2f3aa6;font-size:15px}
.nv.tool.on i{background:#3a2a00}
.sep{height:6px}
.mascot{margin-top:6px;position:relative;display:flex;flex-direction:column}
.mascot .bub{position:relative;z-index:2;margin:0 2px -16px 4px;background:#fff;color:var(--ink);border-radius:14px;padding:6px 9px;font-size:12px;font-weight:700;line-height:1.2}
.mimg{width:100%;display:block;border-radius:14px;margin-top:2px;border:2px solid #263090}
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.8fr) minmax(0,1fr);align-items:end;gap:6px;background:linear-gradient(120deg,#1a2490,#2a1b8f 55%,#3b1f9c);border:2px solid #2d38b4;border-radius:20px;padding:14px 18px 0;overflow:hidden;min-height:170px}
.hero h1{font-family:var(--f1);font-size:clamp(34px,5.2vw,64px);line-height:.95;margin:0;letter-spacing:-.5px;text-shadow:3px 4px 0 #0a0f3c}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero h2{font-family:var(--f1);font-size:clamp(15px,1.9vw,23px);margin:6px 0 8px;font-weight:600}
.pill{display:inline-block;background:var(--gold);color:#3a2a00;border-radius:16px;padding:4px 16px;font-family:var(--f1);font-size:15px;transform:rotate(-2deg);margin-bottom:14px}
.fq{position:relative;align-self:center;background:#fff;color:var(--ink);border-radius:18px;padding:12px 14px 10px;font-size:13px;line-height:1.3;font-weight:700;margin-bottom:6px}
.fq b{display:block;text-align:right;margin-top:4px}
.fay{position:absolute;right:calc(100% - 0px);bottom:0;width:100px}
.girls{display:flex;align-items:flex-end;justify-content:flex-end;gap:0;position:relative}
.girlimg{flex:0 1 300px;width:300px;max-width:62%;height:auto;display:block;border-radius:16px 16px 0 0;border:2px solid #ffffff44;border-bottom:0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%);mask-image:linear-gradient(90deg,transparent 0,#000 14%)}
.girls .bub{order:-1;flex:1 1 120px;max-width:160px;align-self:center;margin-bottom:16px;margin-right:-8px;z-index:2;background:#fff;color:var(--ink);border-radius:16px;padding:7px 11px;font-size:12px;line-height:1.25}
.fayw{position:relative;display:flex;align-items:flex-end;gap:8px}
.fayimg{width:112px;height:auto;flex:none;align-self:flex-end;border-radius:14px 14px 0 0;border:2px solid #ffffff55;border-bottom:0;margin-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.tile{border:0;border-radius:16px;padding:10px 4px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f1);font-size:14px;line-height:1.1;text-align:center;box-shadow:0 5px 0 #0006;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .em{display:block;height:34px;line-height:0}.tile .em svg{height:34px;width:auto}
.tile .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff3;font-size:13px;margin-right:5px}
.tile.on{outline:4px solid #fff}
.tile small{font-size:11px;display:block;font-weight:600;font-family:var(--f2)}
.view{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) 270px;grid-template-areas:"concept concept qc" "story act act" "bot bot bot"}
.pn{background:var(--panel);color:var(--ink);border-radius:18px;padding:14px;min-width:0;box-shadow:0 6px 0 #0004}
.pn h3{margin:0 0 8px;font-family:var(--f1);font-size:19px;display:flex;gap:8px;align-items:center}
.concept{grid-area:concept}.qc{grid-area:qc}.story{grid-area:story}.act{grid-area:act}
.chead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.num{width:50px;height:50px;border-radius:50%;background:var(--c);color:var(--cink);display:grid;place-items:center;font-family:var(--f1);font-size:30px;flex:none}
.chead h2{margin:0;font-family:var(--f1);font-size:26px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:6px 14px;font-size:13px}
.tab.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#fff);box-shadow:0 3px 0 var(--c)}
.vis{align-self:start}.cgrid{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:14px}
.kidc{position:relative;display:flex;flex-direction:column;align-items:center}
.kidc .bub{background:#fff;border:2px solid #cfd3ee;border-radius:16px;padding:8px 10px;font-size:12.5px;line-height:1.25;font-weight:700}
.boyimg{width:118px;height:auto;margin-top:4px;border-radius:12px}
.kidc{align-self:start}.sticky{background:#ffd54a;color:#3a2a00;border-radius:6px;padding:7px 10px;font-family:var(--f1);font-size:13px;line-height:1.2;transform:rotate(-5deg);box-shadow:3px 4px 0 #0002;margin-top:-6px}
.mid h4{margin:0 0 4px;font-family:var(--f1);font-size:17px}
.mid p{margin:0 0 12px;font-weight:600;line-height:1.4;font-size:13.5px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ticks li{display:flex;gap:8px;font-weight:600;font-size:13.5px;line-height:1.3}
.ticks li:before{content:"✓";flex:none;width:20px;height:20px;border-radius:6px;background:var(--good);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.ticks.warn li:before{content:"!";background:#ff8a1f}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc{border-radius:14px;padding:8px;text-align:center;position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.cc.w{background:#fff0ef;border:2px solid #ffc9c6}.cc.v{background:#e9faf1;border:2px solid #b4ecd0}
.cc em{font-style:normal;display:inline-block;align-self:center;border-radius:8px;color:#fff;padding:2px 9px;font-size:11.5px;font-family:var(--f1)}
.cc.w em{background:var(--bad)}.cc.v em{background:var(--good)}
.cc{justify-content:center}.ci{width:100%;height:auto;border-radius:10px;display:block;margin:2px 0}.cc .sc{font-size:56px;line-height:1.05;min-height:90px;display:grid;place-items:center;letter-spacing:-6px;padding-right:6px}
.cc p{margin:0;font-size:12px;line-height:1.25;font-weight:700}
.cc .mk{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px}
.cc.w .mk{background:var(--bad)}.cc.v .mk{background:var(--good)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ex{background:var(--soft);border-radius:14px;padding:12px;text-align:center;font-weight:700;font-size:13.5px;line-height:1.35}
.ex b{display:block;font-size:34px;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--soft);border-radius:14px;padding:12px;font-weight:600;font-size:13.5px;line-height:1.4}
.box h4{margin:0 0 6px;font-family:var(--f1);font-size:16px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kw span{background:color-mix(in srgb,var(--c) 22%,#fff);border-radius:10px;padding:4px 10px;font-size:12.5px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-weight:600}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-family:var(--f1)}
.tw{overflow-x:auto}
/* quick check */
.qc h3{color:var(--ink)}
.q{font-size:14px;line-height:1.3;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 9px;margin-bottom:6px;font-weight:600;font-size:13.5px}
.opt i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#fff)}
.opt.ok{border-color:var(--good);background:#dcf7ea}.opt.no{border-color:var(--bad);background:#ffe4e3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;background:#5b2be0;color:#fff;padding:9px 18px;font-family:var(--f1);font-size:15px;box-shadow:0 4px 0 #3a1a9e}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3a1a9e}
.btn.g{background:var(--good);box-shadow:0 4px 0 #0a7a4d}.btn.l{background:#e6e9f7;color:var(--ink);box-shadow:0 4px 0 #c3c8e6}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fb{margin-top:8px;border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.3;font-weight:600}
.fb.ok{background:#e6f9ef;border:2px solid #9be3c1}.fb.no{background:#fff0ef;border:2px solid #ffc4c1}
.fb b{display:block;font-family:var(--f1);font-size:15px}
.xpg{float:right;color:#b07a00;font-family:var(--f1)}
/* story */
.stage{position:relative;height:190px;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.sc1{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.sc1.on{opacity:1}
.it{position:absolute;transform:translate(-50%,-50%);line-height:1;opacity:0}
.sc1.on .it{animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.2)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.sb{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border:2px solid #cfd3ee;border-radius:12px;padding:4px 8px;font-size:11.5px;font-weight:800;line-height:1.15;max-width:44%;text-align:center;opacity:0;box-shadow:0 2px 0 #0002}
.sc1.on .sb{animation:fade .4s forwards;animation-delay:var(--d,0s)}
@keyframes fade{to{opacity:1}}
.stage.img{height:auto;background:#0b1340;border-color:#2a3590}.stage.img img{display:block;width:100%;height:auto}.stage.img i{position:absolute;top:0;bottom:0;background:#0a1038;opacity:0;transition:opacity .5s;pointer-events:none}.stage.img .l{left:0;width:40%}.stage.img .r{right:0;width:60%}.stage[data-ph="0"] .r{opacity:.72}.stage[data-ph="1"] .l{opacity:.72}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.steps span{flex:1 1 90px;background:var(--soft);border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.2;font-weight:700;color:var(--muted);border:2px solid transparent}.steps span.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#fff);color:var(--ink)}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:8px}
.ctrl button{border:0;border-radius:10px;background:var(--ink);color:#fff;padding:5px 11px;font-size:13px}
.ctrl input[type=range]{flex:1;accent-color:#5b2be0}
.ctrl time{font-size:12px;color:var(--muted);font-weight:800}
.cap{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:6px}
.sbadge{margin-left:auto;font-size:12px;background:#5b2be0;color:#fff;border-radius:12px;padding:3px 12px}
/* activity */
.hint{font-size:13px;color:var(--muted);font-weight:700;margin:-4px 0 8px}
.pool{display:flex;gap:6px;flex-wrap:wrap;min-height:38px;padding:8px;border-radius:12px;background:var(--soft);border:2px dashed #cdd2f0;margin-bottom:10px}
.chipx{border:2px solid #cdd2f0;background:#fff;color:var(--ink);border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:grab;user-select:none;text-align:left}
.chipx.sel{border-color:#5b2be0;background:#ece6ff;box-shadow:0 0 0 3px #5b2be033}
.chipx.ok{border-color:var(--good);background:#dcf7ea}.chipx.no{border-color:var(--bad);background:#ffe4e3}
.bks{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.bk{border-radius:12px;padding:8px;background:color-mix(in srgb,var(--bc,#8a7cff) 14%,#fff);border:2px solid color-mix(in srgb,var(--bc,#8a7cff) 40%,#fff);min-height:104px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.bk.over{outline:3px dashed var(--bc,#5b2be0)}
.bk h5{margin:0;font-family:var(--f1);font-size:13.5px;display:flex;gap:6px;align-items:center;line-height:1.1}
.bk .dz{display:flex;flex-direction:column;gap:4px;flex:1;border:2px dashed color-mix(in srgb,var(--bc,#8a7cff) 50%,#fff);border-radius:9px;padding:4px;min-height:44px;align-content:flex-start}
.bk .dz:empty:before{content:"Drop here";color:#8b90b8;font-size:12px;margin:auto;font-weight:700}
.acts{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.res{text-align:center;margin-top:8px;font-weight:800;font-size:14px;min-height:20px}
.yn{display:grid;gap:8px}
.ynr{background:var(--soft);border-radius:12px;padding:9px 10px;font-size:13.5px;font-weight:600;line-height:1.3}
.ynr .b{display:flex;gap:6px;margin-top:6px}
.ynr .b button{flex:1;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:5px;font-size:13px}
.ynr.ok{background:#e6f9ef}.ynr.no{background:#fff0ef}
.ynr small{display:block;margin-top:5px;font-weight:700}
.meters{display:grid;gap:6px;margin:6px 0 10px}
.mt{display:flex;align-items:center;gap:8px;font-size:12.5px}
.mt span{width:92px}
.mt i{flex:1;height:14px;border-radius:8px;background:#e3e6f5;overflow:hidden}
.mt i b{display:block;height:100%;border-radius:8px;transition:width .5s}
.mt em{font-style:normal;width:36px;text-align:right;font-family:var(--f1)}
.sl{display:grid;gap:3px;margin-bottom:8px;font-size:13px}
.sl input[type=range]{width:100%;accent-color:#5b2be0}
.sl label{display:flex;justify-content:space-between}
.chk{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin:4px 0 8px}
.chk label{display:flex;gap:4px;align-items:center;background:var(--soft);border-radius:10px;padding:3px 9px}
/* bottom row */
.bot{grid-area:bot;display:grid;grid-template-columns:1.15fr 1.25fr 1fr 1fr .9fr;gap:12px}
.bot h3{font-size:16px}
.ring{position:relative;height:150px;perspective:700px;display:flex;align-items:center;justify-content:center}
.rg{position:relative;width:128px;height:130px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.c3{position:absolute;inset:0;border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:12.5px;line-height:1.25;color:#fff;border:3px solid #fff8;backface-visibility:hidden;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 40%,#2a1070))}
.c3 b{font-family:var(--f1);font-size:15px;margin-bottom:4px;overflow-wrap:anywhere;line-height:1.15}
.c3:nth-child(1){transform:rotateY(0) translateZ(112px)}.c3:nth-child(2){transform:rotateY(120deg) translateZ(112px)}.c3:nth-child(3){transform:rotateY(240deg) translateZ(112px)}
.arr{position:absolute;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;border:0;background:#2f6bff;color:#fff;font-size:18px;z-index:3}
.dots{text-align:center;font-size:10px;letter-spacing:4px;color:#aab}
.real{display:flex;gap:10px;font-weight:600;font-size:12.5px;line-height:1.35}

function dragAct(p){const a=p.act,A=$("#act"),pool=$("#pool");let sel=null;const place={};
 const chips=[...A.querySelectorAll(".chipx")],dz=[...A.querySelectorAll(".dz")],bk=[...A.querySelectorAll(".bk")];
 function put(i,b){const c=chips[i];if(b===null){pool.appendChild(c);delete place[i]}else{dz[b].appendChild(c);place[i]=b}c.classList.remove("ok","no");$("#res").textContent=""}
 chips.forEach((c,i)=>{c.onclick=e=>{e.stopPropagation();if(c.parentElement!==pool){put(i,null);return}chips.forEach(x=>x.classList.remove("sel"));c.classList.add("sel");sel=i};
  c.ondragstart=e=>{e.dataTransfer.setData("text/plain",i);sel=i}});
 bk.forEach((b,bi)=>{b.onclick=()=>{if(sel!==null){put(sel,bi);sel=null;chips.forEach(x=>x.classList.remove("sel"))}};b.ondragover=e=>{e.preventDefault();b.classList.add("over")};b.ondragleave=()=>b.classList.remove("over");b.ondrop=e=>{e.preventDefault();b.classList.remove("over");const i=+e.dataTransfer.getData("text/plain");if(!isNaN(i))put(i,bi)}});

 $("#rst").onclick=()=>{chips.forEach((c,i)=>{pool.appendChild(c);c.classList.remove("ok","no","sel")});for(const k in place)delete place[k];sel=null;$("#res").textContent=""};

 meters();show()}
function orderAct(p){const a=p.act,n=a.seq.length;let slots=Array(n).fill(null),pool=shuffle(a.seq.map((x,i)=>i));if(pool.every((v,i)=>v===i))pool.reverse();
 function draw(res){const used=new Set(slots.filter(x=>x!==null));

  $("#opl").innerHTML=pool.filter(i=>!used.has(i)).map(i=>`<button class="chipx" data-o2="${i}">${a.seq[i]}</button>`).join("");

function rateHTML(a){return `<div class="rate"><div class="sl"><label>Output per day <b id="ro">0</b> units</label><input type="range" id="rs" min="0" max="16" step="1" value="0" aria-label="Output per day"></div><div class="meters"><div class="mt"><span>Differential</span><i><b id="rm1" style="background:#12a56b"></b></i><em id="rv1">₹0</em></div><div class="mt"><span>Flat ₹${a.flat}</span><i><b id="rm2" style="background:#ff8a1f"></b></i><em id="rv2">₹0</em></div></div><div class="hint" id="rr"></div><div class="acts"><button class="btn" id="rlock">Lock my answer</button></div><div class="res" id="res"></div></div>`}
function rateAct(p){const a=p.act,s=$("#rs");
 function up(){const o=+s.value,rate=o>=a.std?a.high:a.low,d=o*rate,f=o*a.flat;$("#ro").textContent=o;$("#rm1").style.width=Math.min(100,d/800*100)+"%";$("#rm2").style.width=Math.min(100,f/800*100)+"%";$("#rv1").textContent="₹"+d;$("#rv2").textContent="₹"+f;$("#rr").innerHTML=`Rate per unit: <b>₹${rate}</b> ${o>=a.std?"(standard met: higher rate)":"(below standard: lower rate)"}`;$("#res").textContent=""}
 s.oninput=up;up();
 $("#rlock").onclick=()=>{if(+s.value===a.std){$("#res").innerHTML=`🎉 Yes! At ${a.std} units the rate jumps from ₹${a.low} to ₹${a.high} per unit.`;award("act"+p.id,a.xp)}else $("#res").innerHTML="Not yet. Slide to the exact output where the rate per unit jumps."}}
/* Fayol vs Taylor */
function cmpView(){const it=CMP.map(x=>[x[0],x[1]]);
 setView(`<div class="wide"><h2>⚔️ Fayol vs Taylor</h2><p class="sub">Both are fathers of management thought but they looked at different levels. Sort each statement, then read the table.</p><div class="act" id="act" style="box-shadow:none;padding:0"><div class="pool" id="pool">${it.map((x,i)=>`<button class="chipx" draggable="true" data-i="${i}">${x[0]}</button>`).join("")}</div><div class="bks">${[["Henri Fayol","🎩","#2f6bff"],["F.W. Taylor","🏭","#ef4444"]].map((b,i)=>`<div class="bk" data-b="${i}" style="--bc:${b[2]}"><h5>${b[1]} ${b[0]}</h5><div class="dz"></div></div>`).join("")}</div><div class="acts"><button class="btn" id="chk">Check Answer</button><button class="btn l" id="rst">Reset</button></div><div class="res" id="res"></div></div>
 <div class="tw" style="margin-top:14px"><table class="tbl"><tr><th>Basis</th><th>Fayol</th><th>Taylor</th></tr><tr><td>Level of focus</td><td>Top management, whole organisation</td><td>Shop floor, workers' productivity</td></tr><tr><td>Known as</td><td>Father of general (administrative) management</td><td>Father of scientific management</td></tr><tr><td>Applicability</td><td>Universal</td><td>Mainly specialised situations</td></tr><tr><td>Unity of command</td><td>Strongly supports</td><td>Functional foremanship violates it</td></tr><tr><td>Approach</td><td>Principles of administration</td><td>Scientific study and standards</td></tr></table></div></div>`);
 dragAct({id:"cmp",act:{it:it,xp:25}})}
function revView(){setView(`<div class="wide"><h2>⭐ Quick Revision</h2><p class="sub">One line per principle. Memory trick: <b>HTC EFFICIENCY</b> (H-T-C-E-F-F-I-C, then I-E-N-C-Y completes the word).</p><div class="revg">${P.map(p=>`<div class="rc" style="--k:${p.c};color:${p.k}"><span style="font-size:28px">${p.em}</span><span><b>${p.id}. ${p.t}</b>${p.one}</span></div>`).join("")}</div></div>`)}
function sumView(){setView(`<div class="wide"><h2>📒 Summary Notes</h2><p class="sub">F.W. Taylor's eight principles at a glance.</p><div class="tw"><table class="tbl"><tr><th>#</th><th>Principle</th><th>Meaning</th><th>Clue words</th></tr>${P.map(p=>`<tr><td>${p.id}</td><td><b>${p.t}</b></td><td>${p.def}</td><td>${p.kw.join(", ")}</td></tr>`).join("")}</table></div>
 <h3 style="font-family:var(--f1);margin:16px 0 6px">⚔️ Confusing pairs (exam favourites)</h3><div class="tw"><table class="tbl"><tr><th>Pair</th><th>Difference</th></tr><tr><td><b>Cooperation</b> vs <b>Mental revolution</b></td><td>Cooperation = management and workers work together. Mental revolution = the change of attitude in both that makes cooperation possible.</td></tr><tr><td><b>Scientific selection</b> vs <b>Scientific training</b></td><td>Selection = choosing the right person for the job. Training = teaching the selected person the best method and developing skills.</td></tr><tr><td><b>Piece rate</b> vs <b>Differential piece rate</b></td><td>Piece rate = one rate for every unit. Differential = a higher rate at or above the standard, a lower rate below it.</td></tr><tr><td><b>Standardisation</b> vs <b>Simplification</b></td><td>Standardisation = fixing standards for tools, methods and conditions. Simplification = cutting unnecessary varieties of products.</td></tr></table></div></div>`)}
const VIEWS={code:codeView,rev:revView,fc:fcView,match:matchView,cmp:cmpView,quiz:quizView,cs:csView,sum:sumView};

document.addEventListener("click",e=>{
 const fc=e.target.closest(".fcard");if(fc){fc.classList.toggle("f");fc.dataset.s=1;const g=fc.closest(".fgrid"),n=g.querySelectorAll(".fcard[data-s]").length,c=document.getElementById("fcn");if(c)c.textContent=n+" / "+g.children.length;if(g.dataset.pid&&n===g.children.length)award("fc"+g.dataset.pid,10);return}
 const pb=e.target.closest("[data-p]");if(pb&&!pb.closest(".bk")){go(+pb.dataset.p);$("#sres").hidden=true;return}

 const tb=e.target.closest(".tab[data-t]");if(tb){tab=tb.dataset.t;document.querySelectorAll(".tab[data-t]").forEach(x=>x.classList.toggle("on",x===tb));const p=pp(S.cur);$("#tb").innerHTML=tabHTML(p);initTab(p);return}
 if(!e.target.closest(".search"))$("#sres").hidden=true;
 if(!e.target.closest("#gear,#menu"))$("#menu").hidden=true;
});

 const hits=P.filter(p=>(p.t+" "+p.meaning+" "+p.keys.join(" ")+" "+p.kw.join(" ")+" "+p.def).toLowerCase().includes(v));
 r.hidden=false;r.innerHTML=hits.length?hits.map(p=>`<button data-p="${p.id}">${p.id}. ${p.t}<small>${esc(p.one)}</small></button>`).join(""):`<button style="cursor:default">No concept found. Try "rate" or "foreman".</button>`};
shell();hud();go(S.cur||OFF);window.scrollTo(0,0);
