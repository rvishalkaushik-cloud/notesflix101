const KEY="nf101.pass";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){
  // Open the note as its own page (blob), with a <base> so its links resolve from the notes folder.
  const base=new URL('.',location.href).href;
  const withBase=html.replace(/<head([^>]*)>/i,m=>m+'<base href="'+base+'">').replace(/<\/body>/i,'<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href^=\\"#\\"]");if(!a)return;var id=a.getAttribute("href").slice(1);var el=id&&document.getElementById(id);if(el){e.preventDefault();el.scrollIntoView({behavior:"smooth"});}});<\/script></body>');
  const url=URL.createObjectURL(new Blob([withBase],{type:'text/html;charset=utf-8'}));
  location.replace(url);
}
function fail(msg){document.getElementById('err').textContent=msg;}
(async()=>{
  const cfg=window.NF_AUTH||{};
  if(cfg.requireLogin){
    let user=null;
    try{
      firebase.initializeApp(cfg.firebase);
      user=await new Promise(res=>{const un=firebase.auth().onAuthStateChanged(u=>{un();res(u)})});
    }catch(e){user=null}
    if(!user){document.getElementById('need').hidden=false;return}
  }
  document.getElementById('gate').hidden=false;
  let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){try{show(await open(saved));return}catch(e){fail('The saved password no longer works. Please enter the current one.')}}
  document.getElementById('gate').addEventListener('submit',async ev=>{
    ev.preventDefault();
    const pw=document.getElementById('pw').value;
    fail('');
    try{
      const html=await open(pw);
      try{localStorage.setItem(KEY,pw)}catch(e){}
      show(html);
    }catch(e){fail('That password is not right. Check with your teacher.')}
  });
})();
</script></body></html>
