<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work, Energy and Power · Notesflix 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e5;--bg2:#ffefd0;--card:#ffffff;--ink:#22214f;--mut:#5d5b86;--navy:#2b2a6b;--navy2:#3d3b8e;--orange:#f26b21;--amber:#f9b91a;--teal:#3bb5a0;--mint:#a7ebd5;--coral:#f2645a;--line:#ecd9b4;--shadow:0 10px 26px rgba(43,42,107,.12);--r:20px}
:root{--bg:#effbf4;--bg2:#f2f0ca;--navy:#1f2d3d;--navy2:#362e6c;--ink:#1f2d3d;--orange:#7b2ff7;--amber:#ffbe0b;--teal:#00b383;--mint:#a6e4d4;--coral:#ff5c8a;--line:#d2deda;--g1:#f6e08b;--g2:#a3e4d0;--topbg:rgba(239,251,244,0.92);--tint1:#efe6fe;--tint1ink:#311363;--tint1b:#d7c1fd;--tint2:#dbf4ee;--tint2ink:#004432;--mut:#68757d;--shadow:0 10px 26px rgba(31,45,61,0.13)}
.cv .lb.sm{font-size:.6rem;padding:2px 7px}
:root[data-theme="dark"]{--tint1:#2a2550;--tint1ink:#ffe1c9;--tint1b:#3a3880;--tint2:#173a3a;--tint2ink:#c9fff0;--topbg:rgba(20,19,58,.92);--g1:transparent;--g2:transparent}
:root[data-theme="dark"]{--bg:#14133a;--bg2:#1c1b4d;--card:#23225a;--ink:#f3f1ff;--mut:#b9b6e8;--line:#3a3880;--shadow:0 10px 26px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14133a;--bg2:#1c1b4d;--card:#23225a;--ink:#f3f1ff;--mut:#b9b6e8;--line:#3a3880}}
*{box-sizing:border-box}html{font-size:17px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Poppins,'Segoe UI',Arial,sans-serif;overflow-x:hidden;
 background-image:radial-gradient(800px 420px at 0% 0%,var(--g1) 0,transparent 60%),radial-gradient(700px 420px at 100% 20%,var(--g2) 0,transparent 60%)}
:root[data-theme="dark"] body{background-image:none}
h1,h2,h3,h4{font-family:'Baloo 2',Poppins,sans-serif;line-height:1.15;margin:0 0 .35em;color:var(--navy)}
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] h3{color:#fff}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:40;background:var(--topbg);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
:root[data-theme="dark"] .top{background:rgba(20,19,58,.92)}
.top .in{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.logo{font:800 1.2rem/1 'Baloo 2';letter-spacing:1px;color:var(--navy)}.logo b{color:var(--orange)}
:root[data-theme="dark"] .logo{color:#fff}
.pbar{flex:1;min-width:120px;height:12px;border-radius:99px;background:#fff;border:2px solid var(--line);overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--amber),var(--teal));transition:width .5s}
.xp{font:800 .9rem 'Baloo 2';background:var(--amber);color:#3a2a00;border-radius:99px;padding:4px 12px}
.tbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:5px 10px;font-weight:700;font-size:.8rem}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:thin}
.nav a{flex:none;font:600 .74rem Poppins;color:var(--navy);text-decoration:none;border:2px solid var(--line);border-radius:99px;padding:5px 11px;background:var(--card)}
:root[data-theme="dark"] .nav a{color:#fff}
.nav a.ok::after{content:" ✓";color:var(--teal)}
/* hero */
.hero{padding:30px 0 10px;display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:center}
.kick{display:inline-block;font:800 .72rem Poppins;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:99px;padding:5px 12px}
.hero h1{font-size:clamp(2.4rem,7vw,4.2rem);margin:.25em 0 .1em;color:var(--navy);letter-spacing:.5px}
.hero h1 span{color:var(--orange)}
.lead{font-size:1.05rem;color:var(--mut)}
.heroart{background:#fff;border-radius:28px;box-shadow:var(--shadow);border:3px solid #fff;overflow:hidden}
.heroart svg{display:block;width:100%;height:auto}
.btn{border:0;border-radius:14px;padding:11px 18px;font:700 .95rem Poppins;background:var(--orange);color:#fff;box-shadow:0 5px 0 #c4501a}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4501a}
.btn.alt{background:var(--navy);box-shadow:0 5px 0 #17164a}.btn.teal{background:var(--teal);box-shadow:0 5px 0 #23806f}
.btn.sm{padding:7px 12px;font-size:.82rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* blocks */
section.step{padding:34px 0;border-top:3px dashed var(--line)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh .no{flex:none;width:58px;height:58px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 1.5rem 'Baloo 2';box-shadow:0 5px 0 #17164a}
.sh small{display:block;font:800 .7rem Poppins;letter-spacing:.14em;color:var(--orange)}
.sh h2{font-size:clamp(1.5rem,4vw,2.3rem);margin:0}
.blk{margin:16px 0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid var(--line);padding:18px}
.ttl{display:flex;align-items:center;gap:8px;font:800 1.15rem 'Baloo 2';color:var(--navy);margin:0 0 8px}
:root[data-theme="dark"] .ttl{color:#fff}
.ttl .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--amber);font-size:1.1rem}
/* journey */
.jy{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.jy a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font:600 .8rem/1.25 Poppins}
.jy a .e{font-size:1.3rem}.jy a small{display:block;font:800 .62rem Poppins;letter-spacing:.1em;color:var(--mut)}
.jy a.here{border-color:var(--orange);background:var(--tint1);box-shadow:0 0 0 3px var(--tint1b)}
:root[data-theme="dark"] .jy a.here{background:#3a2a40}
.jy a.here small::after{content:" · YOU ARE HERE";color:var(--orange)}
/* predict */
.pred{background:linear-gradient(135deg,#fff8e6,#ffe9c2);border:3px dashed var(--amber);border-radius:var(--r);padding:16px 18px}
:root[data-theme="dark"] .pred{background:#2a2550}
.pred .q{font:700 1.15rem/1.35 'Baloo 2';color:var(--navy)}:root[data-theme="dark"] .pred .q{color:#fff}
.pred .q::before{content:"🤔 THINK FIRST";display:block;font:800 .7rem Poppins;letter-spacing:.14em;color:var(--orange);margin-bottom:4px}
.pred .a{margin-top:10px;background:var(--tint2);border-radius:14px;padding:10px 14px;border:2px solid var(--mint);color:var(--tint2ink)}
/* key slide */
.ks{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:3px solid var(--navy)}
.ks .hd{background:var(--navy);color:#fff;padding:12px 18px}.ks .hd small{font:800 .68rem Poppins;letter-spacing:.14em;color:var(--amber)}.ks .hd h3{color:#fff;margin:2px 0 0;font-size:1.45rem}
.ks .bd{background:var(--card);padding:16px 18px;display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}
.ks .art{background:var(--bg2);border-radius:16px;display:grid;place-items:center;padding:10px;min-height:200px}.ks .art svg{width:100%;height:auto}
.ks .simple{font-weight:600;font-size:1.02rem}
.ks ul{list-style:none;padding:0;margin:10px 0}.ks li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:.93rem;border:2px solid var(--line)}
.ks li .i{flex:none;font-size:1.2rem}
.ks b,.simple b{color:var(--orange)}
.an{background:var(--tint2);border-left:6px solid var(--teal);border-radius:12px;padding:10px 12px;font-size:.92rem;color:var(--tint2ink)}.an::before{content:"🧠 Think of it like this: ";font-weight:800}
.ex{grid-column:1/-1;background:#fff6dc;border:3px dashed var(--amber);border-radius:16px;padding:12px 14px;font-size:.92rem;color:#3a2a00}.ex::before{content:"✍️ WRITE THIS IN THE EXAM (NCERT)";display:block;font:800 .7rem Poppins;letter-spacing:.12em;color:var(--orange);margin-bottom:4px}
/* glossary */
.gw{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:2px dotted var(--orange);cursor:help}
#gpop{position:fixed;z-index:80;max-width:280px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px;font-size:.86rem;box-shadow:var(--shadow)}
#gpop b{color:var(--amber);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:2px solid var(--teal);background:var(--tint2);color:var(--tint2ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:.82rem}
/* flips */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fp{display:block;width:100%;cursor:pointer;font:inherit;color:inherit;perspective:900px;height:200px;border:0;background:none;padding:0;text-align:left}
.fp .in{display:block;position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fp.on .in{transform:rotateY(180deg)}
.fp .f,.fp .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;padding:14px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.fp .f{background:var(--card);border:3px solid var(--c,var(--orange));align-items:center;text-align:center}
.fp .f .e{flex:none;font-size:2.6rem;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:3px solid var(--c,var(--orange));margin-bottom:8px}
.fp .f b{display:block;font:800 1.05rem 'Baloo 2';color:var(--navy)}:root[data-theme="dark"] .fp .f b{color:#fff}
.fp .f small{color:var(--mut);font-size:.72rem}
.fp .b{background:var(--c,var(--orange));color:#fff;transform:rotateY(180deg);font-size:.88rem;line-height:1.45}
.fp .b em{display:block;margin-top:8px;font-style:normal;background:#ffffff33;border-radius:10px;padding:5px 8px;font-size:.8rem}
/* try / learn */
.try{background:var(--tint1);border-left:6px solid var(--orange);border-radius:12px;padding:9px 12px;font-size:.92rem;margin-bottom:10px;color:var(--tint1ink)}.try::before{content:"🎯 What to try: ";font-weight:800}
details.learn{margin-top:10px;background:var(--tint2);border:2px solid var(--mint);border-radius:12px;padding:8px 12px;color:var(--tint2ink)}details.learn summary{cursor:pointer;font-weight:800}
/* sorter / quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0;font-weight:500}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:800 .8rem 'Baloo 2'}
.opt:hover:not([disabled]){border-color:var(--orange)}.opt.ok{border-color:var(--teal);background:var(--tint2);color:var(--tint2ink)}.opt.no{border-color:var(--coral);background:#ffe5e2;color:#7a1d16}.opt[disabled]{cursor:default}
.fb{margin-top:8px;border-radius:12px;padding:8px 12px;font-size:.9rem}.fb.ok{background:var(--tint2);color:var(--tint2ink)}.fb.no{background:#ffe5e2;color:#7a1d16}
.qhd{display:flex;justify-content:space-between;align-items:center;font:800 .75rem Poppins;letter-spacing:.08em;color:var(--mut)}
.qq{font:700 1.1rem/1.35 'Baloo 2';margin:6px 0}
.dots{display:flex;gap:5px}.dots i{width:22px;height:7px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--orange)}.dots i.ok{background:var(--teal)}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.bk button{border:3px solid var(--navy2);background:var(--card);border-radius:14px;padding:12px;font:800 .9rem 'Baloo 2';color:var(--navy)}
:root[data-theme="dark"] .bk button{color:#fff}
.bk button:hover{background:var(--bg2)}
.item{font:700 1.1rem/1.35 'Baloo 2';background:var(--bg2);border-radius:14px;padding:14px;text-align:center;border:2px dashed var(--amber)}
/* one line */
.ol{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,var(--teal),#2f9c89);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 #23806f}
.ol .e{font-size:1.8rem}.ol small{display:block;font:800 .68rem Poppins;letter-spacing:.14em;opacity:.85}.ol p{margin:0;font-weight:700}.ol b{color:#fff3b0}
/* compare */
.cmp{width:100%;border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.cmp th{background:var(--navy);color:#fff;padding:10px;font:800 .95rem 'Baloo 2'}.cmp th:last-child{background:var(--teal)}
.cmp td{background:var(--card);padding:9px 10px;border-top:2px solid var(--line);font-size:.9rem;vertical-align:top}.cmp td:first-child{font-weight:800;color:var(--orange);background:var(--bg2)}
/* tree */
.tree{text-align:center}.tree .nd{display:inline-block;border-radius:14px;padding:8px 14px;font:800 .95rem 'Baloo 2';color:#fff;border:0;margin:4px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tree .lv{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:10px 0}
.tree .r{background:var(--navy)}.tree .it{background:var(--orange)}.tree .fx{background:var(--teal)}.tree .sm{background:#2f9c89}.tree .lg{background:#1f7a6b}
.tree .leaf{background:var(--card);color:var(--ink);border:2px solid var(--line);font:700 .8rem Poppins;box-shadow:none}
.tinfo{margin-top:10px;background:var(--bg2);border-radius:14px;padding:10px 14px;min-height:56px;font-size:.92rem;text-align:left}
/* 3d */
.b3{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.b3>*{min-width:0}
.cv{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(var(--g1),var(--bg));border:3px solid var(--navy);aspect-ratio:16/11;min-height:300px}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.cv .help{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(43,42,107,.85);color:#fff;border-radius:12px;padding:6px 10px;font-size:.74rem;pointer-events:none}
.cv .lbls{position:absolute;inset:0;pointer-events:none}
.cv .lb{position:absolute;transform:translate(-50%,-100%);background:var(--navy);color:#fff;font:700 .68rem Poppins;padding:3px 8px;border-radius:99px;white-space:nowrap}
.cv .lb.sel{background:var(--orange)}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.modes button{border:2px solid var(--navy);background:var(--card);border-radius:12px;padding:6px 12px;font:800 .82rem 'Baloo 2';color:var(--navy)}
.modes button.on{background:var(--navy);color:#fff}
.panel h4{font-size:1.25rem;margin:.1em 0}.panel .tag{display:inline-block;font:800 .65rem Poppins;letter-spacing:.12em;background:var(--amber);color:#3a2a00;border-radius:8px;padding:3px 8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat div{background:var(--bg2);border-radius:12px;padding:8px;text-align:center;font-size:.78rem;color:var(--mut)}.stat b{display:block;font:800 1.3rem 'Baloo 2';color:var(--navy)}
/* gst */
.gst label{display:block;font-weight:700;margin:6px 0}.gst select,.gst input[type=number]{font:inherit;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.bill{background:#fff;color:#22214f;border-radius:14px;border:2px dashed var(--navy2);padding:12px 14px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem;margin-top:10px}
.bill .tot{border-top:2px solid #22214f;margin-top:6px;padding-top:6px;font-weight:800}
/* motion overrides for light theme */
.ms{border:3px solid var(--navy)!important;background:var(--bg)!important;border-radius:22px!important}
.ms .mcap{color:var(--navy)!important;text-shadow:none!important;background:linear-gradient(transparent,var(--bg) 35%)!important}
.ms .mcap b{color:var(--orange)!important}
.ms .mctl button{background:var(--orange)!important;color:#fff!important}
.ms .mbar{background:var(--teal)!important}
.foot{padding:30px 0 60px;color:var(--mut);font-size:.82rem;text-align:center}
@media (max-width:820px){.hero,.ks .bd,.b3{grid-template-columns:1fr}.cv{aspect-ratio:auto;height:340px;min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ===== factory widgets ===== */
.hero>*{min-width:0}.hero h1{overflow-wrap:anywhere}.hero .kick{white-space:normal;max-width:100%}
@media (max-width:520px){.hero h1{font-size:clamp(1.9rem,9.5vw,2.6rem)}}
.gph{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px}
.gph svg{width:100%;height:auto;display:block;touch-action:none}
.gph .ax{stroke:var(--ink);stroke-width:2}.gph .gr{stroke:var(--line);stroke-width:1}.gph text{fill:var(--ink);font:600 12px Poppins,sans-serif}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px;margin-top:8px}
.sl label{font-weight:700;font-size:.85rem}.sl input[type=range]{width:100%;accent-color:var(--orange)}
.sl output{float:right;font:800 .9rem 'Baloo 2';color:var(--orange)}
.calc .row label{font-weight:700;font-size:.88rem}.calc input,.calc select{font:inherit;font-size:16px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.calc .out{margin-top:10px;background:var(--card);border:2px dashed var(--navy2);border-radius:14px;padding:12px 14px;font-size:.95rem;overflow-x:auto}
.calc .out table{border-collapse:collapse;width:100%}.calc .out td{padding:4px 8px;border-bottom:1px solid var(--line)}.calc .out td:last-child{text-align:right;font-weight:700}
.ord{display:flex;flex-direction:column;gap:8px}.ord button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:600}
.ord button.pk{border-color:var(--teal);background:var(--tint2);color:var(--tint2ink)}.ord .n{font:800 1rem 'Baloo 2';min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--amber);color:#3a2a00;flex:none}
.exq{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;background:var(--card)}
.exq .mk{display:inline-block;font:800 .72rem Poppins;background:var(--navy);color:#fff;border-radius:99px;padding:2px 9px;margin-right:6px}
.exq ul.pts{margin:8px 0 0;padding:0;list-style:none}.exq ul.pts li{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.exq ul.pts input{width:20px;height:20px;accent-color:var(--teal);flex:none;margin-top:3px}
.exq textarea{width:100%;min-height:90px;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);color:var(--ink)}
.tl{position:relative;padding-left:22px;border-left:4px solid var(--amber);margin-left:8px}.tl .ev{position:relative;margin:0 0 12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer}
.tl .ev::before{content:"";position:absolute;left:-33px;top:12px;width:18px;height:18px;border-radius:50%;background:var(--orange);border:3px solid var(--bg)}.tl .ev b{color:var(--orange)}.tl .ev p{margin:4px 0 0;font-size:.9rem}
.tree .lv{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}.tree .nd{border:0;border-radius:12px;padding:8px 12px;font-weight:700;color:#fff;background:var(--c,var(--navy))}
.tree .tinfo{background:var(--tint2);color:var(--tint2ink);border-radius:12px;padding:10px 12px;margin-top:8px}

"<b>Formula:<\/b> W = F × s, with F in newton and s in metre."], ["📏", "<b>Joule:<\/b> 1 J = work done by a force of 1 N through a displacement of 1 m."], ["0️⃣", "<b>Zero work:<\/b> if s = 0 (pushing a wall) or the force is perpendicular to the displacement (carrying a bag along level ground), the work is zero."]], "an": "Like paying for a trip: the fare depends on both how hard you push and how far you go; standing still pays nothing.", "ex": "In science, work is done only when a force acts on a body and the body is displaced in the direction of the force. The work done by a constant force is the product of the force and the displacement in the direction of the force, W = F × s. Work is a scalar. Its SI unit is the joule, named after James Prescott Joule. One joule is the work done when a force of one newton displaces a body by one metre in the direction of the force, so 1 J = 1 N m. If a force of 20 N moves a box by 5 m, the work done is 20 × 5 = 100 J. Work is positive when the force and displacement are in the same direction, as when you pull a trolley forward, and negative when they are opposite, as when friction acts on a sliding block. No work is done when the displacement is zero, as when a person pushes a rigid wall, however tired he becomes. No work is done by the force of gravity on a ball moving horizontally, or by a weightlifter holding a weight steady, because there is no displacement along the force."}, "words": ["work", "joule"], "flips": {"h": "Work · tap", "items": [["💪", "Work", "W = Fs.", "Scalar."], ["📏", "Joule", "1 N m.", "SI unit."], ["🧱", "Pushing a wall", "Zero work.", "No displacement."], ["🧳", "Carrying a bag along level ground", "Zero work.", "Force is perpendicular."], ["🛷", "Friction", "Negative work.", "Opposite to motion."]]}, "act": {"type": "dragsort", "id": "s1sort", "h": "🎮 Is work done?", "try": "Drag each situation to the right bin.", "learn": "Work needs <b>displacement along the force<\/b>.", "bins": [{"t": "Work is done", "e": "✅"}, {"t": "No work done", "e": "❌"}], "items": [["Pulling a trolley along the floor", 0, "The force moves it.", "🛒"], ["Pushing a rigid wall", 1, "No displacement.", "🧱"], ["Lifting a book up", 0, "Lifted along the force.", "📚"], ["Holding a heavy bag still", 1, "No displacement.", "🏋️"], ["Pushing a car that moves", 0, "It moves along the push.", "🚗"], ["Carrying a bag along level ground", 1, "Force is at right angles.", "🧳"]]}, "extra": [{"type": "calc", "id": "s1calc", "h": "🧪 Simulate · work done", "try": "Enter the force and displacement.", "learn": "W = F × s in joule when F is in newton and s in metre.", "inputs": [{"id": "f", "label": "Force F (N)", "type": "number", "min": 0, "max": 1000, "step": 1, "val": 20}, {"id": "s", "label": "Displacement s (m)", "type": "number", "min": 0, "max": 100, "step": 0.5, "val": 5}], "fn": "const w=v.f*v.s;return '<p>W = '+v.f+' × '+v.s+' = <b>'+w+' J<\/b><\/p>';"}, {"type": "memmatch", "id": "s1mem", "h": "🃏 Memory match · work", "try": "Flip two cards to match.", "pairs": [["Work", "Force × displacement"], ["Unit of work", "Joule"], ["1 joule", "1 N m"], ["Pushing a wall", "Zero work"], ["Work is a", "Scalar"]]}, {"type": "tfrush", "id": "s1tf", "h": "⚡ Spot the mistake rush", "try": "Decide fast. Three wrong answers and the round ends.", "items": [["W = F × s.", true, "Along the force."], ["The unit of work is the newton.", false, "It is the joule."], ["No work is done if the displacement is zero.", true, "W = 0."], ["Work is a vector.", false, "It is a scalar."], ["1 J = 1 N m.", true, "Definition."], ["A person holding a bag still does work on it.", false, "No displacement."]]}], "quiz": [["SI unit of work…", ["Joule", "Newton", "Watt", "Pascal"], "Named after Joule."], ["F = 10 N, s = 3 m, W =", ["30 J", "13 J", "3.3 J", "7 J"], "10 × 3."], ["Work is zero when…", ["Displacement is zero", "Force is large", "Mass is large", "Speed is high"], "No movement."]], "line": "<b>W = Fs<\/b>; 1 joule = 1 N m; no displacement means no work.", "pics": [{"type": "manga", "id": "mg-ix7-1-1", "h": "Picture story · swipe the panels", "cast": {"kiara": {"name": "Kiara", "hair": "#1a1a1a", "outfit": "#2a7fd0", "hat": "cap", "skin": "m", "eye": "#22e4ff"}, "ved": {"name": "Ved", "hair": "#3a1a1a", "outfit": "#d08a20", "skin": "l"}, "anvi": {"name": "Anvi", "hair": "#2a1a0a", "outfit": "#2a9a4f", "skin": "d"}}, "panels": [{"bg": ["#2a9a4f", "#0a2a14"], "props": [{"e": "💪", "x": 560, "y": 180, "fs": 110}], "cap": "Push with a force."}, {"bg": ["#3a3a7b", "#0a0a2a"], "props": [{"e": "📏", "x": 560, "y": 180, "fs": 110}], "cap": "Move it a distance."}, {"bg": ["#2a7a6a", "#0a2a24"], "props": [{"e": "⚙️", "x": 400, "y": 190, "fs": 110}], "cap": "Work equals force times distance."}]}], "codes": [{"type": "memcode", "id": "mc-ix7-1-1", "h": "Memory code · work", "phrase": "WORK", "tip": "Work Obtains from Reach and Kick.", "letters": [["W", "Work", "Joule"], ["O", "Of", "Times"], ["R", "Reach (s)", "m"], ["K", "Kick (F)", "N"]]}]}, {"id": "s2", "e": "🏔️", "t": "Kinetic and potential energy", "nav": "Energy", "motion": ["Height changes into speed", "m2"], "before": [{"type": "html", "html": "<figure style=\"margin:0\"><svg viewBox=\"0 0 800 300\" role=\"img\" aria-label=\"Two forms of mechanical energy\" style=\"width:100%;height:auto;display:block;border-radius:18px\"><rect width=\"800\" height=\"300\" fill=\"#f2f0ca\"/><g font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" text-anchor=\"middle\"><g transform=\"translate(115 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#7b2ff7\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🏃<\/text><text y=\"146\" font-size=\"18\" fill=\"#7b2ff7\">KE<\/text><text y=\"180\" font-size=\"13\" fill=\"#1f2d3d\">½mv²<\/text><text y=\"204\" font-size=\"13\" fill=\"#1f2d3d\"><\/text><\/g><g transform=\"translate(305 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#362e6c\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🏔️<\/text><text y=\"146\" font-size=\"18\" fill=\"#362e6c\">PE<\/text><text y=\"180\" font-size=\"13\" fill=\"#1f2d3d\">mgh<\/text><text y=\"204\" font-size=\"13\" fill=\"#1f2d3d\"><\/text><\/g><g transform=\"translate(495 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#00b383\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">♻️<\/text><text y=\"146\" font-size=\"18\" fill=\"#00b383\">Total<\/text><text y=\"180\" font-size=\"13\" fill=\"#1f2d3d\">constant<\/text><text y=\"204\" font-size=\"13\" fill=\"#1f2d3d\"><\/text><\/g><g transform=\"translate(685 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#ff5c8a\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">⚙️<\/text><text y=\"146\" font-size=\"18\" fill=\"#ff5c8a\">Theorem<\/text><text y=\"180\" font-size=\"13\" fill=\"#1f2d3d\">W = ΔKE<\/text><text y=\"204\" font-size=\"13\" fill=\"#1f2d3d\"><\/text><\/g><\/g><\/svg><figcaption style=\"text-align:center;font-weight:700;margin-top:6px;opacity:.8\">Energy is the capacity to do work.<\/figcaption><\/figure>"}], "ks": {"title": "Kinetic energy, potential energy and conservation", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Two energies\"><rect width=\"100%\" height=\"100%\" rx=\"16\" fill=\"#f2f0ca\"/><rect x=\"20\" y=\"38\" width=\"120\" height=\"115\" rx=\"12\" fill=\"#ffbe0b\" opacity=\".45\" stroke=\"#1f2d3d\" stroke-width=\"3\"/><text x=\"80\" y=\"60\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#1f2d3d\">Kinetic<\/text><text x=\"80\" y=\"84\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#1f2d3d\">Due to motion<\/text><text x=\"80\" y=\"104\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#1f2d3d\">KE = ½mv²<\/text><rect x=\"160\" y=\"38\" width=\"120\" height=\"115\" rx=\"12\" fill=\"#7b2ff7\" opacity=\".45\" stroke=\"#1f2d3d\" stroke-width=\"3\"/><text x=\"220\" y=\"60\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#1f2d3d\">Potential<\/text><text x=\"220\" y=\"84\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#1f2d3d\">Due to height<\/text><text x=\"220\" y=\"104\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#1f2d3d\">PE = mgh<\/text><text x=\"150\" y=\"20\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#ff5c8a\">Two energies<\/text><text x=\"150\" y=\"185\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#1f2d3d\">Joule is the unit<\/text><\/svg>", "simple": "<b>KE<\/b> = ½mv² and <b>PE<\/b> = mgh. Total energy is <b>conserved<\/b>: PE + KE = constant.", "pts": [["🏃", "<b>Kinetic energy:<\/b> KE = ½ m v²; doubling the velocity makes KE four times."], ["🏔️", "<b>Potential energy:<\/b> PE = m g h, with g = 10 m/s² (approximate) near Earth."], ["⚙️", "<b>Work–energy theorem:<\/b> the work done on a body equals the change in its kinetic energy."], ["♻️", "<b>Conservation:<\/b> in a falling body, loss in PE = gain in KE, so the total energy stays constant."]], "an": "Like money in two pockets: moving it from one pocket to the other changes the pocket, not the total.", "ex": "Energy is the capacity to do work, and it is measured in joule. The energy of a body due to its motion is its kinetic energy, KE = ½ m v². If the velocity doubles, the kinetic energy becomes four times. The energy possessed by a body because of its position or configuration is potential energy. For a body of mass m at height h above the ground, the potential energy is PE = m g h, where g is the acceleration due to gravity, about 9.8 m/s² and taken as 10 m/s² in simple calculations. A 2 kg book held at 3 m has PE = 2 × 10 × 3 = 60 J. The work-energy theorem states that the work done by the net force on a body equals the change in its kinetic energy. The law of conservation of energy states that energy can neither be created nor destroyed; it can only be changed from one form to another, and the total energy before and after a change remains the same. For a freely falling body, the potential energy lost equals the kinetic energy gained, so mgh = ½mv² and v = √(2gh) at the ground. A pendulum, a roller coaster and a bouncing ball all swap potential and kinetic energy continuously."}, "words": ["kinetic energy", "potential energy", "energy", "conservation of energy"], "flips": {"h": "Energy · tap", "items": [["🏃", "Kinetic", "½mv².", "Motion."], ["🏔️", "Potential", "mgh.", "Height."], ["⚙️", "Theorem", "W = change in KE.", "Work changes energy."], ["♻️", "Conservation", "PE + KE constant.", "Energy is not lost."], ["2️⃣", "Double speed", "KE becomes 4 times.", "Velocity squared."]]}, "act": {"type": "dragsort", "id": "s2sort", "h": "🎮 Kinetic or potential?", "try": "Drag each object to the energy it mainly has.", "learn": "<b>Moving<\/b> means kinetic; <b>raised or stretched<\/b> means potential.", "bins": [{"t": "Kinetic energy", "e": "🏃"}, {"t": "Potential energy", "e": "🏔️"}], "items": [["A running cheetah", 0, "It is moving.", "🐆"], ["A book on a high shelf", 1, "It is raised.", "📚"], ["A speeding car", 0, "It is moving.", "🚗"], ["A stretched bow", 1, "Stored in its shape.", "🏹"], ["A flowing river", 0, "Water is moving.", "🌊"], ["Water behind a dam", 1, "It is raised.", "🏞️"]]}, "extra": [{"type": "calc", "id": "s2calc", "h": "🧪 Simulate · KE and PE", "try": "Choose the mass, velocity and height.", "learn": "KE = ½mv² and PE = mgh with g = 10 m/s².", "inputs": [{"id": "m", "label": "Mass m (kg)", "type": "number", "min": 0.1, "max": 100, "step": 0.1, "val": 2}, {"id": "v", "label": "Velocity v (m/s)", "type": "number", "min": 0, "max": 50, "step": 1, "val": 10}, {"id": "h", "label": "Height h (m)", "type": "number", "min": 0, "max": 100, "step": 1, "val": 5}], "fn": "const ke=0.5*v.m*v.v*v.v,pe=v.m*10*v.h;return '<p>KE = ½ × '+v.m+' × '+v.v+'² = <b>'+ke.toFixed(1)+' J<\/b><\/p><p>PE = '+v.m+' × 10 × '+v.h+' = <b>'+pe.toFixed(1)+' J<\/b><\/p>';"}, {"type": "graph", "id": "s2graph", "h": "📈 Kinetic energy against velocity", "try": "Change the mass. The curve rises steeply because velocity is squared.", "xr": [0, 20], "yr": [0, 2000], "xl": "velocity (m/s)", "yl": "kinetic energy (J)", "params": [{"id": "m", "label": "Mass m (kg)", "min": 1, "max": 10, "step": 1, "val": 4}], "curves": [{"f": "0.5*p.m*x*x", "c": "var(--orange)", "label": "KE = ½mv²"}], "points": [{"x": "10", "y": "0.5*p.m*100", "label": "v = 10 m/s"}], "note": "return 'At v = 10 m/s and m = '+fmt(p.m)+' kg:<br>KE = <b>'+fmt(0.5*p.m*100)+' J<\/b>';"}, {"type": "memmatch", "id": "s2mem", "h": "🃏 Memory match · energy", "try": "Flip two cards to match.", "pairs": [["Kinetic energy", "½mv²"], ["Potential energy", "mgh"], ["Unit of energy", "Joule"], ["Energy conserved", "Total stays constant"], ["Work–energy theorem", "Work = change in KE"]]}, {"type": "tfrush", "id": "s2tf", "h": "⚡ Spot the mistake rush", "try": "Decide fast. Three wrong answers and the round ends.", "items": [["KE = ½mv².", true, "Motion energy."], ["Doubling velocity doubles KE.", false, "It makes KE four times."], ["PE = mgh.", true, "Height energy."], ["Energy can be destroyed.", false, "It only changes form."], ["A falling body loses PE and gains KE.", true, "Total constant."], ["A body at rest on the ground has zero KE.", true, "v = 0."]]}], "quiz": [["KE of 2 kg at 3 m/s…", ["9 J", "6 J", "12 J", "18 J"], "½ × 2 × 9."], ["PE of 5 kg at 4 m (g = 10)…", ["200 J", "20 J", "9 J", "54 J"], "5 × 10 × 4."], ["If v doubles, KE becomes…", ["4 times", "2 times", "Half", "Same"], "Squared."]], "line": "<b>KE = ½mv²<\/b>, <b>PE = mgh<\/b>, and the total energy is conserved.", "pics": [{"type": "manga", "id": "mg-ix7-1-2", "h": "Picture story · swipe the panels", "cast": {"kiara": {"name": "Kiara", "hair": "#1a1a1a", "outfit": "#2a7fd0", "hat": "cap", "skin": "m", "eye": "#22e4ff"}, "ved": {"name": "Ved", "hair": "#3a1a1a", "outfit": "#d08a20", "skin": "l"}, "anvi": {"name": "Anvi", "hair": "#2a1a0a", "outfit": "#2a9a4f", "skin": "d"}}, "panels": [{"bg": ["#d07a2a", "#3a1a06"], "props": [{"e": "🏔️", "x": 560, "y": 180, "fs": 110}], "cap": "Up high it holds potential energy."}, {"bg": ["#7a1f2b", "#2a0a14"], "props": [{"e": "🎢", "x": 560, "y": 180, "fs": 110}], "cap": "Falling turns it into kinetic."}, {"bg": ["#1d4a5e", "#06141c"], "props": [{"e": "♻️", "x": 400, "y": 190, "fs": 110}], "cap": "Total energy stays the same."}]}], "codes": [{"type": "memcode", "id": "mc-ix7-1-2", "h": "Memory code · energy", "phrase": "KEPT", "tip": "Kinetic and Potential Total.", "letters": [["K", "Kinetic ½mv²", "Moving"], ["E", "Energy", "Joule"], ["P", "Potential mgh", "Height"], ["T", "Total", "Constant"]]}]}, {"id": "s3", "e": "⚡", "t": "Power and the watt", "nav": "Power", "motion": ["Power is work per second", "m3"], "before": [{"type": "html", "html": "<figure style=\"margin:0\"><svg viewBox=\"0 0 800 300\" role=\"img\" aria-label=\"Power measures how fast work is done\" style=\"width:100%;height:auto;display:block;border-radius:18px\"><rect width=\"800\" height=\"300\" fill=\"#f2f0ca\"/><g font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" text-anchor=\"middle\"><g transform=\"translate(115 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#7b2ff7\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">⚡<\/text><text y=\"146\" font-size=\"18\" fill=\"#7b2ff7\">P = W/t<\/text><text y=\"180\" font-size=\"13\" fill=\"#1f2d3d\">formula<\/text><text y=\"204\" font-size=\"13\" fill=\"#1f2d3d\"><\/text><\/g><g transform=\"translate(305 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#362e6c\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">💡<\/text><text y=\"146\" font-size=\"18\" fill=\"#362e6c\">Watt<\/text><text y=\"180\" font-size=\"13\" fill=\"#1f2d3d\">1 J/s<\/text><text y=\"204\" font-size=\"13\" fill=\"#1f2d3d\"><\/text><\/g><g transform=\"translate(495 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#00b383\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🔌<\/text><text y=\"146\" font-size=\"18\" fill=\"#00b383\">kWh<\/text><text y=\"180\" font-size=\"13\" fill=\"#1f2d3d\">3.6 × 10⁶ J<\/text><text y=\"204\" font-size=\"13\" fill=\"#1f2d3d\"><\/text><\/g><g transform=\"translate(685 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#ff5c8a\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🏋️<\/text><text y=\"146\" font-size=\"18\" fill=\"#ff5c8a\">Time<\/text><text y=\"180\" font-size=\"13\" fill=\"#1f2d3d\">shorter, more power<\/text><text y=\"204\" font-size=\"13\" fill=\"#1f2d3d\"><\/text><\/g><\/g><\/svg><figcaption style=\"text-align:center;font-weight:700;margin-top:6px;opacity:.8\">Same work, less time, more power.<\/figcaption><\/figure>"}], "ks": {"title": "Power and commercial units of energy", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Power\"><rect width=\"100%\" height=\"100%\" rx=\"16\" fill=\"#f2f0ca\"/><rect x=\"25\" y=\"55\" width=\"250\" height=\"80\" rx=\"14\" fill=\"#ffbe0b\" opacity=\".4\" stroke=\"#1f2d3d\" stroke-width=\"3\"/><text x=\"150\" y=\"106\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"30\" fill=\"#1f2d3d\">P = W ÷ t<\/text><text x=\"150\" y=\"35\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#ff5c8a\">Power<\/text><text x=\"150\" y=\"160\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#1f2d3d\">1 W = 1 J/s,  1 kWh = 3.6 × 10⁶ J<\/text><text x=\"150\" y=\"187\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#7b2ff7\">Electricity bill unit<\/text><\/svg>", "simple": "<b>Power<\/b> = work ÷ time, <b>P = W/t<\/b>. Unit: <b>watt<\/b> (1 W = 1 J/s).", "pts": [["⚡", "<b>Power:<\/b> the rate of doing work, P = W ÷ t."], ["💡", "<b>Watt:<\/b> 1 W = 1 J/s; 1 kW = 1000 W; 1 horse power ≈ 746 W."], ["🔌", "<b>kilowatt-hour:<\/b> 1 kWh = 1000 W × 3600 s = 3.6 × 10⁶ J, the unit on electricity bills."], ["🔄", "<b>Also:<\/b> power can be written as P = energy ÷ time, because energy is the work that can be done."]], "an": "Like two runners carrying the same bag up the stairs: the one who reaches the top in less time is more powerful.", "ex": "Power is the rate at which work is done or energy is transferred. If an amount of work W is done in time t, the power is P = W ÷ t. The SI unit of power is the watt, named after James Watt. One watt is the power of an agent that does work at the rate of one joule per second, 1 W = 1 J/s. A bigger unit is the kilowatt, 1 kW = 1000 W. Another unit, the horse power, equals about 746 W. If a pump lifts 500 J of water in 10 s, the power is 50 W. If two people lift the same load to the same height, they do the same work, but the one who does it faster has more power. Average power is the total work divided by the total time. The commercial unit of electrical energy is the kilowatt-hour (kWh), commonly called one unit. One kWh is the energy used when a power of 1 kW is used for 1 hour, which equals 1000 W × 3600 s = 3.6 × 10⁶ J. A 100 W bulb used for 10 hours consumes 1 kWh of energy."}, "words": ["power", "watt"], "flips": {"h": "Power · tap", "items": [["⚡", "Power", "W ÷ t.", "Rate of work."], ["💡", "Watt", "1 J/s.", "SI unit."], ["🔌", "kWh", "3.6 × 10⁶ J.", "One unit."], ["🐎", "Horse power", "About 746 W.", "Old unit."], ["💯", "100 W for 10 h", "1 kWh.", "1000 Wh."]]}, "act": {"type": "dragsort", "id": "s3sort", "h": "🎮 More power or less power?", "try": "Drag each case into the right bin.", "learn": "Same work in <b>less time<\/b> means <b>more power<\/b>.", "bins": [{"t": "More power", "e": "⚡"}, {"t": "Less power", "e": "🐢"}], "items": [["Lift 100 J in 2 s", 0, "50 W.", "🏋️"], ["Lift 100 J in 10 s", 1, "10 W.", "🐢"], ["200 J done in 4 s", 0, "50 W.", "⚙️"], ["200 J done in 40 s", 1, "5 W.", "🕰️"], ["1000 W heater", 0, "Large power.", "🔥"], ["10 W night lamp", 1, "Small power.", "💡"]]}, "extra": [{"type": "calc", "id": "s3calc", "h": "🧪 Simulate · power and bill", "try": "Enter the work done and the time taken, then the bulb data.", "learn": "P = W ÷ t, and energy in kWh = power in kW × time in hours.", "inputs": [{"id": "w", "label": "Work done W (J)", "type": "number", "min": 1, "max": 10000, "step": 1, "val": 500}, {"id": "t", "label": "Time t (s)", "type": "number", "min": 1, "max": 600, "step": 1, "val": 10}, {"id": "b", "label": "Bulb power (W)", "type": "number", "min": 10, "max": 2000, "step": 10, "val": 100}, {"id": "h", "label": "Hours used", "type": "number", "min": 1, "max": 24, "step": 1, "val": 10}], "fn": "const p=v.w/v.t,k=(v.b/1000)*v.h;return '<p>Power = '+v.w+' ÷ '+v.t+' = <b>'+p.toFixed(1)+' W<\/b><\/p><p>Energy used = '+(v.b/1000)+' kW × '+v.h+' h = <b>'+k.toFixed(2)+' kWh<\/b><\/p>';"}, {"type": "memmatch", "id": "s3mem", "h": "🃏 Memory match · power", "try": "Flip two cards to match.", "pairs": [["Power", "Work ÷ time"], ["Unit of power", "Watt"], ["1 watt", "1 J/s"], ["1 kWh", "3.6 × 10⁶ J"], ["1 kW", "1000 W"]]}, {"type": "tfrush", "id": "s3tf", "h": "⚡ Spot the mistake rush", "try": "Decide fast. Three wrong answers and the round ends.", "items": [["P = W ÷ t.", true, "Rate of work."], ["The unit of power is the joule.", false, "It is the watt."], ["1 kWh = 3.6 × 10⁶ J.", true, "1000 × 3600."], ["More time for the same work means more power.", false, "It means less power."], ["1 W = 1 J/s.", true, "Definition."], ["The kWh is a unit of power.", false, "It is a unit of energy."]]}], "quiz": [["Power = ?", ["Work ÷ time", "Work × time", "Force × time", "Mass × g"], "P = W/t."], ["1 kWh equals…", ["3.6 × 10⁶ J", "3600 J", "1000 J", "36 J"], "1000 × 3600."], ["400 J in 8 s gives…", ["50 W", "3200 W", "0.02 W", "392 W"], "400 ÷ 8."]], "line": "<b>P = W/t<\/b>; 1 watt = 1 J/s; 1 kWh = 3.6 × 10⁶ J.", "pics": [{"type": "manga", "id": "mg-ix7-1-3", "h": "Picture story · swipe the panels", "cast": {"kiara": {"name": "Kiara", "hair": "#1a1a1a", "outfit": "#2a7fd0", "hat": "cap", "skin": "m", "eye": "#22e4ff"}, "ved": {"name": "Ved", "hair": "#3a1a1a", "outfit": "#d08a20", "skin": "l"}, "anvi": {"name": "Anvi", "hair": "#2a1a0a", "outfit": "#2a9a4f", "skin": "d"}}, "panels": [{"bg": ["#ff9933", "#7a3a0a"], "props": [{"e": "⚙️", "x": 560, "y": 180, "fs": 110}], "cap": "Work is done."}, {"bg": ["#2a5fa8", "#0a1a3a"], "props": [{"e": "⏱️", "x": 560, "y": 180, "fs": 110}], "cap": "It takes some time."}, {"bg": ["#7a4a2a", "#2a1a0a"], "props": [{"e": "⚡", "x": 400, "y": 190, "fs": 110}], "cap": "Power is work per second."}]}], "codes": [{"type": "memcode", "id": "mc-ix7-1-3", "h": "Memory code · power", "phrase": "WATT", "tip": "Work Across Time Taken.", "letters": [["W", "Work", "Joule"], ["A", "Across", "Divided by"], ["T", "Time", "Second"], ["T", "Taken", "Gives watt"]]}]}], "next": "Class 9 Science · Simple Machines", "board": {"after": 2, "title": "Power Plant 3D", "try": "Pick a mode. In <b>Flow<\/b>, tap a stage or a flow. In <b>Stack<\/b>, press the buttons to build it up.", "modes": [{"id": "flow", "label": "🧩 Energy flow", "kit": "flow", "tag": "WATER · TURBINE · LIGHT", "title": "From a dam to a bulb", "intro": "Tap a stage or a flow.", "nodes": [{"id": "n1", "label": "Dam", "emoji": "🏞️", "x": -7, "z": 2, "shape": "box", "color": "#7b2ff7", "info": "Water at height has PE."}, {"id": "n2", "label": "Turbine", "emoji": "🌀", "x": 0, "z": -4, "shape": "shop", "color": "#ff5c8a", "info": "Falling water spins it."}, {"id": "n3", "label": "Bulb", "emoji": "💡", "x": 7, "z": 2, "shape": "box", "color": "#362e6c", "info": "Electrical energy lights it."}], "edges": [{"from": "n1", "to": "n2", "color": "#7b2ff7", "label": "fall", "group": "g1"}, {"from": "n2", "to": "n3", "color": "#ff5c8a", "label": "spin", "group": "g2"}, {"from": "n3", "to": "n1", "color": "#362e6c", "label": "glow", "group": "g3"}], "groups": [{"id": "g1", "label": "Water falls", "say": ["PE becomes KE.", "Paused."]}, {"id": "g2", "label": "Turbine spins", "say": ["KE drives the generator.", "Paused."]}, {"id": "g3", "label": "Bulb glows", "say": ["Light and heat.", "Paused."]}], "note": "Dam, turbine, bulb."}, {"id": "stack", "label": "🔺 Energy stack", "kit": "stack", "tag": "WORK TO POWER", "title": "Work to power", "intro": "Tap the buttons.", "layers": [{"label": "Work: W = Fs", "h": 2.2, "color": "#00b383", "info": "Force over distance."}, {"label": "Energy: KE and PE", "h": 2.2, "color": "#ffbe0b", "info": "Capacity to do work."}, {"label": "Power: P = W/t", "h": 2.2, "color": "#ff5c8a", "info": "Rate of work."}], "steps": [{"label": "Work", "show": [0], "note": "Joule."}, {"label": "+ Energy", "show": [0, 1], "note": "Joule."}, {"label": "+ Power", "show": [0, 1, 2], "note": "Watt."}], "note": "Work, energy, power."}]}, "summary": {"blocks": [{"type": "speed", "id": "sumspeed-ix7-1", "h": "⏱️ 60-second speed round", "secs": 60, "items": [["Work =", ["Fs", "F/s", "F + s", "F − s"], "Force times displacement."], ["Unit of work…", ["Joule", "Watt", "Newton", "Pascal"], "SI."], ["KE =", ["½mv²", "mgh", "mv", "Fs"], "Motion energy."], ["PE =", ["mgh", "½mv²", "mv", "Fs"], "Height energy."], ["Power =", ["W/t", "W × t", "F/t", "m/g"], "Rate of work."], ["Unit of power…", ["Watt", "Joule", "Newton", "Metre"], "1 J/s."], ["1 kWh =", ["3.6 × 10⁶ J", "3600 J", "1000 J", "60 J"], "1000 W × 3600 s."], ["Pushing a wall gives…", ["Zero work", "Large work", "Negative work", "Power"], "No displacement."], ["Energy is…", ["Conserved", "Destroyed", "Created", "Lost"], "Only changes form."], ["Doubling v makes KE…", ["4 times", "2 times", "Half", "Same"], "Square."]]}, {"type": "boss", "id": "boss-ix7-1", "h": "👾 Boss battle · Power Goblin", "name": "Power Goblin", "emoji": "👺", "try": "Answer right to hit the boss. Three wrong answers and you lose.", "items": [["F = 50 N, s = 4 m, W =", ["200 J", "54 J", "12.5 J", "46 J"], "50 × 4."], ["KE of 4 kg at 5 m/s…", ["50 J", "20 J", "10 J", "100 J"], "½ × 4 × 25."], ["PE of 3 kg at 5 m (g = 10)…", ["150 J", "15 J", "8 J", "35 J"], "3 × 10 × 5."], ["600 J in 20 s, power…", ["30 W", "12000 W", "580 W", "0.03 W"], "600 ÷ 20."], ["A 2 kW heater for 3 h uses…", ["6 kWh", "5 kWh", "2 kWh", "3 kWh"], "2 × 3."], ["Falling ball: PE decreases and KE…", ["Increases", "Decreases", "Stays zero", "Doubles"], "Conservation."], ["No work is done when…", ["s = 0", "F is large", "m is large", "t is long"], "No displacement."], ["1 J =", ["1 N m", "1 N/m", "1 W s⁻¹", "1 kg m"], "Work by 1 N through 1 m."]]}, {"type": "timeline", "h": "A roller-coaster ride", "items": [["Step 1", "Car lifted to top", "PE rises"], ["Step 2", "Car drops down", "PE becomes KE"], ["Step 3", "Car at the bottom", "KE is largest"], ["Step 4", "Car climbs again", "KE becomes PE"]]}, {"type": "cmp", "h": "Work, energy and power", "heads": ["Quantity", "Formula", "Unit"], "rows": [["Work", "F × s", "Joule"], ["KE", "½mv²", "Joule"], ["PE", "mgh", "Joule"], ["Power", "W ÷ t", "Watt"]]}], "line": "Work is force times displacement; KE = ½mv² and PE = mgh; energy is conserved; power is work per unit time."}, "exam": {"qs": [{"m": 1, "q": "Define one joule of work.", "pts": ["Work done when a force of 1 N displaces a body by 1 m in the direction of the force", "1 J = 1 N m"]}, {"m": 2, "q": "Write the formulae for kinetic energy and potential energy.", "pts": ["KE = ½mv²", "PE = mgh"]}, {"m": 3, "q": "A 2 kg ball falls from rest through 5 m. Using g = 10 m/s², find the PE at the top and the KE just before hitting the ground.", "pts": ["PE = mgh = 2 × 10 × 5 = 100 J", "By conservation KE = 100 J", "Speed v = 10 m/s"]}, {"m": 4, "tag": "Case-based", "q": "Read: \"A pump lifts 800 J of water in 20 s. A 100 W bulb burns for 5 hours.\" (i) Find the power of the pump. (1) (ii) Name the unit. (1) (iii) Find the energy used by the bulb in kWh. (1) (iv) Convert that into joule. (1)", "pts": ["(i) 800 ÷ 20 = 40 W", "(ii) Watt", "(iii) 0.1 × 5 = 0.5 kWh", "(iv) 0.5 × 3.6 × 10⁶ = 1.8 × 10⁶ J"]}, {"m": 6, "tag": "Long answer", "q": "State the law of conservation of energy and verify it for a freely falling body. Also define power and write its unit.", "pts": ["Energy can neither be created nor destroyed, only changed from one form to another", "At height h: PE = mgh, KE = 0, total = mgh", "At the ground: v² = 2gh so KE = ½mv² = mgh and PE = 0", "Total energy stays mgh", "Power = work done ÷ time taken", "Unit: watt (1 W = 1 J/s)"]}], "mcq": [["Assertion (A): No work is done when you push a wall. Reason (R): There is no displacement of the wall.", ["Both A and R are true, and R explains A", "Both A and R are true, but R does not explain A", "A is true, but R is false", "Both A and R are false"], "W = Fs, with s = 0.", "A–R"], ["Assertion (A): Doubling the velocity makes the KE four times. Reason (R): KE is proportional to v².", ["Both A and R are true, and R explains A", "Both A and R are true, but R does not explain A", "A is true, but R is false", "Both A and R are false"], "KE = ½mv².", "A–R"], ["Case: A 1 kW heater runs for 2 hours. Energy used is…", ["2 kWh", "0.5 kWh", "1 kWh", "3.6 kWh"], "1 × 2.", "Case"], ["Case: A ball of 0.5 kg moves at 4 m/s. KE is…", ["4 J", "2 J", "8 J", "1 J"], "½ × 0.5 × 16.", "Case"], ["SI unit of power is…", ["Watt", "Joule", "Newton", "Pascal"], "1 J/s.", "MCQ"]]}, "opener": [{"type": "opener", "id": "op-ix7-1", "h": "Start here · work, energy and power", "lead": "Work is force acting over a distance. Here is how work is measured in joules, how kinetic and potential energy are calculated, how energy is conserved, and how power measures the speed of doing work.", "sections": [{"k": "Page 1 · Theme", "t": "Welcome to the Power Plant Rangers", "art": "<svg viewBox=\"0 0 800 320\" role=\"img\" aria-label=\"Comic: Power Plant Rangers\"><rect width=\"800\" height=\"320\" fill=\"#f2f0ca\"/><rect x=\"10\" y=\"10\" width=\"250\" height=\"270\" fill=\"#7b2ff7\" opacity=\"0.35\" stroke=\"#1f2d3d\" stroke-width=\"5\"/><circle cx=\"135\" cy=\"120\" r=\"26\" fill=\"#ffd7b0\" stroke=\"#1f2d3d\" stroke-width=\"3\"/><circle cx=\"126\" cy=\"115\" r=\"4\" fill=\"#1f2d3d\"/><circle cx=\"144\" cy=\"115\" r=\"4\" fill=\"#1f2d3d\"/><path d=\"M123 134 Q135 146 147 134\" fill=\"none\" stroke=\"#1f2d3d\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"135\" y=\"245\" text-anchor=\"middle\" font-size=\"60\">💪<\/text><path d=\"M22 30 H227 Q237 30 237 40 V70 H22 Z\" fill=\"#fff\" stroke=\"#1f2d3d\" stroke-width=\"3\"/><text x=\"129.5\" y=\"56\" text-anchor=\"middle\" font-family=\"Baloo 2,sans-serif\" font-weight=\"800\" font-size=\"15\" fill=\"#1f2d3d\">Push and move = work!<\/text><rect x=\"275\" y=\"10\" width=\"250\" height=\"270\" fill=\"#ffbe0b\" opacity=\"0.35\" stroke=\"#1f2d3d\" stroke-width=\"5\"/><circle cx=\"400\" cy=\"120\" r=\"26\" fill=\"#ffd7b0\" stroke=\"#1f2d3d\" stroke-width=\"3\"/><circle cx=\"391\" cy=\"115\" r=\"4\" fill=\"#1f2d3d\"/><circle cx=\"409\" cy=\"115\" r=\"4\" fill=\"#1f2d3d\"/><path d=\"M388 134 Q400 146 412 134\" fill=\"none\" stroke=\"#1f2d3d\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"400\" y=\"245\" text-anchor=\"middle\" font-size=\"60\">🏃<\/text><path d=\"M287 30 H492 Q502 30 502 40 V70 H287 Z\" fill=\"#fff\" stroke=\"#1f2d3d\" stroke-width=\"3\"/><text x=\"394.5\" y=\"56\" text-anchor=\"middle\" font-family=\"Baloo 2,sans-serif\" font-w /* true/false rush: items:[[statement, true|false, why]] */
W.tfrush=(host,a)=>{function go(){const Q=a.items.map(x=>x).sort(()=>Math.random()-.5);let i=0,sc=0,lives=3,streak=0,best=0;
  function show(){if(i>=Q.length||lives<=0){const w=sc>=Q.length*.8;host.innerHTML='<div class="tf"><div class="big">'+(w?'🏆':sc>=Q.length*.5?'🥈':'💪')+'</div><b>'+sc+' / '+Q.length+' right · best streak '+best+'</b><p>'+(w?'Sharp eyes! Nothing fools you.':'Read the reasons and try again.')+'</p><button class="btn sm" type="button">↺ Play again</button></div>';host.querySelector('.btn').onclick=go;return}
   const x=Q[i];host.innerHTML='<div class="tf"><div class="tfhd"><span>'+'❤️'.repeat(lives)+'🤍'.repeat(3-lives)+'</span><span>'+(streak>=2?'🔥 '+streak:'')+'</span><span>'+(i+1)+' / '+Q.length+'</span></div><div class="tfq">'+x[0]+'</div><div class="tfb"><button type="button" class="tfy">✅ True</button><button type="button" class="tfn">❌ False</button></div><div class="fbx"></div></div>';
   let busy=false;const ans=v=>{if(busy)return;busy=true;const ok=v===!!x[1];if(ok){sc++;streak++;best=Math.max(best,streak);confetti(host.querySelector(v?'.tfy':'.tfn'))}else{lives--;streak=0}
    host.querySelector('.fbx').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✅ Correct! ':'❌ It is <b>'+(x[1]?'True':'False')+'</b>. ')+(x[2]||'')+'</div>';setTimeout(()=>{i++;show()},ok?900:1900)};
   host.querySelector('.tfy').onclick=()=>ans(true);host.querySelector('.tfn').onclick=()=>ans(false)}
  show()}go()};
/* boss battle: name, emoji, items mcq [q,[correct,...],why] */
W.boss=(host,a)=>{function go(){const Q=a.items.map(x=>x).sort(()=>Math.random()-.5);const hp0=Q.length;let i=0,hp=hp0,lives=3;
  function show(){if(hp<=0||lives<=0||i>=Q.length){const win=hp<=0||(lives>0&&hp<=Math.ceil(hp0*.2));host.innerHTML='<div class="bs"><div class="big">'+(win?'🏆':'💥')+'</div><b>'+(win?(a.name||'Boss')+' defeated!':(a.name||'Boss')+' wins this round')+'</b><p>'+(win?'You beat the boss. Revise one more time to stay sharp.':'Review the tips and fight again.')+'</p><button class="btn sm" type="button">↺ Fight again</button></div>';host.querySelector('.btn').onclick=go;return}
   const x=Q[i],ord=x[1].map((_,k)=>k).sort(()=>Math.random()-.5);
   host.innerHTML='<div class="bs"><div class="bshd"><span class="bsl">'+'❤️'.repeat(lives)+'🤍'.repeat(3-lives)+'</span><span class="bsn">'+(a.emoji||'👾')+' '+(a.name||'Boss')+'</span></div><div class="bshp"><i style="width:'+(hp/hp0*100)+'%"></i></div><div class="bsq"><div class="qq">'+x[0]+'</div><div class="spo">'+ord.map(k=>'<button type="button" class="opt" data-k="'+k+'">'+x[1][k]+'</button>').join('')+'</div></div><div class="fbx"></div></div>';
   host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;host.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.k===0)o.classList.add('ok')});
    if(k===0){hp--;confetti(b);host.querySelector('.bsn').classList.add('hit')}else{b.classList.add('no');lives--}
    host.querySelector('.fbx').innerHTML='<div class="fb '+(k===0?'ok':'no')+'">'+(k===0?'💥 Direct hit! ':'❌ Ouch! ')+(x[2]||'')+'</div>';setTimeout(()=>{i++;show()},k===0?900:1900)})}
  show()}go()};
/* ---------- render ---------- */
const app=$('#app');let html='',M=N.meta||{};
html+='<section class="hero" id="top"><div><span class="kick">'+esc(M.kicker||'')+'</span><h1>'+M.titleHtml+'</h1><p class="lead">'+M.lead+'</p><div class="row"><a class="btn" href="#'+(STEPS[0]?STEPS[0].id:'top')+'" style="text-decoration:none">Start the journey →</a>'+(N.board?'<a class="btn teal" href="#b3" style="text-decoration:none">🧊 Open the 3D board</a>':'')+'</div></div><div class="heroart">'+(N.hero||'')+'</div></section>';
(N.opener||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
if(N.points&&N.points.length)html+='<div class="blk card mp"><div class="ttl"><span class="ic">🎯</span>Main points of this part</div><ol class="mpl">'+N.points.map(p=>'<li><b>'+p[0]+'</b><span>'+p[1]+'</span></li>').join('')+'</ol></div>';
else if(N.hook)html+='<div class="blk">'+predict(N.hook)+'</div>';
(N.intro||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
html+='<div class="blk"><div class="ttl"><span class="ic">🗺️</span>Today’s journey</div>'+journey(-1)+'</div>';
if(N.showCast&&N.cast&&N.cast.length)html+='<div class="blk card"><div class="ttl"><span class="ic">🎭</span>The cast</div><div class="row" style="gap:14px">'+N.cast.map(c=>'<div class="row" style="gap:8px">'+face(c.key)+'<div><b>'+esc(c.name)+'</b><br><small style="color:var(--mut)">'+esc(c.role)+'</small></div></div>').join('')+'</div></div>';
const boardAfter=N.board?(N.board.after==null?0:N.board.after):-9;
function boardHtml(){const b=N.board;return '<section class="step" id="b3"><div class="sh"><span class="no">3D</span><div><small>INTERACTIVE BOARD</small><h2>'+b.title+'</h2></div></div><div class="card" data-mission="b3"><div class="try">'+b.try+'</div><div class="modes">'+b.modes.map((m,i)=>'<button class="'+(i?'':'on')+'" data-m="'+m.id+'" type="button">'+m.label+'</button>').join('')+'</div><div class="b3"><div class="cv" id="cv"><div class="lbls" id="lbls"></div><div class="help">Drag to rotate · scroll or pinch to zoom · tap an object</div></div><div class="panel card" id="pan"></div></div></div></section>'}
function extraBlock(x){if(window.NFX&&NFX[x.type]){const id='x-'+uid();setTimeout(()=>{const h=document.getElementById(id);h.innerHTML='<div class="card" data-mission="'+(x.id||id)+'"><div class="ttl"><span class="ic">'+(NFX_IC[x.type]||'✨')+'</span>'+(x.h||'')+'</div>'+(x.try?'<div class="try">'+x.try+'</div>':'')+'<div class="s"></div></div>';NFX[x.type](h.querySelector('.s'),x)},0);return '<div id="'+id+'"></div>'}
 if(x.type==='cmp')return cmp(x);if(x.type==='formula')return formula(x);if(x.type==='timeline')return timeline(x);if(x.type==='story')return story(x);if(x.type==='flips')return flips(x);if(x.type==='html')return x.html;
 if(W[x.type]){const id='x-'+uid();setTimeout(()=>{const h=document.getElementById(id);h.innerHTML=actWrap(x,'<div class="s"></div>');W[x.type](h.querySelector('.s'),x)},0);return '<div id="'+id+'"></div>'}return ''}
STEPS.forEach((s,i)=>{
 html+='<section class="step" id="'+s.id+'"><div class="sh"><span class="no">'+(i+1)+'</span><div><small>STEP '+(i+1)+' OF '+STEPS.length+'</small><h2>'+esc(s.t)+'</h2></div></div>';
 if(s.ks)html+='<div class="blk">'+keyslide(s.ks,i)+'</div>';
 (s.pics||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.motion)html+='<div class="blk"><div class="ttl"><span class="ic">🎬</span>See it: '+esc(s.motion[0])+'</div><div class="mo" data-spec="'+s.motion[1]+'"></div></div>';
 if(s.pred)html+='<div class="blk">'+predict(s.pred)+'</div>';if(s.words&&s.words.length)html+='<div class="blk">'+words(s.words)+'</div>';if(s.flips)html+='<div class="blk">'+flips(s.flips)+'</div>';(s.codes||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 (s.before||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.act)html+='<div class="blk">'+extraBlock(s.act)+'</div>';
 (s.extra||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.quiz)html+='<div class="blk">'+quiz(s.quiz,s.id+'q')+'</div>';if(s.line)html+='<div class="blk">'+oneline(s.line)+'</div>';html+='</section>';
 if(i===boardAfter)html+=boardHtml()});
if(N.summary){html+='<section class="step" id="sum"><div class="sh"><span class="no">★</span><div><small>REVISION</small><h2>The Ultimate Summary</h2></div></div>';(N.summary.blocks||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');if(N.summary.line)html+='<div class="blk">'+oneline(N.summary.line)+'</div>';html+='</section>'}
if(N.exam)html+='<section class="step" id="exam"><div class="sh"><span class="no">✍️</span><div><small>BOARD PRACTICE</small><h2>Exam Corner</h2></div></div><div class="blk">'+exam(N.exam)+'</div>'+(N.exam.mcq?'<div class="blk">'+quiz(N.exam.mcq,'examq')+'</div>':'')+'</section>';
if(N.next)html+='<div class="blk card" style="text-align:center"><b>Up next:</b> '+N.next+'</div>';
app.innerHTML=html;
$('#nav').innerHTML='<a href="#top">Start</a>'+STEPS.map((s,i)=>'<a href="#'+s.id+'" data-m="'+s.id+'q">'+(i+1)+'. '+esc(s.nav||s.t)+'</a>').join('')+(N.board?'<a href="#b3" data-m="b3">3D board</a>':'')+(N.summary?'<a href="#sum">Summary</a>':'')+(N.exam?'<a href="#exam" data-m="exam">Exam corner</a>':'');
document.querySelectorAll('.exq input[type=checkbox]').forEach(c=>c.addEventListener('change',()=>{const i=c.dataset.ex,all=document.querySelectorAll('[data-ex="'+i+'"]'),n=[...all].filter(x=>x.checked).length;document.querySelector('[data-sc="'+i+'"]').textContent='Ticked: '+n+' / '+all.length;if(n)xp('exam',10)}));
gwrap(app);
const mio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.on){e.target.dataset.on=1;Motion(e.target,MSPEC[e.target.dataset.spec])}}),{rootMargin:'200px'});
document.querySelectorAll('.mo').forEach(m=>mio.observe(m));
$('#thm').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('#thm').textContent=d?'🌙':'☀️'};
if(N.board&&window.Board3D)window.Board3D(N.board,xp);
})();
</script>
</body></html>
