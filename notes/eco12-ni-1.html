 "do": [{"id": "ni", "to": {"o": 1}}, {"count": {"id": "kv", "from": 10, "to": 12, "pre": "₹", "suf": " lakh", "ms": 1200}}]}, {"t": 12000, "c": "End of year: 10 + 2 = <b>₹12 lakh<\/b>", "big": 1, "do": [{"pulse": "k"}]}], "objs": [{"id": "k", "k": "box", "x": 400, "y": 200, "w": 190, "h": 110, "c": "#3bb5a0", "e": "🏭", "t": "Capital stock", "o": 0}, {"id": "kv", "k": "text", "x": 400, "y": 290, "t": "₹0", "fs": 24, "c": "#2b2a6b", "o": 0}, {"id": "gi", "k": "box", "x": 60, "y": 120, "w": 150, "h": 60, "c": "#f26b21", "e": "🔥", "t": "Gross inv. ₹3L", "o": 0}, {"id": "dep", "k": "box", "x": 650, "y": 120, "w": 150, "h": 60, "c": "#f2645a", "e": "🔧", "t": "Depreciation ₹1L", "o": 0}, {"id": "ni", "k": "box", "x": 650, "y": 300, "w": 170, "h": 50, "c": "#2b2a6b", "t": "Net inv. ₹2 lakh", "o": 0, "rx": 25}]}}, "steps": [{"id": "s1", "e": "🔭", "t": "What Is Macroeconomics?", "nav": "Macroeconomics", "motion": ["one unit vs the whole economy", "zoom"], "ks": {"title": "Macroeconomics = the whole economy", "art": "<svg viewBox=\"0 0 300 200\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#feebc0\"/><circle cx=\"80\" cy=\"100\" r=\"46\" fill=\"#fff\" stroke=\"#3bb5a0\" stroke-width=\"5\"/><text x=\"80\" y=\"112\" font-size=\"38\" text-anchor=\"middle\">🍞<\/text><text x=\"80\" y=\"170\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#2b2a6b\">MICRO<\/text><circle cx=\"215\" cy=\"100\" r=\"66\" fill=\"#fff\" stroke=\"#f26b21\" stroke-width=\"5\"/><text x=\"215\" y=\"92\" font-size=\"26\" text-anchor=\"middle\">🏭🏠🏦<\/text><text x=\"215\" y=\"124\" font-size=\"26\" text-anchor=\"middle\">🌾🏛️🚚<\/text><text x=\"215\" y=\"188\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#2b2a6b\">MACRO<\/text><\/svg>", "simple": "<b>Macroeconomics<\/b> = study of the <b>whole economy<\/b> of a country.", "pts": [["📊", "It studies <b>totals<\/b> (called <b>aggregates<\/b>): national income, total jobs, overall prices."], ["🔬", "<b>Microeconomics<\/b> = study of <b>one unit<\/b>: one buyer, one firm, one market."], ["🧭", "Example: India’s inflation → macro. Price of onions in one market → micro."]], "an": "Micro = one tree. Macro = the whole forest.", "ex": "Macroeconomics is the branch of economics that studies the economy as a whole. It deals with aggregates such as national income, aggregate demand, aggregate supply, total employment and the general price level, and with problems like unemployment and inflation."}, "words": ["macroeconomics", "microeconomics", "aggregate"], "flips": {"h": "Micro vs macro · tap to flip", "items": [["🔬", "Microeconomics", "Studies individual units: a household, a firm, an industry.", "Price of tomatoes in Azadpur mandi."], ["🔭", "Macroeconomics", "Studies aggregates of the whole economy.", "India’s GDP growth rate."], ["🎯", "Central problem", "Micro: allocation of resources. Macro: full employment and growth of resources.", "Jobs for the whole country."], ["🧰", "Tools", "Micro: demand and supply of a good. Macro: aggregate demand and aggregate supply.", "AD and AS of India."]]}, "act": {"type": "dragsort", "id": "s1sort", "h": "🃏 Drag game · Micro or macro?", "try": "Drag each card into <b>🔬 Micro<\/b> (one unit) or <b>🌍 Macro<\/b> (whole economy).", "learn": "One buyer, firm or market → <b>micro<\/b>. Country totals → <b>macro<\/b>.", "bins": [{"t": "Micro", "e": "🔬"}, {"t": "Macro", "e": "🌍"}], "items": [["Demand for one bakery’s bread", 0, "One firm.", "🍞"], ["India’s unemployment rate", 1, "Total jobs of the country.", "👷"], ["Overall price rise in India", 1, "Average of all prices.", "📈"], ["Price of wheat in one mandi", 0, "One market.", "🌾"], ["National income of India", 1, "A total for the country.", "🇮🇳"], ["How one student spends pocket money", 0, "One consumer.", "🧒"], ["Total exports of India", 1, "A country total.", "🚢"], ["Profit of one shop", 0, "One firm.", "🏪"]]}, "quiz": [["Macroeconomics studies…", ["The economy as a whole", "One firm only", "One consumer only", "One market only"], "NCERT definition."], ["Which is a macroeconomic variable?", ["General price level", "Price of a pen", "Demand for apples", "A firm’s output"], "An aggregate."], ["Which is a microeconomic study?", ["Consumer’s equilibrium", "National income", "Inflation in India", "Total employment"], "Individual unit."]], "line": "<b>Macro<\/b> = economy as a whole (aggregates) · <b>Micro<\/b> = individual units."}, {"id": "s2", "e": "📺", "t": "Consumption Goods and Capital Goods", "nav": "Consumption vs capital", "motion": ["consumption good vs capital good", "goods"], "ks": {"title": "Consumption goods vs capital goods", "art": "<svg viewBox=\"0 0 300 200\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#feebc0\"/><rect x=\"20\" y=\"40\" width=\"120\" height=\"120\" rx=\"16\" fill=\"#f2645a\"/><text x=\"80\" y=\"100\" font-size=\"44\" text-anchor=\"middle\">📺<\/text><text x=\"80\" y=\"145\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">CONSUMPTION<\/text><rect x=\"160\" y=\"40\" width=\"120\" height=\"120\" rx=\"16\" fill=\"#3bb5a0\"/><text x=\"220\" y=\"100\" font-size=\"44\" text-anchor=\"middle\">🏗️<\/text><text x=\"220\" y=\"145\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">CAPITAL<\/text><\/svg>", "simple": "<b>Consumption good<\/b> = used by people <b>directly<\/b>. <b>Capital good<\/b> = used by producers <b>again and again<\/b> to make other goods.", "pts": [["🛋️", "Consumption goods: TV, clothes, milk, a haircut (for a family)."], ["🏗️", "Capital goods: machines, tools, buildings, tractors. They last <b>many years<\/b> and lose value every year."], ["⚠️", "Raw material (like flour in a bakery) is used up once, so it is <b>not<\/b> a capital good."]], "an": "Same car: for a family = consumption good; for a taxi company = capital good.", "ex": "Consumption goods are those goods which satisfy the wants of consumers directly, e.g. food and clothing. Capital goods are fixed assets of producers which are used repeatedly in the production of goods and services for a number of years, e.g. plant and machinery. Capital goods undergo wear and tear (depreciation)."}, "words": ["consumption goods", "capital goods", "durable goods"], "flips": {"h": "Types of goods · tap to flip", "items": [["🚗", "Durable", "Consumption goods that last several years.", "TV, fridge, car (for a family)."], ["👕", "Semi-durable", "Last a year or so, not very expensive.", "Clothes, crockery."], ["🥛", "Non-durable", "Used up in a single use.", "Milk, bread, petrol (for a family)."], ["💇", "Services", "Non-material things that satisfy wants.", "Doctor’s check-up, haircut."], ["🏗️", "Capital good", "Fixed asset used for many years in production.", "A bakery’s oven, a factory building."], ["📦", "Not capital!", "Raw materials used up once are intermediate goods.", "Flour used by the bakery."]]}, "act": {"type": "dragsort", "id": "s2sort", "h": "🃏 Drag game · Consumption or capital?", "try": "Drag each item to the right box. Ask: <b>who<\/b> uses it and <b>for what<\/b>?", "learn": "Used directly by a family → <b>consumption good<\/b>. Used by a producer for years → <b>capital good<\/b>.", "bins": [{"t": "Consumption good", "e": "🛋️"}, {"t": "Capital good", "e": "🏗️"}], "items": [["Sofa for a home", 0, "Used directly.", "🛋️"], ["Oven in a bakery", 1, "Makes bread for years.", "🔥"], ["Tractor of a farmer", 1, "A producer’s machine.", "🚜"], ["Ice cream eaten by a child", 0, "Used up directly.", "🍦"], ["Computer in a CA office", 1, "Used to give services for years.", "💻"], ["Computer at home for movies", 0, "Family use.", "🎬"], ["Truck of a transport company", 1, "Used for years to earn.", "🚚"], ["School bag of a student", 0, "Personal use.", "🎒"]]}, "quiz": [["Capital goods are…", ["Fixed assets used in production for many years", "Goods used up in one use", "Goods bought by households", "Raw materials"], "NCERT."], ["Clothes bought by a family are…", ["Semi-durable consumption goods", "Capital goods", "Intermediate goods", "Non-durable goods"], "Type of consumption good."], ["Which suffers depreciation?", ["Capital goods", "Services", "Non-durable goods", "Raw materials"], "Wear and tear of fixed assets."]], "line": "<b>Consumption good<\/b> = want satisfied directly · <b>Capital good<\/b> = fixed asset that keeps producing."}, {"id": "s3", "e": "🔁", "t": "Final Goods and Intermediate Goods", "nav": "Final vs intermediate", "motion": ["same flour, two uses", "flour"], "ks": {"title": "Final goods vs intermediate goods", "art": "<svg viewBox=\"0 0 300 200\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#feebc0\"/><rect x=\"110\" y=\"20\" width=\"80\" height=\"50\" rx=\"12\" fill=\"#f26b21\"/><text x=\"150\" y=\"53\" font-size=\"28\" text-anchor=\"middle\">🌾<\/text><path d=\"M150 70 C150 100 70 100 70 125 M150 70 C150 100 230 100 230 125\" stroke=\"#2b2a6b\" stroke-width=\"4\" fill=\"none\"/><rect x=\"20\" y=\"125\" width=\"100\" height=\"55\" rx=\"12\" fill=\"#f2645a\"/><text x=\"70\" y=\"150\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">HOME<\/text><text x=\"70\" y=\"168\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">= FINAL<\/text><rect x=\"180\" y=\"125\" width=\"100\" height=\"55\" rx=\"12\" fill=\"#3bb5a0\"/><text x=\"230\" y=\"150\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">BAKERY<\/text><text x=\"230\" y=\"168\" font-size=\"11\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">= INTERMEDIATE<\/text><\/svg>", "simple": "<b>Final good<\/b> = bought for final use (to consume or to invest). <b>Intermediate good<\/b> = used up in making something else, or resold, in the same year.", "pts": [["🎯", "<b>Use decides<\/b>, not the good. Flour at home = final. Flour in a bakery = intermediate."], ["🏗️", "A machine bought by a firm is a <b>final good<\/b> (it is investment, not used up)."], ["🚫", "Only final goods are counted in national income, to avoid <b>double counting<\/b>."]], "an": "Bread already contains the flour’s value. Count the bread only.", "ex": "Final goods are those goods which are meant for final use, i.e. for consumption or investment, and are not meant for resale or further processing in the same year. Intermediate goods are those goods which are used as raw material for further production or are meant for resale during the same year. Whether a good is final or intermediate depends on its end use."}, "words": ["final goods", "intermediate goods", "end use"], "flips": {"h": "Tricky cases · tap to flip", "items": [["🥛", "Milk to a home", "Consumed by the family.", "Final good."], ["🍬", "Milk to a sweet shop", "Used to make sweets for sale.", "Intermediate good."], ["🔥", "Oven bought by a bakery", "A fixed asset, not resold, not used up this year.", "Final good (investment)."], ["📰", "Paper bought by a publisher", "Used up to print books for sale.", "Intermediate good."], ["🚗", "Car bought by a taxi firm", "Capital good used for years.", "Final good (investment)."], ["🛞", "Tyres bought by a car maker", "Fitted into cars for sale.", "Intermediate good."]]}, "act": {"type": "counttap", "id": "s3sim", "h": "🧮 Challenge · Count it in GDP", "try": "Tap only the goods that should be <b>counted<\/b> in national income. Watch the meter.", "learn": "Count only <b>final goods<\/b> (bread for homes, oven for the bakery). Counting wheat and flour too = <b>double counting<\/b>.", "unit": "₹", "chain": 1, "ask": "A farm sells wheat, the mill makes flour, the bakery makes bread. The bakery also buys a new oven.", "win": "Wheat and flour are already inside the bread price.", "items": [{"t": "Wheat to mill", "e": "🌾", "v": 40}, {"t": "Flour to bakery", "e": "🥡", "v": 70}, {"t": "Bread to homes", "e": "🍞", "v": 100, "f": 1}, {"t": "Oven to bakery", "e": "🔥", "v": 50, "f": 1}]}, "extra": [{"type": "dragsort", "id": "s3drag", "h": "🃏 Drag game · Final or intermediate?", "try": "Think about the <b>use<\/b> of each good.", "learn": "Used up in production or resold → <b>intermediate<\/b>. Consumed or invested → <b>final<\/b>.", "bins": [{"t": "Final", "e": "✅"}, {"t": "Intermediate", "e": "🔁"}], "items": [["Sugar bought by a bakery for cakes", 1, "Used up in production.", "🍬"], ["Delivery van bought by a bakery", 0, "Investment: final.", "🚐"], ["Birthday cake bought by a mother", 0, "Final consumption.", "🎂"], ["Wheat bought by a flour mill", 1, "Raw material.", "🌾"], ["Steel bought to make ovens", 1, "Raw material.", "🔩"], ["Milk bought by a family", 0, "Consumed.", "🥛"]]}], "quiz": [["Whether a good is final or intermediate depends on its…", ["End use", "Price", "Size", "Durability"], "NCERT."], ["A machine bought by a firm is a…", ["Final good", "Intermediate good", "Consumption good", "Free good"], "It is investment, not resold."], ["Including intermediate goods in national income causes…", ["Double counting", "Depreciation", "Inflation", "Nothing"], "Their value is already in final goods."]], "line": "<b>End use<\/b> decides: consumption or investment → <b>final<\/b>; resale or raw material → <b>intermediate<\/b>."}, {"id": "s4", "e": "🪣", "t": "Stocks and Flows", "nav": "Stocks and flows", "motion": ["tap (flow) and tank (stock)", "tank"], "ks": {"title": "Stock vs flow", "art": "<svg viewBox=\"0 0 300 200\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#feebc0\"/><text x=\"70\" y=\"70\" font-size=\"46\" text-anchor=\"middle\">🚰<\/text><path d=\"M70 80 V120\" stroke=\"#3bb5a0\" stroke-width=\"8\" stroke-dasharray=\"6 6\"/><rect x=\"30\" y=\"120\" width=\"80\" height=\"60\" rx=\"8\" fill=\"#fff\" stroke=\"#2b2a6b\" stroke-width=\"3\"/><rect x=\"33\" y=\"145\" width=\"74\" height=\"32\" fill=\"#3bb5a0\"/><text x=\"200\" y=\"80\" font-size=\"14\" font-weight=\"800\" fill=\"#f26b21\" text-anchor=\"middle\">FLOW: per period<\/text><text x=\"200\" y=\"104\" font-size=\"12\" fill=\"#2b2a6b\" text-anchor=\"middle\">income, investment<\/text><text x=\"200\" y=\"140\" font-size=\"14\" font-weight=\"800\" fill=\"#3bb5a0\" text-anchor=\"middle\">STOCK: at a point<\/text><text x=\"200\" y=\"164\" font-size=\"12\" fill=\"#2b2a6b\" text-anchor=\"middle\">wealth, capital<\/text><\/svg>", "simple": "<b>Stock<\/b> = measured <b>at a point of time<\/b> (on a date). <b>Flow<\/b> = measured <b>over a period<\/b> (per month, per year).", "pts": [["🪣", "Stocks: wealth, capital, money supply, bank balance."], ["🚰", "Flows: income, investment, depreciation, exports, interest."], ["💡", "Trick: add “<b>per year<\/b>”. If it makes sense, it is a flow."]], "an": "Water in a tank = stock. Water from the tap per minute = flow.", "ex": "Stock is a quantity measured at a particular point of time, e.g. capital, wealth, money supply. Flow is a quantity measured over a period of time, e.g. national income, investment, consumption. Stocks have no time dimension, while flows have a time dimension."}, "words": ["stock", "flow"], "flips": {"h": "Stock or flow? · tap to flip", "items": [["🏦", "Bank balance", "Measured on a date.", "Stock."], ["💼", "Salary", "Per month.", "Flow."], ["🏭", "Capital", "Value of machines on 31 March.", "Stock."], ["🔥", "Investment", "Addition to capital during the year.", "Flow."], ["🔧", "Depreciation", "Wear and tear during the year.", "Flow."], ["💵", "Money supply", "Money with the public on a date.", "Stock."]]}, "act": {"type": "tank", "id": "s4tank", "h": "🚰 Simulation · Tap and tank", "try": "Move the sliders. Press <b>Run<\/b> and watch the tank fill.", "learn": "Litres <b>per minute<\/b> is a <b>flow<\/b> (over a period). Litres in the tank <b>at a moment<\/b> is a <b>stock<\/b>. Flows change stocks.", "s0": 100, "fin": 20, "fout": 5}, "extra": [{"type": "dragsort", "id": "s4sort", "h": "🃏 Drag game · Stock or flow?", "try": "Trick: add “<b>per year<\/b>”. If it makes sense → flow.", "learn": "Point of time → <b>stock<\/b>. Period of time → <b>flow<\/b>.", "bins": [{"t": "Stock", "e": "🪣"}, {"t": "Flow", "e": "🚰"}], "items": [["Wealth of a family", 0, "On a date.", "💎"], ["National income", 1, "Per year.", "🇮🇳"], ["Water in a dam on 1 June", 0, "At a point.", "🏞️"], ["Exports of India", 1, "Per year.", "🚢"], ["Capital of a factory", 0, "On a date.", "🏭"], ["Interest earned", 1, "Per period.", "💰"], ["Money in your bank account", 0, "On a date.", "🏦"], ["Salary", 1, "Per month.", "💼"]]}], "quiz": [["Which is a stock?", ["Wealth", "Income", "Investment", "Depreciation"], "Point of time."], ["Which is a flow?", ["National income", "Money supply", "Capital", "Bank balance"], "Period of time."], ["Flows have a…", ["Time dimension", "Fixed value", "Point of time", "Physical form only"], "Measured per period."]], "line": "<b>Stock<\/b> = at a point of time · <b>Flow<\/b> = over a period of time."}, {"id": "s5", "e": "🏗️", "t": "Investment and Depreciation", "nav": "Investment", "motion": ["gross, depreciation, net", "invest"], "ks": {"title": "Net investment = gross investment − depreciation", "art": "<svg viewBox=\"0 0 300 200\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#feebc0\"/><rect x=\"20\" y=\"40\" width=\"80\" height=\"120\" rx=\"10\" fill=\"#f26b21\"/><text x=\"60\" y=\"105\" font-size=\"14\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">GROSS<\/text><text x=\"120\" y=\"108\" font-size=\"30\" font-weight=\"800\" fill=\"#2b2a6b\">−<\/text><rect x=\"140\" y=\"110\" width=\"60\" height=\"50\" rx=\"10\" fill=\"#f2645a\"/><text x=\"170\" y=\"140\" font-size=\"11\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">DEP.<\/text><text x=\"212\" y=\"108\" font-size=\"30\" font-weight=\"800\" fill=\"#2b2a6b\">=<\/text><rect x=\"235\" y=\"70\" width=\"55\" height=\"90\" rx=\"10\" fill=\"#3bb5a0\"/><text x=\"262\" y=\"120\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">NET<\/text><\/svg>", "simple": "<b>Investment<\/b> = new capital added in a year. <b>Depreciation<\/b> = fall in value of machines due to normal use and ageing.", "pts": [["➕", "<b>Gross investment<\/b> = total new capital bought."], ["🟰", "<b>Net investment = gross investment − depreciation<\/b>. Example: 3 − 1 = 2."], ["🔧", "Depreciation is also called <b>consumption of fixed capital<\/b>."], ["⚠️", "Loss from fire or flood is <b>capital loss<\/b>, not depreciation."]], "an": "Your phone loses value every year as it gets old. That loss is depreciation.", "ex": "Investment is the addition made to the physical stock of capital during a period of time. Depreciation is the fall in the value of fixed assets due to normal wear and tear and expected obsolescence; it is also called consumption of fixed capital. Gross investment = net investment + depreciation. Net investment is the actual addition to the capital stock."}, "words": ["investment", "gross investment", "net investment", "depreciation", "obsolescence"], "flips": {"h": "Investment words · tap to flip", "items": [["🏭", "Fixed investment", "Addition to fixed assets like machines and buildings.", "New ovens."], ["📦", "Inventory investment", "Change in stock of raw materials, semi-finished and finished goods.", "Extra flour in the store."], ["🔧", "Normal wear and tear", "Loss of value through regular use.", "An oven used daily."], ["📱", "Expected obsolescence", "Loss due to expected change in technology or demand.", "Old model becomes outdated as planned."], ["🔥", "Capital loss", "Unexpected loss, e.g. fire or flood.", "Not depreciation."], ["🟰", "Net investment", "Gross investment minus depreciation.", "₹3 L − ₹1 L = ₹2 L."]]}, "act": {"type": "calc", "id": "s5calc", "h": "🧮 Simulation · Grow the factory", "try": "Change the numbers and watch the bars. Try making depreciation <b>bigger<\/b> than gross investment.", "learn": "<b>Net investment = gross investment − depreciation<\/b>, and it changes the capital stock. If depreciation exceeds gross investment, net investment is <b>negative<\/b> and the capital stock shrinks.", "inputs": [{"id": "o", "label": "Opening capital (₹ lakh)", "val": 10,  let busy=false;function drop(k){if(busy||i>=deck.length)return;busy=true;const c=deck[i],good=k===c[1],bin=host.querySelector('.dgbin[data-k="'+c[1]+'"]'),card=host.querySelector('.dgcard');
  if(good){ok++;streak++;bin.querySelector('.bc').textContent=+bin.querySelector('.bc').textContent+1;bin.classList.add('pop');setTimeout(()=>bin.classList.remove('pop'),500);confetti(bin);if(card)card.classList.add('gone')}else{miss++;streak=0;if(card){card.style.transform='';card.classList.add('shake')}}
  host.querySelector('.dgsc').textContent='✅ '+ok;host.querySelector('.dgst').textContent=streak>=2?'🔥 Streak '+streak:'';
  host.querySelector('.fbx').innerHTML='<div class="fb '+(good?'ok':'no')+'">'+(good?'✅ Right! ':'❌ It goes in <b>'+a.bins[c[1]].t+'</b>. ')+(c[2]||'')+'</div>';
  setTimeout(()=>{busy=false;i++;host.querySelector('.fbx').innerHTML='';draw()},good?900:1900)}
 start()};
/* tap to count: items:[{t,e,v,f(final?),why}], unit, ask */
W.counttap=(host,a)=>{const sel=new Set();const fm=x=>(a.unit||'₹')+x.toLocaleString('en-IN');const right=a.items.reduce((s,x)=>s+(x.f?x.v:0),0);
 host.innerHTML='<div class="ct"><p class="ctq">'+(a.ask||'Tap only what should be counted.')+'</p><div class="ctrow">'+a.items.map((x,k)=>'<button type="button" class="ctit" data-k="'+k+'"><span class="ce">'+x.e+'</span><b>'+x.t+'</b><span class="cval">'+fm(x.v)+'</span></button>'+(k<a.items.length-1&&a.chain?'<span class="ar">➜</span>':'')).join('')+'</div><div class="ctmeter"><span>Your total</span><b class="ctt">'+fm(0)+'</b><div class="ctbar"><i></i></div></div><div class="row" style="justify-content:center"><button class="btn sm" type="button">✔ Check my count</button></div><div class="fbx"></div></div>';
 const max=a.items.reduce((s,x)=>s+x.v,0);
 function upd(){const t=[...sel].reduce((s,k)=>s+a.items[k].v,0);host.querySelector('.ctt').textContent=fm(t);host.querySelector('.ctbar i').style.width=(t/max*100)+'%';host.querySelector('.ctbar i').style.background=t>right?'var(--coral)':'var(--teal)'}
 host.querySelectorAll('.ctit').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('on');upd();host.querySelector('.fbx').innerHTML=''});
 host.querySelector('.btn').onclick=()=>{const t=[...sel].reduce((s,k)=>s+a.items[k].v,0),exact=a.items.every((x,k)=>!!x.f===sel.has(k));
  host.querySelectorAll('.ctit').forEach(b=>{const x=a.items[+b.dataset.k];b.classList.toggle('good',!!x.f);b.classList.toggle('bad',!x.f&&sel.has(+b.dataset.k))});
  host.querySelector('.fbx').innerHTML='<div class="fb '+(exact?'ok':'no')+'">'+(exact?'🎉 Correct! Only final goods counted: <b>'+fm(right)+'</b>. '+(a.win||''):t>right?'❌ Too much! You counted <b>'+fm(t-right)+'</b> extra. That is <b>double counting</b>. Green = count, red = remove.':'❌ You missed some final goods. The right total is <b>'+fm(right)+'</b>. Green boxes are the ones to count.')+'</div>';if(exact){xp(a.id,10);confetti(host.querySelector('.ctmeter'))}}};
/* water tank: stock vs flow simulator */
W.tank=(host,a)=>{const v={s0:a.s0||100,fin:a.fin||20,fout:a.fout||5,t:0};let n=0;
 host.innerHTML='<div class="tk"><svg viewBox="0 0 320 260" class="tksvg"><text x="70" y="40" font-size="40">🚰</text><g class="drops"></g><rect x="60" y="70" width="200" height="160" rx="12" fill="#fff" stroke="var(--navy)" stroke-width="4"/><rect class="wl" x="64" y="226" width="192" height="0" fill="var(--teal)" opacity=".85"/><text class="wt" x="160" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="var(--navy)"></text><text x="275" y="250" font-size="26">🚿</text></svg><div class="tkc">'+
 [['fin','Water IN (litres per minute)',0,50],['fout','Water OUT (litres per minute)',0,50],['t','Time passed (minutes)',0,30]].map(q=>'<label>'+q[1]+': <b data-o="'+q[0]+'"></b><input type="range" min="'+q[2]+'" max="'+q[3]+'" value="'+v[q[0]]+'" data-k="'+q[0]+'"></label>').join('')+'<div class="tkout"></div><div class="row"><button class="btn sm" type="button">▶ Run 10 minutes</button></div></div></div>';
 const g=s=>host.querySelector(s);
 function upd(){host.querySelectorAll('[data-o]').forEach(b=>b.textContent=v[b.dataset.o]);const s=Math.max(0,v.s0+(v.fin-v.fout)*v.t),cap=v.s0+50*30;const h=Math.min(152,s/cap*152*2.2);g('.wl').setAttribute('y',226-h);g('.wl').setAttribute('height',h);g('.wt').textContent=Math.round(s)+' L';
  g('.tkout').innerHTML='<div class="fb ok">🚰 <b>Flow</b> = '+v.fin+' L per minute in, '+v.fout+' L per minute out (needs a <b>period</b>: “per minute”).<br>🪣 <b>Stock</b> at minute '+v.t+' = '+v.s0+' + ('+v.fin+' − '+v.fout+') × '+v.t+' = <b>'+Math.round(s)+' litres</b> (at a <b>point</b> of time).</div>';
  g('.drops').innerHTML=v.fin>0?'<text x="80" y="60" font-size="16">💧<animate attributeName="y" values="55;210" dur="'+(1.6-v.fin/50).toFixed(2)+'s" repeatCount="indefinite"/></text>':'';if(++n>4)xp(a.id,10)}
 host.querySelectorAll('input').forEach(i=>i.oninput=()=>{v[i.dataset.k]=+i.value;upd()});
 g('.btn').onclick=()=>{let k=0;const id=setInterval(()=>{if(k++>=10||v.t>=30)return clearInterval(id);v.t++;host.querySelector('[data-k=t]').value=v.t;upd()},250)};upd()};
/* timed speed round: items mcq [q,[correct,..],why], secs, lives */
W.speed=(host,a)=>{const secs=a.secs||60;
 function intro(){host.innerHTML='<div class="sp"><div class="big">⏱️</div><b>'+(a.items.length)+' questions · '+secs+' seconds · 3 lives ❤️❤️❤️</b><p>Answer fast. Each right answer gives +1. Ready?</p><button class="btn" type="button">▶ Start</button></div>';host.querySelector('.btn').onclick=go}
 function go(){const Q=a.items.map(x=>x).sort(()=>Math.random()-.5);let i=0,sc=0,lives=3,left=secs,end=false;
  host.innerHTML='<div class="sp run"><div class="sphd"><span class="spl"></span><span class="sps"></span><span class="spt"></span></div><div class="sptb"><i></i></div><div class="spq"></div></div>';
  const tick=setInterval(()=>{left--;hd();if(left<=0)fin()},1000);
  function hd(){host.querySelector('.spl').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);host.querySelector('.sps').textContent='Score '+sc;host.querySelector('.spt').textContent=left+'s';host.querySelector('.sptb i').style.width=(left/secs*100)+'%'}
  function q(){if(end)return;if(i>=Q.length)return fin();const x=Q[i],ord=x[1].map((_,k)=>k).sort(()=>Math.random()-.5);host.querySelector('.spq').innerHTML='<div class="qq">'+x[0]+'</div><div class="spo">'+ord.map(k=>'<button type="button" class="opt" data-k="'+k+'">'+x[1][k]+'</button>').join('')+'</div>';
   host.querySelectorAll('.spo .opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;host.querySelectorAll('.spo .opt').forEach(o=>{o.disabled=true;if(+o.dataset.k===0)o.classList.add('ok')});if(k===0){sc++;confetti(b)}else{b.classList.add('no');lives--}hd();setTimeout(()=>{i++;lives<=0?fin():q()},k===0?450:1100)})}
  function fin(){if(end)return;end=true;clearInterval(tick);host.innerHTML='<div class="sp"><div class="big">'+(sc>=Q.length*.8?'🏆':sc>=Q.length*.5?'🥈':'💪')+'</div><b>Score: '+sc+' / '+Q.length+'</b><p>'+(sc>=Q.length*.8?'Champion! You know this part.':'Good try. Revise the one-liners and play again.')+'</p><button class="btn" type="button">↺ Play again</button></div>';host.querySelector('.btn').onclick=go;if(sc>=Q.length*.6)xp(a.id,15)}
  hd();q()}
 intro()};
/* ---------- render ---------- */
const app=$('#app');let html='',M=N.meta||{};
html+='<section class="hero" id="top"><div><span class="kick">'+esc(M.kicker||'')+'</span><h1>'+M.titleHtml+'</h1><p class="lead">'+M.lead+'</p><div class="row"><a class="btn" href="#'+(STEPS[0]?STEPS[0].id:'top')+'" style="text-decoration:none">Start the journey →</a>'+(N.board?'<a class="btn teal" href="#b3" style="text-decoration:none">🧊 Open the 3D board</a>':'')+'</div></div><div class="heroart">'+(N.hero||'')+'</div></section>';
if(N.points&&N.points.length)html+='<div class="blk card mp"><div class="ttl"><span class="ic">🎯</span>Main points of this part</div><ol class="mpl">'+N.points.map(p=>'<li><b>'+p[0]+'</b><span>'+p[1]+'</span></li>').join('')+'</ol></div>';
else if(N.hook)html+='<div class="blk">'+predict(N.hook)+'</div>';
html+='<div class="blk"><div class="ttl"><span class="ic">🗺️</span>Today’s journey</div>'+journey(-1)+'</div>';
if(N.showCast&&N.cast&&N.cast.length)html+='<div class="blk card"><div class="ttl"><span class="ic">🎭</span>The cast</div><div class="row" style="gap:14px">'+N.cast.map(c=>'<div class="row" style="gap:8px">'+face(c.key)+'<div><b>'+esc(c.name)+'</b><br><small style="color:var(--mut)">'+esc(c.role)+'</small></div></div>').join('')+'</div></div>';
const boardAfter=N.board?(N.board.after==null?0:N.board.after):-9;
function boardHtml(){const b=N.board;return '<section class="step" id="b3"><div class="sh"><span class="no">3D</span><div><small>INTERACTIVE BOARD</small><h2>'+b.title+'</h2></div></div><div class="card" data-mission="b3"><div class="try">'+b.try+'</div><div class="modes">'+b.modes.map((m,i)=>'<button class="'+(i?'':'on')+'" data-m="'+m.id+'" type="button">'+m.label+'</button>').join('')+'</div><div class="b3"><div class="cv" id="cv"><div class="lbls" id="lbls"></div><div class="help">Drag to rotate · scroll or pinch to zoom · tap an object</div></div><div class="panel card" id="pan"></div></div></div></section>'}
function extraBlock(x){if(x.type==='cmp')return cmp(x);if(x.type==='formula')return formula(x);if(x.type==='timeline')return timeline(x);if(x.type==='story')return story(x);if(x.type==='flips')return flips(x);if(x.type==='html')return x.html;
 if(W[x.type]){const id='x-'+uid();setTimeout(()=>{const h=document.getElementById(id);h.innerHTML=actWrap(x,'<div class="s"></div>');W[x.type](h.querySelector('.s'),x)},0);return '<div id="'+id+'"></div>'}return ''}
STEPS.forEach((s,i)=>{
 html+='<section class="step" id="'+s.id+'"><div class="sh"><span class="no">'+(i+1)+'</span><div><small>STEP '+(i+1)+' OF '+STEPS.length+'</small><h2>'+esc(s.t)+'</h2></div></div>';
 if(s.ks)html+='<div class="blk">'+keyslide(s.ks,i)+'</div>';
 if(s.motion)html+='<div class="blk"><div class="ttl"><span class="ic">🎬</span>See it: '+esc(s.motion[0])+'</div><div class="mo" data-spec="'+s.motion[1]+'"></div></div>';
 if(s.pred)html+='<div class="blk">'+predict(s.pred)+'</div>';if(s.words&&s.words.length)html+='<div class="blk">'+words(s.words)+'</div>';if(s.flips)html+='<div class="blk">'+flips(s.flips)+'</div>';
 (s.before||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.act)html+='<div class="blk">'+extraBlock(s.act)+'</div>';
 (s.extra||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.quiz)html+='<div class="blk">'+quiz(s.quiz,s.id+'q')+'</div>';if(s.line)html+='<div class="blk">'+oneline(s.line)+'</div>';html+='</section>';
 if(i===boardAfter)html+=boardHtml()});
if(N.summary){html+='<section class="step" id="sum"><div class="sh"><span class="no">★</span><div><small>REVISION</small><h2>The Ultimate Summary</h2></div></div>';(N.summary.blocks||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');if(N.summary.line)html+='<div class="blk">'+oneline(N.summary.line)+'</div>';html+='</section>'}
if(N.exam)html+='<section class="step" id="exam"><div class="sh"><span class="no">✍️</span><div><small>BOARD PRACTICE</small><h2>Exam Corner</h2></div></div><div class="blk">'+exam(N.exam)+'</div>'+(N.exam.mcq?'<div class="blk">'+quiz(N.exam.mcq,'examq')+'</div>':'')+'</section>';
if(N.next)html+='<div class="blk card" style="text-align:center"><b>Up next:</b> '+N.next+'</div>';
app.innerHTML=html;
$('#nav').innerHTML='<a href="#top">Start</a>'+STEPS.map((s,i)=>'<a href="#'+s.id+'" data-m="'+s.id+'q">'+(i+1)+'. '+esc(s.nav||s.t)+'</a>').join('')+(N.board?'<a href="#b3" data-m="b3">3D board</a>':'')+(N.summary?'<a href="#sum">Summary</a>':'')+(N.exam?'<a href="#exam" data-m="exam">Exam corner</a>':'');
document.querySelectorAll('.exq input[type=checkbox]').forEach(c=>c.addEventListener('change',()=>{const i=c.dataset.ex,all=document.querySelectorAll('[data-ex="'+i+'"]'),n=[...all].filter(x=>x.checked).length;document.querySelector('[data-sc="'+i+'"]').textContent='Ticked: '+n+' / '+all.length;if(n)xp('exam',10)}));
gwrap(app);
const mio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.on){e.target.dataset.on=1;Motion(e.target,MSPEC[e.target.dataset.spec])}}),{rootMargin:'200px'});

$('#thm').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('#thm').textContent=d?'🌙':'☀️'};
if(N.board&&window.Board3D)window.Board3D(N.board,xp);
})();
