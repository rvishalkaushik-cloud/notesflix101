<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Study Practice - Principles of Management - Vishal Sir's Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet"><style>:root{--navy:#1b1f4b;--ink:#232754;--pur:#6c4cf1;--pur2:#ece7ff;--yel:#ffc933;--cy:#22c7e8;--pk:#ff5fa2;--gr:#22b573;--rd:#ef476f;--bg:#f5f2ff;--card:#fff;--mut:#5d6190;--line:#1b1f4b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
background-image:radial-gradient(circle at 12px 12px,#e1daff 2px,transparent 2.5px);background-size:34px 34px}
h1,h2,h3,h4{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0;line-height:1.15;color:var(--navy)}
button,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:4px solid var(--yel)}
.top .in{max-width:1180px;margin:auto;padding:8px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-family:'Baloo 2',system-ui,sans-serif;font-size:22px;font-weight:800;white-space:nowrap}.brand b{color:var(--yel)}
.brand small{display:block;font-size:11px;font-weight:700;color:#b9bdf5;letter-spacing:.4px;margin-top:-6px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{background:transparent;border:2px solid transparent;color:#dfe1ff;padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:800;font-size:14px}
nav button:hover{background:#2c3170}nav button.on{background:var(--yel);color:var(--navy)}
main{max-width:1180px;margin:auto;padding:20px 16px 70px}
.sticker{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--line);padding:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--line);background:var(--yel);color:var(--navy);font-weight:900;padding:10px 18px;border-radius:14px;box-shadow:3px 3px 0 var(--line);cursor:pointer;transition:.1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.alt{background:var(--cy)}.btn.pk{background:var(--pk);color:#fff}.btn.ghost{background:#fff}.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:14px;flex-wrap:wrap}.grow{flex:1 1 280px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,#2a2f78,#6c4cf1);color:#fff;border:3px solid var(--line);border-radius:26px;box-shadow:6px 6px 0 var(--line);padding:26px;overflow:hidden}
.hero h1{color:#fff;font-size:clamp(30px,5vw,50px)}.hero h1 em{font-style:normal;color:var(--yel)}
.hero p{color:#e4e0ff;font-size:18px;margin:10px 0 16px}
.pill{display:inline-block;background:var(--yel);color:var(--navy);font-weight:900;padding:3px 12px;border-radius:999px;border:2px solid var(--navy);font-size:13px;margin-bottom:8px}
.coll{position:relative;height:250px}.coll img{position:absolute;border:3px solid var(--navy);border-radius:18px;background:#fff;box-shadow:4px 4px 0 var(--navy)}
.coll .a{height:230px;right:10px;top:6px;transform:rotate(3deg)}.coll .b{height:130px;left:6px;top:0;transform:rotate(-5deg)}.coll .c{height:120px;left:38px;bottom:0;transform:rotate(4deg)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.step{padding:14px;text-align:center}.step .n{font-size:30px}.step b{display:block;font-family:'Baloo 2',system-ui,sans-serif;font-size:19px}.step span{color:var(--mut);font-size:14px}
.mk4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mkt{cursor:pointer;text-align:left;padding:16px;transition:.12s;background:#fff;font:inherit;color:inherit}
.mkt:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--line)}
.mkt .big{font-family:'Baloo 2',system-ui,sans-serif;font-size:44px;line-height:1;color:var(--pur)}.mkt .big small{font-size:16px;color:var(--navy)}
.mkt p{margin:6px 0 0;color:var(--mut);font-size:14px}.mkt .cnt{display:inline-block;margin-top:8px;font-weight:900;background:var(--pur2);border-radius:99px;padding:2px 10px;font-size:13px}
h2.sec{font-size:30px;margin:28px 0 12px}h2.sec span{background:var(--yel);padding:0 8px;border-radius:8px}
.seg{display:flex;gap:4px;margin:12px 0}.seg div{border:2.5px solid var(--navy);border-radius:10px;padding:6px 8px;font-weight:800;font-size:13px;text-align:center;color:var(--navy)}
.seg div:nth-child(1){background:#ffe48a}.seg div:nth-child(2){background:#a6ecfa}.seg div:nth-child(3){background:#ffc2dc}.seg div:nth-child(4){background:#c8f0d8}
.tab{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.tab button{border:2.5px solid var(--navy);background:#fff;border-radius:99px;padding:5px 14px;font-weight:800;cursor:pointer}.tab button.on{background:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cc{cursor:pointer;background:#fff;text-align:left;padding:14px;position:relative}.cc:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--line)}
.cc .em{font-size:30px}.cc h3{font-size:19px;margin:4px 0}.cc .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.badge{display:inline-block;border:2px solid var(--navy);border-radius:99px;padding:0 10px;font-weight:900;font-size:13px;background:var(--yel)}
.badge.t{background:var(--cy)}.badge.ok{background:#c8f0d8}.badge.mid{background:#ffe48a}.badge.low{background:#ffc2dc}
.cc .scr{position:absolute;right:12px;top:12px}
.flip{perspective:900px;height:150px;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.flip .f{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.flip.on .f{transform:rotateY(180deg)}
.flip .s{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line);padding:12px;overflow:auto;background:#fff}
.flip .s.b{transform:rotateY(180deg);background:var(--pur2)}.flip .s h4{font-size:17px;color:var(--pur)}.flip .s small{color:var(--mut);display:block;margin-top:4px;font-size:12.5px;line-height:1.3}
.flip .s.fr{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(180deg,#fff,#fff7da)}.flip .s.fr b{font-size:16px}.flip .s.fr i{font-style:normal;font-size:12px;color:var(--mut);margin-top:6px}
.flip.tall{height:230px}
.qcard{max-width:900px;margin:auto}.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.case{counter-reset:ln;list-style:none;margin:10px 0;padding:14px;background:#fffdf0;border:3px dashed var(--navy);border-radius:16px}
.case li{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.case li i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;font-weight:900;font-size:13px;display:grid;place-items:center;margin-top:1px}
.q{font-weight:800;font-size:17px}.scheme{background:var(--pur2);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;margin:8px 0 14px}
.part{border:3px solid var(--navy);border-radius:16px;padding:12px;margin:12px 0;background:#fff;box-shadow:3px 3px 0 var(--navy)}
.part h4{margin-bottom:8px}.part label{font-weight:800;font-size:14px;display:block;margin:6px 0 4px}
select,textarea{width:100%;border:2.5px solid var(--navy);border-radius:12px;padding:8px 10px;background:#fff}textarea{min-height:76px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--navy);background:#fff;font-weight:900;cursor:pointer}.chip.on{background:var(--pur);color:#fff}
.opts{display:grid;gap:10px;margin:12px 0}.opt{text-align:left;border:3px solid var(--navy);border-radius:14px;padding:10px 14px;background:#fff;cursor:pointer;font-weight:700;box-shadow:3px 3px 0 var(--navy)}
.opt:hover{background:var(--pur2)}.opt.sel{background:var(--pur2);outline:3px solid var(--pur)}.opt.right{background:#c8f0d8}.opt.wrong{background:#ffc2dc}.opt[disabled]{cursor:default}
.res{margin-top:16px;border:3px solid var(--navy);border-radius:18px;padding:16px;background:#f6fff9;box-shadow:4px 4px 0 var(--navy)}
.score{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.score .num{font-family:'Baloo 2',system-ui,sans-serif;font-size:54px;line-height:1;color:var(--pur)}.score .num small{font-size:22px;color:var(--navy)}
.rng{font-weight:800;color:var(--mut)}.meter{height:16px;border:2.5px solid var(--navy);border-radius:99px;overflow:hidden;background:#fff;flex:1 1 160px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),var(--yel),var(--gr))}
.pr{border-top:2px dashed #b9bdf5;padding:10px 0;margin-top:8px}.pr h4{font-size:17px}
.ln{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tick{font-weight:800;font-size:14px;border-radius:99px;padding:1px 10px;border:2px solid var(--navy)}.tick.y{background:#c8f0d8}.tick.n{background:#ffe0e8}
.model{background:#fff;border-left:6px solid var(--cy);padding:8px 12px;border-radius:0 12px 12px 0;margin:8px 0;font-size:15px}
.tip{background:#fff7da;border:2px dashed var(--navy);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:15px}
.sc{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-top:6px}.sc input{width:18px;height:18px;accent-color:var(--pur)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}.bar b{width:92px;font-family:'Baloo 2',system-ui,sans-serif;font-size:18px}.bar .meter{flex:1}.bar span{width:70px;font-weight:900;text-align:right}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.timer{position:sticky;top:76px;z-index:5;display:inline-block;background:var(--navy);color:#fff;border-radius:99px;padding:4px 16px;font-weight:900;border:3px solid var(--yel);float:right}
.ring{width:150px;height:150px}.ring text{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800}
.muted{color:var(--mut)}.small{font-size:13.5px}.right{margin-left:auto}
.note{font-size:13.5px;color:var(--mut);margin-top:18px;border-top:2px dashed #b9bdf5;padding-top:10px}
.bk{margin:0 0 12px;font-weight:800;cursor:pointer;border:0;background:none;color:var(--pur);font-size:16px;padding:0}
@media(max-width:820px){.hero{grid-template-columns:1fr}.coll{height:200px}.steps,.mk4{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}.timer{position:static;float:none;margin-bottom:8px}nav{margin-left:0}.top .in{gap:6px}}
@media(max-width:480px){.steps,.mk4{grid-template-columns:1fr}.brand{font-size:19px}nav button{padding:5px 9px;font-size:13px}.score .num{font-size:44px}}
@media print{.top,.btn,nav{display:none}}

const PR=[
{id:'F1',g:'F',n:'Division of Work',clue:'Work cut into small tasks, each person does what he does best',def:'Work is divided into small tasks and each person is given the task he is best suited for. This gives specialisation and higher efficiency.',eg:'In a shoe factory, one worker cuts, another stitches, another polishes.'},
{id:'F2',g:'F',n:'Authority and Responsibility',clue:'Power to order + being answerable for the result',def:'Authority is the right to give orders; responsibility is the obligation to perform the job. Both must be equal (parity) and go together.',eg:'A manager given a target but no power to hire or approve spending.'},
{id:'F3',g:'F',n:'Discipline',clue:'Obeying rules, respecting agreements',def:'Obedience to organisational rules and respect for agreements. Needs good superiors at all levels, clear and fair agreements, and judicious penalties.',eg:'Staff follow safety rules and attendance norms strictly.'},
{id:'F4',g:'F',n:'Unity of Command',clue:'One boss only',def:'Each subordinate should receive orders from, and be answerable to, one superior only. Dual command causes confusion and conflict.',eg:'A worker told to do two different jobs by two managers.'},
{id:'F5',g:'F',n:'Unity of Direction',clue:'One head + one plan for a group of activities with the same aim',def:'Each group of activities having the same objective must have one head and one plan. It ensures coordination of effort.',eg:'All advertising, discount and dealer activities under one marketing head and one campaign plan.'},
{id:'F6',g:'F',n:'Subordination of Individual Interest to General Interest',clue:'Firm\'s interest comes before personal interest',def:'The interest of the organisation is above the interest of any one person. Where they clash, management must reconcile them with firmness and fairness.',eg:'A manager gives up her own demand for the sake of the whole company.'},
{id:'F7',g:'F',n:'Remuneration of Employees',clue:'Fair pay + incentives; satisfies employer and employee',def:'Pay should be fair and reasonable and give the maximum possible satisfaction to both employer and employees (wages, bonus, profit sharing and other incentives).',eg:'Fair salary plus bonus and profit-sharing.'},
{id:'F8',g:'F',n:'Centralisation and Decentralisation',clue:'How much power at the top vs. spread downwards',def:'Centralisation means concentrating authority at the top; decentralisation means spreading it to lower levels. The right balance depends on the size and nature of the firm.',eg:'Branch managers approve purchases up to a limit; bigger ones go to head office.'},
{id:'F9',g:'F',n:'Scalar Chain',clue:'Chain of superiors from top to bottom; gang plank',def:'The formal line of authority from the highest to the lowest rank. A gang plank allows direct contact between persons at the same level in an emergency, with superiors informed.',eg:'A supervisor phones another department directly in an urgent matter and informs his boss later.'},
{id:'F10',g:'F',n:'Order',clue:'Right person at the right job, right thing at the right place',def:'Material order (right thing at the right place) and social order (right person at the right job). It saves time and avoids waste and confusion.',eg:'Every tool has a fixed shelf and every worker is placed according to skill.'},
{id:'F11',g:'F',n:'Equity',clue:'Kindness + justice, no discrimination',def:'Managers should treat employees with kindness and justice, without discrimination on gender, caste or religion. This earns loyalty and devotion.',eg:'A hotel manager treats all staff fairly and kindly.'},
{id:'F12',g:'F',n:'Stability of Personnel',clue:'Job security, low turnover, planned staffing',def:'Employees should not be removed frequently. Job security and orderly personnel planning build commitment and cut the cost of constant hiring and training.',eg:'A firm hires and fires every few months, so workers lose commitment.'},
{id:'F13',g:'F',n:'Initiative',clue:'Freedom to think out a plan and carry it out',def:'Employees at all levels should be encouraged to think out a plan and execute it, even if mistakes happen. It increases zeal and energy.',eg:'A cashier\'s suggestion for QR payments is tried and adopted.'},
{id:'F14',g:'F',n:'Esprit de Corps',clue:'Team spirit, "union is strength", "our team"',def:'Team spirit and harmony among members. Managers should avoid "divide and rule" and prefer face-to-face communication to build unity.',eg:'Monthly get-togethers; people say "our team".'},
{id:'P1',g:'P',n:'Science, Not Rule of Thumb',clue:'Experiments and facts instead of guesswork',def:'Taylor: replace guesswork and habit with scientific study of each job to find the one best way.',eg:'Experiments decide the best tool and load per trip.'},
{id:'P2',g:'P',n:'Harmony, Not Discord',clue:'Management and workers share a common aim; no conflict',def:'Mutual trust and confidence between management and workers, with both sharing the gains of higher output.',eg:'Workers and owners share the gains through bonus.'},
{id:'P3',g:'P',n:'Cooperation, Not Individualism',clue:'Teamwork and sincere help instead of everyone for himself',def:'Healthy cooperation between management and workers, instead of each pursuing his own way. Management invites workers\' suggestions and helps them.',eg:'Teams work together and management helps whenever needed.'},
{id:'P4',g:'P',n:'Development of Each and Every Person to His Greatest Efficiency and Prosperity',clue:'Training workers so they reach best efficiency and earn more',def:'Select workers scientifically and train them so that each reaches his maximum efficiency and prosperity.',eg:'Each worker is trained to reach his best and earns more.'},
{id:'P5',g:'P',n:'Mental Revolution',clue:'Change of attitude of workers and management towards each other and work',def:'A complete change in outlook of both workers and management: from conflict over the division of surplus to cooperating to increase the surplus.',eg:'Both sides stop quarrelling over profit-sharing and work to raise output.'},
{id:'T1',g:'T',n:'Functional Foremanship',clue:'Eight specialist foremen; planning and production in-charges',def:'Planning in-charge: instruction card clerk, route clerk, time and cost clerk, disciplinarian. Production in-charge: gang boss, speed boss, repair boss, inspector. Each worker takes orders from eight specialists.',eg:'A worker gets orders from eight different bosses.'},
{id:'T2',g:'T',n:'Standardisation and Simplification of Work',clue:'Fixed standards (size, weight, quality) and fewer varieties',def:'Standardisation sets standards for size, quality, method and weight. Simplification removes unnecessary variety, so costs and inventory fall.',eg:'A uniform carton size; slow varieties discontinued.'},
{id:'T3',g:'T',n:'Method Study',clue:'Find the one best way of doing a job',def:'Studying the different methods of doing a job and selecting the best one, which minimises cost and maximises quality and satisfaction.',eg:'Comparing all methods of baking and selecting the fastest, cheapest one.'},
{id:'T4',g:'T',n:'Motion Study',clue:'Eliminate unnecessary body and machine movements',def:'Studying the movements of hands, legs, body and machines while doing a job, and eliminating the unproductive ones. Often done with cinematography.',eg:'Video shows needless bending, so the process is redesigned.'},
{id:'T5',g:'T',n:'Time Study',clue:'Stopwatch, standard time for a job',def:'Determining the standard time to complete a task by timing a trained worker under normal conditions. Used for fixing targets, wages and schedules.',eg:'A stopwatch records sorting cycles; the average is the standard time.'},
{id:'T6',g:'T',n:'Fatigue Study',clue:'Rest intervals to remove tiredness',def:'Finding the amount and frequency of rest breaks needed to overcome physical and mental fatigue and so raise productivity.',eg:'A 10-minute break after every two hours of work.'},
{id:'T7',g:'T',n:'Differential Piece Wage System',clue:'Higher rate for those who meet the standard, lower for others',def:'Two different piece rates: a higher rate for workers who meet or beat the standard output and a lower rate for those who do not. It rewards efficiency and motivates improvement.',eg:'Rs 12 per shirt for 50 or more shirts, Rs 9 per shirt for fewer.'}
];
const GROUPS={F:"Fayol's 14 principles",P:"Taylor's principles",T:"Taylor's techniques"};

{id:'M01',q:'A manager makes sure that every employee receives orders from one superior only. Which principle of Fayol is followed?',o:['Unity of Direction','Unity of Command','Scalar Chain','Discipline'],a:1,pid:'F4',why:'One employee, one boss = Unity of Command. (Unity of Direction is one head and one plan for a group of activities.)'},
{id:'M02',q:'"Gang plank" is a part of which principle?',o:['Order','Equity','Scalar Chain','Initiative'],a:2,pid:'F9',why:'Gang plank is a direct link between same-level persons in different chains, used in emergencies. It is an exception within Scalar Chain.'},
{id:'M03',q:'Which technique of scientific management uses a stopwatch?',o:['Motion Study','Time Study','Fatigue Study','Method Study'],a:1,pid:'T5',why:'Time Study fixes the standard time for a job using a stopwatch.'},
{id:'M04',q:'Mr Sharma treats all his staff with kindness and justice and never discriminates on caste or religion. Which principle?',o:['Equity','Discipline','Order','Esprit de Corps'],a:0,pid:'F11',why:'Kindness plus justice without discrimination = Equity.'},
{id:'M05',q:'Which of these is NOT one of Taylor\'s principles of scientific management?',o:['Science, not rule of thumb','Harmony, not discord','Unity of command','Cooperation, not individualism'],a:2,pid:'P1',why:'Unity of Command is Fayol\'s principle. Taylor\'s four are Science, Harmony, Cooperation and Development of each person.'},
{id:'M06',q:'The technique that aims to find the one best way of doing a job is',o:['Motion Study','Fatigue Study','Method Study','Simplification'],a:2,pid:'T3',why:'Method Study compares the ways of doing a job and selects the best one.'},
{id:'M07',q:'Paying a higher piece rate to workers who meet the standard and a lower rate to those who do not is called',o:['Time rate system','Differential Piece Wage System','Simple piece rate','Profit sharing'],a:1,pid:'T7',why:'Two different rates around a standard output = Differential Piece Wage System.'},
{id:'M08',q:'"Right person at the right job" refers to which principle?',o:['Division of Work','Order','Scalar Chain','Stability of Personnel'],a:1,pid:'F10',why:'Order has two parts: material order (right thing, right place) and social order (right person, right job).'},
{id:'M09',q:'Who is called the Father of Scientific Management?',o:['Henri Fayol','F. W. Taylor','Peter Drucker','Max Weber'],a:1,pid:'P1',why:'F. W. Taylor. Henri Fayol is the Father of General Administrative Theory.'},
{id:'M10',q:'A company cuts its product varieties from 50 to 20 to save cost and inventory. Which technique is this?',o:['Method Study','Motion Study','Simplification of Work','Fatigue Study'],a:2,pid:'T2',why:'Removing unnecessary variety is Simplification (together with Standardisation, one technique of scientific management).'},
{id:'M11',q:'Which technique of Taylor goes against Fayol\'s principle of Unity of Command?',o:['Time Study','Functional Foremanship','Method Study','Differential Piece Wage'],a:1,pid:'T1',why:'In Functional Foremanship a worker takes orders from eight specialist bosses, which breaks Unity of Command.'},
{id:'M12',q:'Giving a manager responsibility for a result but not the power to take decisions violates',o:['Discipline','Initiative','Authority and Responsibility','Remuneration'],a:2,pid:'F2',why:'Authority and responsibility must be equal (parity).'},
{id:'M13',q:'The slogan "Union is strength" is linked to which principle?',o:['Esprit de Corps','Unity of Direction','Equity','Centralisation'],a:0,pid:'F14',why:'Esprit de Corps is team spirit; managers should avoid divide and rule.'},
{id:'M14',q:'Assertion (A): Principles of management are flexible.\nReason (R): They can be modified by managers according to the situation.',o:['Both A and R are true and R explains A','Both A and R are true but R does not explain A','A is true but R is false','A is false but R is true'],a:0,pid:null,why:'Principles are guidelines, not rigid rules, so managers can adapt them. R is the reason for A.'},
{id:'M15',q:'Assertion (A): Fatigue Study helps to raise productivity.\nReason (R): Rest intervals remove physical and mental tiredness.',o:['Both A and R are true and R explains A','Both A and R are true but R does not explain A','A is true but R is false','A is false but R is true'],a:0,pid:'T6',why:'Rest breaks reduce fatigue, which is why output and quality improve.'}

{id:'K03',m:3,t:'A Place for Everything',em:'🗂️',s:['At RightPlace Stores, every product has a fixed shelf and a clear label.','Every staff member is placed in the section that matches his or her skills.','A customer asking for any item is served within seconds, and nobody wastes time hunting for materials or people.'],
 q:'Identify the principle of management followed. Quote the lines and state its meaning.',w:{n:1,e:1,x:1},
 parts:[{pid:'F10',ev:[0,1],acc:[2],xk:[['right thing, right place',/right\s+(thing|material|product)[^.]*right\s+place|(material|proper|fixed)\s+(order|place)/],['right person, right job',/right\s+(person|man)[^.]*right\s+(job|place|position)|social\s+order/],['material and social order',/(material|social)\s+order/],['saves time / avoids waste',/(waste|time|efficien|confusion)/]],need:2,
 model:'Principle: Order. Lines: "every product has a fixed shelf" (material order) and "every staff member is placed in the section that matches his or her skills" (social order). Meaning: there should be a right place for every thing and a right job for every person, which saves time and avoids confusion and waste.'}],
 tip:'Order has two halves: things (material order) and people (social order). Mention both for full marks.'},
{id:'K04',m:3,t:'The Fair Manager',em:'⚖️',s:['Aman manages the Lotus Hotel and its 40 employees.','He treats every employee with kindness and justice.','He does not discriminate on the basis of gender, caste or religion while assigning duties or rewards.','In return, the employees show loyalty and devotion to the hotel.'],
 q:'Identify the principle of management. Quote the lines and state its meaning.',w:{n:1,e:1,x:1},
 parts:[{pid:'F11',ev:[1,2],acc:[3],xk:[['kindness',/kind/],['justice / fairness',/(justice|fair)/],['no discrimination',/discriminat/],['loyalty and devotion',/(loyal|devot)/]],need:2,
 model:'Principle: Equity. Lines: "He treats every employee with kindness and justice" and "He does not discriminate on the basis of gender, caste or religion". Meaning: managers should treat employees with kindness and justice, without discrimination, which earns their loyalty and devotion.'}],
 tip:'Kindness + justice are the two key words of Equity. The word "discriminate" in the case is a strong clue.'},
{id:'K05',m:3,t:'Hire and Fire',em:'🚪',s:['Phoenix Pvt Ltd hires new staff every few months and dismisses many without notice.','Employees fear losing their jobs at any time, so they work without commitment.','The firm spends heavily on training new people, who leave soon after.','The company is based in Pune.'],
 q:'Identify the principle of management violated by Phoenix. Quote the lines and state its meaning.',w:{n:1,e:1,x:1},
 parts:[{pid:'F12',ev:[0,1],acc:[2],xk:[['job security',/(job\s+)?security/],['employee turnover / hire and fire',/(turnover|hire|fire|dismiss|removed)/],['training cost',/(training|cost)/],['commitment / efficiency',/(commit|loyal|moral|efficien)/]],need:2,
 model:'Principle: Stability of Personnel (violated). Lines: "hires new staff every few months and dismisses many without notice" and "Employees fear losing their jobs at any time". Meaning: employees should not be removed frequently; job security and orderly personnel planning build commitment and reduce hiring and training costs.'}],
 tip:'When a case says a principle is violated, say so clearly in your answer ("Stability of Personnel is violated").'},
{id:'K06',m:3,t:'The Best Way to Bake',em:'🎂',s:['Mr Kapoor runs a bakery chain and wants to reduce the time taken to prepare a cake.','He studies the different ways in which cakes are baked in all his outlets.','After comparing them, he selects the one way that is fastest and cheapest without harming quality, and trains all bakers in it.'],
 q:'Identify the technique of scientific management used by Mr Kapoor. Quote the lines and state its meaning.',w:{n:1,e:1,x:1},
 parts:[{pid:'T3',ev:[1,2],acc:[0],xk:[['one best way',/(one\s+)?best\s+way/],['compare / study methods',/(compar|analys|stud)/],['minimises cost, maximises quality',/(cost|time|quality)/],['methods of doing a job',/(job|work)[^.]*(method|way)|method[^.]*(job|work)/]],need:2,
 model:'Technique: Method Study. Lines: "He studies the different ways in which cakes are baked" and "he selects the one way that is fastest and cheapest". Meaning: Method Study means finding the one best way of doing a job by comparing the available methods, so as to minimise cost and maximise quality.'}],
 tip:'Different ways compared, one best way chosen = Method Study. Motion Study is about movements, not methods.'},
{id:'K07',m:3,t:'Tired Packers',em:'😴',s:['In Delta Packers, employees work nine hours a day with only a lunch break.','By afternoon their speed falls and mistakes rise sharply.','The manager introduces a ten-minute rest break after every two hours, and output improves.'],
 q:'Identify the technique of scientific management used by the manager. Quote the lines and state its meaning.',w:{n:1,e:1,x:1},
 parts:[{pid:'T6',ev:[1,2],acc:[0],xk:[['rest intervals',/(rest|break|interval)/],['fatigue / tiredness',/(fatigue|tired|exhaust)/],['raises productivity',/(productiv|efficien|output)/],['frequency and duration of rest',/(frequency|duration|how long|physical|mental)/]],need:2,
 model:'Technique: Fatigue Study. Lines: "speed falls and mistakes rise sharply" and "a ten-minute rest break after every two hours". Meaning: Fatigue Study finds the amount and frequency of rest intervals needed to overcome physical and mental tiredness, so that productivity improves.'}],
 tip:'Rest break in the case = Fatigue Study. Mention both the duration and the frequency of rest in your meaning.'},
{id:'K08',m:3,t:'Pay by the Shirt',em:'👕',s:['Zippy Garments fixes a standard of 50 shirts per worker per day.','Workers who stitch 50 or more shirts are paid Rs 12 per shirt for all their pieces.','Workers who stitch fewer than 50 shirts are paid Rs 9 per shirt.','Efficient workers are rewarded and the others are motivated to improve.'],
 q:'Identify the technique of scientific management used by Zippy Garments. Quote the lines and state its meaning.',w:{n:1,e:1,x:1},
 parts:[{pid:'T7',ev:[1,2],acc:[0,3],xk:[['higher rate for efficient',/(higher|more)[^.]*(efficient|standard|meet)/],['lower rate for others',/(lower|less)[^.]*(inefficient|below|others|not)/],['standard output',/standard\s+(output|task|production)/],['motivates workers',/(motivat|incentive|reward|recogni)/]],need:2,
 model:'Technique: Differential Piece Wage System. Lines: "Rs 12 per shirt" for 50 or more shirts and "Rs 9 per shirt" for fewer. Meaning: two different piece rates are fixed around a standard output, a higher rate for workers who meet or beat it and a lower rate for those who do not. It rewards efficiency and motivates others to improve.'}],
 tip:'Two rates + a standard = Differential Piece Wage. Always quote both the higher and the lower rate line.'},
{id:'K09',m:3,t:'The Larger Good',em:'🖥️',s:['Priya heads the accounts department and has asked for new computers for her team.','The board has limited funds and decides to buy machines for the production line, which will raise the output and profits of the whole firm.','Priya withdraws her own demand for the larger good of the organisation.'],
 q:'Identify the principle of management reflected. Quote the lines and state its meaning.',w:{n:1,e:1,x:1},
 parts:[{pid:'F6',ev:[1,2],acc:[0],xk:[['organisation interest above individual',/(organi[sz]ation|general|company|firm)[^.]*(interest|goal|above|first)/],['individual interest',/individual[^.]*(interest|goal)/],['reconcile conflict',/(reconcil|conflict|clash)/],['firmness / fairness',/(firm|fair|example)/]],need:2,
 model:'Principle: Subordination of Individual Interest to General Interest. Lines: "buy machines for the production line, which will raise the output and profits of the whole firm" and "Priya withdraws her own demand for the larger good". Meaning: the interest of the organisation is above the interest of any one person, and where they conflict management must reconcile them.'}],
 tip:'Write the full name: "Subordination of Individual Interest to General Interest". A short form like "General Interest" can lose the mark.'},
{id:'K10',m:3,t:'Target Without Power',em:'🎯',s:['Ritu is made sales manager of Kiran Appliances with a target of Rs 10 crore.','She is held accountable for the target but cannot recruit staff, approve discounts or authorise advertising.','At the end of the year she misses the target and blames the lack of power.'],
 q:'Identify the principle of management that is violated. Quote the lines and state its meaning.',w:{n:1,e:1,x:1},
 parts:[{pid:'F2',ev:[1],acc:[0,2],evNeed:1,xk:[['authority = right to give orders',/authority[^.]*(right|power)|right to (give )?(order|command)/],['responsibility = obligation',/responsib[^.]*(oblig|answerab|accountab|duty)|obligation/],['parity / balance',/(parity|balance|equal|co-?exist|go together)/],['accountable without power',/(accountab|answerab)/]],need:2,
 model:'Principle: Authority and Responsibility (violated). Line: "She is held accountable for the target but cannot recruit staff, approve discounts or authorise advertising". Meaning: authority is the right to give orders and responsibility is the obligation to perform; the two must be equal (parity). Responsibility without authority leads to failure.'}],
 tip:'Responsibility without authority (or authority without responsibility) = Authority and Responsibility out of balance.'},

/* ===== 4 marks ===== */
{id:'L01',m:4,t:'Sunrise Pharma',em:'💊',s:['Sunrise Pharma divides its production into small tasks such as mixing, filling, sealing and labelling, and each worker handles only the task he or she does best.','As a result, workers have become skilled and output per worker has risen.','The manager also organises monthly get-togethers and team games, and encourages everyone to say "our team" instead of "my section".','Employees help each other and the department works like a family.'],
 q:'Identify any two principles of management described in the case. For each, quote the lines and state its meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'F1',ev:[0],acc:[1],evNeed:1,xk:[['specialisation',/special/],['work divided into small tasks',/(divid|split|small\s+tasks?|break)/],['efficiency / productivity',/(efficien|skill|productiv)/]],need:2,model:'Principle 1: Division of Work. Line: "divides its production into small tasks". Meaning: work is divided into small tasks and each person does the task he is best suited for, giving specialisation and higher efficiency.'},
        {pid:'F14',ev:[2],acc:[3],evNeed:1,xk:[['team spirit / union is strength',/team\s*spirit|union is strength|unity/],['harmony / togetherness',/(harmony|together|cooperat|family)/],['avoid divide and rule / communication',/(divide and rule|communicat)/]],need:1,model:'Principle 2: Esprit de Corps. Line: "encourages everyone to say \'our team\'". Meaning: team spirit and harmony among members ("union is strength"); managers should avoid divide and rule.'}],
 tip:'Order of the two principles does not matter, but each one needs its own line and its own meaning.'},
{id:'L02',m:4,t:'Kavya Foods',em:'🍲',s:['Kavya Foods pays its employees fair salaries along with bonus and profit sharing, which satisfies both the owners and the workers.','Managers are encouraged to think of new recipes and packaging ideas without waiting for orders from above.','A cashier\'s suggestion for a QR-code payment counter was tried and then adopted across all outlets.'],
 q:'Identify any two principles of management described in the case. For each, quote the lines and state its meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'F7',ev:[0],evNeed:1,xk:[['fair / reasonable',/(fair|reasonable|just)/],['wages / bonus / incentives',/(wage|salary|payment|remuneration|bonus|incentive)/],['satisfaction of both',/satisf/]],need:2,model:'Principle 1: Remuneration of Employees. Line: "pays its employees fair salaries along with bonus and profit sharing". Meaning: pay should be fair and give maximum satisfaction to both employer and employees.'},
        {pid:'F13',ev:[1,2],evNeed:1,acc:[],xk:[['think out and carry out a plan',/(think|conceive|plan)[^.]*(carry|execut|implement)/],['freedom',/(freedom|free)/],['all levels',/(all levels|every level|any level|everyone)/],['new ideas / suggestions',/(initiative|new ideas?|suggest)/]],need:2,model:'Principle 2: Initiative. Lines: "Managers are encouraged to think of new recipes" and "A cashier\'s suggestion ... was adopted". Meaning: employees at all levels should be free to think out a plan and carry it out, which raises their zeal and energy.'}],
 tip:'Initiative is about thinking AND carrying out a plan; mention freedom at all levels.'},
{id:'L03',m:4,t:'Metro Builders',em:'🏗️',s:['At Metro Builders, every employee follows the safety rules strictly, and agreements with the workers\' union are respected by both sides.','Supervisors can instruct workers on site and approve materials up to a fixed limit.','In return, they are answerable for the quality of work and completion of every stage on time.','The firm has built 40 housing projects so far.'],
 q:'Identify any two principles of management described in the case. For each, quote the lines and state its meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'F3',ev:[0],evNeed:1,xk:[['obedience',/obedien|obey|follow/],['respect for rules and agreements',/(respect|rules|norms|agreements?)/],['good superiors / fair penalty',/(good\s+superiors?|clear|fair|judicious|penalt)/]],need:2,model:'Principle 1: Discipline. Line: "every employee follows the safety rules strictly, and agreements ... are respected". Meaning: obedience to organisational rules and respect for agreements, supported by good superiors, clear agreements and fair penalties.'},
        {pid:'F2',ev:[1,2],evNeed:1,xk:[['authority = right to instruct',/(right|power)[^.]*(order|command|instruct)|authority/],['responsibility = obligation',/(obligation|answerab|accountab|responsib)/],['balance / parity',/(balance|parity|equal|go together)/]],need:2,model:'Principle 2: Authority and Responsibility. Lines: "Supervisors can instruct workers" and "they are answerable for the quality of work". Meaning: authority is the right to give orders and responsibility is the obligation to perform; both must be balanced.'}],
 tip:'"Can instruct" = authority; "answerable for" = responsibility. Quote both halves.'},
{id:'L04',m:4,t:'Orbit Electronics',em:'📱',s:['Orbit Electronics has three groups of activities with the same objective of promoting its new phone: advertising, discounts and dealer visits.','All three are placed under one marketing head and follow a single campaign plan.','The company also decides that purchases up to Rs 50,000 can be approved by branch managers, while major decisions are taken only at head office.'],
 q:'Identify any two principles of management described in the case. For each, quote the lines and state its meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'F5',ev:[0,1],evNeed:1,xk:[['one head, one plan',/(one|single)\s+(head|plan|boss)/],['same objective',/(same|common)\s+(objective|goal|aim)/],['group of activities',/(group|set)\s+of\s+activities/],['coordination',/(coordinat|unity|focus)/]],need:2,model:'Principle 1: Unity of Direction. Lines: "placed under one marketing head and follow a single campaign plan". Meaning: each group of activities with the same objective must have one head and one plan, so that efforts are coordinated.'},
        {pid:'F8',ev:[2],evNeed:1,xk:[['degree of authority at top / lower levels',/(degree|extent|level)/],['centralisation / decentralisation',/(central|decentral)/],['authority and power',/(authority|power)/],['balance suited to size',/(balance|optimum|size|situation)/]],need:2,model:'Principle 2: Centralisation and Decentralisation. Line: "purchases up to Rs 50,000 can be approved by branch managers, while major decisions are taken only at head office". Meaning: the degree of authority kept at the top or given to lower levels should be balanced to suit the size and needs of the firm.'}],
 tip:'Unity of Direction is about activities and plans. Unity of Command is about people and bosses. Do not mix them.'},
{id:'L05',m:4,t:'Alpha Steel',em:'🔩',s:['At Alpha Steel, loaders used to lift loads by their own habits and guesswork.','The manager now conducts experiments to find the best way, the best tool and the right load per trip, and fixes these as standards.','Earlier, workers and management often quarrelled over wages and targets.','Now both sides share a common aim of higher output, and the extra profits are shared through bonuses.'],
 q:'Identify any two principles of scientific management described in the case. For each, quote the lines and state its meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'P1',ev:[0,1],evNeed:1,xk:[['experiments / scientific study',/(experiment|scientific|investigat|study)/],['rule of thumb / guesswork',/(rule of thumb|guess|trial and error|habit)/],['one best way / standard',/(one best way|best way|standard)/]],need:2,model:'Principle 1: Science, Not Rule of Thumb. Lines: "lift loads by their own habits and guesswork" and "conducts experiments to find the best way". Meaning: guesswork is replaced by scientific study of each job to find the one best way.'},
        {pid:'P2',ev:[2,3],evNeed:1,xk:[['mutual trust and confidence',/(mutual|trust|confidence)/],['shared aim',/(share|common|same)[^.]*(aim|goal|objective|gain)/],['no conflict',/(conflict|discord|quarrel)/],['prosperity / gains shared',/(prosperity|bonus|profit|gain)/]],need:2,model:'Principle 2: Harmony, Not Discord. Lines: "workers and management often quarrelled" and "both sides share a common aim of higher output". Meaning: mutual trust between management and workers, who share the gains, replaces conflict.'}],
 tip:'For Taylor\'s principles, link the case to the exact name, e.g. "Science, Not Rule of Thumb".'},
{id:'L06',m:4,t:'ShipFast Couriers',em:'⏱️',s:['At ShipFast Couriers, a manager records with a stopwatch how long a trained sorter takes to complete a sorting cycle under normal conditions.','The average time is fixed as the standard time for the job.','He also studies video recordings of the sorters and finds that many hand and body movements, such as bending twice and re-arranging parcels, are not needed.','After removing these movements the process becomes faster and less tiring.'],
 q:'Identify any two techniques of scientific management used. For each, quote the lines and state its meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'T5',ev:[0,1],evNeed:1,xk:[['stopwatch / time taken',/(stopwatch|time taken|timing)/],['standard time',/standard\s+time/],['targets / wages / schedules',/(target|incentive|wage|schedul)/],['cost / efficiency',/(cost|efficien|supervis)/]],need:2,model:'Technique 1: Time Study. Lines: "records with a stopwatch how long a trained sorter takes" and "average time is fixed as the standard time". Meaning: determining the standard time for a job by timing a trained worker under normal conditions.'},
        {pid:'T4',ev:[2,3],evNeed:1,xk:[['unnecessary / unproductive movements',/(unnecessary|unproductive|needless|waste|eliminat)/],['hand, body, machine movements',/(movement|motion)/],['body / hand / machine',/(body|hand|machine|leg)/],['cinematography / video',/(cinematograph|video|film|camera)/]],need:2,model:'Technique 2: Motion Study. Lines: "many hand and body movements ... are not needed" and "After removing these movements ...". Meaning: studying the movements of hands, body and machines in a job and eliminating the unproductive ones.'}],
 tip:'Time Study = how LONG. Motion Study = how MANY movements. Use these words in your meaning.'},
{id:'L07',m:4,t:'Gamma Industries',em:'🏭',s:['At Gamma Industries, each worker gets instructions from eight specialist bosses, four from the planning department and four from the production department.','One boss prepares the instruction card, another decides the route, another fixes the time and cost, and another looks after discipline.','Workers complain that they do not know whose order to follow first when instructions clash.','Skill levels have improved, but coordination has suffered.'],
 q:'Identify the technique of scientific management used and the principle of Fayol that it violates. Quote the lines for each and state the meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'T1',ev:[0,1],evNeed:1,xk:[['eight specialist foremen',/(eight|8)\s+(foremen|specialist|bosses)|specialist/],['planning and production in-charge',/(planning|production)/],['each does one function',/(each|one)[^.]*(function|specific)|function/],['expert / specialisation',/(expert|special)/]],need:2,model:'Technique: Functional Foremanship. Lines: "eight specialist bosses, four from the planning department and four from the production department". Meaning: planning in-charge and production in-charge, each with four specialist foremen, direct a worker according to function.'},
        {pid:'F4',ev:[2],evNeed:1,xk:[['one boss only',/(one|single)\s+(boss|superior)/],['violated / conflict / confusion',/(violat|conflict|confusion|dual)/],['unity of command',/unity of command/],['orders',/(orders?|instruction)/]],need:2,model:'Principle violated: Unity of Command. Line: "they do not know whose order to follow first". Meaning: a worker should receive orders from one superior only; eight bosses cause confusion.'}],
 tip:'Functional Foremanship and Unity of Command are the best known "opposite" pair in this chapter.'},
{id:'L08',m:4,t:'Navjeevan Industries',em:'🤝',s:['The owners of Navjeevan Industries used to treat workers as tools and fought over every wage revision.','Now they meet workers every month, listen to suggestions and act on them, and welcome help from workers in solving production problems.','Each worker also gets training and is guided so that he reaches his best level of efficiency and earns more.','The plant has two production halls.'],
 q:'Identify any two principles of scientific management described in the case. For each, quote the lines and state its meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'P3',ev:[1],acc:[],evNeed:1,xk:[['cooperation between management and workers',/(cooperat|co-operat|together|help)/],['not individualism',/(individualism|own way|each for himself)/],['suggestions invited / sincere help',/(suggest|sincere|mutual)/]],need:2,model:'Principle 1: Cooperation, Not Individualism. Line: "listen to suggestions and act on them, and welcome help from workers". Meaning: management and workers should cooperate sincerely rather than each pulling his own way.'},
        {pid:'P4',ev:[2],evNeed:1,xk:[['training',/(train|develop)/],['greatest efficiency',/(greatest|maximum|best|highest)[^.]*(efficien)|efficien/],['prosperity / more earnings',/(prosper|earn|more)/],['scientific selection',/(select|each and every)/]],need:2,model:'Principle 2: Development of Each and Every Person to his Greatest Efficiency and Prosperity. Line: "Each worker also gets training ... reaches his best level of efficiency and earns more". Meaning: workers should be scientifically selected and trained so that each reaches his maximum efficiency and prosperity.'}],
 tip:'The long fourth principle can be written as "Development of each and every person". Use the full title once.'},

/* ===== 6 marks ===== */
{id:'N01',m:6,t:'Greenfield Auto',em:'🚗',s:['At Greenfield Auto, the production head divides the assembly line into specialised jobs such as welding, painting and fitting, and each worker repeats one job.','Every employee reports to only one supervisor, who gives all the instructions.','The company pays reasonable wages and yearly bonuses linked to profits, so both management and workers are satisfied.','The factory is located near a highway, which helps in transport.','It produces 200 cars every month.'],
 q:'Identify any three principles of management followed by Greenfield Auto. For each, quote the lines and state its meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'F1',ev:[0],evNeed:1,xk:[['specialisation',/special/],['work divided into small tasks',/(divid|split|task|job)/],['efficiency',/(efficien|skill|productiv)/]],need:2,model:'Division of Work. Line: "divides the assembly line into specialised jobs". Meaning: work is divided into small tasks and each person does the task he is best suited for, giving specialisation and efficiency.'},
        {pid:'F4',ev:[1],evNeed:1,xk:[['one superior only',/(one|single)\s+(boss|superior|supervisor)/],['orders from one source',/(orders?|instruction)/],['avoids confusion',/(confus|conflict|dual)/]],need:2,model:'Unity of Command. Line: "Every employee reports to only one supervisor". Meaning: each subordinate should receive orders from, and be answerable to, one superior only.'},
        {pid:'F7',ev:[2],evNeed:1,xk:[['fair / reasonable pay',/(fair|reasonable|just)/],['wages / bonus / incentives',/(wage|salary|bonus|incentive|payment)/],['satisfies both',/satisf/]],need:2,model:'Remuneration of Employees. Line: "pays reasonable wages and yearly bonuses linked to profits". Meaning: pay should be fair and satisfy both employer and employees.'}],
 tip:'For 6 marks, keep each principle in a block of its own: name, line, meaning. Examiners tick block by block.'},
{id:'N02',m:6,t:'Pioneer Textiles',em:'🧵',s:['Pioneer Textiles wants to raise the output of its weaving unit.','The manager first measures, with a stopwatch, the time taken by a skilled weaver to finish one roll under normal conditions.','Weavers were tiring after long stretches, so a rest break of 15 minutes is fixed after every two hours.','A weaver who produces 40 rolls or more in a week gets Rs 100 per roll, while others get Rs 80 per roll.','The unit is located in an industrial area.'],
 q:'Identify any three techniques of scientific management used by Pioneer Textiles. For each, quote the lines and state its meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'T5',ev:[1],evNeed:1,xk:[['stopwatch',/stopwatch|timing/],['standard time',/standard\s+time|time taken/],['fix targets / wages',/(target|wage|schedul|incentive)/]],need:2,model:'Time Study. Line: "measures, with a stopwatch, the time taken by a skilled weaver". Meaning: fixing the standard time of a job by timing a trained worker under normal conditions.'},
        {pid:'T6',ev:[2],evNeed:1,xk:[['rest intervals',/(rest|break|interval)/],['fatigue',/(fatigue|tired)/],['productivity',/(productiv|efficien|output)/]],need:2,model:'Fatigue Study. Line: "a rest break of 15 minutes is fixed after every two hours". Meaning: finding the amount and frequency of rest needed to overcome physical and mental tiredness.'},
        {pid:'T7',ev:[3],evNeed:1,xk:[['higher rate for efficient',/(higher|more)[^.]*(efficient|standard)/],['lower rate for others',/(lower|less)[^.]*(inefficient|below|others)/],['standard output',/standard/],['motivates',/(motivat|incentive|reward)/]],need:2,model:'Differential Piece Wage System. Line: "Rs 100 per roll ... while others get Rs 80 per roll". Meaning: a higher piece rate for those meeting the standard and a lower rate for the rest, to reward efficiency.'}],
 tip:'Keep technique names exactly as in the NCERT text. "Differential Piece Wage System" is the full name.'},
{id:'N03',m:6,t:'Bharat Bakers',em:'🥖',s:['Bharat Bakers has 30 outlets, each headed by a manager who reports to the regional head, who in turn reports to the managing director.','In an urgent matter, the manager of outlet A calls outlet B directly and informs the regional head later.','Every ingredient has a fixed storage place and every baker is posted in the section where he is most skilled.','The owner, Mr Das, never favours relatives and treats all workers justly and kindly.','The bakery was started in 1998.'],
 q:'Identify any three principles of management followed. For each, quote the lines and state its meaning.',w:{n:1,e:.5,x:.5},
 parts:[{pid:'F9',ev:[0,1],evNeed:1,xk:[['chain of authority top to bottom',/(chain|top|highest)/],['gang plank',/gang\s*plank/],['emergency direct contact',/(emergency|direct|same level)/]],need:2,model:'Scalar Chain. Lines: "reports to the regional head, who in turn reports to the managing director" and "calls outlet B directly". Meaning: formal line of authority from top to bottom with a gang plank for emergencies.'},
        {pid:'F10',ev:[2],evNeed:1,xk:[['right thing, right place',/(right|proper|fixed)\s+(thing|place|material)|material order/],['right person, right job',/(right|skilled)[^.]*(person|baker|man)|social order/],['saves time / waste',/(waste|time|confusion)/]],need:2,model:'Order. Line: "Every ingredient has a fixed storage place and every baker is posted in the section where he is most skilled". Meaning: right thing at the right place and right person at the right job.'},
        {pid:'F11',ev:[3],evNeed:1,xk:[['kindness',/kind/],['justice',/(justice|fair)/],['no discrimination / favouritism',/(discriminat|favour|favor)/]],need:2,model:'Equity. Line: "never favours relatives and treats all workers justly and kindly". Meaning: managers should treat employees with kindness and justice without discrimination.'}],
 tip:'If the case has a distractor line (like the year the bakery began), ignore it in "quote the lines".'},

function evalCase(q,stu,selfX){
 const used=new Set(),W=q.w,per=W.n+W.e+W.x;let total=0;const out=[];
 stu.forEach((s,i)=>{
  const pi=q.parts.findIndex((p,j)=>p.pid===s.pid&&!used.has(j));
  const o={chosen:s.pid,ok:pi>=0,n:0,e:0,x:0,evHit:[],evBad:[],xh:[],xm:[],pi};
  if(pi>=0){used.add(pi);const p=q.parts[pi];o.n=W.n;
   const core=new Set(p.ev),acc=new Set(p.acc||[]),need=p.evNeed||p.ev.length;
   s.lines.forEach(l=>core.has(l)||acc.has(l)?o.evHit.push(l):o.evBad.push(l));
   let es=Math.min(1,Math.min(o.evHit.length,need)/need);if(o.evBad.length>need)es*=.5;o.e=W.e*es;
   const words=(s.text||'').trim().split(/\s+/).filter(Boolean).length;
   p.xk.forEach(([l,re])=>(ci(re).test(s.text||'')?o.xh:o.xm).push(l));
   const xs=words<4?0:Math.min(1,o.xh.length/(p.need||1));o.x=W.x*xs;o.auto=o.x;
   if(selfX&&selfX[i])o.x=W.x}
  total+=o.n+o.e+o.x;out.push(o)});
 const missed=q.parts.filter((_,j)=>!used.has(j)).map(p=>p.pid);
 return{total:Math.min(total,q.m),max:q.m,parts:out,missed}}
function evalTheory(q,text,self){
 const its=q.items.map((it,i)=>{let s=0,nameHit=ci(it.k).test(text),x2=it.k2?ci(it.k2).test(text):false;
  if(nameHit)s=it.k2?it.m*.5+(x2?it.m*.5:0):it.m;
  const auto=s;if(self&&self[i])s=it.m;return{l:it.l,m:it.m,s,auto,hit:nameHit,hit2:x2,self:!!(self&&self[i])}});
 let t=its.reduce((a,b)=>a+b.s,0);t=Math.min(t,q.cap||q.m);return{total:t,max:q.m,items:its}}

function rec(q,got,info){
 ST.res[q.id]={got,max:q.m,t:Date.now(),tag:q.type};
 const bump=(pid,ok)=>{if(!pid)return;const o=ST.pr[pid]||(ST.pr[pid]={ok:0,tot:0});o.tot++;if(ok)o.ok++};
 if(q.type==='mcq')bump(q.pid,got>=1);
 if(q.type==='case'&&info){const per=q.w.n+q.w.e+q.w.x;q.parts.forEach(p=>{const m=info.parts.find(o=>o.ok&&q.parts[o.pi]===p);bump(p.pid,!!m&&(m.n+m.e+m.x)>=per*.7)})}
 save()}

 const S=[{a:'Unity of direction.',s:[['Name',0,'Wrong principle. One boss per worker is Unity of COMMAND.'],['Lines',0,'No lines quoted.'],['Meaning',0,'No meaning.']],t:0},
 {a:'Unity of Command. Neha gets orders from both the managers so she is confused.',s:[['Name',1,'Correct principle.'],['Lines',.5,'Paraphrased, not quoted exactly, so partial credit at best.'],['Meaning',0,'No definition of the principle.']],t:1.5},
 {a:QBYID.K01.parts[0].model,s:[['Name',1,'Exact name.'],['Lines',1,'Both lines quoted.'],['Meaning',1,'Clear meaning plus reason.']],t:3}];
 const sd=i=>{const x=S[i];$('#smd').innerHTML=`<div class="model">${esc(x.a)}</div><div class="ln">${x.s.map(s=>`<span class="tick ${s[1]>=1?'y':s[1]>0?'':'n'}" style="${s[1]>0&&s[1]<1?'background:#ffe48a':''}">${s[0]}: ${s[1]}</span>`).join('')}</div><p><b>Examiner:</b> ${x.s.map(s=>s[2]).join(' ')}</p><div class="score"><div class="num">${x.t}<small>/3</small></div><div class="rng">Estimated marks</div></div>`};
 $$('#sm button').forEach(b=>b.onclick=()=>{$$('#sm button').forEach(x=>x.classList.toggle('on',x===b));sd(+b.dataset.i)});sd(0)}
V.clues=()=>{
 let g='F';const draw=()=>{$('#cg').innerHTML=PR.filter(p=>p.g===g).map(p=>`<button class="flip"><div class="f"><div class="s fr"><i>Clue</i><b>${esc(p.clue)}</b><i>tap to reveal the name</i></div><div class="s b"><h4>${esc(p.n)}</h4><small>${esc(p.def)}</small><small><b>Eg:</b> ${esc(p.eg)}</small></div></div></button>`).join('');$$('#cg .flip').forEach(b=>b.onclick=()=>b.classList.toggle('on'))};
 $('#app').innerHTML=`<h2 class="sec"><span>Clue cards</span></h2><p class="muted">Read the clue, guess the principle, then flip. These are the words that appear in case studies.</p><div class="tab" id="ct">${Object.entries(GROUPS).map(([k,v])=>`<button data-g="${k}" class="${k===g?'on':''}">${v}</button>`).join('')}</div><div class="grid" id="cg"></div>`;
 $$('#ct button').forEach(b=>b.onclick=()=>{g=b.dataset.g;$$('#ct button').forEach(x=>x.classList.toggle('on',x===b));draw()});draw()}
function browse(list,title,sub,types){
 let f=0;const draw=()=>{$('#bl').innerHTML=list.filter(q=>!f||q.m===f).map(q=>{const r=ST.res[q.id];const p=r?r.got/r.max:null;return`<button class="sticker cc" data-id="${q.id}"><span class="em">${q.em||'📝'}</span>${r?`<span class="scr badge ${p>=.75?'ok':p>=.5?'mid':'low'}">${f5(r.got)}/${r.max}</span>`:''}<h3>${esc(q.t)}</h3><div class="meta"><span class="badge">${q.m} marks</span><span class="badge t">${q.type==='case'?'Case study':'Theory'}</span></div></button>`}).join('');$$('#bl .cc').forEach(b=>b.onclick=()=>go(types,b.dataset.id))};
 $('#app').innerHTML=`<h2 class="sec"><span>${title}</span></h2><p class="muted">${sub}</p><div class="tab" id="bf"><button class="on" data-m="0">All</button>${[...new Set(list.map(q=>q.m))].map(m=>`<button data-m="${m}">${m} marks</button>`).join('')}</div><div class="grid" id="bl"></div>`;
 $$('#bf button').forEach(b=>b.onclick=()=>{f=+b.dataset.m;$$('#bf button').forEach(x=>x.classList.toggle('on',x===b));draw()});draw()}
V.studio=a=>{if(a&&a.m){}browse(CASES,'Case studies','Read the case, name the principle, pick the lines, write the meaning. Then check your marks.','case')}
V.theory=()=>browse(THEORY,'Theory writer','Typed answers for 3, 4 and 6 marks. The checker finds the points examiners tick.','tcase');
V.case=id=>{$('#app').innerHTML=`<div class="qcard"><button class="bk" data-go="studio">← All cases</button><div id="qh"></div></div>`;renderQ(QBYID[id],$('#qh'),{})};
V.tcase=id=>{$('#app').innerHTML=`<div class="qcard"><button class="bk" data-go="theory">← All theory</button><div id="qh"></div></div>`;renderQ(QBYID[id],$('#qh'),{})};
const selHTML=()=>`<option value="">— choose principle or technique —</option>`+Object.entries(GROUPS).map(([g,n])=>`<optgroup label="${n}">${PR.filter(p=>p.g===g).map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</optgroup>`).join('');
function modelHTML(q){
 if(q.type==='mcq')return`<div class="model"><b>Answer:</b> ${esc(q.o[q.a])}. ${esc(q.why)}</div>`;
 if(q.type==='case')return q.parts.map((p,i)=>`<div class="model"><b>${esc(PN(p.pid))}</b> (lines ${p.ev.map(x=>x+1).join(', ')}). ${esc(p.model)}</div>`).join('');
 return`<div class="model">${esc(q.model)}</div>`}
function renderQ(q,host,o){
 o=o||{};
 if(q.type==='mcq')return rMCQ(q,host,o);if(q.type==='case')return rCase(q,host,o);return rTheory(q,host,o)}
function rMCQ(q,host,o){
 let sel=-1,lock=false;
 host.innerHTML=`<div class="sticker"><div class="qh"><span class="badge">1 mark</span><span class="badge t">MCQ</span></div><p class="q" style="white-space:pre-line">${esc(q.q)}</p><div class="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(t)}</button>`).join('')}</div><div id="mr"></div>${o.exam?`<button class="btn" id="mn" disabled>Save and next →</button>`:''}</div>`;
 $$('.opt',host).forEach(b=>b.onclick=()=>{if(lock)return;sel=+b.dataset.i;
  if(o.exam){$$('.opt',host).forEach(x=>x.classList.toggle('sel',x===b));$('#mn',host).disabled=false;return}
  lock=true;$$('.opt',host).forEach((x,i)=>{x.disabled=true;if(i===q.a)x.classList.add('right');else if(i===sel)x.classList.add('wrong')});
  const g=sel===q.a?1:0;rec(q,g);$('#mr',host).innerHTML=`<div class="res"><b>${g?'✅ Correct, 1/1':'❌ Not this time, 0/1'}</b><div class="model">${esc(q.why)}</div></div>${o.next?'<p><button class="btn" id="nx">Next →</button></p>':''}`;
  if(o.next)$('#nx',host).onclick=()=>o.next(g)});
 if(o.exam)$('#mn',host).onclick=()=>{const g=sel===q.a?1:0;rec(q,g);o.onDone(g)}}
function rCase(q,host,o){
 const np=q.parts.length;let last=null,selfX=[];
 host.innerHTML=`<div class="sticker"><div class="qh"><span class="badge">${q.m} marks</span><span class="badge t">Case study</span><b style="font-size:20px">${q.em} ${esc(q.t)}</b></div>
 <ol class="case">${q.s.map((x,i)=>`<li><i>${i+1}</i><span>${esc(x)}</span></li>`).join('')}</ol>
 <p class="q">${esc(q.q)}</p><div class="scheme">Marking: name ${fmt(q.w.n)} · lines ${fmt(q.w.e)} · meaning ${fmt(q.w.x)}${np>1?' for each of the '+np+' principles':''}. Total ${q.m}.</div>
 ${q.parts.map((_,i)=>`<div class="part" data-i="${i}"><h4>${np>1?'Principle / technique '+(i+1):'Your answer'}</h4><label>Name</label><select>${selHTML()}</select><label>Lines that prove it (tap the line numbers)</label><div class="chips">${q.s.map((_,j)=>`<button class="chip" data-l="${j}">${j+1}</button>`).join('')}</div><label>Meaning in your own words, linked to the case</label><textarea placeholder="e.g. It means ... In the case, ..."></textarea></div>`).join('')}
 <button class="btn" id="chk">${o.exam?'Save and next →':'Check my marks'}</button><div id="rs"></div></div>`;
 $$('.chip',host).forEach(c=>c.onclick=()=>c.classList.toggle('on'));
 const gather=()=>$$('.part',host).map(p=>({pid:$('select',p).value,lines:$$('.chip.on',p).map(c=>+c.dataset.l),text:$('textarea',p).value}));
 const draw=()=>{const stu=gather(),r=evalCase(q,stu,selfX);last=r;const p=r.total/q.m,b=band(p);
  const lo=Math.max(0,r5(r.total)-.5),hi=Math.min(q.m,r5(r.total)+.5);
  $('#rs',host).innerHTML=`<div class="res"><div class="score"><div class="num">${f5(r.total)}<small>/${q.m}</small></div><div><span class="badge ${b[1]}">${b[2]} ${b[0]}</span><div class="rng">Likely range in the exam: ${f5(lo)} to ${f5(hi)} marks</div></div><div class="meter"><i style="width:${p*100}%"></i></div></div><p>${b[3]}</p>
  ${r.parts.map((x,i)=>{const pt=x.pi>=0?q.parts[x.pi]:null;const emp=!x.chosen&&!x.lines.length&&!(stu[i].text||'').trim();
   return`<div class="pr"><h4>${np>1?'Principle '+(i+1)+': ':''}${emp?'Not attempted':x.ok?'✅ '+esc(PN(x.chosen)):'❌ '+(x.chosen?esc(PN(x.chosen)):'No name chosen')}</h4>
   ${pt?`<div class="ln"><span class="tick y">Name +${fmt(x.n)}</span><span class="tick ${x.e>=q.w.e?'y':x.e>0?'':'n'}" ${x.e>0&&x.e<q.w.e?'style="background:#ffe48a"':''}>Lines +${fmt(x.e)} of ${fmt(q.w.e)}</span><span class="tick ${x.x>=q.w.x?'y':x.x>0?'':'n'}" ${x.x>0&&x.x<q.w.x?'style="background:#ffe48a"':''}>Meaning +${fmt(x.x)} of ${fmt(q.w.x)}</span></div>
   <p class="small"><b>Lines:</b> best lines are ${pt.ev.map(n=>n+1).join(' and ')}${x.evBad.length?'. You also chose '+x.evBad.map(n=>n+1).join(', ')+' which do not prove it':''}.</p>
   <p class="small" style="margin:6px 0 0"><b>Points examiners look for in the meaning:</b></p><div class="ln">${x.xh.map(l=>`<span class="tick y">✔ ${esc(l)}</span>`).join('')}${x.xm.map(l=>`<span class="tick n">✘ ${esc(l)}</span>`).join('')}</div>
   <label class="sc"><input type="checkbox" data-s="${i}" ${selfX[i]?'checked':''}> My explanation covered the main idea, just in different words</label>`:emp?'':`<p class="small">This principle is not in the case. Re-read the lines and match the clue words.</p>`}</div>`}).join('')}
  ${r.missed.length?`<div class="pr"><h4>Missed</h4><p class="small">You did not find: ${r.missed.map(m=>'<b>'+esc(PN(m))+'</b>').join(', ')}.</p></div>`:''}
  <h4 style="margin-top:10px">Model answer</h4>${modelHTML(q)}<div class="tip"><b>Examiner tip:</b> ${esc(q.tip)}</div>
  <p><button class="btn ghost" id="rt">Try again</button> ${o.next?'<button class="btn" id="nx">Next →</button>':''}</p></div>`;
  $$('[data-s]',host).forEach(c=>c.onchange=()=>{selfX[+c.dataset.s]=c.checked;draw2()});
  $('#rt',host).onclick=()=>renderQ(q,host,o);if(o.next)$('#nx',host).onclick=()=>o.next(last.total);return r};
 const draw2=()=>{const r=draw();rec(q,r.total,r)};
 $('#chk',host).onclick=()=>{const stu=gather(),r=evalCase(q,stu,[]);if(o.exam){last=r;rec(q,r.total,r);o.onDone(r.total);return}draw2();$('#rs',host).scrollIntoView({behavior:'smooth',block:'start'})}}
function rTheory(q,host,o){
 let self=[];
 host.innerHTML=`<div class="sticker"><div class="qh"><span class="badge">${q.m} marks</span><span class="badge t">Theory</span><b style="font-size:20px">${esc(q.t)}</b></div><p class="q">${esc(q.q)}</p><div class="scheme">${q.mode==='any'?`Any ${q.cap>3&&q.items[0].m===2?'three':q.cap} points are enough`:'All points below are looked for'}. Total ${q.m} marks.</div><textarea style="min-height:190px" placeholder="Type your answer here, as you would write it in the exam..."></textarea><p><button class="btn" id="chk">${o.exam?'Save and next →':'Check my marks'}</button></p><div id="rs"></div></div>`;
 const draw=()=>{const t=$('textarea',host).value,r=evalTheory(q,t,self),p=r.total/q.m,b=band(p);
  $('#rs',host).innerHTML=`<div class="res"><div class="score"><div class="num">${f5(r.total)}<small>/${q.m}</small></div><div><span class="badge ${b[1]}">${b[2]} ${b[0]}</span><div class="rng">Likely range in the exam: ${f5(Math.max(0,r5(r.total)-.5))} to ${f5(Math.min(q.m,r5(r.total)+.5))} marks</div></div><div class="meter"><i style="width:${p*100}%"></i></div></div><p>${b[3]}</p>
  ${r.items.map((it,i)=>`<div class="pr"><div class="ln"><span class="tick ${it.s>=it.m?'y':it.s>0?'':'n'}" ${it.s>0&&it.s<it.m?'style="background:#ffe48a"':''}>+${fmt(it.s)} / ${fmt(it.m)}</span><b>${esc(it.l)}</b></div><label class="sc"><input type="checkbox" data-s="${i}" ${self[i]?'checked':''}> I covered this point in my own words</label></div>`).join('')}
  <h4 style="margin-top:10px">Model answer</h4>${modelHTML(q)}<div class="tip"><b>Examiner tip:</b> ${esc(q.tip)}</div><p><button class="btn ghost" id="rt">Try again</button> ${o.next?'<button class="btn" id="nx">Next →</button>':''}</p></div>`;
  $$('[data-s]',host).forEach(c=>c.onchange=()=>{self[+c.dataset.s]=c.checked;draw2()});$('#rt',host).onclick=()=>renderQ(q,host,o);if(o.next)$('#nx',host).onclick=()=>o.next(r.total);return r};
 const draw2=()=>{const r=draw();rec(q,r.total,r)};
 $('#chk',host).onclick=()=>{if(o.exam){const r=evalTheory(q,$('textarea',host).value,[]);rec(q,r.total,r);o.onDone(r.total);return}draw2();$('#rs',host).scrollIntoView({behavior:'smooth',block:'start'})}}
V.rapid=()=>{
 const qs=shuf(MCQ);let i=0,s=0,streak=0,best=0;
 const step=()=>{if(i>=qs.length){const p=s/qs.length,b=band(p);$('#app').innerHTML=`<div class="qcard sticker"><h2>Rapid fire done ${b[2]}</h2><div class="score"><div class="num">${s}<small>/${qs.length}</small></div><div><span class="badge ${b[1]}">${b[0]}</span><div class="rng">Best streak: ${best}</div></div></div><p>${b[3]}</p><button class="btn" data-go="rapid">Play again</button> <button class="btn alt" data-go="studio">Case studies</button></div>`;return}
  $('#app').innerHTML=`<div class="qcard"><div class="row" style="margin-bottom:10px"><span class="badge">${i+1} / ${qs.length}</span><span class="badge t">🔥 Streak ${streak}</span><span class="badge ok">Score ${s}</span></div><div id="qh"></div></div>`;
  renderQ({...qs[i],type:'mcq',m:1},$('#qh'),{next:g=>{if(g){s++;streak++;best=Math.max(best,streak)}else streak=0;i++;step()}})};
 step()}
V.exam=()=>{
 const pick=(arr,n)=>shuf(arr).slice(0,n),six=Math.random()<.5?CASES.filter(c=>c.m===6):THEORY.filter(t=>t.m===6);
 const qs=[...pick(MCQ,4).map(x=>({...x,type:'mcq',m:1})),...pick(CASES.filter(c=>c.m===3),2),...pick(CASES.filter(c=>c.m===4),1),...pick(six,1)];
 let i=0,end=Date.now()+25*60000;const got={};
 const fin=()=>{clearInterval(window._tm);const tot=qs.reduce((a,q)=>a+(got[q.id]||0),0),p=tot/20,b=band(p);
  $('#app').innerHTML=`<div class="qcard"><div class="sticker"><h2>Mini paper result ${b[2]}</h2><div class="score"><div class="num">${f5(tot)}<small>/20</small></div><div><span class="badge ${b[1]}">${b[0]}</span><div class="rng">About ${Math.round(p*100)}% · likely range ${f5(Math.max(0,tot-1))} to ${f5(Math.min(20,tot+1))}</div></div><div class="meter"><i style="width:${p*100}%"></i></div></div><p>${b[3]}</p></div>
  ${qs.map(q=>{const g=got[q.id]||0,pp=g/q.m;return`<div class="sticker" style="margin-top:12px"><div class="ln"><span class="badge ${pp>=.75?'ok':pp>=.5?'mid':'low'}">${f5(g)} / ${q.m}</span><b>${esc(q.t||q.q.slice(0,60))}</b></div><details><summary>Model answer</summary>${modelHTML(q)}</details></div>`}).join('')}
  <p><button class="btn" data-go="exam">New paper</button> <button class="btn ghost" data-go="marks">My Marks</button></p></div>`};
 const step=()=>{if(i>=qs.length)return fin();const q=qs[i];
  $('#app').innerHTML=`<div class="qcard"><span class="timer" id="tm"></span><div class="row" style="margin-bottom:10px"><span class="badge">Question ${i+1} of ${qs.length}</span><span class="badge t">${q.m} marks</span></div><div id="qh"></div></div>`;
  renderQ(q,$('#qh'),{exam:true,onDone:g=>{got[q.id]=g;i++;step()}})};
 const tick=()=>{const l=Math.max(0,end-Date.now()),t=$('#tm');if(t)t.textContent='⏱ '+String(Math.floor(l/60000)).padStart(2,'0')+':'+String(Math.floor(l/1000)%60).padStart(2,'0');if(!l){fin()}};
 step();window._tm=setInterval(tick,500);tick()}
V.marks=()=>{
 const d=done(),p=d.max?d.got/d.max:0,b=band(p);
 const byM=[1,3,4,6].map(m=>{const k=Object.keys(ST.res).filter(x=>ST.res[x].max===m);const g=k.reduce((a,x)=>a+ST.res[x].got,0),mx=k.length*m;return{m,n:k.length,g,mx}});
 const pr=Object.entries(ST.pr).filter(([,v])=>v.tot).map(([id,v])=>({id,a:v.ok/v.tot,t:v.tot})).sort((a,b)=>a.a-b.a);
 const weak=Object.keys(ST.res).filter(x=>ST.res[x].got/ST.res[x].max<.7);
 const R=60,C=2*Math.PI*R;
 $('#app').innerHTML=`<h2 class="sec"><span>My marks</span></h2>${d.n?`<div class="row2"><div class="sticker"><div class="score"><svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="#ece7ff" stroke-width="16"/><circle cx="75" cy="75" r="${R}" fill="none" stroke="#6c4cf1" stroke-width="16" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 75 75)" stroke-linecap="round"/><text x="75" y="85" text-anchor="middle" font-size="32" fill="#1b1f4b">${Math.round(p*100)}%</text></svg><div><span class="badge ${b[1]}">${b[2]} ${b[0]}</span><p>${f5(d.got)} of ${d.max} marks from ${d.n} questions.</p><p class="muted small">${b[3]}</p></div></div></div>
 <div class="sticker"><h3>By question type</h3>${byM.map(x=>`<div class="bar"><b>${x.m} mark</b><div class="meter"><i style="width:${x.mx?x.g/x.mx*100:0}%"></i></div><span>${x.n?f5(x.g)+'/'+x.mx:'—'}</span></div>`).join('')}</div></div>
 <div class="row2" style="margin-top:16px"><div class="sticker"><h3>Weakest principles</h3>${pr.length?pr.slice(0,6).map(x=>`<div class="bar"><b style="width:auto;flex:1;font-size:15px">${esc(PN(x.id))}</b><span style="width:60px">${Math.round(x.a*100)}%</span></div>`).join(''):'<p class="muted">Attempt a few cases to see this.</p>'}</div>
 <div class="sticker"><h3>Retry these (below 70%)</h3>${weak.length?`<div class="ln">${weak.map(id=>{const q=QBYID[id];return`<button class="btn ghost" data-q="${id}">${esc(q.t||id)} · ${f5(ST.res[id].got)}/${q.m}</button>`}).join('')}</div>`:'<p class="muted">Nothing to retry. Great work.</p>'}</div></div>
 <p><button class="btn ghost" id="rs">Reset my marks</button></p>`:`<div class="sticker"><p>No attempts yet.</p><button class="btn" data-go="studio">Try a case</button></div>`}`;
 $$('[data-q]').forEach(b=>b.onclick=()=>{const q=QBYID[b.dataset.q];if(q.type==='mcq')return go('rapid');go(q.type==='case'?'case':'tcase',q.id)});
 const r=$('#rs');if(r)r.onclick=()=>{if(confirm('Clear all saved marks?')){ST={res:{},pr:{}};save();V.marks()}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t&&t.dataset.go)go(t.dataset.go)});
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
go('home');
</script></body></html>
