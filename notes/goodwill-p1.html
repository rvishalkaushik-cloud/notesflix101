<title>Goodwill Part 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff6e5;--card:#ffffff;--fg:#2b2a6b;--mute:#5d5c93;--line:#f0dcb6;--o:#f26b21;--am:#f9b91a;--teal:#3bb5a0;--navy:#2b2a6b;--soft:#fdeccb;--bad:#d6334a;--okbg:#d9f3ee;--badbg:#fde0e4;--ftbg:#fff0c2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c46;--card:#2a2965;--fg:#fff6e5;--mute:#c9c7ee;--line:#4140a0;--soft:#35338a;--okbg:#14524a;--badbg:#6a2236;--ftbg:#5a4a12;--bad:#ff8b9c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1c46;--card:#2a2965;--fg:#fff6e5;--mute:#c9c7ee;--line:#4140a0;--soft:#35338a;--okbg:#14524a;--badbg:#6a2236;--ftbg:#5a4a12;--bad:#ff8b9c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 Poppins,system-ui,sans-serif;margin:0;padding-block:0 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:860px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
main>*,section>*{min-width:0}
h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(32px,8vw,52px);font-weight:800}
h2{font-size:clamp(23px,5.5vw,31px);font-weight:800}
h3{font-size:19px;font-weight:600}
p{margin:0}.mute{color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:max(12px,env(safe-area-inset-top,0px));gap:10px}
.brand{font:800 18px 'Baloo 2';color:var(--o)}
.tg{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:8px 14px;font:500 14px Poppins;cursor:pointer;min-height:40px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--line);min-width:0}
.hero,.step{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;scroll-margin-top:12px}
.hero svg{width:100%;height:auto;max-height:230px}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cast .card{display:grid;gap:4px;padding:12px;text-align:center}
.av{width:54px;height:54px;border-radius:50%;margin:0 auto 2px;display:grid;place-items:center;font:800 24px 'Baloo 2';color:#fff}
.role{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px Poppins;border:2px solid var(--line);background:var(--card);color:var(--mute);border-radius:99px;padding:3px 10px;text-decoration:none;white-space:nowrap}
.chip.on{background:var(--o);border-color:var(--o);color:#fff;font-weight:600}
.sh{display:flex;gap:12px;align-items:center}
.num{flex:none;width:46px;height:46px;border-radius:14px;background:var(--o);color:#fff;display:grid;place-items:center;font:800 24px 'Baloo 2'}
.lab{font:600 12px Poppins;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer;min-height:46px}
.opt:hover{border-color:var(--am)}
.opt.ok{border-color:var(--teal);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--soft);font-size:15px}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.flip{perspective:800px;height:140px;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:center}
.fi{position:relative;display:block;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.fi>span{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:12px;border-radius:20px;border:2px solid var(--line);background:var(--card);overflow:auto;font-size:14px}
.fi>span:first-child{font:600 17px 'Baloo 2';box-shadow:0 5px 0 var(--line)}
.fi>span:first-child::after{content:"tap to flip";display:block;font:400 11px Poppins;color:var(--o);margin-top:4px}
.fi>span+span{transform:rotateY(180deg);background:var(--am);border-color:var(--am);color:#2b2a6b;font-weight:500}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:400px}
th,td{border:1.5px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
td.n{text-align:right;white-space:nowrap}
tr.t td{font-weight:700;background:var(--soft)}
.cap{font:600 14px Poppins;text-align:center;margin:8px 0 6px}
.btn{border:0;border-radius:99px;padding:10px 18px;font:600 15px Poppins;background:var(--o);color:#fff;cursor:pointer;min-height:44px}
.btn.alt{background:var(--card);color:var(--fg);border:2px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pool{display:flex;gap:8px;flex-wrap:wrap;min-height:44px}
.it{border:2px dashed var(--o);background:var(--card);color:var(--fg);border-radius:12px;padding:7px 12px;font:500 14px Poppins;cursor:pointer;min-height:40px}
.it.sel{background:var(--am);color:#2b2a6b;border-style:solid}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.zone{border:2px solid var(--line);border-radius:16px;padding:8px;min-height:90px;background:var(--soft);cursor:pointer}
.zone b{display:block;font:600 14px 'Baloo 2';margin-bottom:4px}
.zone .pl{background:var(--okbg);border-radius:10px;padding:3px 8px;margin:3px 0;font-size:13px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
input.in,select.in{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 8px;font:inherit;width:100%;min-width:84px;min-height:38px}
input.in.ok{border-color:var(--teal);background:var(--okbg)}input.in.bad{border-color:var(--bad);background:var(--badbg)}input.in.ft{border-color:var(--am);background:var(--ftbg)}
small.a{display:block;font-size:11.5px;color:var(--bad);margin-top:2px}
small.f{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
details{border-top:2px dashed var(--line);padding-top:8px;margin-top:6px}
summary{cursor:pointer;font-weight:600;color:var(--teal);min-height:34px}
.qh{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{font:600 11px Poppins;background:var(--soft);border-radius:99px;padding:2px 10px;letter-spacing:.04em}
.big{font:800 26px 'Baloo 2';color:var(--o)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.note{background:var(--soft);border-left:6px solid var(--am);border-radius:12px;padding:10px 14px;font-size:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:8px 14px;font:600 14px Poppins;cursor:pointer;min-height:40px}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .tab.on{background:var(--o);border-color:var(--o)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab.on{background:var(--o);border-color:var(--o)}}
.score{font:800 22px 'Baloo 2';color:var(--o)}
.sc{position:sticky;bottom:max(10px,env(safe-area-inset-bottom,0px));justify-self:center;background:var(--navy);color:#fff;border-radius:99px;padding:8px 18px;font:600 14px Poppins;z-index:5;box-shadow:0 4px 14px #0004}

.an{display:grid;gap:8px}
.an svg{width:100%;height:auto;border-radius:18px;background:var(--soft);display:block}
.an .cp{min-height:50px;font-weight:500;padding:2px 4px}
.an .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:5px;margin-left:4px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}.dots i.on{background:var(--o)}
svg .s{opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}@media (prefers-reduced-motion:reduce){svg .s{transition:none}}
svg .s.on{opacity:1;transform:none}
svg text.t{font:500 15px Poppins,sans-serif;fill:var(--fg)}
svg text.tw{font:600 13px Poppins,sans-serif;fill:#fff}
svg text.td{font:600 15px Poppins,sans-serif;fill:#2b2a6b}
svg text.big{font:800 22px 'Baloo 2',sans-serif;fill:var(--fg)}
.pie{width:210px;height:210px;border-radius:50%;margin:auto;border:4px solid var(--card)}
.legend{display:grid;gap:6px;font-size:14px}.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-2px}
tr.chg td{background:var(--ftbg)}
.tagc{font:600 11px Poppins;color:var(--o);margin-left:6px}

.read{display:grid;gap:8px;border-left:8px solid var(--teal)}
.read h3{color:var(--o)}
.read ul,.read ol{margin:0;padding-left:20px;display:grid;gap:4px}
.read .df{background:var(--soft);border-radius:12px;padding:8px 12px}
.read .je{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;background:var(--soft);border-radius:10px;padding:8px 10px;overflow-x:auto;white-space:pre}

.xpbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding:8px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border-bottom:2px solid var(--line)}
.xpbar .xl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.xpbar .xt{grid-column:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar .xf{height:100%;background:linear-gradient(90deg,var(--o),var(--am));transition:width .5s}
.xpbar .tg{grid-column:2;grid-row:1/3;padding:6px 10px;font-size:12px;min-height:36px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:99px;padding:10px 18px;font:600 14px Poppins;z-index:20;box-shadow:0 4px 14px #0005;max-width:90vw;text-align:center}
.df ul,.read .df{margin:0}
.wk{display:grid;gap:10px}
.wk .wst{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--card)}
.wk .wst[hidden]{display:none}
.wk .wst.new{animation:pop .5s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wk .wst.new{animation:none}}
.wk .wn{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:800 15px 'Baloo 2'}
.wk .wh{font:600 15px Poppins}
.wk .wb{font-size:15px;display:block;margin-top:3px;min-width:0}.wk .wb>*{margin-top:6px}
.calc{font-family:'IBM Plex Mono',ui-monospace,monospace;background:var(--soft);border-radius:10px;padding:7px 10px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.hl{background:var(--am);color:#2b2a6b;border-radius:6px;padding:0 6px;font-weight:600}
.bars{display:grid;gap:6px}
.bars .b{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.bars .tr{display:block;background:var(--line);border-radius:8px;height:16px;overflow:hidden}
.bars .f{display:block;height:16px;border-radius:8px}
.lab-steps{display:grid;gap:8px;margin-top:10px}
.lab-steps>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.lab-steps .wn{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:800 14px 'Baloo 2'}
table.gridt input.in{min-width:64px;padding:6px 4px}table.gridt td,table.gridt th{padding:6px 5px}
footer{text-align:center;color:var(--mute);font-size:13px;padding-top:6px}
</style>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const fm=n=>(n<0?'(':'')+Math.abs(Math.round(n)).toLocaleString('en-IN')+(n<0?')':'');
const STEPS=['What is goodwill?','Adjusting the profits','Average profit method','Build it yourself 1','Super profit method','Build it yourself 2','Capitalisation methods','Build it yourself 3','Recap and boss round'];
const NS=STEPS.length;
const mp=c=>`<div class="chips">${STEPS.map((s,i)=>`<a class="chip ${i+1===c?'on':''}" href="#s${i+1}">${i+1}. ${s}</a>`).join('')}</div>`;
const head=(n,t,sub)=>`${mp(n)}<div class="sh"><div class="num">${n}</div><div><div class="lab">Step ${n} of ${NS}</div><h2>${t}</h2></div></div>${sub?`<p class="mute">${sub}</p>`:''}`;
const OPTS=['a','b','c','d'];
function mcq(o){return `<div class="card q" data-ans="${o.ans}" ${o.score===false?'':'data-score="1"'}>
 <div class="qh">${o.predict?'<span class="badge" style="background:var(--am);color:#2b2a6b">THINK FIRST</span>':`<span class="badge">${o.tag} · ${o.marks||'1M'}</span>`}</div>
 <p>${o.q}</p>${o.opts.map((t,i)=>`<button class="opt" data-i="${i}">(${OPTS[i]}) ${t}</button>`).join('')}<div class="fb" hidden>${o.why}</div></div>`}
const pre=(q,opts,ans,why)=>mcq({predict:1,score:false,q,opts,ans,why});
const arq=(tag,a,r,ans,why)=>mcq({tag,q:`<b>Assertion (A):</b> ${a}<br><b>Reason (R):</b> ${r}`,opts:['Both A and R are true, and R is the correct explanation of A','Both A and R are true, but R is not the correct explanation of A','A is true, but R is false','A is false, but R is true'],ans,why});
const flips=a=>`<div class="flips">${a.map(([f,b])=>`<button class="flip"><span class="fi"><span>${f}</span><span>${b}</span></span></button>`).join('')}</div>`;
function two(dr,cr,h=['Dr.','Cr.']){const n=Math.max(dr.length,cr.length);let td=0,tc=0,r='';
 for(let i=0;i<n;i++){const a=dr[i]||['',''],b=cr[i]||['',''];td+=+a[1]||0;tc+=+b[1]||0;r+=`<tr><td>${a[0]}</td><td class="n">${a[1]===''?'':fm(a[1])}</td><td>${b[0]}</td><td class="n">${b[1]===''?'':fm(b[1])}</td></tr>`}
 return `<div class="tw"><table><tr><th>${h[0]} Particulars</th><th>₹</th><th>${h[1]} Particulars</th><th>₹</th></tr>${r}<tr class="t"><td>Total</td><td class="n">${fm(td)}</td><td>Total</td><td class="n">${fm(tc)}</td></tr></table></div>`}
const num=(tag,marks,q,ans)=>`<div class="card"><div class="qh"><span class="badge">${tag} · ${marks}</span></div><p>${q}</p><details><summary>Try it on paper first, then open the answer</summary>${ans}</details></div>`;
const castC=['#f26b21','#3bb5a0','#2b2a6b','#f9b91a','#d6568a','#6b5bd6'];
const cast=[['A','Aditya','Partner · Sunrise Bakery'],['M','Meher','Partner · Sunrise Bakery']];
const hero=`<svg viewBox="0 0 520 220" role="img" aria-label="Flat illustration of Sunrise Bakery with two partners"><rect x="90" y="70" width="340" height="120" rx="10" fill="#fdeccb" stroke="#f0dcb6" stroke-width="3"/><rect x="90" y="70" width="340" height="34" rx="10" fill="#f26b21"/><g fill="#fff6e5"><rect x="100" y="104" width="40" height="12" rx="6" fill="#d9540f"/><rect x="180" y="104" width="40" height="12" rx="6" fill="#d9540f"/><rect x="260" y="104" width="40" height="12" rx="6" fill="#d9540f"/><rect x="340" y="104" width="40" height="12" rx="6" fill="#d9540f"/></g><text x="260" y="94" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="20" fill="#fff6e5">SUNRISE BAKERY</text><rect x="120" y="130" width="100" height="60" rx="8" fill="#3bb5a0"/><circle cx="150" cy="156" r="14" fill="#f9b91a"/><circle cx="190" cy="152" r="12" fill="#f9b91a"/><rect x="300" y="126" width="90" height="64" rx="8" fill="#2b2a6b"/><path d="M315 160 a15 15 0 0 1 60 0z" fill="#f9b91a"/><circle cx="460" cy="40" r="22" fill="#f9b91a"/><g transform="translate(40,92)"><circle cx="20" cy="14" r="13" fill="#f6c9a0"/><rect x="4" y="28" width="32" height="46" rx="12" fill="#f26b21"/><text x="20" y="92" text-anchor="middle" font-family="Poppins" font-size="12" fill="#2b2a6b">Aditya</text></g><g transform="translate(450,92)"><circle cx="20" cy="14" r="13" fill="#e8b48a"/><rect x="4" y="28" width="32" height="46" rx="12" fill="#3bb5a0"/><text x="20" y="92" text-anchor="middle" font-family="Poppins" font-size="12" fill="#2b2a6b">Meher</text></g></svg>`;


/* ======== XP ======== */
const LV=[[0,'Rookie'],[250,'Learner'],[600,'Ledger Keeper'],[1100,'Valuer'],[1700,'Goodwill Pro'],[2300,'Goodwill Master']];
let ST={xp:0,got:{},best:{}};
try{const r=localStorage.getItem('g1xp');if(r){const o=JSON.parse(r);if(o&&typeof o.xp==='number')ST=Object.assign(ST,o)}}catch(e){}
const save=()=>{try{localStorage.setItem('g1xp',JSON.stringify(ST))}catch(e){}};
const lvOf=x=>{let i=0;LV.forEach((l,k)=>{if(x>=l[0])i=k});return i};
function drawXP(){const i=lvOf(ST.xp),cur=LV[i],nx=LV[i+1];const pct=nx?Math.round((ST.xp-cur[0])/(nx[0]-cur[0])*100):100;
 $('#xpb').innerHTML=`<div class="xl"><b>Level ${i+1} · ${cur[1]}</b><span>⭐ ${ST.xp} XP${nx?` · ${nx[0]-ST.xp} to next`:' · MAX'}</span></div><div class="xt"><div class="xf" style="width:${pct}%"></div></div><button class="tg" id="th">Light / Dark</button>`;$('#th').onclick=()=>{const r=document.documentElement,d=r.getAttribute('data-theme');const dark=d?d==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.setAttribute('data-theme',dark?'light':'dark')}}
let tt=null;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
function xp(id,n,label){if(ST.got[id]||n<=0)return;ST.got[id]=1;const before=lvOf(ST.xp);ST.xp+=n;save();drawXP();const after=lvOf(ST.xp);
 toast(after>before?`🎉 Level up! You are now ${LV[after][1]}`:`+${n} XP ${label||''}`)}

/* ======== ENGINE ======== */
const QS={};
const sumK=(v,ks)=>ks.reduce((s,k)=>s+v(k),0);
const fd=n=>Number.isInteger(n)?(n<0?'−':'')+fm(Math.abs(n)):String(n);
function cellHTML(c){
 if(c===''||c==null)return '';
 if(typeof c==='number')return fd(c);
 if(c.g!=null)return fd(c.g);
 return `<input class="in" type="text" inputmode="decimal" autocomplete="off" data-k="${c.k}" aria-label="your answer">`;
}
function blockHTML(b){
 if(b.t==='grid')return `<div class="cap">${b.title}</div><div class="tw"><table class="gridt" style="min-width:0"><tr><th>Particulars</th>${b.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${b.rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(c=>`<td class="n">${cellHTML(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 if(b.t==='line')return `<div class="row" style="margin:10px 0 4px"><span style="flex:1;min-width:200px"><b>${b.label}</b></span><span style="width:150px">${cellHTML(b.cell)}</span></div>`;
 if(b.t==='rows'){return `<div class="cap">${b.title}</div><div class="tw"><table><tr><th>Particulars</th><th>Working</th><th>${b.unit||'₹'}</th></tr>${b.rows.map(r=>`<tr><td>${r[0]}</td><td class="mute">${r[1]||''}</td><td class="n">${cellHTML(r[2])}</td></tr>`).join('')}</table></div>`}
 const n=Math.max(b.dr.length,b.cr.length);let r='';
 for(let i=0;i<n;i++){const a=b.dr[i]||['',''],c=b.cr[i]||['',''];r+=`<tr><td>${a[0]}</td><td class="n">${cellHTML(a[1])}</td><td>${c[0]}</td><td class="n">${cellHTML(c[1])}</td></tr>`}
 r+=`<tr class="t"><td>Total</td><td>${cellHTML(b.td)}</td><td>Total</td><td>${cellHTML(b.tc)}</td></tr>`;

function mark(card,q){
 const inputs=[...card.querySelectorAll('input.in')];

 let tot=0,got=0,okn=0,ftn=0;card.querySelectorAll('small').forEach(s=>s.remove());
 inputs.forEach(el=>{const c=q.cells[el.dataset.k],w=c.w==null?1:c.w,val=v(c.k);tot+=w;
  let st='bad';if(Math.abs(val-c.a)<.005)st='ok';else if(c.ft&&!isNaN(val)){const f=c.ft(v);if(!isNaN(f)&&Math.abs(val-f)<.5)st='ft'}
  el.className='in '+st;el.disabled=true;
  if(st==='ok'){got+=w;okn++}else if(st==='ft'){got+=w;ftn++;el.insertAdjacentHTML('afterend',`<small class="f">✓ follows your earlier figure. Correct: ${fd(c.a)}</small>`)}
  else el.insertAdjacentHTML('afterend',`<small class="a">Answer: ${fd(c.a)}</small>`)});
 const m=Math.round(q.marks*got/tot*2)/2;

 const r=card.querySelector('.by-res');r.hidden=false;
 r.innerHTML=`<div class="score">${m} / ${q.marks} marks${gain?` · +${gain} XP`:''}</div><p>${okn} of ${inputs.length} boxes exactly right${ftn?`, ${ftn} more earned follow-through marks (yellow)`:''}. Wrong boxes show the right answer below them.</p><details open><summary>Full working</summary>${q.work}</details>`}

function mkApp(c){
 const R=c.ratio,sr=R.reduce((a,b)=>a+b,0),iod=c.iod||[],iodSum=iod.reduce((s,x)=>s+x.a,0),avail=c.np+iodSum,claims=c.items.reduce((s,x)=>s+x.due,0),short=avail<claims;
 const f=short?avail/claims:1,div=short?0:avail-claims,amt={},iodK=iod.map(x=>x.k);
 const pre=[...(c.pre||[])];
 if(short){pre.push({t:'line',label:'Working: total appropriations due (₹)',cell:{k:'claims',a:claims}});
  pre.push({t:'line',label:'Working: profit available (net profit + interest on drawings) (₹)',cell:{k:'av',a:avail,ft:v=>c.np+iodK.reduce((s,k)=>s+v(k),0)}})}
 const dr=c.items.map(x=>{const a=x.due*f;amt[x.k]=a;return [x.l,{k:x.k,a,ft:short?(v=>x.due*v('av')/v('claims')):null}]});
 const shk=[];
 if(!short)c.names.forEach((n,i)=>{const a=div*R[i]/sr;amt['sh'+i]=a;shk.push('sh'+i);dr.push([`To ${n}'s ${c.acct} A/c (${R[i]}/${sr})`,{k:'sh'+i,a,ft:v=>v('div')*R[i]/sr}])});
 const cr=[['By Net Profit',{g:c.np}]];
 iod.forEach(x=>{amt[x.k]=x.a;cr.push([x.l,c.iodIn?{k:x.k,a:x.a}:{g:x.a,gk:x.k}])});
 const ik=c.items.map(x=>x.k);
 const blocks=[...pre,{t:'two',title:c.title||'Profit and Loss Appropriation Account for the year ended 31st March 2026',dr,cr,
  td:{k:'tot',a:avail,ft:v=>sumK(v,ik)+sumK(v,shk),w:.5},tc:{k:'tot2',a:avail,ft:v=>c.np+sumK(v,iodK),w:.5}}];
 if(!short&&c.items.length)blocks.push({t:'line',label:'Working: profit left to share ('+R.join(' : ')+')',cell:{k:'div',a:div,ft:v=>(c.np+sumK(v,iodK))-sumK(v,ik)}});
 return {blocks,amt,names:c.names,R,sr,loss:false}}
function mkLoss(c){
 const R=c.ratio,sr=R.reduce((a,b)=>a+b,0),iod=c.iod||[],iodSum=iod.reduce((s,x)=>s+x.a,0),loss=-c.np,net=loss-iodSum,amt={};
 const dr=[['To Net Loss (from P&L A/c)',{g:loss}]],cr=[];
 iod.forEach(x=>{amt[x.k]=x.a;cr.push([x.l,{g:x.a,gk:x.k}])});
 c.names.forEach((n,i)=>{const a=net*R[i]/sr;amt['sh'+i]=a;cr.push([`By ${n}'s ${c.acct} A/c (share of loss, ${R[i]}/${sr})`,{k:'sh'+i,a,ft:null}])});
 return {blocks:[{t:'two',title:'Profit and Loss Appropriation Account for the year ended 31st March 2026',dr,cr,td:{g:loss},tc:{k:'tot2',a:loss,w:.5}}],amt,names:c.names,R,sr,loss:true}}
function mkLedger2(ap,i,p){
 const f=p.method==='fixed',nm=ap.names[i],A=ap.amt,dr=[],cr=[],ck=[],dk=[];let sd=0,sc=0;
 if(p.open&&p.open.dr){dr.push(['To Balance b/d',{g:p.open.dr}]);sd+=p.open.dr}
 if(p.open&&p.open.cr){cr.push(['By Balance b/d',{g:p.open.cr}]);sc+=p.open.cr}
 if(p.draw){dr.push(['To Drawings',{g:p.draw}]);sd+=p.draw}
 const gdr=sd,gcr=sc;
 [['ioc','By Interest on Capital'],['sal','By Salary'],['com','By Commission']].forEach(([k,l])=>{if(A[k+i]!==undefined){const kk='L'+i+k;cr.push([l,{k:kk,a:A[k+i],ft:v=>v(k+i)}]);sc+=A[k+i];ck.push(kk)}});
 if(!ap.loss&&A['sh'+i]>0){const kk='L'+i+'sh';cr.push(['By Profit share',{k:kk,a:A['sh'+i],ft:v=>v('sh'+i)}]);sc+=A['sh'+i];ck.push(kk)}
 if(A['iod'+i]){const kk='L'+i+'iod';dr.push(['To Interest on Drawings',{k:kk,a:A['iod'+i],ft:v=>v('iod'+i)}]);sd+=A['iod'+i];dk.push(kk)}
 if(ap.loss){const kk='L'+i+'ls';dr.push(['To Share of loss',{k:kk,a:A['sh'+i],ft:v=>v('sh'+i)}]);sd+=A['sh'+i];dk.push(kk)}
 const cd=sc-sd;const kc='cd'+i;
 if(cd>=0)dr.push(['To Balance c/d',{k:kc,a:cd,ft:v=>gcr+sumK(v,ck)-(gdr+sumK(v,dk))}]);
 else cr.push(['By Balance c/d',{k:kc,a:-cd,ft:v=>(gdr+sumK(v,dk))-(gcr+sumK(v,ck))}]);
 const T=cd>=0?sc:sd;
 return {t:'two',title:`${nm}'s ${f?'Current':'Capital'} A/c`,dr,cr,
  td:{k:'dt'+i,a:T,ft:v=>gdr+sumK(v,dk)+(cd>=0?v(kc):0),w:.5},tc:{k:'ct'+i,a:T,ft:v=>gcr+sumK(v,ck)+(cd<0?v(kc):0),w:.5}}}

const anim=id=>{const a=ANS[id];return `<div class="card an" id="${id}"><div class="lab">▶ Watch first · +10 XP</div><svg viewBox="0 0 520 230" role="img" aria-label="${a.alt}">${a.svg}</svg><div class="cp"></div><div class="ctl"><button class="btn sm" data-a="play">▶ Play</button><button class="btn alt sm" data-a="next">Next ›</button><div class="dots">${a.caps.map(()=>'<i></i>').join('')}</div></div></div>`};
const read=h=>`<div class="card read">${h}</div>`;
const choose=(id,rows)=>`<div class="ch" id="${id}">${rows.map((r,i)=>`<div style="border-top:1.5px solid var(--line);padding:8px 0"><div>${r.q}</div><div class="row" style="margin-top:6px">${r.o.map((o,j)=>`<button class="btn alt sm" data-i="${i}" data-j="${j}">${o}</button>`).join('')}</div><div class="mute" id="${id}r${i}" style="margin-top:4px"></div></div>`).join('')}</div>`;
const walk=(id,title,prob,steps)=>`<div class="card wk" id="${id}"><div class="lab">🧭 Solve it with me · +10 XP</div><h3>${title}</h3><div class="note">${prob}</div>${steps.map((s,i)=>`<div class="wst" ${i?'hidden':''}><span class="wn">${i+1}</span><div><div class="wh">${s.h}</div><div class="wb">${s.b}</div></div></div>`).join('')}<div class="row"><button class="btn sm" data-w="next">Next step ›</button><button class="btn alt sm" data-w="all">Show all</button><button class="btn alt sm" data-w="reset">↺ Restart</button><span class="mute" data-w="cnt"></span></div></div>`;
const calc=h=>`<div class="calc">${h}</div>`;
const hl=h=>`<span class="hl">${h}</span>`;
const bars=rows=>`<div class="bars">${rows.map(r=>`<div class="b"><span>${r[0]}</span><span class="tr"><span class="f" style="width:${Math.max(2,Math.round(r[1]/r[2]*100))}%;background:${r[3]||'var(--o)'}"></span></span><b>${r[4]}</b></div>`).join('')}</div>`;
const tb=(head,rows,tot)=>`<div class="tw"><table style="min-width:0"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}${tot?`<tr class="t">${tot.map((c,i)=>`<td${i?' class="n"':''}>${c}</td>`).join('')}</tr>`:''}</table></div>`;

const WALK={};
WALK.av=walk('wav','Simple average profit','Sunrise Bakery earned: ₹40,000, ₹50,000, ₹60,000, ₹30,000 and ₹70,000 in five years. Goodwill is valued at <b>3 years\' purchase of average profit</b>.',[
 {h:'Add the profits',b:`${calc('40,000 + 50,000 + 60,000 + 30,000 + 70,000 = 2,50,000')}`},
 {h:'Divide by the number of years',b:`${calc('2,50,000 ÷ 5 = 50,000')}Average profit = ${hl('₹50,000')}.`},
 {h:'Multiply by the years\' purchase',b:`${calc('Goodwill = 50,000 × 3 = ₹1,50,000')}<div class="note">"3 years' purchase" means the buyer pays 3 years of the average profit for the reputation.</div>`}]);
WALK.wa=walk('wwa','Weighted average profit','Profits: <b>₹30,000, ₹45,000, ₹60,000</b> (oldest to latest). Weights <b>1, 2, 3</b>. Goodwill at 4 years\' purchase of the weighted average.',[
 {h:'Why weights?',b:`The latest year shows the present strength of the business better, so it gets the <b>highest weight</b>.`},
 {h:'Multiply each profit by its weight',b:`${tb(['Year','Profit','Weight','Product'],[['1','30,000','1','30,000'],['2','45,000','2','90,000'],['3','60,000','3','1,80,000']],['Total','','6','3,00,000'])}`},
 {h:'Divide the products by the total of the weights',b:`${calc('3,00,000 ÷ 6 = 50,000')}`},
 {h:'Goodwill',b:`${calc('50,000 × 4 = ₹2,00,000')}`}]);
WALK.ad=walk('wad','Adjusting the profits first','Profits: Year 1 ₹30,000; Year 2 ₹36,000; Year 3 ₹42,000. The <b>closing stock of Year 2 was undervalued by ₹5,000</b>. Goodwill at 5 years\' purchase of average profit.',[
 {h:'Fix Year 2',b:`The closing stock was too low, so the Year 2 profit was ${hl('too low')} by 5,000.${calc('36,000 + 5,000 = 41,000')}`},
 {h:'Fix Year 3',b:`The same stock is the <b>opening stock of Year 3</b>. It was too low, so Year 3\'s cost was too low and its profit ${hl('too high')} by 5,000.${calc('42,000 − 5,000 = 37,000')}`},
 {h:'Average the adjusted profits',b:`${tb(['','Y1','Y2','Y3'],[['Reported','30,000','36,000','42,000'],['Adjustment','','+5,000','−5,000']],['Adjusted','30,000','41,000','37,000'])}${calc('(30,000 + 41,000 + 37,000) ÷ 3 = 36,000')}`},
 {h:'Goodwill',b:`${calc('36,000 × 5 = ₹1,80,000')}<div class="note">A stock error only moves profit from one year to the next. The total of both years does not change.</div>`}]);
WALK.sp=walk('wsp','Super profit method','Capital employed (assets − outside liabilities): assets <b>₹10,50,000</b> (excluding goodwill), outside liabilities <b>₹2,50,000</b>. Normal rate of return <b>10%</b>. Average profit <b>₹90,000</b>. Goodwill at <b>3 years\' purchase of super profit</b>.',[
 {h:'Capital employed',b:`${calc('10,50,000 − 2,50,000 = 8,00,000')}`},
 {h:'Normal profit',b:`${calc('8,00,000 × 10% = 80,000')}This is what an ordinary business with this capital would earn.`},
 {h:'Super profit',b:`${bars([['Normal',80,90,'var(--teal)','₹80,000'],['Actual',90,90,'var(--navy)','₹90,000']])}${calc('90,000 − 80,000 = 10,000')}`},
 {h:'Goodwill',b:`${calc('10,000 × 3 = ₹30,000')}<div class="note">If the average profit is <b>less</b> than the normal profit, there is no super profit and no goodwill.</div>`}]);
WALK.cp=walk('wcp','Capitalisation of average profit','Average profit <b>₹1,00,000</b>. Normal rate of return <b>10%</b>. Assets (excluding goodwill) <b>₹10,00,000</b>; outside liabilities <b>₹1,80,000</b>.',[
 {h:'Capitalise the average profit',b:`If 10% is a normal return, the business is worth the capital that earns ₹1,00,000 at 10%.${calc('1,00,000 × 100 ÷ 10 = 10,00,000')}`},
 {h:'Find the net assets (capital employed)',b:`${calc('10,00,000 − 1,80,000 = 8,20,000')}`},
 {h:'Goodwill is the difference',b:`${bars([['Capitalised value',10,10,'var(--navy)','₹10,00,000'],['Net assets',8.2,10,'var(--teal)','₹8,20,000']])}${calc('10,00,000 − 8,20,000 = ₹1,80,000')}`}]);
WALK.cs=walk('wcs','Capitalisation of super profit','Average profit <b>₹72,000</b>, capital employed <b>₹5,00,000</b>, normal rate of return <b>12%</b>.',[
 {h:'Normal profit and super profit',b:`${calc('Normal profit = 5,00,000 × 12% = 60,000\nSuper profit = 72,000 − 60,000 = 12,000')}`},
 {h:'Capitalise the super profit',b:`${calc('12,000 × 100 ÷ 12 = ₹1,00,000')}`},
 {h:'Check with the other method',b:`${calc('Capitalised average profit = 72,000 × 100 ÷ 12 = 6,00,000\nLess capital employed        = 5,00,000\nGoodwill                     = 1,00,000 ✓')}${hl('Both methods always agree.')} The extra capital value comes only from the super profit.`}]);
const MQ={};
MQ.s1=[mcq({tag:'Q1.1',q:'Goodwill is:',opts:['A fictitious asset','An intangible asset','A tangible fixed asset','A current asset'],ans:1,why:'(b). Goodwill has value but no physical form, so it is intangible. It is not fictitious, because it can be sold with the business.'}),
mcq({tag:'Q1.2',q:'Which of these does NOT affect the value of goodwill?',opts:['Location of the business','Efficiency of management','The colour of the shop signboard','Special advantages such as patents'],ans:2,why:'(c). Location, management and special advantages all raise earning power. A signboard\'s colour does not.'}),
mcq({tag:'Q1.3',q:'As per AS-26, goodwill is recorded in the books only when it is:',opts:['Self-generated','Purchased','Estimated by the partners','Valued by any method'],ans:1,why:'(b). Only purchased goodwill is recorded. Self-generated goodwill is not recorded.'}),
mcq({tag:'Q1.4',q:'The goodwill of a partnership firm is usually NOT valued when:',opts:['A new partner is admitted','A partner retires','A partner draws cash for personal use','The profit sharing ratio changes'],ans:2,why:'(c). Drawings do not change the partners\' rights. The other three events do.'}),
mcq({tag:'Q1.5',q:'A famous brand, a busy market location and loyal customers mainly increase:',opts:['Fixed assets','Goodwill','Outside liabilities','Drawings'],ans:1,why:'(b). They raise the firm\'s earning power, which is goodwill.'}),
mcq({tag:'Q1.6',q:'The methods of valuing goodwill in the syllabus are:',opts:['Average profit, super profit and capitalisation','Only the average profit method','Straight line and written down value','Cost method only'],ans:0,why:'(a). Average profit (simple or weighted), super profit, and capitalisation (of average profit or of super profit).'}),
arq('Q1.7','The balance sheet of an old, well-known firm may not show any goodwill.','Only purchased goodwill is recorded in the books. Self-generated goodwill is not.',0,'(a). The firm built its reputation itself, so no goodwill appears in the books.')].join('');
MQ.s2=[mcq({tag:'Q2.1',q:'The profits of three years are ₹30,000, ₹40,000 and ₹50,000. Goodwill at 2 years\' purchase of average profit is:',opts:['₹80,000','₹1,20,000','₹40,000','₹60,000'],ans:0,why:'(a). Average = 1,20,000 ÷ 3 = 40,000. Goodwill = 40,000 × 2 = ₹80,000.'}),
mcq({tag:'Q2.2',q:'Profits ₹24,000, ₹36,000 and ₹42,000 with weights 1, 2 and 3. The weighted average profit is:',opts:['₹34,000','₹37,000','₹36,000','₹40,000'],ans:1,why:'(b). 24,000 + 72,000 + 1,26,000 = 2,22,000. Divide by 6 = ₹37,000.'}),
mcq({tag:'Q2.3',q:'An abnormal loss by fire included in a year\'s profit is:',opts:['Added back to that year\'s profit','Deducted from that year\'s profit','Ignored','Added to the next year\'s profit'],ans:0,why:'(a). It will not repeat, so the year\'s normal profit is higher.'}),
mcq({tag:'Q2.4',q:'A non-recurring gain included in a year\'s profit is:',opts:['Added back','Deducted from the profit','Ignored','Doubled'],ans:1,why:'(b). It will not repeat, so it is deducted to find the normal profit.'}),
mcq({tag:'Q2.5',q:'The closing stock of a year was undervalued by ₹5,000. The profit of the <b>next</b> year:',opts:['Decreases by ₹5,000 on adjustment','Increases by ₹5,000 on adjustment','Does not change','Doubles'],ans:0,why:'(a). The next year\'s opening stock was too low, so its profit was too high. Deduct ₹5,000.'}),
mcq({tag:'Q2.6',q:'In the weighted average method, the highest weight is given to:',opts:['The oldest year','The most recent year','The middle year','The year of highest profit'],ans:1,why:'(b). The latest year shows the present strength of the business.'}),
arq('Q2.7','Capital expenditure wrongly charged to the Profit and Loss A/c is added back to profit while valuing goodwill.','It makes the profit of that year too low.',0,'(a). A capital item is not an expense. Charging it reduced the profit wrongly.')].join('');
MQ.s4=[mcq({tag:'Q4.1',q:'Normal profit is calculated as:',opts:['Capital employed × normal rate of return','Average profit × normal rate of return','Capital employed ÷ normal rate of return','Super profit × years\' purchase'],ans:0,why:'(a). It is the return an ordinary firm would earn on the same capital.'}),
mcq({tag:'Q4.2',q:'Capital employed ₹5,00,000, normal rate of return 10%, average profit ₹58,000. The super profit is:',opts:['₹8,000','₹58,000','₹50,000','₹(8,000)'],ans:0,why:'(a). Normal profit 50,000. Super profit = 58,000 − 50,000 = ₹8,000.'}),
mcq({tag:'Q4.3',q:'There is no super profit when:',opts:['Average profit is more than normal profit','Average profit is less than normal profit','The normal rate of return is high','Years\' purchase is large'],ans:1,why:'(b). With average profit below normal profit, goodwill is nil.'}),
mcq({tag:'Q4.4',q:'Super profit ₹12,000 and goodwill at 3 years\' purchase of super profit is:',opts:['₹36,000','₹4,000','₹1,20,000','₹12,000'],ans:0,why:'(a). 12,000 × 3 = ₹36,000.'}),

mcq({tag:'Q4.6',q:'Assets ₹9,00,000 (excluding goodwill), outside liabilities ₹1,50,000 and normal rate of return 10%. The normal profit is:',opts:['₹90,000','₹75,000','₹60,000','₹1,05,000'],ans:1,why:'(b). Capital employed = 7,50,000. Normal profit = ₹75,000.'}),
arq('Q4.7','The normal rate of return is applied on capital employed to find normal profit.','Normal profit is what a similar firm would earn on the same capital.',0,'(a). That is why goodwill is measured as the profit above normal profit.')].join('');
MQ.s6=[mcq({tag:'Q6.1',q:'The capitalised value of average profit is:',opts:['Average profit × 100 ÷ normal rate of return','Average profit × normal rate of return ÷ 100','Average profit × years\' purchase','Capital employed × normal rate of return'],ans:0,why:'(a). It is the capital that earns the average profit at the normal rate.'}),
mcq({tag:'Q6.2',q:'Average profit ₹60,000 and normal rate of return 12%. The capitalised value is:',opts:['₹5,00,000','₹7,20,000','₹7,200','₹50,000'],ans:0,why:'(a). 60,000 × 100 ÷ 12 = ₹5,00,000.'}),
mcq({tag:'Q6.3',q:'Goodwill by capitalisation of average profit is:',opts:['Capitalised value − net assets','Net assets − capitalised value','Average profit × 100','Super profit × years\' purchase'],ans:0,why:'(a). The value the firm should have, less what its assets actually give.'}),
mcq({tag:'Q6.4',q:'Super profit ₹15,000 and normal rate of return 10%. Goodwill by capitalisation of super profit is:',opts:['₹1,50,000','₹15,000','₹1,500','₹30,000'],ans:0,why:'(a). 15,000 × 100 ÷ 10 = ₹1,50,000.'}),
mcq({tag:'Q6.5',q:'The two capitalisation methods give:',opts:['The same goodwill','Different goodwill always','Goodwill only if super profit is nil','Zero goodwill'],ans:0,why:'(a). Capitalised value − capital employed = super profit × 100 ÷ rate.'}),
mcq({tag:'Q6.6',q:'If the capitalised value is less than the net assets, goodwill is:',opts:['Nil','A negative asset','The difference, shown as an asset','Doubled'],ans:0,why:'(a). There is no goodwill when earning power is below normal.'}),

MQ.b=[mcq({tag:'B1',q:'Capital employed ₹6,00,000, normal rate 10%, average profit ₹75,000. Goodwill at 4 years\' purchase of super profit is:',opts:['₹60,000','₹75,000','₹15,000','₹3,00,000'],ans:0,why:'(a). Normal profit 60,000. Super profit 15,000. 15,000 × 4 = ₹60,000.'}),
mcq({tag:'B2',q:'Same data. Goodwill by capitalisation of super profit is:',opts:['₹1,50,000','₹60,000','₹1,00,000','₹90,000'],ans:0,why:'(a). 15,000 × 100 ÷ 10 = ₹1,50,000.'}),
mcq({tag:'B3',q:'Same data. Goodwill by capitalisation of average profit is:',opts:['₹1,50,000','₹1,35,000','₹75,000','₹6,00,000'],ans:0,why:'(a). 75,000 × 100 ÷ 10 = 7,50,000. Less 6,00,000 = ₹1,50,000.'}),
mcq({tag:'B4',q:'Which method needs the normal rate of return but no "years\' purchase"?',opts:['Capitalisation','Average profit','Super profit','Weighted average'],ans:0,why:'(a). Capitalisation divides by the rate instead of multiplying by years.'}),
mcq({tag:'B5',q:'Profits ₹30,000, ₹42,000 and ₹54,000 with weights 1, 2 and 3. The weighted average is:',opts:['₹42,000','₹46,000','₹45,000','₹48,000'],ans:1,why:'(b). 30,000 + 84,000 + 1,62,000 = 2,76,000. ÷ 6 = ₹46,000.'}),
arq('B6','Goodwill is recorded in the books of a firm only when it is purchased.','Self-generated goodwill cannot be measured reliably.',0,'(a). That is the AS-26 rule and its reason.'),
mcq({tag:'B7',q:'A year\'s profit of ₹70,000 is after an abnormal loss of ₹12,000 by fire. The adjusted profit is:',opts:['₹82,000','₹58,000','₹70,000','₹94,000'],ans:0,why:'(a). Add back the abnormal loss: 70,000 + 12,000 = ₹82,000.'}),
mcq({tag:'B8',q:'Average profit ₹48,000, normal rate 12% and net assets ₹3,60,000. Goodwill by capitalisation is:',opts:['₹40,000','₹4,00,000','₹3,60,000','₹57,600'],ans:0,why:'(a). 48,000 × 100 ÷ 12 = 4,00,000. Less 3,60,000 = ₹40,000.'})].join('');
WALK.why=walk('wwhy','Why abnormal items are adjusted','Goodwill is the value of a firm\'s <b>usual</b> earning power. A one-time event tells us nothing about what the firm will earn <b>next</b> year.',[
 {h:'The idea',b:`A buyer pays for the profit the firm <b>normally</b> makes. So we remove anything that happened once, whether it helped or hurt.`},
 {h:'An abnormal GAIN makes the firm look better than it is',b:`Profits: 40,000, 40,000 and 60,000. The Year 3 profit includes a one-time <b>lottery gain of ₹20,000</b>.${calc('Reported average = 1,40,000 ÷ 3 = 46,667\nGoodwill at 3 years = 1,40,000')}The buyer would be paying for a lottery that will not come again.`},
 {h:'So DEDUCT the gain',b:`${calc('Year 3 normal profit = 60,000 − 20,000 = 40,000\nAverage = 1,20,000 ÷ 3 = 40,000\nGoodwill at 3 years = 1,20,000')}Ignoring the gain would ${hl('overstate goodwill by ₹20,000')}.`},
 {h:'An abnormal LOSS makes the firm look worse than it is',b:`Profits: 40,000, 40,000 and 20,000. The Year 3 profit is <b>after a fire loss of ₹20,000</b>.${calc('Reported average = 1,00,000 ÷ 3 = 33,333\nGoodwill at 3 years = 1,00,000')}The firm would be punished for a fire that will not happen again.`},
 {h:'So ADD BACK the loss',b:`${calc('Year 3 normal profit = 20,000 + 20,000 = 40,000\nAverage = 40,000\nGoodwill at 3 years = 1,20,000')}Ignoring the loss would ${hl('understate goodwill by ₹20,000')}.<div class="note"><b>Remember:</b> abnormal <b>gain → deduct</b>. Abnormal <b>loss → add back</b>. Always ask: what would the profit have been without this one-off?</div>`}]);
WALK.nm=walk('wnm','Normal profit given separately','<b>Year 1:</b> profit ₹55,000 including an abnormal gain of ₹5,000. <b>Year 2:</b> <b>normal profit ₹48,000</b>, with an abnormal loss of ₹7,000 shown separately. <b>Year 3:</b> profit ₹50,000 after an abnormal loss of ₹2,000. Goodwill at 2 years\' purchase of average normal profit.',[
 {h:'Year 1: the gain is inside the profit',b:`${calc('55,000 − 5,000 = 50,000')}`},
 {h:'Year 2: the normal profit is already given',b:`The normal profit is the profit <b>without</b> abnormal items. Use ${hl('48,000')} as it is.<div class="note">Do not add the ₹7,000 loss to a normal profit. It is already left out.</div>`},
 {h:'Year 3: the loss is already charged',b:`${calc('50,000 + 2,000 = 52,000')}`},
 {h:'Average and goodwill',b:`${calc('(50,000 + 48,000 + 52,000) ÷ 3 = 50,000\nGoodwill = 50,000 × 2 = ₹1,00,000')}<div class="note"><b>Do not confuse:</b> "normal profit" here is a rupee amount of a year. The <b>normal rate of return</b> is a percentage used later to find normal profit in the super profit method.</div>`}]);
WALK.rem=walk('wrem','Annual remuneration in a weighted average','Profits <b>before</b> the manager\'s remuneration: ₹50,000, ₹60,000 and ₹70,000. The manager gets <b>₹12,000 every year</b>, not yet charged. Weights 1, 2, 3. Goodwill at 3 years\' purchase.',[
 {h:'Why every year?',b:`The remuneration is a <b>recurring cost</b>. A buyer will pay it every year, so every year\'s profit is overstated by it. Deduct it from <b>each</b> year, <b>before</b> applying the weights.`},
 {h:'Adjust each year',b:`${tb(['','Year 1','Year 2','Year 3'],[['Reported profit','50,000','60,000','70,000'],['Less: remuneration','(12,000)','(12,000)','(12,000)']],['Adjusted','38,000','48,000','58,000'])}`},
 {h:'Apply the weights',b:`${tb(['Year','Adjusted','Weight','Product'],[['1','38,000','1','38,000'],['2','48,000','2','96,000'],['3','58,000','3','1,74,000']],['Total','','6','3,08,000'])}${calc('3,08,000 ÷ 6 = 51,333')}`},
 {h:'Goodwill',b:`${calc('51,333 × 3 = ₹1,54,000')}`},
 {h:'A quick check',b:`The weighted average before the remuneration is (50,000 + 1,20,000 + 2,10,000) ÷ 6 = 63,333. Take away 12,000 once: ${hl('51,333')}, the same. Deducting a fixed amount from every year is the same as deducting it once from the average.`}]);
WALK.cmb=walk('wcmb','One question, every adjustment','<b>Year 1:</b> profit ₹50,000 <b>including an abnormal gain of ₹8,000</b>. <b>Year 2:</b> profit ₹44,000 <b>after an abnormal loss of ₹6,000</b>; closing stock <b>undervalued by ₹5,000</b>. <b>Year 3:</b> <b>normal profit ₹52,000</b> (abnormal loss of ₹3,000 shown separately). <b>Year 4:</b> profit ₹60,000; closing stock <b>overvalued by ₹4,000</b>. Goodwill at <b>2 years\' purchase</b> of average profit.',[
 {h:'List what each year needs',b:`${tb(['Year','Items to deal with'],[['1','Abnormal gain inside → deduct'],['2','Abnormal loss charged → add back. Closing stock undervalued → add'],['3','Normal profit given → use it. Opening stock was undervalued (Year 2 closing) → deduct'],['4','Closing stock overvalued → deduct']])}`},
 {h:'Year 1',b:`${calc('50,000 − 8,000 = 42,000')}`},
 {h:'Year 2',b:`${calc('44,000 + 6,000 (loss) + 5,000 (closing stock) = 55,000')}`},
 {h:'Year 3',b:`The normal profit 52,000 is free of the abnormal loss. But the <b>opening stock</b> was undervalued by 5,000, so cost was too low and profit too <b>high</b>.${calc('52,000 − 5,000 = 47,000')}`},
 {h:'Year 4',b:`Its opening stock (Year 3 closing) was correct. Its own closing stock is overvalued, so profit is too high.${calc('60,000 − 4,000 = 56,000')}`},
 {h:'Average and goodwill',b:`${tb(['','Y1','Y2','Y3','Y4'],[['Adjusted profit','42,000','55,000','47,000','56,000']],['Total','','','','2,00,000'])}${calc('Average = 2,00,000 ÷ 4 = 50,000\nGoodwill = 50,000 × 2 = ₹1,00,000')}<div class="note">Stock errors only move profit between two years: +5,000 in Year 2 and −5,000 in Year 3 cancel out.</div>`}]);
WALK.sp2=walk('wsp2','Super profit with adjustments','Profits of three years: ₹52,000; ₹60,000 (<b>including an abnormal gain of ₹8,000</b>); ₹70,000, all <b>before partners\' salary of ₹10,000 a year</b>. Capital employed ₹4,00,000, normal rate of return 10%. Goodwill at 3 years\' purchase of super profit.',[
 {h:'Adjust every year first',b:`${tb(['','Y1','Y2','Y3'],[['Reported','52,000','60,000','70,000'],['Less: abnormal gain','','(8,000)',''],['Less: salary','(10,000)','(10,000)','(10,000)']],['Adjusted','42,000','42,000','60,000'])}`},
 {h:'Average adjusted profit',b:`${calc('1,44,000 ÷ 3 = 48,000')}`},
 {h:'Normal profit and super profit',b:`${calc('Normal profit = 4,00,000 × 10% = 40,000\nSuper profit = 48,000 − 40,000 = 8,000')}<div class="note">Always compare the <b>adjusted</b> average with the normal profit.</div>`},
 {h:'Goodwill',b:`${calc('8,000 × 3 = ₹24,000')}`}]);
WALK.cp2=walk('wcp2','Capitalisation with adjustments','Profits: Year 1 ₹60,000 (<b>after an abnormal loss of ₹6,000</b>); Year 2 ₹72,000 (<b>including an abnormal gain of ₹12,000</b>); Year 3 ₹72,000. A manager\'s remuneration of <b>₹6,000 a year was not charged</b>. Capital employed ₹4,50,000, normal rate 12%. Goodwill by capitalisation of average profit.',[
 {h:'Adjust every year',b:`${tb(['','Y1','Y2','Y3'],[['Reported','60,000','72,000','72,000'],['Add: abnormal loss','6,000','',''],['Less: abnormal gain','','(12,000)',''],['Less: remuneration','(6,000)','(6,000)','(6,000)']],['Adjusted','60,000','54,000','66,000'])}`},
 {h:'Average adjusted profit',b:`${calc('1,80,000 ÷ 3 = 60,000')}`},
 {h:'Capitalise it',b:`${calc('60,000 × 100 ÷ 12 = 5,00,000')}`},
 {h:'Compare with capital employed',b:`${calc('5,00,000 − 4,50,000 = ₹50,000')}`}]);
MQ.s2=[mcq({tag:'Q2.1',q:'An abnormal gain is included in a year\'s profit. For valuing goodwill it is:',opts:['Added to the profit','Deducted from the profit','Averaged with the profit','Doubled'],ans:1,why:'(b). It will not recur, so it is deducted to find the usual profit.'}),

mcq({tag:'Q3.2',q:'Profits ₹24,000, ₹36,000 and ₹42,000 with weights 1, 2 and 3. The weighted average profit is:',opts:['₹34,000','₹37,000','₹36,000','₹40,000'],ans:1,why:'(b). 24,000 + 72,000 + 1,26,000 = 2,22,000. ÷ 6 = ₹37,000.'}),

${anim('gu1')}
${read(`<h3>📖 Read it: Goodwill</h3>
<div class="df"><b>Goodwill</b> is the <b>reputation</b> of a firm that lets it earn <b>more profit than a new business</b> of the same kind. It is the value of the firm's good name, customers and connections.</div>
<p><b>Nature of goodwill</b></p>
<ul><li><b>Intangible asset:</b> it has value but no physical form. It is <b>not</b> a fictitious asset, because it can be sold with the business.</li>
<li><b>Not independent:</b> it cannot be sold separately from the business.</li>
<li><b>Its value changes</b> with the profits and the reputation of the firm.</li>
<li><b>Hard to value:</b> there is no single exact figure, so several methods are used.</li>
<li><b>It helps earn super profits</b> (profit above the normal level).</li></ul>
<p><b>Factors that affect the value of goodwill</b></p>
${tb(['Factor','Why it matters'],[['Nature of business','Stable, in-demand products earn steady profits'],['Location','A busy market brings regular customers'],['Efficiency of management','Good management lowers cost and raises profit'],['Market situation','Less competition or a monopoly raises profit'],['Special advantages','Patents, trademarks, licences, government contracts'],['Access to scarce resources','Cheap raw material or rare skilled labour']])}
<p><b>When must goodwill be valued?</b> On a <b>change in the profit sharing ratio</b>, <b>admission</b> of a partner, <b>retirement</b>, <b>death</b> of a partner, and <b>dissolution</b> (when the firm is sold as a going concern).</p>
<div class="note"><b>AS-26:</b> only <b>purchased</b> goodwill is recorded in the books. A firm's <b>self-generated</b> goodwill is never recorded, so it is valued only on the events above and adjusted through the partners' accounts.</div>`)}
${flips([['👀 Meaning','Reputation that lets a firm earn more than a new business.'],['👻 Intangible','Real value, no physical form. Not fictitious.'],['📍 Factors','Nature, location, management, market, special advantages.'],['⚖️ AS-26','Only purchased goodwill is recorded.']])}
<div class="card"><h3>Try it: which factor?</h3>${choose('ch1',[{q:'A patented recipe that no competitor can copy.',o:['Location','Special advantage','Market situation'],a:1},{q:'A shop in the busiest market of the city.',o:['Location','Efficient management','Scarce resources'],a:0},{q:'A firm with no competitor in its town.',o:['Market situation','Special advantage','Nature of business'],a:0},{q:'A manager who cuts waste and raises sales every year.',o:['Location','Efficiency of management','Market situation'],a:1}])}</div>
<h3>Practice</h3>
${MQ.s1}
</section>`);

${anim('gu7')}
${anim('gu6')}
${read(`<h3>📖 Read it: Why we adjust</h3>
<div class="df">Goodwill is the value of the firm's <b>usual</b> earning power. So every year's profit is cleaned of anything <b>unusual</b>, whether it helped or hurt, and of any <b>cost</b> the buyer would bear that was never charged.</div>
<p><b>Abnormal gain: DEDUCT. Abnormal loss: ADD BACK.</b></p>
<ul><li>An <b>abnormal gain</b> (lottery, profit on sale of a fixed asset, insurance claim received) made the year look <b>better</b> than normal. It will not come again, so it is <b>deducted</b>.</li>
<li>An <b>abnormal loss</b> (fire, theft, loss on sale of a fixed asset) made the year look <b>worse</b> than normal. It will not happen again, so it is <b>added back</b>.</li></ul>
<div class="note"><b>Test to use:</b> ask "what would the profit have been in an ordinary year?" Remove the gain, restore the loss.</div>
<p><b>Read the wording carefully</b></p>
${tb(['The question says','Meaning','What to do'],[['Profit <b>after</b> charging an abnormal loss','The loss is already deducted','Add it back'],['Profit <b>before</b> charging an abnormal loss','Not yet deducted','Do nothing'],['Profit <b>including</b> an abnormal gain','The gain is inside the profit','Deduct it'],['Profit <b>excluding</b> an abnormal gain','Gain is not in the profit','Do nothing']])}
<p><b>When normal profit is given separately</b></p>
<p>Sometimes a year's <b>normal profit</b> is stated, with abnormal gains or losses listed alongside. The normal profit already leaves them out. <b>Use it as it is.</b> Do not adjust it again for those abnormal items.</p>
<div class="note"><b>Two different "normals":</b> "normal profit" of a year is a rupee figure free of abnormal items. "Normal rate of return" is a percentage used in Step 5 to work out the normal profit for the super profit method.</div>
<p><b>Other adjustments</b></p>
${tb(['Item in the year\'s profit','What to do'],[['Capital expenditure charged to P&amp;L','Add back'],['Capital income credited to P&amp;L','Deduct'],['Closing stock undervalued','Add to that year; <b>deduct</b> from next year'],['Closing stock overvalued','Deduct from that year; <b>add</b> to next year'],['Annual expense not charged (manager\'s remuneration, partner\'s salary)','Deduct from <b>every</b> year'],['Remuneration charged, but it is to be a different amount','Adjust only the <b>difference</b> in every year']])}
<div class="note"><b>Stock errors are two-year errors:</b> the closing stock of one year is the opening stock of the next. The total over both years stays the same.</div>
<div class="note"><b>Annual expenses:</b> a recurring cost the buyer will bear every year is deducted from <b>each</b> year, before weights are applied. In the weighted average method, deduct first, then multiply by the weights.</div>`)}
${flips([['➖ Abnormal gain','It will not recur, so deduct it.'],['➕ Abnormal loss','It will not recur, so add it back.'],['📌 Normal profit given','Use it directly. Ignore the abnormal items.'],['🔁 Annual expense','Deduct from every year, then average.']])}
${WALK.why}
${WALK.nm}
<div class="card"><h3>Try it: add back or deduct?</h3>${choose('ch2',[{q:'Abnormal loss by fire inside the year\'s profit.',o:['Add back','Deduct'],a:0},{q:'Profit on sale of an old machine credited to P&amp;L.',o:['Add back','Deduct'],a:1},{q:'Purchase of furniture charged to P&amp;L by mistake.',o:['Add back','Deduct'],a:0},{q:'Closing stock overvalued by ₹3,000 (this year\'s profit).',o:['Add back','Deduct'],a:1}])}</div>
<h3>Practice: concepts</h3>
${MQ.s2}
<h3>Build it yourself: adjusting profits</h3>
<div id="by0" style="display:grid;gap:14px"></div></section>`);

S.push(`<section class="step" id="s3">${head(3,'Average profit method','Find the usual profit, then pay a few years of it for the reputation.')}
${anim('gu2')}
${anim('gu3')}
${anim('gu8')}
${read(`<h3>📖 Read it: Average profit method</h3>
<div class="df">Goodwill = <b>Average profit × Number of years' purchase</b>. The buyer pays for a few years of the firm's usual profit.</div>
<ol><li><b>Adjust</b> each year's profit (see Step 2).</li>
<li><b>Simple average</b> = total of the adjusted profits ÷ number of years.</li>
<li><b>Weighted average</b> = Σ(profit × weight) ÷ Σ weights, with the <b>highest weight for the latest year</b>.</li>
<li><b>Goodwill</b> = average profit × years' purchase.</li></ol>
<p class="mute">A <b>loss</b> year is included in the total with a minus sign. A <b>year's purchase</b> is just the number of years of profit the buyer agrees to pay.</p>
<div class="note"><b>Adjust first.</b> Every year's profit must be corrected for abnormal items, stock errors and annual expenses (Step 2) <b>before</b> averaging.</div>`)}
${flips([['➗ Simple average','Total of adjusted profits ÷ number of years.'],['⚖️ Weighted','Latest year gets the highest weight. Divide by total weights.'],['➕ Add back','Abnormal losses and capital items charged to P&amp;L.'],['➖ Deduct','Abnormal gains and capital income credited.']])}
${WALK.av}
${WALK.wa}
${WALK.rem}
${WALK.cmb}
${WALK.ad}
<div class="card" id="avc"><h3>Try it: average profit calculator</h3><p class="mute">Change any profit or the years' purchase. A loss is a negative number.</p>
<div class="grid2"><label>Year 1<input class="in" id="a_1" type="number" value="40000"></label><label>Year 2<input class="in" id="a_2" type="number" value="50000"></label><label>Year 3<input class="in" id="a_3" type="number" value="60000"></label><label>Year 4<input class="in" id="a_4" type="number" value="30000"></label><label>Year 5<input class="in" id="a_5" type="number" value="70000"></label><label>Years' purchase<input class="in" id="a_y" type="number" value="3"></label></div><div id="a_o" class="stat" style="margin-top:10px"></div></div>
<h3>Practice</h3>
${MQ.s3}
</section>`);

${anim('gu4')}
${read(`<h3>📖 Read it: Super profit method</h3>
<div class="df"><b>Super profit</b> = Average profit − Normal profit. Goodwill = <b>Super profit × Number of years' purchase</b>.</div>
<ol><li><b>Capital employed:</b> assets (excluding goodwill and fictitious assets) − outside liabilities. From the other side: capital + reserves + accumulated profits − fictitious assets.</li>
<li><b>Normal profit</b> = Capital employed × Normal rate of return ÷ 100.</li>
<li><b>Average profit</b> (adjusted, as in Step 2).</li>
<li><b>Super profit</b> = average profit − normal profit.</li>
<li><b>Goodwill</b> = super profit × years' purchase.</li></ol>
<div class="note"><b>No super profit?</b> If the average profit is <b>less</b> than the normal profit, there is no super profit and goodwill is <b>nil</b>. Never show negative goodwill.</div>
<p class="mute">The <b>normal rate of return</b> is the return that firms of this type usually earn on their capital. It is always given in the question.</p>`)}
${flips([['🏦 Capital employed','Assets (without goodwill) − outside liabilities.'],['📏 Normal profit','Capital employed × normal rate ÷ 100.'],['🚀 Super profit','Average profit − normal profit.'],['0️⃣ Below normal','No super profit means nil goodwill.']])}
${WALK.sp}
<div class="card" id="spc"><h3>Try it: super profit calculator</h3>
<div class="grid2"><label>Capital employed (₹)<input class="in" id="p_c" type="number" value="400000"></label><label>Normal rate (%)<input class="in" id="p_r" type="number" value="10"></label><label>Average profit (₹)<input class="in" id="p_a" type="number" value="52000"></label><label>Years' purchase<input class="in" id="p_y" type="number" value="3"></label></div><div id="p_o" class="stat" style="margin-top:10px"></div></div>

S.push(`<section class="step" id="s7">${head(7,'Capitalisation methods','Ask what the business should be worth, then compare with what it has.')}
${anim('gu5')}
${read(`<h3>📖 Read it: Capitalisation methods</h3>
<div class="df"><b>Capitalised value</b> = the capital that would earn the profit at the normal rate = <b>Profit × 100 ÷ Normal rate of return</b>.</div>
<p><b>1. Capitalisation of average profit</b></p>
<ul><li>Capitalised value of average profit = Average profit × 100 ÷ NRR.</li>
<li>Capital employed (net assets) = assets (excluding goodwill) − outside liabilities.</li>
<li><b>Goodwill = Capitalised value − Capital employed</b>.</li></ul>
<p><b>2. Capitalisation of super profit</b></p>
<ul><li>Super profit = average profit − normal profit (as in Step 5).</li>
<li><b>Goodwill = Super profit × 100 ÷ NRR</b>.</li></ul>
<div class="note"><b>Both give the same goodwill.</b> The capitalised value exceeds capital employed by exactly the capitalised super profit. Use whichever is asked, and use the other as a check.</div>
<p class="mute">If the balance sheet already shows goodwill, remove it from the assets before finding capital employed. If the capitalised value is less than capital employed, goodwill is nil.</p>`)}
${flips([['💰 Capitalised value','Profit × 100 ÷ normal rate.'],['🧾 Method 1','Capitalised average profit − capital employed.'],['🚀 Method 2','Super profit × 100 ÷ normal rate.'],['✅ Check','Both methods always agree.']])}
${WALK.cp}
${WALK.cs}
<div class="card" id="cpc"><h3>Try it: capitalisation calculator</h3>
<div class="grid2"><label>Average profit (₹)<input class="in" id="c_a" type="number" value="100000"></label><label>Normal rate (%)<input class="in" id="c_r" type="number" value="10"></label><label>Capital employed (₹)<input class="in" id="c_n" type="number" value="820000"></label></div><div id="c_o" class="stat" style="margin-top:10px"></div></div>
<div class="card"><h3>Try it: is there goodwill?</h3>${choose('ch3',[{q:'Average profit ₹48,000. Normal profit ₹50,000.',o:['Goodwill exists','No goodwill'],a:1},{q:'Capitalised value ₹9,00,000. Capital employed ₹7,50,000.',o:['Goodwill exists','No goodwill'],a:0},{q:'Capitalised value ₹6,00,000. Capital employed ₹6,20,000.',o:['Goodwill exists','No goodwill'],a:1},{q:'Average profit ₹60,000. Normal profit ₹45,000.',o:['Goodwill exists','No goodwill'],a:0}])}</div>
<h3>Practice</h3>

${tb(['Method','Formula'],[['Average profit','Average profit × years\' purchase'],['Weighted average','Σ(profit × weight) ÷ Σ weights'],['Super profit','(Average profit − Normal profit) × years\' purchase'],['Normal profit','Capital employed × NRR ÷ 100'],['Capital employed','Assets (without goodwill) − outside liabilities'],['Capitalisation of average profit','(Average profit × 100 ÷ NRR) − Capital employed'],['Capitalisation of super profit','Super profit × 100 ÷ NRR']])}
<div class="note"><b>Before every method:</b> adjust the profits (add back abnormal losses and capital items, deduct abnormal gains, correct stock errors in two years). <b>After:</b> goodwill is never negative.</div>

${mcq({tag:'C2',q:'The super profit is:',opts:['₹40,000','₹80,000','₹1,20,000','₹20,000'],ans:0,why:'(a). 1,20,000 − 80,000 = ₹40,000.'})}
${mcq({tag:'C3',q:'Goodwill at 2 years\' purchase of super profit is:',opts:['₹80,000','₹2,40,000','₹40,000','₹1,60,000'],ans:0,why:'(a). 40,000 × 2 = ₹80,000.'})}
${mcq({tag:'C4',q:'Goodwill by capitalisation of super profit is:',opts:['₹4,00,000','₹80,000','₹40,000','₹12,00,000'],ans:0,why:'(a). 40,000 × 100 ÷ 10 = ₹4,00,000.'})}

 function sp(t){if(t)xp('c:spc',5,'for exploring');const c=g('p_c'),r=g('p_r'),a=g('p_a'),y=g('p_y'),np=c*r/100,s=a-np,gw=s>0?s*y:0;

 ['p_c','p_r','p_a','p_y'].forEach(i=>q(i).oninput=()=>sp(true));sp(false);

 ['c_a','c_r','c_n'].forEach(i=>q(i).oninput=()=>cp(true));cp(false)})();
document.querySelectorAll('.an').forEach(el=>{const a=ANS[el.id],n=a.caps.length;let cur=0,timer=null,seen=false;const pb=el.querySelector('[data-a=play]');
 const set=k=>{cur=k;el.querySelectorAll('.s').forEach(g=>g.classList.toggle('on',+g.dataset.s<=k));el.querySelector('.cp').textContent=k?a.caps[k-1]:'Press Play to watch.';el.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<k));if(k>=n)xp('an:'+el.id,10,'for watching')};
 const lab=()=>{pb.textContent=timer?'❚❚ Pause':(cur>=n?'↻ Replay':'▶ Play')};
