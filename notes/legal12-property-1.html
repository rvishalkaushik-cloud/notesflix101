<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Law of Property · Notesflix 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e5;--bg2:#ffefd0;--card:#ffffff;--ink:#22214f;--mut:#5d5b86;--navy:#2b2a6b;--navy2:#3d3b8e;--orange:#f26b21;--amber:#f9b91a;--teal:#3bb5a0;--mint:#a7ebd5;--coral:#f2645a;--line:#ecd9b4;--shadow:0 10px 26px rgba(43,42,107,.12);--r:20px}
:root{--bg:#f6f1e4;--bg2:#eee3c8;--navy:#0f1e3d;--navy2:#323338;--ink:#0f1e3d;--orange:#9a7228;--amber:#c9a54b;--teal:#2f6f8f;--mint:#b6cdd8;--coral:#a63d32;--line:#d6d3cd;--g1:#e2cf9f;--g2:#b6c7c9;--topbg:rgba(246,241,228,0.92);--tint1:#f3eee5;--tint1ink:#3e2e10;--tint1b:#e1d5be;--tint2:#e2ebef;--tint2ink:#122a36;--mut:#606877;--shadow:0 10px 26px rgba(15,30,61,0.13)}
.cv .lb.sm{font-size:.6rem;padding:2px 7px}
:root[data-theme="dark"]{--tint1:#2a2550;--tint1ink:#ffe1c9;--tint1b:#3a3880;--tint2:#173a3a;--tint2ink:#c9fff0;--topbg:rgba(20,19,58,.92);--g1:transparent;--g2:transparent}
:root[data-theme="dark"]{--bg:#14133a;--bg2:#1c1b4d;--card:#23225a;--ink:#f3f1ff;--mut:#b9b6e8;--line:#3a3880;--shadow:0 10px 26px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14133a;--bg2:#1c1b4d;--card:#23225a;--ink:#f3f1ff;--mut:#b9b6e8;--line:#3a3880}}
*{box-sizing:border-box}html{font-size:17px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Poppins,'Segoe UI',Arial,sans-serif;overflow-x:hidden;
 background-image:radial-gradient(800px 420px at 0% 0%,var(--g1) 0,transparent 60%),radial-gradient(700px 420px at 100% 20%,var(--g2) 0,transparent 60%)}
:root[data-theme="dark"] body{background-image:none}
h1,h2,h3,h4{font-family:'Baloo 2',Poppins,sans-serif;line-height:1.15;margin:0 0 .35em;color:var(--navy)}
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] h3{color:#fff}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:40;background:var(--topbg);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
:root[data-theme="dark"] .top{background:rgba(20,19,58,.92)}
.top .in{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.logo{font:800 1.2rem/1 'Baloo 2';letter-spacing:1px;color:var(--navy)}.logo b{color:var(--orange)}
:root[data-theme="dark"] .logo{color:#fff}
.pbar{flex:1;min-width:120px;height:12px;border-radius:99px;background:#fff;border:2px solid var(--line);overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--amber),var(--teal));transition:width .5s}
.xp{font:800 .9rem 'Baloo 2';background:var(--amber);color:#3a2a00;border-radius:99px;padding:4px 12px}
.tbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:5px 10px;font-weight:700;font-size:.8rem}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:thin}
.nav a{flex:none;font:600 .74rem Poppins;color:var(--navy);text-decoration:none;border:2px solid var(--line);border-radius:99px;padding:5px 11px;background:var(--card)}
:root[data-theme="dark"] .nav a{color:#fff}
.nav a.ok::after{content:" ✓";color:var(--teal)}
/* hero */
.hero{padding:30px 0 10px;display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:center}
.kick{display:inline-block;font:800 .72rem Poppins;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:99px;padding:5px 12px}
.hero h1{font-size:clamp(2.4rem,7vw,4.2rem);margin:.25em 0 .1em;color:var(--navy);letter-spacing:.5px}
.hero h1 span{color:var(--orange)}
.lead{font-size:1.05rem;color:var(--mut)}
.heroart{background:#fff;border-radius:28px;box-shadow:var(--shadow);border:3px solid #fff;overflow:hidden}
.heroart svg{display:block;width:100%;height:auto}
.btn{border:0;border-radius:14px;padding:11px 18px;font:700 .95rem Poppins;background:var(--orange);color:#fff;box-shadow:0 5px 0 #c4501a}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4501a}
.btn.alt{background:var(--navy);box-shadow:0 5px 0 #17164a}.btn.teal{background:var(--teal);box-shadow:0 5px 0 #23806f}
.btn.sm{padding:7px 12px;font-size:.82rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* blocks */
section.step{padding:34px 0;border-top:3px dashed var(--line)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh .no{flex:none;width:58px;height:58px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 1.5rem 'Baloo 2';box-shadow:0 5px 0 #17164a}
.sh small{display:block;font:800 .7rem Poppins;letter-spacing:.14em;color:var(--orange)}
.sh h2{font-size:clamp(1.5rem,4vw,2.3rem);margin:0}
.blk{margin:16px 0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid var(--line);padding:18px}
.ttl{display:flex;align-items:center;gap:8px;font:800 1.15rem 'Baloo 2';color:var(--navy);margin:0 0 8px}
:root[data-theme="dark"] .ttl{color:#fff}
.ttl .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--amber);font-size:1.1rem}
/* journey */
.jy{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.jy a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font:600 .8rem/1.25 Poppins}
.jy a .e{font-size:1.3rem}.jy a small{display:block;font:800 .62rem Poppins;letter-spacing:.1em;color:var(--mut)}
.jy a.here{border-color:var(--orange);background:var(--tint1);box-shadow:0 0 0 3px var(--tint1b)}
:root[data-theme="dark"] .jy a.here{background:#3a2a40}
.jy a.here small::after{content:" · YOU ARE HERE";color:var(--orange)}
/* predict */
.pred{background:linear-gradient(135deg,#fff8e6,#ffe9c2);border:3px dashed var(--amber);border-radius:var(--r);padding:16px 18px}
:root[data-theme="dark"] .pred{background:#2a2550}
.pred .q{font:700 1.15rem/1.35 'Baloo 2';color:var(--navy)}:root[data-theme="dark"] .pred .q{color:#fff}
.pred .q::before{content:"🤔 THINK FIRST";display:block;font:800 .7rem Poppins;letter-spacing:.14em;color:var(--orange);margin-bottom:4px}
.pred .a{margin-top:10px;background:var(--tint2);border-radius:14px;padding:10px 14px;border:2px solid var(--mint);color:var(--tint2ink)}
/* key slide */
.ks{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:3px solid var(--navy)}
.ks .hd{background:var(--navy);color:#fff;padding:12px 18px}.ks .hd small{font:800 .68rem Poppins;letter-spacing:.14em;color:var(--amber)}.ks .hd h3{color:#fff;margin:2px 0 0;font-size:1.45rem}
.ks .bd{background:var(--card);padding:16px 18px;display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}
.ks .art{background:var(--bg2);border-radius:16px;display:grid;place-items:center;padding:10px;min-height:200px}.ks .art svg{width:100%;height:auto}
.ks .simple{font-weight:600;font-size:1.02rem}
.ks ul{list-style:none;padding:0;margin:10px 0}.ks li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:.93rem;border:2px solid var(--line)}
.ks li .i{flex:none;font-size:1.2rem}
.ks b,.simple b{color:var(--orange)}
.an{background:var(--tint2);border-left:6px solid var(--teal);border-radius:12px;padding:10px 12px;font-size:.92rem;color:var(--tint2ink)}.an::before{content:"🧠 Think of it like this: ";font-weight:800}
.ex{grid-column:1/-1;background:#fff6dc;border:3px dashed var(--amber);border-radius:16px;padding:12px 14px;font-size:.92rem;color:#3a2a00}.ex::before{content:"✍️ WRITE THIS IN THE EXAM (NCERT)";display:block;font:800 .7rem Poppins;letter-spacing:.12em;color:var(--orange);margin-bottom:4px}
/* glossary */
.gw{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:2px dotted var(--orange);cursor:help}
#gpop{position:fixed;z-index:80;max-width:280px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px;font-size:.86rem;box-shadow:var(--shadow)}
#gpop b{color:var(--amber);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:2px solid var(--teal);background:var(--tint2);color:var(--tint2ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:.82rem}
/* flips */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fp{display:block;width:100%;cursor:pointer;font:inherit;color:inherit;perspective:900px;height:200px;border:0;background:none;padding:0;text-align:left}
.fp .in{display:block;position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fp.on .in{transform:rotateY(180deg)}
.fp .f,.fp .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;padding:14px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.fp .f{background:var(--card);border:3px solid var(--c,var(--orange));align-items:center;text-align:center}
.fp .f .e{flex:none;font-size:2.6rem;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:3px solid var(--c,var(--orange));margin-bottom:8px}
.fp .f b{display:block;font:800 1.05rem 'Baloo 2';color:var(--navy)}:root[data-theme="dark"] .fp .f b{color:#fff}
.fp .f small{color:var(--mut);font-size:.72rem}
.fp .b{background:var(--c,var(--orange));color:#fff;transform:rotateY(180deg);font-size:.88rem;line-height:1.45}
.fp .b em{display:block;margin-top:8px;font-style:normal;background:#ffffff33;border-radius:10px;padding:5px 8px;font-size:.8rem}
/* try / learn */
.try{background:var(--tint1);border-left:6px solid var(--orange);border-radius:12px;padding:9px 12px;font-size:.92rem;margin-bottom:10px;color:var(--tint1ink)}.try::before{content:"🎯 What to try: ";font-weight:800}
details.learn{margin-top:10px;background:var(--tint2);border:2px solid var(--mint);border-radius:12px;padding:8px 12px;color:var(--tint2ink)}details.learn summary{cursor:pointer;font-weight:800}
/* sorter / quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0;font-weight:500}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:800 .8rem 'Baloo 2'}
.opt:hover:not([disabled]){border-color:var(--orange)}.opt.ok{border-color:var(--teal);background:var(--tint2);color:var(--tint2ink)}.opt.no{border-color:var(--coral);background:#ffe5e2;color:#7a1d16}.opt[disabled]{cursor:default}
.fb{margin-top:8px;border-radius:12px;padding:8px 12px;font-size:.9rem}.fb.ok{background:var(--tint2);color:var(--tint2ink)}.fb.no{background:#ffe5e2;color:#7a1d16}
.qhd{display:flex;justify-content:space-between;align-items:center;font:800 .75rem Poppins;letter-spacing:.08em;color:var(--mut)}
.qq{font:700 1.1rem/1.35 'Baloo 2';margin:6px 0}
.dots{display:flex;gap:5px}.dots i{width:22px;height:7px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--orange)}.dots i.ok{background:var(--teal)}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.bk button{border:3px solid var(--navy2);background:var(--card);border-radius:14px;padding:12px;font:800 .9rem 'Baloo 2';color:var(--navy)}
:root[data-theme="dark"] .bk button{color:#fff}
.bk button:hover{background:var(--bg2)}
.item{font:700 1.1rem/1.35 'Baloo 2';background:var(--bg2);border-radius:14px;padding:14px;text-align:center;border:2px dashed var(--amber)}
/* one line */
.ol{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,var(--teal),#2f9c89);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 #23806f}
.ol .e{font-size:1.8rem}.ol small{display:block;font:800 .68rem Poppins;letter-spacing:.14em;opacity:.85}.ol p{margin:0;font-weight:700}.ol b{color:#fff3b0}
/* compare */
.cmp{width:100%;border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.cmp th{background:var(--navy);color:#fff;padding:10px;font:800 .95rem 'Baloo 2'}.cmp th:last-child{background:var(--teal)}
.cmp td{background:var(--card);padding:9px 10px;border-top:2px solid var(--line);font-size:.9rem;vertical-align:top}.cmp td:first-child{font-weight:800;color:var(--orange);background:var(--bg2)}
/* tree */
.tree{text-align:center}.tree .nd{display:inline-block;border-radius:14px;padding:8px 14px;font:800 .95rem 'Baloo 2';color:#fff;border:0;margin:4px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tree .lv{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:10px 0}
.tree .r{background:var(--navy)}.tree .it{background:var(--orange)}.tree .fx{background:var(--teal)}.tree .sm{background:#2f9c89}.tree .lg{background:#1f7a6b}
.tree .leaf{background:var(--card);color:var(--ink);border:2px solid var(--line);font:700 .8rem Poppins;box-shadow:none}
.tinfo{margin-top:10px;background:var(--bg2);border-radius:14px;padding:10px 14px;min-height:56px;font-size:.92rem;text-align:left}
/* 3d */
.b3{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.b3>*{min-width:0}
.cv{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(var(--g1),var(--bg));border:3px solid var(--navy);aspect-ratio:16/11;min-height:300px}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.cv .help{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(43,42,107,.85);color:#fff;border-radius:12px;padding:6px 10px;font-size:.74rem;pointer-events:none}
.cv .lbls{position:absolute;inset:0;pointer-events:none}
.cv .lb{position:absolute;transform:translate(-50%,-100%);background:var(--navy);color:#fff;font:700 .68rem Poppins;padding:3px 8px;border-radius:99px;white-space:nowrap}
.cv .lb.sel{background:var(--orange)}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.modes button{border:2px solid var(--navy);background:var(--card);border-radius:12px;padding:6px 12px;font:800 .82rem 'Baloo 2';color:var(--navy)}
.modes button.on{background:var(--navy);color:#fff}
.panel h4{font-size:1.25rem;margin:.1em 0}.panel .tag{display:inline-block;font:800 .65rem Poppins;letter-spacing:.12em;background:var(--amber);color:#3a2a00;border-radius:8px;padding:3px 8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat div{background:var(--bg2);border-radius:12px;padding:8px;text-align:center;font-size:.78rem;color:var(--mut)}.stat b{display:block;font:800 1.3rem 'Baloo 2';color:var(--navy)}
/* gst */
.gst label{display:block;font-weight:700;margin:6px 0}.gst select,.gst input[type=number]{font:inherit;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.bill{background:#fff;color:#22214f;border-radius:14px;border:2px dashed var(--navy2);padding:12px 14px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem;margin-top:10px}
.bill .tot{border-top:2px solid #22214f;margin-top:6px;padding-top:6px;font-weight:800}
/* motion overrides for light theme */
.ms{border:3px solid var(--navy)!important;background:var(--bg)!important;border-radius:22px!important}
.ms .mcap{color:var(--navy)!important;text-shadow:none!important;background:linear-gradient(transparent,var(--bg) 35%)!important}
.ms .mcap b{color:var(--orange)!important}
.ms .mctl button{background:var(--orange)!important;color:#fff!important}
.ms .mbar{background:var(--teal)!important}
.foot{padding:30px 0 60px;color:var(--mut);font-size:.82rem;text-align:center}
@media (max-width:820px){.hero,.ks .bd,.b3{grid-template-columns:1fr}.cv{aspect-ratio:auto;height:340px;min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ===== factory widgets ===== */
.hero>*{min-width:0}.hero h1{overflow-wrap:anywhere}.hero .kick{white-space:normal;max-width:100%}
@media (max-width:520px){.hero h1{font-size:clamp(1.9rem,9.5vw,2.6rem)}}
.gph{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px}
.gph svg{width:100%;height:auto;display:block;touch-action:none}
.gph .ax{stroke:var(--ink);stroke-width:2}.gph .gr{stroke:var(--line);stroke-width:1}.gph text{fill:var(--ink);font:600 12px Poppins,sans-serif}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px;margin-top:8px}
.sl label{font-weight:700;font-size:.85rem}.sl input[type=range]{width:100%;accent-color:var(--orange)}
.sl output{float:right;font:800 .9rem 'Baloo 2';color:var(--orange)}
.calc .row label{font-weight:700;font-size:.88rem}.calc input,.calc select{font:inherit;font-size:16px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.calc .out{margin-top:10px;background:var(--card);border:2px dashed var(--navy2);border-radius:14px;padding:12px 14px;font-size:.95rem;overflow-x:auto}
.calc .out table{border-collapse:collapse;width:100%}.calc .out td{padding:4px 8px;border-bottom:1px solid var(--line)}.calc .out td:last-child{text-align:right;font-weight:700}
.ord{display:flex;flex-direction:column;gap:8px}.ord button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:600}
.ord button.pk{border-color:var(--teal);background:var(--tint2);color:var(--tint2ink)}.ord .n{font:800 1rem 'Baloo 2';min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--amber);color:#3a2a00;flex:none}
.exq{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;background:var(--card)}
.exq .mk{display:inline-block;font:800 .72rem Poppins;background:var(--navy);color:#fff;border-radius:99px;padding:2px 9px;margin-right:6px}
.exq ul.pts{margin:8px 0 0;padding:0;list-style:none}.exq ul.pts li{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.exq ul.pts input{width:20px;height:20px;accent-color:var(--teal);flex:none;margin-top:3px}
.exq textarea{width:100%;min-height:90px;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);color:var(--ink)}
.tl{position:relative;padding-left:22px;border-left:4px solid var(--amber);margin-left:8px}.tl .ev{position:relative;margin:0 0 12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer}
.tl .ev::before{content:"";position:absolute;left:-33px;top:12px;width:18px;height:18px;border-radius:50%;background:var(--orange);border:3px solid var(--bg)}.tl .ev b{color:var(--orange)}.tl .ev p{margin:4px 0 0;font-size:.9rem}
.tree .lv{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}.tree .nd{border:0;border-radius:12px;padding:8px 12px;font-weight:700;color:#fff;background:var(--c,var(--navy))}
.tree .tinfo{background:var(--tint2);color:var(--tint2ink);border-radius:12px;padding:10px 12px;margin-top:8px}

.tk{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;align-items:center}.tksvg{width:100%;max-width:340px;display:block;margin:auto}.wl{transition:y .3s,height .3s}.tkc label{display:block;font-size:.85rem;margin-bottom:8px}.tkc input{width:100%;accent-color:var(--orange)}
.sp.run{text-align:left}.sphd{display:flex;justify-content:space-between;font:800 .9rem Poppins}.sptb{height:8px;border-radius:99px;background:var(--line);margin:6px 0 10px;overflow:hidden}.sptb i{display:block;height:100%;background:var(--orange);transition:width 1s linear}.spo{display:grid;grid-template-columns:1fr 1fr;gap:6px}

<script>window.NOTE={"meta": {"title": "Law of Property", "kit": "legal", "palette": 10, "titleHtml": "LAW OF<br><span>PROPERTY<\/span><br><small style=\"font-size:.42em;color:var(--teal)\">Kinds, Ownership, Transfer<\/small>", "kicker": "Class 12 · Legal Studies · Unit 3C · Law of Property", "lead": "Your phone, your family’s flat, a song you wrote — all are <b>property<\/b>. Learn what property is, who owns it, and how the law lets it pass from one person to another.", "foot": "Notesflix 101 · Class 12 Legal Studies · Law: Transfer of Property Act, 1882 and Registration Act, 1908 (current law, checked Nov 2026). Story scenarios are fictional; real cases are named with court, year and source."}, "hero": "<svg viewBox=\"0 0 640 380\" role=\"img\" aria-label=\"A house, keys and a registered deed with a gold seal\"><defs><linearGradient id=\"hp1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#0f1e3d\"/><stop offset=\"1\" stop-color=\"#0a1428\"/><\/linearGradient><\/defs><rect width=\"640\" height=\"380\" fill=\"url(#hp1)\"/><rect y=\"300\" width=\"640\" height=\"80\" fill=\"#1c1f26\"/><g transform=\"translate(90 140)\"><path d=\"M0 70 L80 0 L160 70 V160 H0Z\" fill=\"#5b3d1c\"/><rect x=\"60\" y=\"100\" width=\"40\" height=\"60\" fill=\"#c9a54b\"/><rect x=\"18\" y=\"86\" width=\"30\" height=\"26\" fill=\"#f6f1e4\"/><rect x=\"112\" y=\"86\" width=\"30\" height=\"26\" fill=\"#f6f1e4\"/><\/g><g transform=\"translate(380 120) rotate(6)\"><rect width=\"170\" height=\"160\" rx=\"6\" fill=\"#f6f1e4\"/><text x=\"85\" y=\"34\" font-family=\"Playfair Display,Georgia,serif\" font-weight=\"700\" font-size=\"16\" text-anchor=\"middle\" fill=\"#1c1f26\">SALE DEED<\/text><rect x=\"20\" y=\"54\" width=\"130\" height=\"4\" fill=\"#bbb\"/><rect x=\"20\" y=\"70\" width=\"118\" height=\"4\" fill=\"#bbb\"/><rect x=\"20\" y=\"86\" width=\"106\" height=\"4\" fill=\"#bbb\"/><rect x=\"20\" y=\"102\" width=\"130\" height=\"4\" fill=\"#bbb\"/><rect x=\"20\" y=\"118\" width=\"118\" height=\"4\" fill=\"#bbb\"/><circle cx=\"132\" cy=\"134\" r=\"18\" fill=\"#c9a54b\"><animate attributeName=\"r\" values=\"18;21;18\" dur=\"2s\" repeatCount=\"indefinite\"/><\/circle><text x=\"132\" y=\"139\" font-size=\"14\" text-anchor=\"middle\">⚖️<\/text><\/g><text x=\"300\" y=\"250\" font-size=\"44\">🔑<animate attributeName=\"y\" values=\"250;238;250\" dur=\"1.8s\" repeatCount=\"indefinite\"/><\/text><text x=\"320\" y=\"350\" fill=\"#c9a54b\" font-family=\"Playfair Display,Georgia,serif\" font-weight=\"700\" font-size=\"20\" text-anchor=\"middle\">No registered deed, no title<\/text><\/svg>", "opener": [{"type": "opener", "id": "op", "h": "Start here · The big picture", "lead": "Four short pages. Read them in order.", "sections": [{"k": "1", "t": "What is property?", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Kinds of property: movable and immovable, tangible and intangible\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#0f1e3d\"/><g font-family=\"Poppins,sans-serif\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#f6f1e4\" font-size=\"11\"><rect x=\"13\" y=\"26\" width=\"124\" height=\"68\" rx=\"12\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"75\" y=\"54\" font-size=\"22\">🏠<\/text><text x=\"75\" y=\"74\">Immovable<\/text><text x=\"75\" y=\"87\" font-size=\"9\" fill=\"#c9a54b\">land, building<\/text><rect x=\"163\" y=\"26\" width=\"124\" height=\"68\" rx=\"12\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"225\" y=\"54\" font-size=\"22\">🚲<\/text><text x=\"225\" y=\"74\">Movable<\/text><text x=\"225\" y=\"87\" font-size=\"9\" fill=\"#c9a54b\">bike, phone<\/text><rect x=\"13\" y=\"106\" width=\"124\" height=\"68\" rx=\"12\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"75\" y=\"134\" font-size=\"22\">📦<\/text><text x=\"75\" y=\"154\">Tangible<\/text><text x=\"75\" y=\"167\" font-size=\"9\" fill=\"#c9a54b\">can be touched<\/text><rect x=\"163\" y=\"106\" width=\"124\" height=\"68\" rx=\"12\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"225\" y=\"134\" font-size=\"22\">💡<\/text><text x=\"225\" y=\"154\">Intangible<\/text><text x=\"225\" y=\"167\" font-size=\"9\" fill=\"#c9a54b\">copyright, shares<\/text><\/g><\/svg>", "body": "In law, <b>property<\/b> means anything over which a person can have <b>rights of ownership<\/b> — and those rights can be enforced against the whole world. It is not just land: your bicycle, your money in a bank, shares in a company, even a <b>copyright<\/b> in a song you wrote are property. The law sorts property into kinds: <b>movable<\/b> and <b>immovable<\/b>, <b>tangible<\/b> and <b>intangible<\/b>.", "simple": "Property = anything a person can own, with rights the law protects.", "words": [["Right in rem", "A right good against the whole world, like ownership."]], "think": ["Is a song’s copyright property?", "Yes — intangible property (intellectual property, Unit 3D)."]}, {"k": "2", "t": "Owning vs holding", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Ownership is the right; possession is the control\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#eee3c8\"/><g font-family=\"Poppins,sans-serif\" font-weight=\"700\" text-anchor=\"middle\"><rect x=\"18\" y=\"30\" width=\"122\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#2f6f8f\" stroke-width=\"3\"/><text x=\"79\" y=\"80\" font-size=\"34\">📜<\/text><text x=\"79\" y=\"112\" font-size=\"12\" fill=\"#2f6f8f\">OWNERSHIP<\/text><text x=\"79\" y=\"132\" font-size=\"9.5\" fill=\"#0f1e3d\">the legal right (de jure)<\/text><rect x=\"160\" y=\"30\" width=\"122\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#9a7228\" stroke-width=\"3\"/><text x=\"221\" y=\"80\" font-size=\"34\">🔑<\/text><text x=\"221\" y=\"112\" font-size=\"12\" fill=\"#9a7228\">POSSESSION<\/text><text x=\"221\" y=\"132\" font-size=\"9.5\" fill=\"#0f1e3d\">physical control (de facto)<\/text><text x=\"150\" y=\"186\" font-size=\"11\" fill=\"#0f1e3d\">A landlord owns; a tenant possesses<\/text><\/g><\/svg>", "body": "A landlord <b>owns<\/b> a flat; the tenant <b>possesses<\/b> it. A bank holds your gold in a locker; you still own it. <b>Ownership<\/b> is the fullest legal right over a thing — to use it, enjoy it, sell it, gift it or destroy it. <b>Possession<\/b> is actual physical control. Usually they come together, but the law often separates them.", "simple": "Ownership = right. Possession = control.", "words": [["De jure", "By law."], ["De facto", "In fact."]], "think": ["You lend your book to a friend. Who owns it? Who possesses it?", "You own it; your friend possesses it."]}, {"k": "3", "t": "Moving property between people", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Transfer of property: a living person conveys property to another living person\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#0f1e3d\"/><g font-family=\"Poppins,sans-serif\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#f6f1e4\"><text x=\"55\" y=\"96\" font-size=\"40\">🧑<\/text><text x=\"55\" y=\"130\" font-size=\"11\">Transferor<\/text><text x=\"245\" y=\"96\" font-size=\"40\">👩<\/text><text x=\"245\" y=\"130\" font-size=\"11\">Transferee<\/text><path d=\"M92 84 H208\" stroke=\"#c9a54b\" stroke-width=\"4\"/><text x=\"150\" y=\"74\" font-size=\"11\" fill=\"#c9a54b\">conveys property<\/text><text x=\"150\" y=\"170\" font-size=\"12\">s.5 TPA: between living persons<\/text><\/g><text font-size=\"24\"><animateMotion dur=\"3s\" repeatCount=\"indefinite\" path=\"M100 92 H200\"/>🏠<\/text><\/svg>", "body": "People sell, mortgage, rent out, swap and gift property every day. When this is done between <b>living persons<\/b>, it is governed by the <b>Transfer of Property Act, 1882<\/b> (TPA). Property passing on death (by a will or inheritance) is a different area — succession law. For immovable property, the <b>Registration Act, 1908<\/b> requires many transfers to be <b>registered<\/b>.", "simple": "TPA = rules for transfers between living persons.", "words": [["Inter vivos", "Between living persons."], ["Registration", "Recording a document with the Sub-Registrar so it has legal effect."]], "think": ["Your grandfather leaves you his house in a will. Is that governed by the TPA?", "No — that is succession (on death), not a transfer between living persons."]}, {"k": "4", "t": "Your journey", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Five modes of transfer: sale, mortgage, lease, exchange, gift\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#eee3c8\"/><g font-family=\"Poppins\" font-weight=\"700\" font-size=\"10\" text-anchor=\"middle\" fill=\"#0f1e3d\"><rect x=\"15\" y=\"60\" width=\"50\" height=\"80\" rx=\"10\" fill=\"#2f6f8f\"/><text x=\"40\" y=\"108\" font-size=\"22\">💰<\/text><text x=\"40\" y=\"160\">Sale s.54<\/text><rect x=\"70\" y=\"60\" width=\"50\" height=\"80\" rx=\"10\" fill=\"#9a7228\"/><text x=\"95\" y=\"108\" font-size=\"22\">🏦<\/text><text x=\"95\" y=\"160\">Mortgage s.58<\/text><rect x=\"125\" y=\"60\" width=\"50\" height=\"80\" rx=\"10\" fill=\"#c9a54b\"/><text x=\"150\" y=\"108\" font-size=\"22\">🔑<\/text><text x=\"150\" y=\"160\">Lease s.105<\/text><rect x=\"180\" y=\"60\" width=\"50\" height=\"80\" rx=\"10\" fill=\"#323338\"/><text x=\"205\" y=\"108\" font-size=\"22\">🔁<\/text><text x=\"205\" y=\"160\">Exchange s.118<\/text><rect x=\"235\" y=\"60\" width=\"50\" height=\"80\" rx=\"10\" fill=\"#a63d32\"/><text x=\"260\" y=\"108\" font-size=\"22\">🎁<\/text><text x=\"260\" y=\"160\">Gift s.122<\/text><\/g><text x=\"150\" y=\"36\" text-anchor=\"middle\" font-family=\"Playfair Display,Georgia,serif\" font-weight=\"700\" font-size=\"15\" fill=\"#0f1e3d\">Modes of transfer<\/text><\/svg>", "body": "<b>Step 1<\/b> Meaning and kinds of property. <b>Step 2<\/b> Ownership and possession. <b>Step 3<\/b> Transfer of property — what can and cannot be transferred, and why registration matters, with a Supreme Court case on “GPA sales”. <b>Step 4<\/b> Five modes of transfer: <b>sale, mortgage, lease, exchange and gift<\/b>.", "simple": "Property → ownership → transfer → five modes.", "words": [["GPA", "General Power of Attorney — authority to act for another."]], "think": ["Can a GPA make you the owner of a flat?", "No. Only a registered conveyance (e.g. a sale deed) transfers title — Suraj Lamp (SC, 2011)."]}]}], "points": [["Property", "Anything capable of ownership; rights enforceable against the world."], ["Kinds", "Movable/immovable, tangible/intangible, corporeal/incorporeal."], ["Transfer (s.5 TPA)", "Conveyance of property by a living person to one or more living persons."], ["Registration", "Sale of immovable property worth ₹100 or more needs a registered instrument (s.54 TPA; s.17 Registration Act)."], ["Modes", "Sale (s.54), mortgage (s.58), lease (s.105), exchange (s.118), gift (s.122)."]], "intro": [{"type": "episode", "id": "ep1", "h": "Episode · The Flat Next Door", "try": "Press play; read each explanation.", "cast": {"meera": {"name": "Meera", "hair": "#2b1d3a", "outfit": "#2f6f8f", "skin": "m"}, "sunil": {"name": "Sunil", "hair": "#9aa0a6", "outfit": "#a63d32", "skin": "l"}, "officer": {"name": "Sub-Registrar", "hair": "#3a2418", "outfit": "#1c1f26", "skin": "d", "sash": "#c9a54b"}}, "scenes": [{"dur": 4200, "bg": ["#0f1e3d", "#0a1428"], "kicker": "SCENE 1", "title": "A cheap deal", "chars": [{"ch": "sunil", "x": 560, "y": 300, "mood": "smug"}, {"ch": "meera", "x": 240, "y": 300, "mood": "happy"}], "bubbles": [{"x": 280, "y": 40, "w": 340, "t": "“Skip the stamp duty! I’ll just give you a GPA and a will.”", "tail": "r"}], "sub": "A shortcut that looks smart 😏", "exp": "Sunil offers to “sell” his flat through a <b>General Power of Attorney<\/b>, an agreement to sell and a <b>will<\/b> — the so-called <b>SA/GPA/Will<\/b> route — to avoid paying stamp duty on a sale deed."}, {"dur": 4200, "bg": ["#2f6f8f", "#0f1e3d"], "kicker": "SCENE 2", "title": "Money paid", "chars": [{"ch": "meera", "x": 240, "y": 300, "mood": "happy"}], "props": [{"e": "💰🔑", "x": 540, "y": 200, "fs": 64}], "sub": "Keys in hand… owner? 🤔", "exp": "Meera pays the full price and gets the keys. She now has <b>possession<\/b>. But does she have <b>ownership<\/b>? Possession and ownership are not the same thing."}, {"dur": 4300, "bg": ["#1c1f26", "#0f1e3d"], "kicker": "SCENE 3", "title": "The twist", "chars": [{"ch": "sunil", "x": 560, "y": 300, "mood": "smug"}], "props": [{"e": "📄📄", "x": 250, "y": 200, "fs": 60}], "bubbles": [{"x": 120, "y": 40, "w": 340, "t": "Sunil cancels the GPA and sells the flat to someone else by a registered deed.", "tail": "r"}], "sfx": [{"t": "WHAT?!", "x": 420, "y": 120, "fs": 44, "c": "#a63d32", "r": -8}], "sub": "A registered sale beats a GPA 😱", "exp": "A GPA only lets someone <b>act for<\/b> the owner; it does not <b>transfer title<\/b>. The buyer with a <b>registered sale deed<\/b> becomes the owner under <b>s.54 TPA<\/b>."}, {"dur": 4300, "bg": ["#9a7228", "#0f1e3d"], "kicker": "SCENE 4", "title": "The rule", "chars": [{"ch": "officer", "x": 400, "y": 300, "mood": "cool"}], "props": [{"e": "🏛️", "x": 400, "y": 120, "fs": 56}], "bubbles": [{"x": 90, "y": 180, "w": 620, "t": "“Immovable property is sold only by a registered deed.” — Suraj Lamp (SC, 2011)", "tail": "l"}], "sub": "Registration matters 📜", "exp": "The Supreme Court held that SA/GPA/Will transactions are <b>not transfers<\/b>. They may be treated only as an agreement to sell, which Meera can use to claim <b>specific performance<\/b> or defend possession."}, {"dur": 4400, "bg": ["#0f1e3d", "#0a1428"], "kicker": "SCENE 5", "title": "Lesson", "chars": [{"ch": "meera", "x": 400, "y": 300, "mood": "cool"}], "bubbles": [{"x": 110, "y": 60, "w": 580, "t": "Buying a flat? Insist on a registered sale deed. Pay the stamp duty.", "tail": "l"}], "sub": "No registered deed, no title ✅", "exp": "Stamp duty is the price of a secure title. <i>Story is fictional; the rule is real.<\/i>"}]}, {"type": "memcode", "id": "mc1", "h": "Memory code · five modes of transfer", "phrase": "SMLEG", "tip": "“SMiLE, G!” — every property deal should end with a smile: Sale, Mortgage, Lease, Exchange, Gift.", "letters": [["S", "Sale", "s.54 — ownership for a price"], ["M", "Mortgage", "s.58 — interest to secure a loan"], ["L", "Lease", "s.105 — right to enjoy for a period, for rent"], ["E", "Exchange", "s.118 — ownership for ownership"], ["G", "Gift", "s.122 — ownership without consideration"]]}], "glossary": {"property": "Anything over which rights of ownership can be exercised and enforced against the world.", "immovable property": "Land, benefits arising out of land, and things attached to the earth (General Clauses Act, s.3(26)); excludes standing timber, growing crops and grass (s.3 TPA).", "movable property": "Property of every description except immovable property, e.g. vehicles, furniture, money.", "tangible property": "Property that has a physical existence and can be touched.", "intangible property": "Property without physical existence, e.g. copyright, patents, shares, goodwill.", "ownership": "The most complete right a person can have over a thing: to possess, use, enjoy, transfer and destroy it.", "possession": "Physical control over a thing with the intention to exercise that control (corpus and animus).", "transfer of property": "An act by which a living person conveys property, in present or future, to one or more living persons or to himself (s.5 TPA).", "transferor": "The person who transfers property.", "transferee": "The person to whom property is transferred.", "sale": "Transfer of ownership in exchange for a price paid or promised or part-paid and part-promised (s.54).", "mortgage": "Transfer of an interest in specific immovable property to secure the payment of a loan (s.58).", "lease": "Transfer of a right to enjoy immovable property for a certain time, in consideration of a price, money or service (s.105).", "exchange": "Mutual transfer of ownership of one thing for ownership of another, neither being money only (s.118).", "gift": "Voluntary transfer of existing property without consideration, accepted by the donee during the donor’s lifetime (s.122).", "mortgagor": "The person who mortgages property to borrow money.", "mortgagee": "The lender to whom the property is mortgaged.", "lessor": "The owner who grants the lease.", "lessee": "The tenant who takes the lease.", "donor": "The person who makes the gift.", "donee": "The person who receives the gift.", "spes successionis": "A mere chance of inheriting property; it cannot be transferred (s.6(a)).", "general power of attorney": "A document authorising one person to act on behalf of another; it does not transfer ownership."}, "mspec": {"m1": {"aria": "Sorting objects into movable and immovable property", "sky": ["#f6f1e4", "#eee3c8"], "ground": "#c9a54b", "objs": [{"id": "m", "k": "box", "x": 200, "y": 200, "w": 180, "h": 80, "c": "#2f6f8f", "e": "🚲", "t": "Movable"}, {"id": "i", "k": "box", "x": 600, "y": 200, "w": 180, "h": 80, "c": "#9a7228", "e": "🏠", "t": "Immovable"}, {"id": "x", "k": "emoji", "x": 400, "y": 110, "t": "🌳", "fs": 46}], "steps": [{"t": 200, "c": "A tree rooted in land…", "do": []}, {"t": 1800, "c": "Attached to earth → <b>immovable<\/b>", "do": [{"id": "x", "to": {"x": 600}, "ms": 800}]}, {"t": 3600, "c": "Cut timber sold for wood…", "do": [{"id": "x", "text": "🪵"}, {"id": "x", "to": {"x": 400}, "ms": 500}]}, {"t": 5200, "c": "→ <b>movable<\/b> (standing timber is excluded in s.3 TPA)", "big": 1, "do": [{"id": "x", "to": {"x": 200}, "ms": 800}]}]}, "m2": {"aria": "Owner and possessor separated by a lease", "sky": ["#0f1e3d", "#0a1428"], "ground": "#1c1f26", "objs": [{"id": "o", "k": "box", "x": 180, "y": 200, "w": 160, "h": 80, "c": "#2f6f8f", "e": "🧑", "t": "Owner"}, {"id": "h", "k": "box", "x": 400, "y": 120, "w": 150, "h": 70, "c": "#5b3d1c", "e": "🏠", "t": "Flat"}, {"id": "t", "k": "box", "x": 620, "y": 200, "w": 160, "h": 80, "c": "#9a7228", "e": "👩", "t": "Tenant"}], "steps": [{"t": 200, "c": "Owner holds title 📜", "do": [{"pulse": "o"}]}, {"t": 1800, "c": "Gives keys on lease", "do": [{"fly": {"from": "o", "to": "t", "e": "🔑", "n": 2}}]}, {"t": 3600, "c": "Tenant now has <b>possession<\/b>", "do": [{"pulse": "t"}]}, {"t": 5200, "c": "Owner still has <b>ownership<\/b>", "big": 1, "do": [{"pulse": "o"}]}]}, "m3": {"aria": "A registered sale deed beats a GPA", "sky": ["#f6f1e4", "#eee3c8"], "ground": "#c9a54b", "objs": [{"id": "g", "k": "box", "x": 200, "y": 200, "w": 170, "h": 80, "c": "#6b7280", "e": "📄", "t": "GPA + will"}, {"id": "s", "k": "box", "x": 600, "y": 200, "w": 170, "h": 80, "c": "#2f6f8f", "e": "📜", "t": "Registered deed"}, {"id": "r", "k": "text", "x": 400, "y": 330, "t": "", "fs": 24, "c": "#a63d32"}], "steps": [{"t": 200, "c": "Two buyers claim the same flat", "do": []}, {"t": 1800, "c": "One holds a GPA and a will", "do": [{"shake": "g"}]}, {"t": 3400, "c": "One holds a registered sale deed", "do": [{"pulse": "s"}]}, {"t": 5200, "c": "Title passes only by <b>registered conveyance<\/b>", "big": 1, "do": [{"id": "r", "text": "Suraj Lamp (SC, 2011)"}]}]}, "m4": {"aria": "Five modes of transfer shown as five arrows", "sky": ["#0f1e3d", "#0a1428"], "ground": "#1c1f26", "objs": [{"id": "a", "k": "box", "x": 150, "y": 200, "w": 150, "h": 80, "c": "#c9a54b", "e": "🏠", "t": "Property", "tc": "#0f1e3d"}, {"id": "b", "k": "box", "x": 620, "y": 200, "w": 170, "h": 80, "c": "#2f6f8f", "e": "👩", "t": "Transferee"}, {"id": "l", "k": "text", "x": 400, "y": 110, "t": "", "fs": 26, "c": "#c9a54b"}], "steps": [{"t": 200, "c": "For a price → <b>sale<\/b>", "do": [{"id": "l", "text": "💰 SALE"}, {"fly": {"from": "a", "to": "b", "e": "💰", "n": 2}}]}, {"t": 1700, "c": "To secure a loan → <b>mortgage<\/b>", "do": [{"id": "l", "text": "🏦 MORTGAGE"}]}, {"t": 3200, "c": "For rent, for a time → <b>lease<\/b>", "do": [{"id": "l", "text": "🔑 LEASE"}]}, {"t": 4700, "c": "For another property → <b>exchange<\/b>", "do": [{"id": "l", "text": "🔁 EXCHANGE"}]}, {"t": 6200, "c": "For nothing, out of love → <b>gift<\/b>", "big": 1, "do": [{"id": "l", "text": "🎁 GIFT"}]}]}}, "steps": [{"id": "s1", "e": "🏠", "t": "Meaning and Kinds of Property", "nav": "Kinds of property", "motion": ["Movable or immovable?", "m1"], "ks": {"title": "Property and its kinds", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Kinds of property: movable and immovable, tangible and intangible\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#0f1e3d\"/><g font-family=\"Poppins,sans-serif\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#f6f1e4\" font-size=\"11\"><rect x=\"13\" y=\"26\" width=\"124\" height=\"68\" rx=\"12\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"75\" y=\"54\" font-size=\"22\">🏠<\/text><text x=\"75\" y=\"74\">Immovable<\/text><text x=\"75\" y=\"87\" font-size=\"9\" fill=\"#c9a54b\">land, building<\/text><rect x=\"163\" y=\"26\" width=\"124\" height=\"68\" rx=\"12\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"225\" y=\"54\" font-size=\"22\">🚲<\/text><text x=\"225\" y=\"74\">Movable<\/text><text x=\"225\" y=\"87\" font-size=\"9\" fill=\"#c9a54b\">bike, phone<\/text><rect x=\"13\" y=\"106\" width=\"124\" height=\"68\" rx=\"12\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"75\" y=\"134\" font-size=\"22\">📦<\/text><text x=\"75\" y=\"154\">Tangible<\/text><text x=\"75\" y=\"167\" font-size=\"9\" fill=\"#c9a54b\">can be touched<\/text><rect x=\"163\" y=\"106\" width=\"124\" height=\"68\" rx=\"12\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"225\" y=\"134\" font-size=\"22\">💡<\/text><text x=\"225\" y=\"154\">Intangible<\/text><text x=\"225\" y=\"167\" font-size=\"9\" fill=\"#c9a54b\">copyright, shares<\/text><\/g><\/svg>", "simple": "<b>Property<\/b> is anything over which a person can exercise <b>rights of ownership<\/b>. Kinds: <b>movable / immovable<\/b>, <b>tangible / intangible<\/b>, <b>corporeal / incorporeal<\/b>.", "pts": [["🏠", "<b>Immovable<\/b>: land, benefits arising out of land, things attached to the earth (General Clauses Act, s.3(26))."], ["🌾", "TPA s.3: immovable property does <b>not<\/b> include standing timber, growing crops or grass."], ["🚲", "<b>Movable<\/b>: everything that is not immovable — vehicles, jewellery, money, goods."], ["💡", "<b>Intangible<\/b>: copyright, patents, trademarks, shares, goodwill."]], "an": "If you can carry it away without breaking the earth, it is usually movable.", "ex": "Property means anything which can be owned, including rights that can be enforced against the world. Property is classified as: (1) movable and immovable — immovable property includes land, benefits to arise out of land and things attached to the earth or permanently fastened to anything attached to the earth (s.3(26), General Clauses Act, 1897); under s.3 of the Transfer of Property Act, 1882, immovable property does not include standing timber, growing crops or grass; movable property is property of every description except immovable property; (2) tangible and intangible — tangible property has physical existence, intangible property (such as copyrights, patents and shares) does not; (3) corporeal and incorporeal — corporeal rights are rights over material things, incorporeal rights are rights over immaterial things or rights over the property of another, such as easements."}, "words": ["property", "immovable property", "movable property", "tangible property", "intangible property"], "act": {"type": "dragsort", "id": "s1g", "h": "🎮 Movable or immovable?", "try": "Drag each item into the right box. Ask: is it attached to the earth?", "learn": "Land and things permanently attached to it are <b>immovable<\/b>. Standing timber, growing crops and grass are treated as movable under the TPA.", "bins": [{"t": "Immovable", "e": "🏠"}, {"t": "Movable", "e": "🚲"}], "items": [["A two-storey house", 0, "Attached to the earth.", "🏡"], ["A laptop", 1, "Can be carried away.", "💻"], ["A right of way across a neighbour’s land", 0, "A benefit arising out of land.", "🛤️"], ["Standing timber meant to be cut and sold", 1, "Excluded by s.3 TPA.", "🪵"], ["A borewell fixed in a farm", 0, "Permanently attached.", "💧"], ["Gold jewellery", 1, "Movable goods.", "💍"], ["Growing wheat crop", 1, "Excluded by s.3 TPA.", "🌾"]]}, "quiz": [["Under s.3 TPA, immovable property does NOT include…", ["Standing timber", "A building", "Land", "A right of way"], ""], ["A copyright is…", ["Intangible property", "Immovable property", "Not property", "Tangible property"], ""], ["Immovable property is defined in…", ["s.3(26) General Clauses Act", "s.10 Contract Act", "BNS s.356", "Constitution Art. 21"], ""]], "line": "<b>Immovable<\/b> = land + attached things; <b>movable<\/b> = everything else. Copyright, shares = <b>intangible<\/b>."}, {"id": "s2", "e": "🔑", "t": "Ownership and Possession", "nav": "Ownership & possession", "motion": ["Owner vs tenant", "m2"], "ks": {"title": "Ownership vs possession", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Ownership is the right; possession is the control\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#eee3c8\"/><g font-family=\"Poppins,sans-serif\" font-weight=\"700\" text-anchor=\"middle\"><rect x=\"18\" y=\"30\" width=\"122\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#2f6f8f\" stroke-width=\"3\"/><text x=\"79\" y=\"80\" font-size=\"34\">📜<\/text><text x=\"79\" y=\"112\" font-size=\"12\" fill=\"#2f6f8f\">OWNERSHIP<\/text><text x=\"79\" y=\"132\" font-size=\"9.5\" fill=\"#0f1e3d\">the legal right (de jure)<\/text><rect x=\"160\" y=\"30\" width=\"122\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#9a7228\" stroke-width=\"3\"/><text x=\"221\" y=\"80\" font-size=\"34\">🔑<\/text><text x=\"221\" y=\"112\" font-size=\"12\" fill=\"#9a7228\">POSSESSION<\/text><text x=\"221\" y=\"132\" font-size=\"9.5\" fill=\"#0f1e3d\">physical control (de facto)<\/text><text x=\"150\" y=\"186\" font-size=\"11\" fill=\"#0f1e3d\">A landlord owns; a tenant possesses<\/text><\/g><\/svg>", "simple": "<b>Ownership<\/b> = the fullest legal right over a thing. <b>Possession<\/b> = physical control with the intention to control (<b>corpus + animus<\/b>).", "pts": [["📜", "Owner’s rights: possess, use, enjoy, transfer, destroy, exclude others."], ["🔑", "Possession needs <b>corpus<\/b> (physical control) and <b>animus<\/b> (intention to possess)."], ["⚖️", "“Possession is nine points of the law” — a possessor is protected even against others with weaker claims."], ["🪢", "They can be split: landlord/tenant, pledgor/pledgee, owner/finder."]], "an": "Ownership is your name on the phone’s purchase bill; possession is the phone in your hand.", "ex": "Ownership is the relation between a person and a right which is vested in him; it is the most comprehensive right a person can have over a thing, including the right to possess, use, enjoy, alienate and destroy it, and to exclude others. Possession is the continued exercise of a claim to the exclusive use of a thing; it has two elements — corpus possessionis (physical control) and animus possidendi (intention to possess). Ownership is a de jure (legal) relation, possession a de facto (factual) one. The two may exist together or separately: the owner of a house let out on lease retains ownership while the tenant holds possession. The law protects possession even against persons other than the true owner, and possession can, in time, ripen into ownership through adverse possession under the Limitation Act, 1963."}, "words": ["ownership", "possession"], "extra": [{"type": "cmp", "h": "Ownership vs possession", "heads": ["Basis", "Ownership", "Possession"], "rows": [["Nature", "Legal right (de jure)", "Physical fact (de facto)"], ["Elements", "Title recognised by law", "Corpus + animus"], ["Duration", "Lasts until transferred or lost", "Can be temporary"], ["Example", "Landlord owns the flat", "Tenant lives in the flat"], ["Transfer", "By sale, gift, etc.", "By delivery"]]}], "flips": {"h": "Who owns, who possesses? · tap", "items": [["🏬", "Your car is in a service centre", "You still own it.", "Service centre has possession (bailment)."], ["📚", "You lend a book to a friend", "Ownership stays with you.", "Friend possesses it."], ["👛", "You find a wallet on the road", "Owner keeps ownership.", "Finder has possession and must try to return it."], ["🏦", "Gold kept in a bank locker", "You own and, legally, possess it.", "Bank has custody, not possession."], ["🏠", "Flat given on rent", "Landlord owns.", "Tenant possesses."], ["💍", "Gold pledged for a loan", "Borrower owns.", "Lender (pledgee) possesses."]]}, "act": {"type": "tfrush", "id": "s2t", "h": "⚡ True or False Rush", "try": "3 lives. Read the rule after each answer.", "learn": "Ownership is the right; possession is control plus intention. They can be held by different people.", "items": [["A tenant is the owner of the rented flat.", false, "The tenant has possession only."], ["Possession has two elements: corpus and animus.", true, ""], ["A finder of goods has possession of them.", true, "But not ownership."], ["Ownership and possession always go together.", false, "They are often split."], ["Ownership includes the right to transfer the property.", true, ""], ["Possession is a legal fact; ownership is a physical fact.", false, "It is the other way round."]]}, "quiz": [["Physical control over a thing is…", ["Corpus", "Animus", "Title", "Easement"], ""], ["A landlord who has let out his flat has…", ["Ownership", "Possession only", "Neither", "Custody"], ""], ["Ownership is a…", ["De jure relation", "De facto relation", "Crime", "Contract"], ""]], "line": "<b>Ownership<\/b> = right. <b>Possession<\/b> = corpus + animus. They can be split."}, {"id": "s3", "e": "📜", "t": "Transfer of Property", "nav": "Transfer", "motion": ["Registered deed vs GPA", "m3"], "ks": {"title": "Transfer of property (TPA, 1882)", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Transfer of property: a living person conveys property to another living person\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#0f1e3d\"/><g font-family=\"Poppins,sans-serif\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#f6f1e4\"><text x=\"55\" y=\"96\" font-size=\"40\">🧑<\/text><text x=\"55\" y=\"130\" font-size=\"11\">Transferor<\/text><text x=\"245\" y=\"96\" font-size=\"40\">👩<\/text><text x=\"245\" y=\"130\" font-size=\"11\">Transferee<\/text><path d=\"M92 84 H208\" stroke=\"#c9a54b\" stroke-width=\"4\"/><text x=\"150\" y=\"74\" font-size=\"11\" fill=\"#c9a54b\">conveys property<\/text><text x=\"150\" y=\"170\" font-size=\"12\">s.5 TPA: between living persons<\/text><\/g><text font-size=\"24\"><animateMotion dur=\"3s\" repeatCount=\"indefinite\" path=\"M100 92 H200\"/>🏠<\/text><\/svg>", "simple": "<b>s.5:<\/b> “Transfer of property” means an act by which a <b>living person<\/b> conveys property, in present or in future, to one or more other living persons, or to himself and others.", "pts": [["🧑‍🤝‍🧑", "Between <b>living persons<\/b> — a company or association also counts as a living person."], ["✅", "<b>s.6<\/b>: property of any kind may be transferred, except as provided."], ["🚫", "Not transferable: <b>spes successionis<\/b> (chance of inheriting), a mere right to sue, a public office, future maintenance, a right of re-entry alone."], ["📝", "<b>Registration<\/b>: sale of immovable property of ₹100 or more needs a registered instrument (s.54); see also s.17 Registration Act, 1908."]], "an": "A transfer is like handing over a baton in a relay — both runners must be in the race (alive) at the time.", "ex": "Section 5 of the Transfer of Property Act, 1882 defines transfer of property as an act by which a living person conveys property, in present or in future, to one or more other living persons, or to himself and one or more other living persons. “Living person” includes a company, association or body of individuals, whether incorporated or not. Under Section 6, property of any kind may be transferred, except: (a) the chance of an heir-apparent succeeding to an estate (spes successionis); (b) a mere right of re-entry for breach of a condition; (c) an easement apart from the dominant heritage; (d) an interest restricted in its enjoyment to the owner personally; (dd) a right to future maintenance; (e) a mere right to sue; (f) a public office or the salary of a public officer; (g) certain pensions. Essentials of a valid transfer: competent transferor, transferable property, transfer to a living person, lawful object and consideration, and compliance with formalities such as writing and registration."}, "words": ["transfer of property", "transferor", "transferee", "spes successionis", "general power of attorney"], "codes": [{"type": "memcode", "id": "mc3", "h": "Memory code · what CANNOT be transferred (s.6)", "phrase": "SPERM-RIP", "tip": "A long one — read it aloud once: Spes, Pension, Easement alone, Re-entry, Maintenance, Right to sue, Interest personal, Public office.", "letters": [["S", "Spes successionis", "chance of inheriting"], ["P", "Pensions", "certain military/civil pensions"], ["E", "Easement", "apart from the dominant land"], ["R", "Re-entry", "mere right of re-entry"], ["M", "Maintenance", "right to future maintenance"], ["R", "Right to sue", "a mere right to sue"], ["I", "Interest personal", "restricted to the owner personally"], ["P", "Public office", "or salary of a public officer"]]}], "act": {"type": "gate", "id": "s3g", "h": "🚪 Transfer Gate · can this be transferred?", "try": "Read each file. Tap the <b>s.6 bar<\/b> that blocks the transfer, or the gold button if it is a <b>valid transfer<\/b>.", "learn": "Most property can be transferred (s.6), but a few things cannot — and a transfer must be between living persons.", "allText": "✅ Valid transfer", "okText": "<b>Valid transfer.<\/b>", "stopText": "Blocked by:", "hint": "<b>Tap the bar<\/b> that blocks it, or the gold button if valid.", "gates": [["🎲", "Chance of inheriting", "s.6(a)", "Spes"], ["⚖️", "Mere right to sue", "s.6(e)", "Sue"], ["🏛️", "Public office", "s.6(f)", "Office"], ["🍲", "Future maintenance", "s.6(dd)", "Maint."], ["👶", "Not a living person", "s.5", "Unborn"]], "scenarios": [{"e": "🏠", "t": "Ravi (40) sells his flat to Neha by a registered sale deed for ₹60 lakh.", "fail": -1, "why": "Transferable property, living persons, registered."}, {"e": "👴", "t": "Aman sells to his friend “whatever I will inherit when my father dies”.", "fail": 0, "result": "void", "why": "A mere chance of inheritance cannot be transferred."}, {"e": "📃", "t": "Priya transfers to a company her right to sue a neighbour for trespass damages.", "fail": 1, "result": "void", "why": "A mere right to sue cannot be transferred."}, {"e": "🏛️", "t": "A tehsildar agrees to transfer his post and salary to his nephew.", "fail": 2, "result": "void", "why": "A public office cannot be transferred."}, {"e": "🍲", "t": "A divorced wife sells her right to future maintenance for a lump sum.", "fail": 3, "result": "void", "why": "Right to future maintenance is personal."}, {"e": "🏢", "t": "A trader transfers his shop to a registered private company by a registered deed.", "fail": -1, "why": "A company is a “living person” under s.5."}, {"e": "👶", "t": "Kunal transfers land directly to a grandson who is not yet born, with no prior interest to anyone.", "fail": 4, "result": "void", "why": "Transfer must be to a living person; an interest for an unborn person needs a prior interest (s.13)."}], "endText": "Most things can be transferred — but not chances, personal rights or public offices."}, "extra": [{"type": "casebrief", "id": "cb1", "h": "Real case · Suraj Lamp & Industries v. State of Haryana", "name": "Suraj Lamp & Industries Pvt. Ltd. v. State of Haryana", "court": "Supreme Court of India", "year": "Decided 11 October 2011", "cite": "(2012) 1 SCC 656 · [2011] 11 SCR 848", "bench": "R.V. Raveendran, A.K. Patnaik, H.L. Gokhale JJ.", "label": "Real Indian case · Registration and title", "facts": "<p>Across India, especially in Delhi and Haryana, people were “buying” flats and plots without a registered sale deed. Instead, the seller signed three documents: a <b>Sale Agreement<\/b>, a <b>General Power of Attorney<\/b> and a <b>Will<\/b> in the buyer’s favour — the <b>SA/GPA/Will<\/b> method. It avoided stamp duty and registration fees, and was often used to hide black money.<\/p><p>The Supreme Court examined whether such transactions transfer ownership.<\/p>", "issue": "<p>Do SA/GPA/Will transactions amount to a <b>transfer<\/b> or <b>sale<\/b> of immovable property under the Transfer of Property Act?<\/p>", "args": [["For those relying on GPA sales", "Full price was paid and possession given; the documents show the seller intended to transfer. Courts have accepted such transfers before."], ["For the State", "Under s.54 TPA, immovable property can be sold only by a registered instrument. A GPA is only an agency; a will takes effect only on death. These transactions cause loss of revenue and fraud."]], "predict": {"q": "What did the Supreme Court hold?", "opts": ["SA/GPA/Will transactions do not transfer title; only a registered deed of conveyance does", "They are complete sales if full price is paid", "They are valid only in Delhi", "A GPA makes the attorney the owner"], "why": "s.54 TPA and the Registration Act require a registered instrument for sale of immovable property."}, "decision": "<p>The Court held that immovable property can be legally and lawfully transferred <b>only by a registered deed of conveyance<\/b>. SA/GPA/Will transactions are <b>not transfers or sales<\/b> and do not convey title. They may be treated as an <b>agreement to sell<\/b>, and can be used to seek specific performance or to defend possession (s.53A).<\/p>", "principle": "<p><b>No registered conveyance, no title.<\/b> A power of attorney, even an irrevocable one, does not transfer ownership; a will transfers property only after the testator’s death.<\/p>", "exam": "“In Suraj Lamp & Industries v. State of Haryana (2011), the Supreme Court held that SA/GPA/Will transactions do not convey title; immovable property can be transferred only by a registered deed.”", "today": "A property dealer offers you a flat “on GPA” at a lower price. Under this rule you would not become the owner.", "src": [["Supreme Court judgment (Indian Kanoon)", "https://indiankanoon.org/doc/1565619/"], ["Transfer of Property Act, 1882 — India Code", "https://www.indiacode.nic.in/handle/123456789/2338"]]}], "quiz": [["Transfer of property under s.5 TPA is between…", ["Living persons", "A living and a dead person", "Only individuals", "Only the State"], ""], ["Which cannot be transferred?", ["Spes successionis", "A house", "Shares", "A car"], "s.6(a)."], ["Suraj Lamp (2011) held that title to immovable property passes by…", ["A registered deed of conveyance", "A GPA", "An unregistered agreement", "A will during the seller’s lifetime"], ""]], "line": "Transfer = between <b>living persons<\/b> (s.5). Most property transferable (s.6). <b>No registered deed, no title<\/b>."}, {"id": "s4", "e": "🔁", "t": "Modes of Transfer", "nav": "Sale, mortgage, lease…", "motion": ["Five ways to transfer", "m4"], "ks": {"title": "Sale, mortgage, lease, exchange, gift", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Five modes of transfer: sale, mortgage, lease, exchange, gift\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#eee3c8\"/><g font-family=\"Poppins\" font-weight=\"700\" font-size=\"10\" text-anchor=\"middle\" fill=\"#0f1e3d\"><rect x=\"15\" y=\"60\" width=\"50\" height=\"80\" rx=\"10\" fill=\"#2f6f8f\"/><text x=\"40\" y=\"108\" font-size=\"22\">💰<\/text><text x=\"40\" y=\"160\">Sale s.54<\/text><rect x=\"70\" y=\"60\" width=\"50\" height=\"80\" rx=\"10\" fill=\"#9a7228\"/><text x=\"95\" y=\"108\" font-size=\"22\">🏦<\/text><text x=\"95\" y=\"160\">Mortgage s.58<\/text><rect x=\"125\" y=\"60\" width=\"50\" height=\"80\" rx=\"10\" fill=\"#c9a54b\"/><text x=\"150\" y=\"108\" font-size=\"22\">🔑<\/text><text x=\"150\" y=\"160\">Lease s.105<\/text><rect x=\"180\" y=\"60\" width=\"50\" height=\"80\" rx=\"10\" fill=\"#323338\"/><text x=\"205\" y=\"108\" font-size=\"22\">🔁<\/text><text x=\"205\" y=\"160\">Exchange s.118<\/text><rect x=\"235\" y=\"60\" width=\"50\" height=\"80\" rx=\"10\" fill=\"#a63d32\"/><text x=\"260\" y=\"108\" font-size=\"22\">🎁<\/text><text x=\"260\" y=\"160\">Gift s.122<\/text><\/g><text x=\"150\" y=\"36\" text-anchor=\"middle\" font-family=\"Playfair Display,Georgia,serif\" font-weight=\"700\" font-size=\"15\" fill=\"#0f1e3d\">Modes of transfer<\/text><\/svg>", "simple": "The TPA lays down five main modes: <b>sale<\/b> (s.54), <b>mortgage<\/b> (s.58), <b>lease<\/b> (s.105), <b>exchange<\/b> (s.118) and <b>gift<\/b> (s.122).", "pts": [["💰", "<b>Sale<\/b>: transfer of <b>ownership<\/b> for a <b>price<\/b>. Immovable property of ₹100+ → registered instrument."], ["🏦", "<b>Mortgage<\/b>: transfer of an <b>interest<\/b> in specific immovable property to <b>secure a loan<\/b>."], ["🔑", "<b>Lease<\/b>: transfer of a <b>right to enjoy<\/b> property for a <b>certain time<\/b>, for rent; ownership stays with the lessor."], ["🔁🎁", "<b>Exchange<\/b>: ownership for ownership. <b>Gift<\/b>: ownership <b>without consideration<\/b>, accepted in the donor’s lifetime; immovable gift → registered instrument (s.123)."]], "an": "Sale sells the whole cake; mortgage pledges the cake as a guarantee; lease lets someone eat slices for a while; exchange swaps cakes; gift gives the cake away.", "ex": "Sale (s.54): a transfer of ownership in exchange for a price paid or promised or part-paid and part-promised; sale of tangible immovable property of value ₹100 or upwards can be made only by a registered instrument. Mortgage (s.58): the transfer of an interest in specific immovable property for the purpose of securing the payment of money advanced by way of loan; the transferor is the mortgagor, the transferee the mortgagee. Lease (s.105): a transfer of a right to enjoy immovable property, made for a certain time, in consideration of a price paid or promised, or of money, a share of crops, service or any other thing of value; a lease from year to year or for more than one year must be by registered instrument (s.107). Exchange (s.118): when two persons mutually transfer the ownership of one thing for the ownership of another, neither thing or both things being money only. Gift (s.122): the transfer of certain existing movable or immovable property made voluntarily and without consideration by the donor to the donee, and accepted by or on behalf of the donee during the donor’s lifetime; a gift of immovable property must be by registered instrument signed by the donor and attested by at least two witnesses (s.123)."}, "words": ["sale", "mortgage", "mortgagor", "mortgagee", "lease", "lessor", "lessee", "exchange", "gift", "donor", "donee"], "flips": {"h": "Name the mode · tap", "items": [["💰", "Sold a plot for ₹25 lakh by registered deed", "Ownership for a price.", "Sale (s.54)."], ["🏦", "Pledged the house to a bank for a home loan", "Interest in property to secure a loan.", "Mortgage (s.58)."], ["🔑", "Rented a shop for 3 years at ₹40,000 a month", "Right to enjoy for a time, for rent.", "Lease (s.105)."], ["🔁", "Swapped a Gurgaon flat for a Noida flat", "Ownership for ownership.", "Exchange (s.118)."], ["🎁", "Father transfers a flat to his daughter, free, by registered deed", "No consideration.", "Gift (s.122–123)."], ["⚰️", "Donor dies before the donee accepts", "Acceptance must be in the donor’s lifetime.", "Gift is void (s.122)."]]}, "act": {"type": "boss", "id": "s4b", "name": "The Deed Dragon", "emoji": "🐉", "h": "🐉 Boss battle · name the transfer", "try": "Each right answer hits the dragon. 3 lives.", "learn": "Price → sale. Loan security → mortgage. Rent for a time → lease. Property for property → exchange. Nothing in return → gift.", "items": [["A sells his car to B for ₹5 lakh.", ["Sale", "Exchange", "Gift", "Lease"], "Ownership for a price."], ["A transfers his farmhouse to the bank as security for a ₹50 lakh loan.", ["Mortgage", "Sale", "Lease", "Gift"], "Interest to secure a loan."], ["A lets out his godown to B for 11 months at a monthly rent.", ["Lease", "Mortgage", "Exchange", "Sale"], "Right to enjoy for a time."], ["A gives his land to B, and B gives his shop to A.", ["Exchange", "Sale", "Gift", "Lease"], "Ownership for ownership."], ["A transfers his flat to his niece free of cost by a registered deed she accepts.", ["Gift", "Sale", "Lease", "Mortgage"], "No consideration."], ["A gives B a plot in return for ₹10 lakh plus B’s old car.", ["Sale (price partly money)", "Exchange", "Gift", "Lease"], "Where a price is paid, it is a sale; exchange needs neither thing being money only."], ["A promises to gift his house to B but dies before B accepts.", ["Gift is void", "Valid gift", "Valid sale", "Lease"], "Acceptance must be during the donor’s lifetime."], ["Sale of a ₹30 lakh flat is made by an unregistered paper.", ["Does not transfer ownership", "Valid sale", "Valid gift", "Valid lease"], "s.54 needs a registered instrument."]]}, "extra": [{"type": "docfill", "id": "s4d", "h": "📝 Draft it right · a gift deed", "try": "Complete the gift deed so it is valid under ss.122–123 TPA.", "title": "Gift Deed", "doc": "This Deed of Gift is made on 5 May 2027 by Mr. Arjun Rao (the Donor) in favour of his son Kabir Rao (the Donee). The Donor, out of natural love and affection and {0}, transfers to the Donee the flat No. 302, Green Towers, Pune, which {1}. The Donee {2} during the lifetime of the Donor. This deed is {3} and is {4}.<br><br>Signed: Arjun Rao (Donor) · Kabir Rao (Donee)", "blanks": [["without any consideration", "for a price of ₹40 lakh", "in return for Kabir’s car", "A gift is made without consideration (s.122)."], ["the Donor presently owns", "the Donor hopes to buy next year", "the Donor may inherit later", "Only existing property can be gifted; a gift of future property is void (s.124)."], ["hereby accepts the gift", "will decide after the Donor’s death", "rejects the gift", "Acceptance must be during the donor’s lifetime."], ["signed by the Donor and attested by at least two witnesses", "signed by nobody", "attested by the Donee only", "s.123 requirement."], ["registered with the Sub-Registrar", "kept unregistered to save fees", "posted on social media", "A gift of immovable property needs a registered instrument (s.123)."]], "done": "Existing property, no consideration, accepted in the donor’s lifetime, signed, attested and registered — a valid gift."}, {"type": "cmp", "h": "Modes of transfer at a glance", "heads": ["Mode", "Section", "What passes", "Consideration"], "rows": [["Sale", "54", "Ownership", "Price (money)"], ["Mortgage", "58", "Interest (security)", "Loan"], ["Lease", "105", "Right to enjoy for a time", "Rent / premium"], ["Exchange", "118", "Ownership for ownership", "Another property"], ["Gift", "122", "Ownership", "None"]]}], "quiz": [["Transfer of ownership for a price is…", ["Sale", "Lease", "Gift", "Mortgage"], ""], ["A gift must be accepted…", ["During the donor’s lifetime", "After the donor’s death", "Within 10 years", "Never"], ""], ["Lease is defined in…", ["s.105", "s.54", "s.122", "s.5"], ""]], "line": "<b>SMLEG<\/b>: Sale (price) · Mortgage (loan) · Lease (rent) · Exchange (property) · Gift (nothing)."}], "board": {"after": 3, "title": "Property Town in 3D", "try": "Tap each building to see the transfer that happens there.", "modes": [{"id": "flow", "label": "🏠 Five transfers", "kit": "flow", "tag": "TRANSFER OF PROPERTY ACT", "title": "Who gets what?", "intro": "Tokens show what passes from the owner. Tap anything.", "nodes": [{"id": "o", "label": "Owner", "emoji": "🧑", "x": -16, "z": 0, "shape": "house", "color": "#c9a54b", "info": "Transferor: must be competent and own transferable property."}, {"id": "b", "label": "Buyer", "emoji": "💰", "x": 6, "z": -12, "shape": "house", "color": "#2f6f8f", "info": "Sale (s.54): ownership for a price; registered deed for immovable property ₹100+."}, {"id": "k", "label": "Bank", "emoji": "🏦", "x": 14, "z": -3, "shape": "bank", "color": "#9a7228", "info": "Mortgage (s.58): interest in property to secure a loan."}, {"id": "t", "label": "Tenant", "emoji": "🔑", "x": 14, "z": 6, "shape": "shop", "color": "#323338", "info": "Lease (s.105): right to enjoy for a time, for rent."}, {"id": "d", "label": "Donee", "emoji": "🎁", "x": 4, "z": 13, "shape": "house", "color": "#a63d32", "info": "Gift (s.122–123): no consideration; accepted in donor’s lifetime; registered if immovable."}], "edges": [{"from": "o", "to": "b", "color": "#2f6f8f", "label": "sale", "group": "s"}, {"from": "o", "to": "k", "color": "#9a7228", "label": "mortgage", "group": "m"}, {"from": "o", "to": "t", "color": "#323338", "label": "lease", "group": "l"}, {"from": "o", "to": "d", "color": "#a63d32", "label": "gift", "group": "g"}], "groups": [{"id": "s", "label": "Sale", "say": ["Sale on", "hidden"]}, {"id": "m", "label": "Mortgage", "say": ["Mortgage on", "hidden"]}, {"id": "l", "label": "Lease", "say": ["Lease on", "hidden"]}, {"id": "g", "label": "Gift", "say": ["Gift on", "hidden"]}], "note": "Parties are fictional; sections are from the Transfer of Property Act, 1882."}]}, "summary": {"blocks": [{"type": "speed", "id": "sp1", "h": "⚡ 60-second Rapid Ruling", "secs": 60, "items": [["Transfer of property is defined in…", ["s.5 TPA", "s.54 TPA", "s.10 Contract Act", "s.17 Registration Act"], ""], ["Growing crops are treated as…", ["Movable", "Immovable", "Intangible", "Not property"], ""], ["Copyright is…", ["Intangible", "Immovable", "Tangible", "Not transferable"], ""], ["Corpus + animus =", ["Possession", "Ownership", "Easement", "Mortgage"], ""], ["Chance of inheriting is…", ["Not transferable", "Transferable", "A lease", "A gift"], ""], ["Sale is defined in…", ["s.54", "s.58", "s.105", "s.122"], ""], ["Loan security transfer:", ["Mortgage", "Lease", "Gift", "Exchange"], ""], ["Gift needs…", ["No consideration", "A price", "Rent", "A loan"], ""], ["Suraj Lamp held GPA sales…", ["Do not convey title", "Are valid sales", "Are leases", "Are gifts"], ""], ["Immovable gift must be…", ["Registered", "Oral", "Secret", "Unwitnessed"], ""]]}, {"type": "memmatch", "id": "mm1", "h": "🃏 Match the term", "pairs": [["Mortgagor", "Borrower who pledges property"], ["Lessee", "Tenant"], ["Donee", "Receiver of a gift"], ["Spes successionis", "Chance of inheriting"], ["Suraj Lamp (2011)", "No registered deed, no title"]]}, {"type": "cmp", "h": "Frequently confused", "heads": ["Pair", "First", "Second"], "rows": [["Sale vs exchange", "Ownership for money", "Ownership for another thing"], ["Sale vs lease", "Ownership passes", "Only right to enjoy passes"], ["Mortgage vs sale", "Interest to secure a loan", "Full ownership for a price"], ["Ownership vs possession", "Legal right", "Physical control + intention"], ["Gift vs will", "Transfer between living persons, now", "Takes effect only on death (succession)"]]}], "line": "Property kinds · ownership vs possession · <b>s.5<\/b> transfer · <b>s.6<\/b> exceptions · <b>SMLEG<\/b> · Suraj Lamp: registered deed = title."}, "exam": {"qs": [{"m": 1, "q": "Define transfer of property.", "pts": ["An act by which a living person conveys property, in present or future, to one or more living persons (s.5 TPA)"]}, {"m": 1, "q": "What is spes successionis?", "pts": ["A mere chance of an heir succeeding to property; not transferable (s.6(a))"]}, {"m": 2, "q": "Distinguish between ownership and possession.", "pts": ["Ownership: legal right (de jure); possession: physical control (de facto)", "Ownership is permanent until transferred; possession can be temporary — e.g. landlord vs tenant"]}, {"m": 3, "q": "Explain the essentials of a valid gift.", "pts": ["Transfer of existing property without consideration", "Made voluntarily by the donor", "Accepted by the donee during the donor’s lifetime; immovable gift by registered, attested instrument (s.123)"]}, {"m": 4, "q": "Distinguish between sale and lease (four points).", "pts": ["Ownership passes vs only right to enjoy", "Permanent vs for a certain time", "Price vs rent/premium", "Transferee becomes owner vs lessor remains owner"]}, {"m": 4, "tag": "Case-based", "q": "Mohit paid ₹45 lakh to Naresh for a flat and received the keys, a General Power of Attorney and a will in his favour. Naresh later sold the same flat to Pooja by a registered sale deed. Who owns the flat? Support with a decided case.", "pts": ["Sale of immovable property needs a registered instrument (s.54)", "GPA and will do not transfer title", "Pooja owns the flat", "Suraj Lamp & Industries v State of Haryana (SC, 2011); Mohit may claim on the agreement to sell"]}, {"m": 6, "q": "Explain the modes of transfer of property under the Transfer of Property Act, 1882.", "pts": ["Sale — s.54", "Mortgage — s.58", "Lease — s.105", "Exchange — s.118", "Gift — ss.122–123", "Registration requirements for immovable property"]}, {"m": 6, "tag": "Competency-based", "q": "Identify the transaction and state one legal requirement: (a) A rents his shop to B for 3 years at ₹20,000 per month; (b) C transfers his house to a bank to secure a ₹30 lakh loan; (c) D transfers his plot to his sister without consideration; (d) E sells to F “whatever E will inherit from his uncle”.", "pts": ["(a) Lease (s.105) — lease above one year by registered instrument (s.107)", "(b) Mortgage (s.58) — interest in specific immovable property to secure a loan", "(c) Gift (s.122) — registered, attested; accepted in donor’s lifetime", "(d) Void — spes successionis cannot be transferred (s.6(a))"]}], "mcq": [["Assertion (A): A General Power of Attorney transfers ownership of immovable property to the attorney. Reason (R): Immovable property can be transferred only by a registered deed of conveyance.", ["A is false, but R is true", "Both A and R are true, and R explains A", "Both A and R are true, but R does not explain A", "A is true, but R is false"], "Suraj Lamp (2011).", "A–R"], ["Assertion (A): A gift of future property is void. Reason (R): A gift can be made only of existing property.", ["Both A and R are true, and R explains A", "Both A and R are true, but R does not explain A", "A is true, but R is false", "A is false, but R is true"], "s.124 read with s.122.", "A–R"], ["Ananya rents her flat to Vikram for 11 months at ₹25,000 per month. Who has ownership and who has possession?", ["Ananya: ownership; Vikram: possession", "Vikram: both", "Ananya: possession; Vikram: ownership", "Neither"], "", "Case-based"], ["Match: (i) s.54 (ii) s.58 (iii) s.105 (iv) s.122 with (P) Lease (Q) Gift (R) Sale (S) Mortgage", ["i-R, ii-S, iii-P, iv-Q", "i-S, ii-R, iii-Q, iv-P", "i-R, ii-P, iii-S, iv-Q", "i-Q, ii-S, iii-P, iv-R"], "", "Match"]]}, "next": "Next chapter · Unit 3D Intellectual Property Rights"};window.NF_IMG={};const MSPEC=window.NOTE.mspec||{};</script>

/* ---------- gate: the agreement token walks through the essentials of a valid contract ---------- */
NFX_IC.gate='🚪';
NFX.gate=function(h,x){

 h.innerHTML='<div class="lg"><div class="lg-stage"><div class="lg-row" style="justify-content:space-between"><span class="lg-pill lg-n"></span><span class="lg-pill lg-st"></span></div>'+

  '<div class="lg-row" style="justify-content:center;margin-top:12px"><button type="button" class="lg-gold lg-all">'+(x.allText||'✅ Every gate passes: it is a CONTRACT')+'</button></div><div class="lg-msg"></div></div></div>';
 const $=s=>h.querySelector(s),tok=$('.lg-tok'),gs=[...h.querySelectorAll('.lg-g')];
 function pos(j){const tr=$('.lg-track').getBoundingClientRect(),b=(j<0?null:gs[Math.min(j,gs.length-1)].getBoundingClientRect());tok.style.left=(j<0?-4:(j>=gs.length?tr.width-26:b.left-tr.left+b.width/2-14))+'px'}
 function load(){locked=false;gs.forEach(g=>g.classList.remove('pass','fail'));const s=S[i];$('.lg-n').textContent='Case file '+(i+1)+' / '+S.length;$('.lg-st').textContent='⚖️ '+score+' · 🔥 '+streak;
  $('.lg-scn').innerHTML=(s.e?'<b style="font-size:1.2rem">'+s.e+'</b> ':'')+s.t+'<br><small style="color:#6b5a2e">'+(x.hint||'<b>Tap the gate it FAILS</b>, or press the gold button if it passes all.')+'</small>';$('.lg-msg').innerHTML='';pos(-1)}
 function walk(stop,ok){let j=0;const lim=stop<0?gs.length:stop;(function step(){if(j<lim){gs[j].classList.add('pass');pos(j);j++;setTimeout(step,260)}else{if(stop>=0){gs[stop].classList.add('fail');pos(stop)}else pos(gs.length);fin(ok)}})()}
 function fin(ok){const s=S[i];if(ok){score++;streak++}else streak=0;$('.lg-st').textContent='⚖️ '+score+' · 🔥 '+streak;

 function end(){const r=score/S.length;sv(x.id,score);XP(x.id,10+score*3);$('.lg-scn').innerHTML='🏛️ <b>Session over.</b> You judged '+score+' of '+S.length+' case files correctly. '+stars(r)+'<br>'+(x.endText||'');$('.lg-msg').innerHTML='<div class="lg-row" style="justify-content:center"><button type="button" class="lg-ghost lg-re">↻ Play again (new order)</button></div>';$('.lg-n').textContent='Done';

NFX.revclock=function(h,x){
 const E=x.events,L=x.lights;let at=0,ans={};
 h.innerHTML='<div class="lg"><div class="lg-stage"><div class="lg-row" style="justify-content:space-between"><b class="lg-tt">'+(x.title||'')+'</b><span class="lg-pill lg-c"></span></div>'+

  '<div class="lg-tl">'+E.map((e,j)=>'<div class="lg-ev" data-j="'+j+'"><span class="d">'+e.e+'</span><div><small>'+esc(e.t)+'</small>'+e.text+'</div></div>').join('')+'</div>'+

 function draw(){rg.value=at;evs.forEach((e,j)=>e.classList.toggle('on',j<=at));const st=E[at].s||[];lt.forEach((l,j)=>{l.className=st[j]===1?'g':st[j]===0?'r':''});

   const bs=$('.lg-qa').querySelectorAll('[data-a]');const mark=(v)=>{bs.forEach(z=>{z.disabled=true;if(z.dataset.a==='0')z.classList.add('y');else if(z.dataset.a===v)z.classList.add('n')});$('.lg-o').innerHTML='<div class="lg-fb">'+(v==='0'?'✅ ':'❌ ')+q[2]+'</div>'};
   if(ans[at]!=null)mark(ans[at]);bs.forEach(b=>b.onclick=()=>{ans[at]=b.dataset.a;mark(b.dataset.a);if(b.dataset.a==='0')XP(x.id+'q'+at,6);$('.lg-nxt').disabled=false;if(at===E.length-1)done()})}
  $('.lg-nxt').disabled=need()||at===E.length-1;$('.lg-pv').disabled=at===0}
 function done(){const qs=E.map((e,j)=>e.q?j:-1).filter(j=>j>=0),ok=qs.filter(j=>ans[j]==='0').length;sv(x.id,ok);XP(x.id,10);$('.lg-qa').insertAdjacentHTML('beforeend','<div class="lg-fb">🏁 Timeline complete: '+ok+' / '+qs.length+' rulings correct '+stars(ok/qs.length)+'</div>')}
 $('.lg-nxt').onclick=()=>{if(need())return;if(at<E.length-1){at++;draw();if(at===E.length-1&&!E[at].q)done()}};$('.lg-pv').onclick=()=>{if(at>0){at--;draw()}};
 rg.oninput=()=>{let v=+rg.value;for(let j=0;j<v;j++)if(E[j].q&&ans[j]==null){v=j;break}at=v;draw()};draw()};

 h.innerHTML='<div class="lg"><div class="lg-pane" style="margin-top:0"><h5>'+(x.who||'Draft argument')+'</h5>'+(x.facts?'<p style="margin:0 0 8px">'+x.facts+'</p>':'')+'<div class="lg-ls">'+x.lines.map((l,j)=>'<button type="button" class="lg-line" data-j="'+j+'">'+(j+1)+'. '+l.t+'</button>').join('')+'</div>'+

 ls.forEach(b=>b.onclick=()=>{if(phase)return;const j=+b.dataset.j;mk.has(j)?mk.delete(j):mk.add(j);b.classList.toggle('mk')});
 $('.lg-ck').onclick=()=>{if(phase)return;phase=1;$('.lg-ck').disabled=true;let hit=0,wr=0;
