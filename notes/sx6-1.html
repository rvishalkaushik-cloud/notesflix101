<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>What is Democracy · Notesflix 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e5;--bg2:#ffefd0;--card:#ffffff;--ink:#22214f;--mut:#5d5b86;--navy:#2b2a6b;--navy2:#3d3b8e;--orange:#f26b21;--amber:#f9b91a;--teal:#3bb5a0;--mint:#a7ebd5;--coral:#f2645a;--line:#ecd9b4;--shadow:0 10px 26px rgba(43,42,107,.12);--r:20px}
:root{--bg:#f4f0ff;--bg2:#f6ebd3;--navy:#2d1e6b;--navy2:#623550;--ink:#2d1e6b;--orange:#ff7a00;--amber:#ffd60a;--teal:#8338ec;--mint:#d4b9f8;--coral:#ef476f;--line:#d8d3ea;--g1:#f9e491;--g2:#d0b5f9;--topbg:rgba(244,240,255,0.92);--tint1:#ffefe0;--tint1ink:#663100;--tint1b:#ffd7b2;--tint2:#eee3fc;--tint2ink:#32155a;--mut:#73689f;--shadow:0 10px 26px rgba(45,30,107,0.13)}
.cv .lb.sm{font-size:.6rem;padding:2px 7px}
:root[data-theme="dark"]{--tint1:#2a2550;--tint1ink:#ffe1c9;--tint1b:#3a3880;--tint2:#173a3a;--tint2ink:#c9fff0;--topbg:rgba(20,19,58,.92);--g1:transparent;--g2:transparent}
:root[data-theme="dark"]{--bg:#14133a;--bg2:#1c1b4d;--card:#23225a;--ink:#f3f1ff;--mut:#b9b6e8;--line:#3a3880;--shadow:0 10px 26px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14133a;--bg2:#1c1b4d;--card:#23225a;--ink:#f3f1ff;--mut:#b9b6e8;--line:#3a3880}}
*{box-sizing:border-box}html{font-size:17px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Poppins,'Segoe UI',Arial,sans-serif;overflow-x:hidden;
 background-image:radial-gradient(800px 420px at 0% 0%,var(--g1) 0,transparent 60%),radial-gradient(700px 420px at 100% 20%,var(--g2) 0,transparent 60%)}
:root[data-theme="dark"] body{background-image:none}
h1,h2,h3,h4{font-family:'Baloo 2',Poppins,sans-serif;line-height:1.15;margin:0 0 .35em;color:var(--navy)}
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] h3{color:#fff}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:40;background:var(--topbg);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
:root[data-theme="dark"] .top{background:rgba(20,19,58,.92)}
.top .in{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.logo{font:800 1.2rem/1 'Baloo 2';letter-spacing:1px;color:var(--navy)}.logo b{color:var(--orange)}
:root[data-theme="dark"] .logo{color:#fff}
.pbar{flex:1;min-width:120px;height:12px;border-radius:99px;background:#fff;border:2px solid var(--line);overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--amber),var(--teal));transition:width .5s}
.xp{font:800 .9rem 'Baloo 2';background:var(--amber);color:#3a2a00;border-radius:99px;padding:4px 12px}
.tbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:5px 10px;font-weight:700;font-size:.8rem}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:thin}
.nav a{flex:none;font:600 .74rem Poppins;color:var(--navy);text-decoration:none;border:2px solid var(--line);border-radius:99px;padding:5px 11px;background:var(--card)}
:root[data-theme="dark"] .nav a{color:#fff}
.nav a.ok::after{content:" ✓";color:var(--teal)}
/* hero */
.hero{padding:30px 0 10px;display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:center}
.kick{display:inline-block;font:800 .72rem Poppins;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:99px;padding:5px 12px}
.hero h1{font-size:clamp(2.4rem,7vw,4.2rem);margin:.25em 0 .1em;color:var(--navy);letter-spacing:.5px}
.hero h1 span{color:var(--orange)}
.lead{font-size:1.05rem;color:var(--mut)}
.heroart{background:#fff;border-radius:28px;box-shadow:var(--shadow);border:3px solid #fff;overflow:hidden}
.heroart svg{display:block;width:100%;height:auto}
.btn{border:0;border-radius:14px;padding:11px 18px;font:700 .95rem Poppins;background:var(--orange);color:#fff;box-shadow:0 5px 0 #c4501a}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4501a}
.btn.alt{background:var(--navy);box-shadow:0 5px 0 #17164a}.btn.teal{background:var(--teal);box-shadow:0 5px 0 #23806f}
.btn.sm{padding:7px 12px;font-size:.82rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* blocks */
section.step{padding:34px 0;border-top:3px dashed var(--line)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh .no{flex:none;width:58px;height:58px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 1.5rem 'Baloo 2';box-shadow:0 5px 0 #17164a}
.sh small{display:block;font:800 .7rem Poppins;letter-spacing:.14em;color:var(--orange)}
.sh h2{font-size:clamp(1.5rem,4vw,2.3rem);margin:0}
.blk{margin:16px 0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid var(--line);padding:18px}
.ttl{display:flex;align-items:center;gap:8px;font:800 1.15rem 'Baloo 2';color:var(--navy);margin:0 0 8px}
:root[data-theme="dark"] .ttl{color:#fff}
.ttl .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--amber);font-size:1.1rem}
/* journey */
.jy{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.jy a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font:600 .8rem/1.25 Poppins}
.jy a .e{font-size:1.3rem}.jy a small{display:block;font:800 .62rem Poppins;letter-spacing:.1em;color:var(--mut)}
.jy a.here{border-color:var(--orange);background:var(--tint1);box-shadow:0 0 0 3px var(--tint1b)}
:root[data-theme="dark"] .jy a.here{background:#3a2a40}
.jy a.here small::after{content:" · YOU ARE HERE";color:var(--orange)}
/* predict */
.pred{background:linear-gradient(135deg,#fff8e6,#ffe9c2);border:3px dashed var(--amber);border-radius:var(--r);padding:16px 18px}
:root[data-theme="dark"] .pred{background:#2a2550}
.pred .q{font:700 1.15rem/1.35 'Baloo 2';color:var(--navy)}:root[data-theme="dark"] .pred .q{color:#fff}
.pred .q::before{content:"🤔 THINK FIRST";display:block;font:800 .7rem Poppins;letter-spacing:.14em;color:var(--orange);margin-bottom:4px}
.pred .a{margin-top:10px;background:var(--tint2);border-radius:14px;padding:10px 14px;border:2px solid var(--mint);color:var(--tint2ink)}
/* key slide */
.ks{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:3px solid var(--navy)}
.ks .hd{background:var(--navy);color:#fff;padding:12px 18px}.ks .hd small{font:800 .68rem Poppins;letter-spacing:.14em;color:var(--amber)}.ks .hd h3{color:#fff;margin:2px 0 0;font-size:1.45rem}
.ks .bd{background:var(--card);padding:16px 18px;display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}
.ks .art{background:var(--bg2);border-radius:16px;display:grid;place-items:center;padding:10px;min-height:200px}.ks .art svg{width:100%;height:auto}
.ks .simple{font-weight:600;font-size:1.02rem}
.ks ul{list-style:none;padding:0;margin:10px 0}.ks li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:.93rem;border:2px solid var(--line)}
.ks li .i{flex:none;font-size:1.2rem}
.ks b,.simple b{color:var(--orange)}
.an{background:var(--tint2);border-left:6px solid var(--teal);border-radius:12px;padding:10px 12px;font-size:.92rem;color:var(--tint2ink)}.an::before{content:"🧠 Think of it like this: ";font-weight:800}
.ex{grid-column:1/-1;background:#fff6dc;border:3px dashed var(--amber);border-radius:16px;padding:12px 14px;font-size:.92rem;color:#3a2a00}.ex::before{content:"✍️ WRITE THIS IN THE EXAM (NCERT)";display:block;font:800 .7rem Poppins;letter-spacing:.12em;color:var(--orange);margin-bottom:4px}
/* glossary */
.gw{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:2px dotted var(--orange);cursor:help}
#gpop{position:fixed;z-index:80;max-width:280px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px;font-size:.86rem;box-shadow:var(--shadow)}
#gpop b{color:var(--amber);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:2px solid var(--teal);background:var(--tint2);color:var(--tint2ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:.82rem}
/* flips */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fp{display:block;width:100%;cursor:pointer;font:inherit;color:inherit;perspective:900px;height:200px;border:0;background:none;padding:0;text-align:left}
.fp .in{display:block;position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fp.on .in{transform:rotateY(180deg)}
.fp .f,.fp .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;padding:14px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.fp .f{background:var(--card);border:3px solid var(--c,var(--orange));align-items:center;text-align:center}
.fp .f .e{flex:none;font-size:2.6rem;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:3px solid var(--c,var(--orange));margin-bottom:8px}
.fp .f b{display:block;font:800 1.05rem 'Baloo 2';color:var(--navy)}:root[data-theme="dark"] .fp .f b{color:#fff}
.fp .f small{color:var(--mut);font-size:.72rem}
.fp .b{background:var(--c,var(--orange));color:#fff;transform:rotateY(180deg);font-size:.88rem;line-height:1.45}
.fp .b em{display:block;margin-top:8px;font-style:normal;background:#ffffff33;border-radius:10px;padding:5px 8px;font-size:.8rem}
/* try / learn */
.try{background:var(--tint1);border-left:6px solid var(--orange);border-radius:12px;padding:9px 12px;font-size:.92rem;margin-bottom:10px;color:var(--tint1ink)}.try::before{content:"🎯 What to try: ";font-weight:800}
details.learn{margin-top:10px;background:var(--tint2);border:2px solid var(--mint);border-radius:12px;padding:8px 12px;color:var(--tint2ink)}details.learn summary{cursor:pointer;font-weight:800}
/* sorter / quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0;font-weight:500}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:800 .8rem 'Baloo 2'}
.opt:hover:not([disabled]){border-color:var(--orange)}.opt.ok{border-color:var(--teal);background:var(--tint2);color:var(--tint2ink)}.opt.no{border-color:var(--coral);background:#ffe5e2;color:#7a1d16}.opt[disabled]{cursor:default}
.fb{margin-top:8px;border-radius:12px;padding:8px 12px;font-size:.9rem}.fb.ok{background:var(--tint2);color:var(--tint2ink)}.fb.no{background:#ffe5e2;color:#7a1d16}
.qhd{display:flex;justify-content:space-between;align-items:center;font:800 .75rem Poppins;letter-spacing:.08em;color:var(--mut)}
.qq{font:700 1.1rem/1.35 'Baloo 2';margin:6px 0}
.dots{display:flex;gap:5px}.dots i{width:22px;height:7px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--orange)}.dots i.ok{background:var(--teal)}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.bk button{border:3px solid var(--navy2);background:var(--card);border-radius:14px;padding:12px;font:800 .9rem 'Baloo 2';color:var(--navy)}
:root[data-theme="dark"] .bk button{color:#fff}
.bk button:hover{background:var(--bg2)}
.item{font:700 1.1rem/1.35 'Baloo 2';background:var(--bg2);border-radius:14px;padding:14px;text-align:center;border:2px dashed var(--amber)}
/* one line */
.ol{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,var(--teal),#2f9c89);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 #23806f}
.ol .e{font-size:1.8rem}.ol small{display:block;font:800 .68rem Poppins;letter-spacing:.14em;opacity:.85}.ol p{margin:0;font-weight:700}.ol b{color:#fff3b0}
/* compare */
.cmp{width:100%;border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.cmp th{background:var(--navy);color:#fff;padding:10px;font:800 .95rem 'Baloo 2'}.cmp th:last-child{background:var(--teal)}
.cmp td{background:var(--card);padding:9px 10px;border-top:2px solid var(--line);font-size:.9rem;vertical-align:top}.cmp td:first-child{font-weight:800;color:var(--orange);background:var(--bg2)}
/* tree */
.tree{text-align:center}.tree .nd{display:inline-block;border-radius:14px;padding:8px 14px;font:800 .95rem 'Baloo 2';color:#fff;border:0;margin:4px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tree .lv{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:10px 0}
.tree .r{background:var(--navy)}.tree .it{background:var(--orange)}.tree .fx{background:var(--teal)}.tree .sm{background:#2f9c89}.tree .lg{background:#1f7a6b}
.tree .leaf{background:var(--card);color:var(--ink);border:2px solid var(--line);font:700 .8rem Poppins;box-shadow:none}
.tinfo{margin-top:10px;background:var(--bg2);border-radius:14px;padding:10px 14px;min-height:56px;font-size:.92rem;text-align:left}
/* 3d */
.b3{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.b3>*{min-width:0}
.cv{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(var(--g1),var(--bg));border:3px solid var(--navy);aspect-ratio:16/11;min-height:300px}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.cv .help{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(43,42,107,.85);color:#fff;border-radius:12px;padding:6px 10px;font-size:.74rem;pointer-events:none}
.cv .lbls{position:absolute;inset:0;pointer-events:none}
.cv .lb{position:absolute;transform:translate(-50%,-100%);background:var(--navy);color:#fff;font:700 .68rem Poppins;padding:3px 8px;border-radius:99px;white-space:nowrap}
.cv .lb.sel{background:var(--orange)}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.modes button{border:2px solid var(--navy);background:var(--card);border-radius:12px;padding:6px 12px;font:800 .82rem 'Baloo 2';color:var(--navy)}
.modes button.on{background:var(--navy);color:#fff}
.panel h4{font-size:1.25rem;margin:.1em 0}.panel .tag{display:inline-block;font:800 .65rem Poppins;letter-spacing:.12em;background:var(--amber);color:#3a2a00;border-radius:8px;padding:3px 8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat div{background:var(--bg2);border-radius:12px;padding:8px;text-align:center;font-size:.78rem;color:var(--mut)}.stat b{display:block;font:800 1.3rem 'Baloo 2';color:var(--navy)}
/* gst */
.gst label{display:block;font-weight:700;margin:6px 0}.gst select,.gst input[type=number]{font:inherit;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.bill{background:#fff;color:#22214f;border-radius:14px;border:2px dashed var(--navy2);padding:12px 14px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem;margin-top:10px}
.bill .tot{border-top:2px solid #22214f;margin-top:6px;padding-top:6px;font-weight:800}
/* motion overrides for light theme */
.ms{border:3px solid var(--navy)!important;background:var(--bg)!important;border-radius:22px!important}
.ms .mcap{color:var(--navy)!important;text-shadow:none!important;background:linear-gradient(transparent,var(--bg) 35%)!important}
.ms .mcap b{color:var(--orange)!important}
.ms .mctl button{background:var(--orange)!important;color:#fff!important}
.ms .mbar{background:var(--teal)!important}
.foot{padding:30px 0 60px;color:var(--mut);font-size:.82rem;text-align:center}
@media (max-width:820px){.hero,.ks .bd,.b3{grid-template-columns:1fr}.cv{aspect-ratio:auto;height:340px;min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ===== factory widgets ===== */
.hero>*{min-width:0}.hero h1{overflow-wrap:anywhere}.hero .kick{white-space:normal;max-width:100%}
@media (max-width:520px){.hero h1{font-size:clamp(1.9rem,9.5vw,2.6rem)}}
.gph{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px}
.gph svg{width:100%;height:auto;display:block;touch-action:none}
.gph .ax{stroke:var(--ink);stroke-width:2}.gph .gr{stroke:var(--line);stroke-width:1}.gph text{fill:var(--ink);font:600 12px Poppins,sans-serif}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px;margin-top:8px}
.sl label{font-weight:700;font-size:.85rem}.sl input[type=range]{width:100%;accent-color:var(--orange)}
.sl output{float:right;font:800 .9rem 'Baloo 2';color:var(--orange)}
.calc .row label{font-weight:700;font-size:.88rem}.calc input,.calc select{font:inherit;font-size:16px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.calc .out{margin-top:10px;background:var(--card);border:2px dashed var(--navy2);border-radius:14px;padding:12px 14px;font-size:.95rem;overflow-x:auto}
.calc .out table{border-collapse:collapse;width:100%}.calc .out td{padding:4px 8px;border-bottom:1px solid var(--line)}.calc .out td:last-child{text-align:right;font-weight:700}
.ord{display:flex;flex-direction:column;gap:8px}.ord button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:600}
.ord button.pk{border-color:var(--teal);background:var(--tint2);color:var(--tint2ink)}.ord .n{font:800 1rem 'Baloo 2';min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--amber);color:#3a2a00;flex:none}
.exq{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;background:var(--card)}
.exq .mk{display:inline-block;font:800 .72rem Poppins;background:var(--navy);color:#fff;border-radius:99px;padding:2px 9px;margin-right:6px}
.exq ul.pts{margin:8px 0 0;padding:0;list-style:none}.exq ul.pts li{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.exq ul.pts input{width:20px;height:20px;accent-color:var(--teal);flex:none;margin-top:3px}
.exq textarea{width:100%;min-height:90px;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);color:var(--ink)}
.tl{position:relative;padding-left:22px;border-left:4px solid var(--amber);margin-left:8px}.tl .ev{position:relative;margin:0 0 12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer}
.tl .ev::before{content:"";position:absolute;left:-33px;top:12px;width:18px;height:18px;border-radius:50%;background:var(--orange);border:3px solid var(--bg)}.tl .ev b{color:var(--orange)}.tl .ev p{margin:4px 0 0;font-size:.9rem}
.tree .lv{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}.tree .nd{border:0;border-radius:12px;padding:8px 12px;font-weight:700;color:#fff;background:var(--c,var(--navy))}
.tree .tinfo{background:var(--tint2);color:var(--tint2ink);border-radius:12px;padding:10px 12px;margin-top:8px}
.mpl{margin:0;padding:0;list-style:none;counter-reset:m;display:grid;gap:8px}.mpl li{counter-increment:m;display:flex;gap:10px;align-items:baseline;background:var(--bg2,#fff6e5);border-radius:14px;padding:10px 12px}.mpl li::before{content:counter(m);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-weight:800;font-size:.85rem}.mpl b{flex:none;min-width:0;color:var(--navy)}.mpl span{color:var(--ink)}@media(max-width:600px){.mpl li{flex-wrap:wrap}}

e6b\"><\/text><\/g><g transform=\"translate(305 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#623550\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">👤<\/text><text y=\"146\" font-size=\"18\" fill=\"#623550\">Rulers<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">elected<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><g transform=\"translate(495 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#8338ec\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🙋<\/text><text y=\"146\" font-size=\"18\" fill=\"#8338ec\">Say<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">in decisions<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><g transform=\"translate(685 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#ef476f\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">⚖️<\/text><text y=\"146\" font-size=\"18\" fill=\"#ef476f\">Law<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">for all<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><\/g><\/svg><figcaption style=\"text-align:center;font-weight:700;margin-top:6px;opacity:.8\">Power belongs to the people.<\/figcaption><\/figure>"}], "ks": {"title": "What democracy means", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Democracy\"><rect width=\"100%\" height=\"100%\" rx=\"16\" fill=\"#f6ebd3\"/><circle cx=\"40\" cy=\"95\" r=\"26\" fill=\"#ffd60a\" opacity=\".5\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><text x=\"40\" y=\"104\" text-anchor=\"middle\" font-size=\"26\">🗳️<\/text><text x=\"40\" y=\"145\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"10\" fill=\"#2d1e6b\">Vote<\/text><path d=\"M69 95 H118\" stroke=\"#ef476f\" stroke-width=\"3\"/><path d=\"M111 89 l7 6 l-7 6\" fill=\"none\" stroke=\"#ef476f\" stroke-width=\"3\"/><circle cx=\"150\" cy=\"95\" r=\"26\" fill=\"#ffd60a\" opacity=\".5\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"26\">👤<\/text><text x=\"150\" y=\"145\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"10\" fill=\"#2d1e6b\">Elect<\/text><path d=\"M179 95 H228\" stroke=\"#ef476f\" stroke-width=\"3\"/><path d=\"M221 89 l7 6 l-7 6\" fill=\"none\" stroke=\"#ef476f\" stroke-width=\"3\"/><circle cx=\"260\" cy=\"95\" r=\"26\" fill=\"#ffd60a\" opacity=\".5\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><text x=\"260\" y=\"104\" text-anchor=\"middle\" font-size=\"26\">🏛️<\/text><text x=\"260\" y=\"145\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"10\" fill=\"#2d1e6b\">Govern<\/text><text x=\"150\" y=\"18\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#ef476f\">Democracy<\/text><text x=\"150\" y=\"185\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#2d1e6b\">The people decide<\/text><\/svg>", "simple": "<b>Democracy<\/b> = <b>demos<\/b> (people) + <b>kratos<\/b> (rule) = rule by the <b>people<\/b>.", "pts": [["🗳️", "<b>Democracy<\/b> is a form of government in which the people choose their rulers and rulers answer to them."], ["📜", "The word comes from the Greek <b>demos<\/b> (people) and <b>kratos<\/b> (rule)."], ["🏛️", "<b>Ancient Athens<\/b> had a direct democracy, but only adult male citizens could take part."], ["🌍", "Today most countries claim to be democratic; the test is whether the people <b>really<\/b> have the power."]], "an": "A class in which students choose a captain, give feedback to the captain and can choose someone else next term is a small democracy. A class in which the teacher simply appoints a captain for ever is not.", "ex": "A government is the group of people who take decisions for a country and who make and carry out its laws. Governments can take different forms, for example a monarchy, in which a king or queen rules and the position passes within a family, a dictatorship, in which one person or a small group holds power without the people consent, or a democracy. Democracy is a form of government in which the people choose their rulers and have a say in the way the country is run. The word comes from two Greek words: demos, meaning the people, and kratos, meaning rule or power. So democracy means rule by the people. The idea began in the city-state of Athens in ancient Greece more than two thousand years ago. In Athens citizens met in an assembly and decided important matters by voting. But only adult male citizens could take part, and women, slaves and people from other places were left out, so by modern standards it was only a limited democracy. Over the centuries, struggles in many countries led to the right to vote being extended to all adults, regardless of property, sex, caste or religion. Today, in a modern democracy, the people do not usually decide every issue themselves. Instead, they elect representatives through elections, and these representatives form the government and make laws. A government is democratic only if it satisfies a few conditions: the rulers must be elected by the people, the elections must be free and fair, every adult must have one vote of equal value, and the rights and freedoms of the citizens must be protected. A country with elections which are rigged, or where citizens cannot speak or form groups without fear, is not a real democracy even if it calls itself one. Democracy also means that those in power can be removed peacefully by voting. This is a major difference from other forms of government, in which a change of ruler may require a revolt."}, "words": ["democracy", "citizen", "monarchy", "dictatorship"], "flips": {"h": "Meaning · tap", "items": [["🗳️", "Democracy", "Rule by the people.", "Demos and kratos."], ["👑", "Monarchy", "Rule by king or queen.", "Family succession."], ["🪖", "Dictatorship", "Rule by one or few.", "No consent."], ["🏛️", "Athens", "Early direct democracy.", "Only male citizens."], ["🙋", "Citizen", "Member with rights.", "Votes and duties."]]}, "act": {"type": "dragsort", "id": "s1sort", "h": "🎮 Democratic or not?", "try": "Drag each situation to democratic or non-democratic.", "learn": "A government is <b>democratic<\/b> when rulers are freely chosen and rights are protected.", "bins": [{"t": "Democratic", "e": "🗳️"}, {"t": "Not democratic", "e": "⛔"}], "items": [["Leaders chosen in free elections", 0, "People choose.", "🗳️"], ["The ruler never allows an election", 1, "No choice.", "⛔"], ["Citizens may criticise the government", 0, "Free speech.", "🗣️"], ["Opposition leaders jailed for speaking", 1, "No freedom.", "🚫"], ["Rulers can be voted out", 0, "Accountable.", "🔄"], ["Votes are rigged", 1, "Not fair.", "🎭"]]}, "extra": [{"type": "calc", "id": "s1calc", "h": "🧪 Simulate · who wins the council election?", "try": "Three candidates get votes. Find the winner and the share of votes.", "learn": "Vote share (%) = candidate votes ÷ total votes × 100; majority needs more than 50 %.", "inputs": [{"id": "a", "label": "Votes for Candidate A", "type": "number", "min": 0, "max": 500, "step": 1, "val": 180}, {"id": "b", "label": "Votes for Candidate B", "type": "number", "min": 0, "max": 500, "step": 1, "val": 150}, {"id": "c", "label": "Votes for Candidate C", "type": "number", "min": 0, "max": 500, "step": 1, "val": 70}], "fn": "const t=v.a+v.b+v.c,m=Math.max(v.a,v.b,v.c),w=v.a===m?'A':(v.b===m?'B':'C');return '<p>Total votes = '+v.a+' + '+v.b+' + '+v.c+' = <b>'+t+'<\/b><\/p><p>Winner: <b>Candidate '+w+'<\/b> with '+(t?(m/t*100).toFixed(1):0)+' %<\/p><p>'+((m/t)>0.5?'An absolute majority: more than half the votes.':'Not an absolute majority, but the most votes (a plurality).')+'<\/p>';"}, {"type": "memmatch", "id": "s1mem", "h": "🃏 Memory match · meaning", "try": "Flip two cards to match.", "pairs": [["Democracy", "Rule by the people"], ["Monarchy", "Rule by king or queen"], ["Dictatorship", "Rule by one without consent"], ["Demos", "The people"], ["Kratos", "Rule or power"]]}, {"type": "tfrush", "id": "s1tf", "h": "⚡ Spot the mistake rush", "try": "Decide fast. Three wrong answers and the round ends.", "items": [["Democracy means rule by the people.", true, "Demos and kratos."], ["Athens allowed all residents to vote.", false, "Only adult male citizens."], ["Rulers in a democracy can be voted out.", true, "Peaceful change."], ["A country is democratic if it simply says so.", false, "Elections and rights matter."], ["A dictatorship rules with the consent of the people.", false, "No consent."], ["Free and fair elections are essential.", true, "Real choice."]]}], "quiz": [["Democracy means rule by the…", ["People", "King", "Army", "Priest"], "Demos."], ["Which is NOT democratic?", ["Rigged elections", "Free elections", "Equal votes", "Rule of law"], "Check signs."], ["Early direct democracy was in…", ["Athens", "Delhi", "Cairo", "Beijing"], "Greece."]], "line": "<b>Democracy<\/b> is <b>rule by the people<\/b>, who choose and can change their rulers.", "pics": [{"type": "manga", "id": "mg-sx6-1-1", "h": "Picture story · swipe the panels", "cast": {"rhea": {"name": "Rhea", "hair": "#1a1a1a", "outfit": "#2a7fd0", "hat": "cap", "skin": "m", "eye": "#22e4ff"}, "farhan": {"name": "Farhan", "hair": "#3a1a1a", "outfit": "#d08a20", "skin": "l"}, "meenal": {"name": "Meenal", "hair": "#2a1a0a", "outfit": "#2a9a4f", "skin": "d"}}, "panels": [{"bg": ["#d07a2a", "#3a1a06"], "props": [{"e": "🗳️", "x": 560, "y": 180, "fs": 110}], "cap": "People vote."}, {"bg": ["#7a1f2b", "#2a0a14"], "props": [{"e": "👤", "x": 560, "y": 180, "fs": 110}], "cap": "Rulers are chosen."}, {"bg": ["#1d4a5e", "#06141c"], "props": [{"e": "🔄", "x": 400, "y": 190, "fs": 110}], "cap": "Rulers can be changed."}]}], "codes": [{"type": "memcode", "id": "mc-sx6-1-1", "h": "Memory code · features", "phrase": "FERA", "tip": "Free elections, Equal vote, Rights, Accountability.", "letters": [["F", "Free elections", "Real choice"], ["E", "Equal vote", "One person one vote"], ["R", "Rights", "Protected"], ["A", "Accountable", "Answer"]]}]}, {"id": "s2", "e": "⚖️", "t": "Features of a democracy", "nav": "Features", "motion": ["Checking a government", "m3"], "before": [{"type": "html", "html": "<figure style=\"margin:0\"><svg viewBox=\"0 0 800 300\" role=\"img\" aria-label=\"Four features\" style=\"width:100%;height:auto;display:block;border-radius:18px\"><rect width=\"800\" height=\"300\" fill=\"#f6ebd3\"/><g font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" text-anchor=\"middle\"><g transform=\"translate(115 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#ff7a00\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">📊<\/text><text y=\"146\" font-size=\"18\" fill=\"#ff7a00\">Elections<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">free and fair<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><g transform=\"translate(305 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#623550\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🙋<\/text><text y=\"146\" font-size=\"18\" fill=\"#623550\">Equal vote<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">one value<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><g transform=\"translate(495 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#8338ec\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🛡️<\/text><text y=\"146\" font-size=\"18\" fill=\"#8338ec\">Rights<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">protected<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><g transform=\"translate(685 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#ef476f\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🔍<\/text><text y=\"146\" font-size=\"18\" fill=\"#ef476f\">Accountable<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">answer<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><\/g><\/svg><figcaption style=\"text-align:center;font-weight:700;margin-top:6px;opacity:.8\">All four are needed.<\/figcaption><\/figure>"}], "ks": {"title": "Elections, equality, rights and accountability", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Signs of democracy\"><rect width=\"100%\" height=\"100%\" rx=\"16\" fill=\"#f6ebd3\"/><rect x=\"20\" y=\"38\" width=\"120\" height=\"115\" rx=\"12\" fill=\"#ffd60a\" opacity=\".45\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><text x=\"80\" y=\"60\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#2d1e6b\">Present<\/text><text x=\"80\" y=\"84\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#2d1e6b\">Free elections<\/text><text x=\"80\" y=\"104\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#2d1e6b\">Rights protected<\/text><rect x=\"160\" y=\"38\" width=\"120\" height=\"115\" rx=\"12\" fill=\"#ff7a00\" opacity=\".45\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><text x=\"220\" y=\"60\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#2d1e6b\">Absent<\/text><text x=\"220\" y=\"84\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#2d1e6b\">Rigged votes<\/text><text x=\"220\" y=\"104\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#2d1e6b\">No free speech<\/text><text x=\"150\" y=\"20\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#ef476f\">Signs of democracy<\/text><text x=\"150\" y=\"185\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#2d1e6b\">Check the signs<\/text><\/svg>", "simple": "<b>Democracy<\/b> = free <b>elections<\/b> + <b>equal<\/b> vote + <b>rights<\/b> + <b>accountability<\/b>.", "pts": [["📊", "<b>Free and fair elections<\/b> held regularly, with real choice among parties."], ["🙋", "<b>One person, one vote, one value:<\/b> every adult citizen counts equally."], ["🛡️", "<b>Rights and freedoms:<\/b> speech, assembly, religion; independent courts protect them."], ["🔍", "<b>Accountability:<\/b> rulers must explain their actions, follow the law and can be voted out."]], "an": "Think of a cricket match with an umpire: players follow rules, the umpire is neutral, scores are public and every team can complain. The match is fair only if all these are present.", "ex": "A democratic government has certain features. First, the major decisions are taken by elected leaders. In a democracy the rulers are chosen by the people at regular intervals, and the elections must be free and fair. This means that every adult can vote without fear or pressure, that there is more than one party or candidate to choose from, and that the votes are counted honestly. Elections held in which the ruling party always wins by pressure or fraud do not make a country democratic. Second, in a democracy every citizen has an equal political right. The principle of one person, one vote, one value means that each adult has just one vote and every vote counts the same, whatever the person caste, religion, sex, wealth or education. In many countries this right was won only after long struggles. For instance, in many countries women gained the vote only in the twentieth century. Third, a democracy provides rights and freedoms. Citizens must be free to speak and write, to form organisations, to protest peacefully and to follow their religion. Without these freedoms elections would mean little, because people could not criticise the rulers or form an opposition. Courts that are independent of the government protect these rights and make sure that laws are followed. Fourth, in a democracy the rulers are accountable. They have to follow the constitution and the laws, they have to answer questions in the legislature and in the media, and the people can vote them out if they are not satisfied. The rule of law, which means that no one is above the law, supports this. In addition, a democracy needs transparency, which means that people have the right to know how decisions are made, as through the right to information. Finally, in a democracy the majority rules, but the rights of minorities must be respected so that majority rule does not become the tyranny of the majority. Each of these features supports the others, and when one is weak, democracy suffers."}, "words": ["accountable", "majority", "minority", "universal adult franchise"], "flips": {"h": "Features · tap", "items": [["📊", "Free and fair elections", "Real choice, honest count.", "Regular."], ["🙋", "One person, one vote", "Equal value.", "All adults."], ["🛡️", "Rights and freedoms", "Speech, assembly.", "Courts protect."], ["🔍", "Accountability", "Answer to people.", "Can be voted out."], ["⚖️", "Minorities", "Rights protected.", "Majority rule with care."]]}, "act": {"type": "dragsort", "id": "s2sort", "h": "🎮 Which feature is at risk?", "try": "Drag each problem to the feature it harms.", "learn": "<b>Elections<\/b>, <b>equality<\/b>, <b>rights<\/b> and <b>accountability<\/b> each protect democracy.", "bins": [{"t": "Fair elections", "e": "📊"}, {"t": "Equal vote", "e": "🙋"}, {"t": "Rights", "e": "🛡️"}, {"t": "Accountability", "e": "🔍"}], "items": [["Ballot boxes are stuffed", 0, "Fraud.", "📦"], ["Some groups are not allowed to vote", 1, "Unequal.", "🚫"], ["Critics are jailed", 2, "No freedom.", "⛓️"], ["Ministers refuse to answer questions", 3, "Hidden.", "🙈"], ["Only one party may contest", 0, "No choice.", "1️⃣"], ["A vote in one area counts double", 1, "Not equal.", "⚖️"]]}, "extra": [{"type": "calc", "id": "s2calc", "h": "🧪 Simulate · is the vote equal?", "try": "Compare two constituencies. Equal value means each vote has the same weight.", "learn": "Votes per seat = voters ÷ seats; equal value needs similar voters per seat.", "inputs": [{"id": "a", "label": "Voters in Area A (thousands)", "type": "number", "min": 10, "max": 500, "step": 10, "val": 200}, {"id": "b", "label": "Voters in Area B (thousands)", "type": "number", "min": 10, "max": 500, "step": 10, "val": 400}, {"id": "s", "label": "Seats in each area", "type": "number", "min": 1, "max": 10, "step": 1, "val": 1}], "fn": "const x=v.a/v.s,y=v.b/v.s,r=Math.max(x,y)/Math.min(x,y);return '<p>Area A: '+v.a+' ÷ '+v.s+' = <b>'+x.toFixed(0)+' thousand voters per seat<\/b><\/p><p>Area B: '+v.b+' ÷ '+v.s+' = <b>'+y.toFixed(0)+' thousand voters per seat<\/b><\/p><p>'+(r>1.2?'A voter in the smaller area has about '+r.toFixed(1)+' times the weight. The vote is not equal.':'The weights are close, so the votes are nearly equal in value.')+'<\/p>';"}, {"type": "memmatch", "id": "s2mem", "h": "🃏 Memory match · features", "try": "Flip two cards to match.", "pairs": [["One person one vote", "Equal political right"], ["Accountability", "Rulers answer to people"], ["Rule of law", "No one above the law"], ["Free press", "Informs citizens"], ["Minority rights", "Protected from majority"]]}, {"type": "tfrush", "id": "s2tf", "h": "⚡ Spot the mistake rush", "try": "Decide fast. Three wrong answers and the round ends.", "items": [["Every adult has one vote of equal value.", true, "Equal."], ["Elections can be rigged and still be democratic.", false, "Must be free and fair."], ["Courts help protect rights.", true, "Independent."], ["Rulers need not answer to anyone.", false, "Accountable."], ["Minority rights must be protected.", true, "Not the tyranny of the majority."], ["Free speech is unnecessary in a democracy.", false, "It is essential."]]}], "quiz": [["One person, one vote, one value is…", ["Political equality", "Monarchy", "Tax", "Law only"], "Equal."], ["Rulers who must explain actions are…", ["Accountable", "Absolute", "Hidden", "Immune"], "Answer."], ["Which protects rights?", ["Independent courts", "Rigged polls", "Silence", "Fear"], "Justice."]], "line": "A democracy has <b>free elections<\/b>, an <b>equal vote<\/b>, protected <b>rights<\/b> and <b>accountable<\/b> rulers.", "pics": [{"type": "manga", "id": "mg-sx6-1-2", "h": "Picture story · swipe the panels", "cast": {"rhea": {"name": "Rhea", "hair": "#1a1a1a", "outfit": "#2a7fd0", "hat": "cap", "skin": "m", "eye": "#22e4ff"}, "farhan": {"name": "Farhan", "hair": "#3a1a1a", "outfit": "#d08a20", "skin": "l"}, "meenal": {"name": "Meenal", "hair": "#2a1a0a", "outfit": "#2a9a4f", "skin": "d"}}, "panels": [{"bg": ["#ff9933", "#7a3a0a"], "props": [{"e": "📊", "x": 560, "y": 180, "fs": 110}], "cap": "Fair elections."}, {"bg": ["#2a5fa8", "#0a1a3a"], "props": [{"e": "🛡️", "x": 560, "y": 180, "fs": 110}], "cap": "Rights for all."}, {"bg": ["#7a4a2a", "#2a1a0a"], "props": [{"e": "🔍", "x": 400, "y": 190, "fs": 110}], "cap": "Rulers must answer."}]}], "codes": [{"type": "memcode", "id": "mc-sx6-1-2", "h": "Memory code · features", "phrase": "FERA", "tip": "Free elections, Equal vote, Rights, Accountability.", "letters": [["F", "Free elections", "Choice"], ["E", "Equal vote", "Same value"], ["R", "Rights", "Freedom"], ["A", "Accountable", "Answer"]]}]}, {"id": "s3", "e": "🏛️", "t": "Direct and representative democracy", "nav": "Forms", "motion": ["Direct and representative democracy", "m2"], "before": [{"type": "html", "html": "<figure style=\"margin:0\"><svg viewBox=\"0 0 800 300\" role=\"img\" aria-label=\"How people take part\" style=\"width:100%;height:auto;display:block;border-radius:18px\"><rect width=\"800\" height=\"300\" fill=\"#f6ebd3\"/><g font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" text-anchor=\"middle\"><g transform=\"translate(115 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#ff7a00\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🙋<\/text><text y=\"146\" font-size=\"18\" fill=\"#ff7a00\">Direct<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">all vote<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><g transform=\"translate(305 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#623550\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">👤<\/text><text y=\"146\" font-size=\"18\" fill=\"#623550\">Representative<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">elected few<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><g transform=\"translate(495 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#8338ec\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🗳️<\/text><text y=\"146\" font-size=\"18\" fill=\"#8338ec\">Referendum<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">vote on a question<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><g transform=\"translate(685 0)\"><rect x=\"-85\" y=\"30\" width=\"170\" height=\"240\" rx=\"18\" fill=\"#fff\" stroke=\"#ef476f\" stroke-width=\"5\"/><text y=\"104\" font-size=\"50\">🏫<\/text><text y=\"146\" font-size=\"18\" fill=\"#ef476f\">Local bodies<\/text><text y=\"180\" font-size=\"13\" fill=\"#2d1e6b\">near the people<\/text><text y=\"204\" font-size=\"13\" fill=\"#2d1e6b\"><\/text><\/g><\/g><\/svg><figcaption style=\"text-align:center;font-weight:700;margin-top:6px;opacity:.8\">Size decides the method.<\/figcaption><\/figure>"}], "ks": {"title": "Direct and representative democracy", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Two forms\"><rect width=\"100%\" height=\"100%\" rx=\"16\" fill=\"#f6ebd3\"/><rect x=\"20\" y=\"38\" width=\"120\" height=\"115\" rx=\"12\" fill=\"#ffd60a\" opacity=\".45\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><text x=\"80\" y=\"60\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#2d1e6b\">Direct<\/text><text x=\"80\" y=\"84\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#2d1e6b\">People decide<\/text><text x=\"80\" y=\"104\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#2d1e6b\">Small groups<\/text><rect x=\"160\" y=\"38\" width=\"120\" height=\"115\" rx=\"12\" fill=\"#ff7a00\" opacity=\".45\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><text x=\"220\" y=\"60\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#2d1e6b\">Representative<\/text><text x=\"220\" y=\"84\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#2d1e6b\">People elect<\/text><text x=\"220\" y=\"104\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#2d1e6b\">Large countries<\/text><text x=\"150\" y=\"20\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#ef476f\">Two forms<\/text><text x=\"150\" y=\"185\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#2d1e6b\">Who decides<\/text><\/svg>", "simple": "<b>Direct<\/b> = all decide; <b>representative<\/b> = <b>elected few<\/b> decide for all, as in <b>India<\/b>.", "pts": [["🙋", "<b>Direct democracy:<\/b> people decide issues themselves, possible only in small communities (a village meeting or gram sabha)."], ["👤", "<b>Representative democracy:<\/b> people elect representatives who make laws and form the government; used in India, the UK and the USA."], ["🗳️", "A <b>referendum<\/b> lets people vote directly on one question."], ["🏘️", "In India, <b>gram sabhas<\/b> and local bodies bring decisions close to people."]], "an": "A class of 10 can vote on lunch order together (direct). A school of 3000 elects a council to decide for all (representative).", "ex": "There are two main ways in which the people take part in democracy. In a direct democracy, all citizens take decisions together on important matters, for example by gathering in one place and voting. This was possible in the small city-states of ancient Greece and is still used in small communities and in some local bodies, such as the gram sabha, which is the meeting of all adult voters of a village. A direct democracy cannot work in a large country because it is not practical to gather millions of people to decide each issue, and most issues need time and expert knowledge. For this reason, most modern democracies are representative democracies. In this form the people elect representatives for a fixed term, such as five years. The representatives meet in a parliament or assembly, debate issues, make laws and form the government. They are accountable to the voters, who may re-elect or reject them in the next election. India, the United Kingdom, the United States and many other countries are representative democracies. Some countries also use methods of direct democracy for special questions. A referendum is a vote in which the people decide a single question directly, for instance whether to accept a new law or change the constitution. An initiative lets citizens propose a law. A recall allows voters in some places to remove an elected person before the term ends. In India, the Constitution provides a representative system for the Parliament and state legislatures, and a system of local self-government through panchayats in villages and municipalities in towns, through which the people can take part in decisions about their local needs. Public debates, petitions, the media, peaceful protests and social movements are other ways in which citizens take part between elections. Representative democracy can work well only when elections are fair and representatives listen to the people."}, "words": ["representative", "majority", "citizen", "accountable"], "flips": {"h": "Forms · tap", "items": [["🙋", "Direct democracy", "People decide directly.", "Small groups."], ["👤", "Representative democracy", "Elected representatives decide.", "Large countries."], ["🗳️", "Referendum", "Vote on one question.", "Direct tool."], ["🏘️", "Gram sabha", "Village meeting.", "All adult voters."], ["🏛️", "Parliament", "Elected lawmakers.", "Make laws."]]}, "act": {"type": "dragsort", "id": "s3sort", "h": "🎮 Direct or representative?", "try": "Drag each example to the form of democracy.", "learn": "<b>Direct<\/b> means people decide themselves, <b>representative<\/b> means elected people decide.", "bins": [{"t": "Direct", "e": "🙋"}, {"t": "Representative", "e": "👤"}], "items": [["Village meeting where all adults vote", 0, "Gram sabha.", "🏘️"], ["Members of Parliament make laws", 1, "Elected.", "🏛️"], ["A referendum on one question", 0, "Vote on the issue.", "🗳️"], ["The assembly of a state", 1, "Elected members.", "🏢"], ["All students vote on class trip", 0, "Small group.", "🚌"], ["School council elected by students", 1, "Chosen few.", "🏫"]]}, "extra": [{"type": "calc", "id": "s3calc", "h": "🧪 Simulate · majority needed", "try": "A house has some members. A law needs a majority vote.", "learn": "Simple majority = more than half = (members ÷ 2) rounded up when members are odd; for even members it is members ÷ 2 + 1.", "inputs": [{"id": "m", "label": "Members in the house", "type": "number", "min": 3, "max": 600, "step": 1, "val": 543}, {"id": "y", "label": "Votes in favour", "type": "number", "min": 0, "max": 600, "step": 1, "val": 300}], "fn": "const need=Math.floor(v.m/2)+1,pass=v.y>=need;return '<p>Majority needed = floor('+v.m+' ÷ 2) + 1 = <b>'+need+'<\/b> votes<\/p><p>Votes in favour = <b>'+v.y+'<\/b><\/p><p>'+(pass?'The law passes.':'The law fails: '+(need-v.y)+' more votes are needed.')+'<\/p>';"}, {"type": "memmatch", "id": "s3mem", "h": "🃏 Memory match · forms", "try": "Flip two cards to match.", "pairs": [["Direct democracy", "People decide directly"], ["Representative democracy", "People elect decision makers"], ["Referendum", "Vote on one question"], ["Gram sabha", "Village assembly"], ["Parliament", "Elected lawmakers"]]}, {"type": "tfrush", "id": "s3tf", "h": "⚡ Spot the mistake rush", "try": "Decide fast. Three wrong answers and the round ends.", "items": [["Direct democracy suits small groups.", true, "Practical."], ["India is a direct democracy at national level.", false, "Representative."], ["A referendum is a direct vote on one question.", true, "Direct tool."], ["Gram sabha is a village meeting.", true, "All adults."], ["Representatives are never accountable.", false, "They face elections."], ["The gram sabha has no role.", false, "It has a role."]]}], "quiz": [["A large country usually has…", ["Representative democracy", "Direct democracy only", "No government", "Monarchy only"], "Practical."], ["A vote on one question is a…", ["Referendum", "Election", "Census", "Budget"], "Direct."], ["The village assembly is the…", ["Gram sabha", "Lok Sabha", "Rajya Sabha", "High Court"], "Local."]], "line": "Small groups can use <b>direct<\/b> democracy, but large countries use <b>representative<\/b> democracy with elected representatives.", "pics": [{"type": "manga", "id": "mg-sx6-1-3", "h": "Picture story · swipe the panels", "cast": {"rhea": {"name": "Rhea", "hair": "#1a1a1a", "outfit": "#2a7fd0", "hat": "cap", "skin": "m", "eye": "#22e4ff"}, "farhan": {"name": "Farhan", "hair": "#3a1a1a", "outfit": "#d08a20", "skin": "l"}, "meenal": {"name": "Meenal", "hair": "#2a1a0a", "outfit": "#2a9a4f", "skin": "d"}}, "panels": [{"bg": ["#2a7fd0", "#0a1a3a"], "props": [{"e": "🙋", "x": 560, "y": 180, "fs": 110}], "cap": "Ever  map", "A crop"], "Feature."], ["A ruler jails critics. Missing…", ["Rights and freedoms", "Climate", "Roads", "Taxes"], "Freedom."], ["Voters per seat: 300k vs 600k with 1 seat each means…", ["Unequal weight", "Equal weight", "Perfect equality", "No vote"], "Different weights."], ["Which is direct?", ["Village gram sabha vote", "Parliament vote", "Judge ruling", "Cabinet decision"], "All adults."], ["Athens included…", ["Only adult male citizens", "All adults", "Women only", "Slaves"], "Limited."], ["If votes 40 vs 60 of 100, winner share…", ["60 %", "40 %", "100 %", "50 %"], "60 ÷ 100."]]}, {"type": "timeline", "h": "A fair election", "items": [["Step 1", "Parties and candidates stand", "Real choice"], ["Step 2", "Citizens vote freely", "Equal vote"], ["Step 3", "Votes are counted honestly", "Fair result"], ["Step 4", "Winners govern and answer", "Accountable"]]}, {"type": "cmp", "h": "Direct and representative", "heads": ["Property", "Direct", "Representative"], "rows": [["Who decides", "All citizens", "Elected representatives"], ["Suitable for", "Small groups", "Large countries"], ["Example", "Gram sabha", "Parliament"], ["Speed", "Slow for big issues", "Practical"]]}], "line": "Democracy means rule by the people through fair elections, equal votes, protected rights and accountable rulers, usually through representatives."}, "exam": {"qs": [{"m": 1, "q": "What does the word democracy mean?", "pts": ["Rule by the people, from the Greek demos and kratos"]}, {"m": 2, "q": "State any two features of a democracy.", "pts": ["Free and fair elections", "One person, one vote, one value; rights and accountability"]}, {"m": 3, "q": "Differentiate between direct and representative democracy with one example each.", "pts": ["Direct: people decide themselves, for example gram sabha", "Representative: elected members decide, for example Parliament", "Direct suits small groups, representative suits large countries"]}, {"m": 4, "tag": "Case-based", "q": "Read: \"In a country, elections are held but the ruling party controls the counting, opposition leaders are jailed and the media cannot criticise.\" (i) Is it democratic? (1) (ii) Which feature of fair elections is missing? (1) (iii) Which freedom is denied? (1) (iv) Suggest one step to improve. (1)", "pts": ["(i) No", "(ii) Honest counting and real choice", "(iii) Freedom of speech and expression", "(iv) Independent election body and free media"]}, {"m": 6, "tag": "Long answer", "q": "Explain the meaning and features of democracy. Why do large countries have representative democracy?", "pts": ["Rule by the people, demos and kratos", "Free and fair elections", "One person one vote one value", "Rights and rule of law", "Accountability", "Direct democracy impractical for millions", "Representatives elected and accountable"]}], "mcq": [["Assertion (A): Elections alone do not make a government democratic. Reason (R): Elections must be free and fair, with rights protected.", ["Both A and R are true, and R explains A", "Both A and R are true, but R does not explain A", "A is true, but R is false", "Both A and R are false"], "Conditions.", "A–R"], ["Assertion (A): Large countries use representative democracy. Reason (R): It is not practical for millions of people to decide every issue together.", ["Both A and R are true, and R explains A", "Both A and R are true, but R does not explain A", "A is true, but R is false", "Both A and R are false"], "Practical.", "A–R"], ["Case: A candidate gets 350 of 700 votes. Share is…", ["50 %", "35 %", "70 %", "25 %"], "350 ÷ 700.", "Case"], ["Case: Majority in a house of 100 is…", ["51", "50", "49", "100"], "Floor 50 + 1.", "Case"], ["A vote on one question is a…", ["Referendum", "Census", "Budget", "Charter"], "Direct.", "MCQ"]]}, "opener": [{"type": "opener", "id": "op-sx6-1", "h": "Start here · meaning, features and forms of democracy", "lead": "On a make-believe island the students choose their own council. Here is what democracy means, its main features, the difference between direct and representative democracy, and what makes a government democratic.", "sections": [{"k": "Page 1 · Theme", "t": "Welcome to Student Council Island", "art": "<svg viewBox=\"0 0 800 320\" role=\"img\" aria-label=\"Comic: Student Council Island\"><rect width=\"800\" height=\"320\" fill=\"#f6ebd3\"/><rect x=\"10\" y=\"10\" width=\"250\" height=\"270\" fill=\"#ff7a00\" opacity=\"0.35\" stroke=\"#2d1e6b\" stroke-width=\"5\"/><circle cx=\"135\" cy=\"120\" r=\"26\" fill=\"#ffd7b0\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><circle cx=\"126\" cy=\"115\" r=\"4\" fill=\"#2d1e6b\"/><circle cx=\"144\" cy=\"115\" r=\"4\" fill=\"#2d1e6b\"/><path d=\"M123 134 Q135 146 147 134\" fill=\"none\" stroke=\"#2d1e6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"135\" y=\"240\" text-anchor=\"middle\" font-family=\"Baloo 2,sans-serif\" font-weight=\"800\" font-size=\"30\" fill=\"#2d1e6b\">🗳️<\/text><path d=\"M22 30 H227 Q237 30 237 40 V70 H22 Z\" fill=\"#fff\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><text x=\"129.5\" y=\"56\" text-anchor=\"middle\" font-family=\"Baloo 2,sans-serif\" font-weight=\"800\" font-size=\"15\" fill=\"#2d1e6b\">We choose our leaders!<\/text><rect x=\"275\" y=\"10\" width=\"250\" height=\"270\" fill=\"#ffd60a\" opacity=\"0.35\" stroke=\"#2d1e6b\" stroke-width=\"5\"/><circle cx=\"400\" cy=\"120\" r=\"26\" fill=\"#ffd7b0\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><circle cx=\"391\" cy=\"115\" r=\"4\" fill=\"#2d1e6b\"/><circle cx=\"409\" cy=\"115\" r=\"4\" fill=\"#2d1e6b\"/><path d=\"M388 134 Q400 146 412 134\" fill=\"none\" stroke=\"#2d1e6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"400\" y=\"245\" text-anchor=\"middle\" font-size=\"60\">🙋<\/text><path d=\"M287 30 H492 Q502 30 502 40 V70 H287 Z\" fill=\"#fff\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><text x=\"394.5\" y=\"56\" text-anchor=\"middle\" font-family=\"Baloo 2,sans-serif\" font-weight=\"800\" font-size=\"15\" fill=\"#2d1e6b\">Everyone has one vote!<\/text><rect x=\"540\" y=\"10\" width=\"250\" height=\"270\" fill=\"#f4f0ff\" opacity=\"1\" stroke=\"#2d1e6b\" stroke-width=\"5\"/><circle cx=\"665\" cy=\"120\" r=\"26\" fill=\"#ffd7b0\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><circle cx=\"656\" cy=\"115\" r=\"4\" fill=\"#2d1e6b\"/><circle cx=\"674\" cy=\"115\" r=\"4\" fill=\"#2d1e6b\"/><path d=\"M653 134 Q665 146 677 134\" fill=\"none\" stroke=\"#2d1e6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"665\" y=\"245\" text-anchor=\"middle\" font-size=\"60\">⚖️<\/text><path d=\"M552 30 H757 Q767 30 767 40 V70 H552 Z\" fill=\"#fff\" stroke=\"#2d1e6b\" stroke-width=\"3\"/><text x=\"659.5\" y=\"56\" text-anchor=\"middle\" font-family=\"Baloo 2,sans-serif\" font-weight=\"800\" font-size=\"15\" fill=\"#2d1e6b\">Rules apply to all!<\/text><text x=\"400\" y=\"306\" text-anchor=\"middle\" font-family=\"Baloo 2,sans-serif\" font-weight=\"800\" font-size=\"22\" fill=\"#ef476f\">Student Council Island · what is democracy<\/text><\/svg>", "body": "<p>Rhea, Farhan and Meenal live on an island where every class chooses a council. The council plans events, spends the fund and must explain its decisions to everyone.<\/p>", "simple": "Choose, decide, explain.", "words": [["Democracy", "rule by the people"]], "think": ["What is democracy?", "Rule by the people."]}, {"k": "Page 2 · The big idea", "t": "One person, one vote", "art": "<svg viewBox=\"0 0 800 320\" role=\"img\" aria-label=\"How a democracy works\"><rect width=\"100%\" height=\"100%\" rx=\"16\" fill=\"#f6ebd3\"/><circle cx=\"80\" cy=\"165\" r=\"48\" fill=\"#ffd60a\" opacity=\".5\" stroke=\"#2d1e6b\" stroke-width=\"5\"/><text x=\"80\" y=\"182\" text-anchor=\"middle\" font-size=\"46\">🗳️<\/text><text x=\"80\" y=\"245\" text-anchor=\"middle\" font-family=\"Baloo 2,Inter,sans-serif\" font-weight=\"800\" font-size=\"19\" fill=\"#2d1e6b\">Vote<\/text><path d=\"M134 165 H233.33333333333337\" stroke=\"#ef476f\" stroke-width=\"5\"/><path d=\"M223.33333333333337 155 l12 10 l-12 10\" fill=\    host.innerHTML='<div class="bs"><div class="bshd"><span class="bsl">'+'❤️'.repeat(lives)+'🤍'.repeat(3-lives)+'</span><span class="bsn">'+(a.emoji||'👾')+' '+(a.name||'Boss')+'</span></div><div class="bshp"><i style="width:'+(hp/hp0*100)+'%"></i></div><div class="bsq"><div class="qq">'+x[0]+'</div><div class="spo">'+ord.map(k=>'<button type="button" class="opt" data-k="'+k+'">'+x[1][k]+'</button>').join('')+'</div></div><div class="fbx"></div></div>';
   host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;host.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.k===0)o.classList.add('ok')});
    if(k===0){hp--;confetti(b);host.querySelector('.bsn').classList.add('hit')}else{b.classList.add('no');lives--}
    host.querySelector('.fbx').innerHTML='<div class="fb '+(k===0?'ok':'no')+'">'+(k===0?'💥 Direct hit! ':'❌ Ouch! ')+(x[2]||'')+'</div>';setTimeout(()=>{i++;show()},k===0?900:1900)})}
  show()}go()};
/* ---------- render ---------- */
const app=$('#app');let html='',M=N.meta||{};
html+='<section class="hero" id="top"><div><span class="kick">'+esc(M.kicker||'')+'</span><h1>'+M.titleHtml+'</h1><p class="lead">'+M.lead+'</p><div class="row"><a class="btn" href="#'+(STEPS[0]?STEPS[0].id:'top')+'" style="text-decoration:none">Start the journey →</a>'+(N.board?'<a class="btn teal" href="#b3" style="text-decoration:none">🧊 Open the 3D board</a>':'')+'</div></div><div class="heroart">'+(N.hero||'')+'</div></section>';
(N.opener||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
if(N.points&&N.points.length)html+='<div class="blk card mp"><div class="ttl"><span class="ic">🎯</span>Main points of this part</div><ol class="mpl">'+N.points.map(p=>'<li><b>'+p[0]+'</b><span>'+p[1]+'</span></li>').join('')+'</ol></div>';
else if(N.hook)html+='<div class="blk">'+predict(N.hook)+'</div>';
(N.intro||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
html+='<div class="blk"><div class="ttl"><span class="ic">🗺️</span>Today’s journey</div>'+journey(-1)+'</div>';
if(N.showCast&&N.cast&&N.cast.length)html+='<div class="blk card"><div class="ttl"><span class="ic">🎭</span>The cast</div><div class="row" style="gap:14px">'+N.cast.map(c=>'<div class="row" style="gap:8px">'+face(c.key)+'<div><b>'+esc(c.name)+'</b><br><small style="color:var(--mut)">'+esc(c.role)+'</small></div></div>').join('')+'</div></div>';
const boardAfter=N.board?(N.board.after==null?0:N.board.after):-9;
function boardHtml(){const b=N.board;return '<section class="step" id="b3"><div class="sh"><span class="no">3D</span><div><small>INTERACTIVE BOARD</small><h2>'+b.title+'</h2></div></div><div class="card" data-mission="b3"><div class="try">'+b.try+'</div><div class="modes">'+b.modes.map((m,i)=>'<button class="'+(i?'':'on')+'" data-m="'+m.id+'" type="button">'+m.label+'</button>').join('')+'</div><div class="b3"><div class="cv" id="cv"><div class="lbls" id="lbls"></div><div class="help">Drag to rotate · scroll or pinch to zoom · tap an object</div></div><div class="panel card" id="pan"></div></div></div></section>'}
function extraBlock(x){if(window.NFX&&NFX[x.type]){const id='x-'+uid();setTimeout(()=>{const h=document.getElementById(id);h.innerHTML='<div class="card" data-mission="'+(x.id||id)+'"><div class="ttl"><span class="ic">'+(NFX_IC[x.type]||'✨')+'</span>'+(x.h||'')+'</div>'+(x.try?'<div class="try">'+x.try+'</div>':'')+'<div class="s"></div></div>';NFX[x.type](h.querySelector('.s'),x)},0);return '<div id="'+id+'"></div>'}
 if(x.type==='cmp')return cmp(x);if(x.type==='formula')return formula(x);if(x.type==='timeline')return timeline(x);if(x.type==='story')return story(x);if(x.type==='flips')return flips(x);if(x.type==='html')return x.html;
 if(W[x.type]){const id='x-'+uid();setTimeout(()=>{const h=document.getElementById(id);h.innerHTML=actWrap(x,'<div class="s"></div>');W[x.type](h.querySelector('.s'),x)},0);return '<div id="'+id+'"></div>'}return ''}
STEPS.forEach((s,i)=>{
 html+='<section class="step" id="'+s.id+'"><div class="sh"><span class="no">'+(i+1)+'</span><div><small>STEP '+(i+1)+' OF '+STEPS.length+'</small><h2>'+esc(s.t)+'</h2></div></div>';
 if(s.ks)html+='<div class="blk">'+keyslide(s.ks,i)+'</div>';
 (s.pics||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.motion)html+='<div class="blk"><div class="ttl"><span class="ic">🎬</span>See it: '+esc(s.motion[0])+'</div><div class="mo" data-spec="'+s.motion[1]+'"></div></div>';
 if(s.pred)html+='<div class="blk">'+predict(s.pred)+'</div>';if(s.words&&s.words.length)html+='<div class="blk">'+words(s.words)+'</div>';if(s.flips)html+='<div class="blk">'+flips(s.flips)+'</div>';(s.codes||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 (s.before||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.act)html+='<div class="blk">'+extraBlock(s.act)+'</div>';
 (s.extra||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.quiz)html+='<div class="blk">'+quiz(s.quiz,s.id+'q')+'</div>';if(s.line)html+='<div class="blk">'+oneline(s.line)+'</div>';html+='</section>';
 if(i===boardAfter)html+=boardHtml()});
if(N.summary){html+='<section class="step" id="sum"><div class="sh"><span class="no">★</span><div><small>REVISION</small><h2>The Ultimate Summary</h2></div></div>';(N.summary.blocks||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');if(N.summary.line)html+='<div class="blk">'+oneline(N.summary.line)+'</div>';html+='</section>'}
if(N.exam)html+='<section class="step" id="exam"><div class="sh"><span class="no">✍️</span><div><small>BOARD PRACTICE</small><h2>Exam Corner</h2></div></div><div class="blk">'+exam(N.exam)+'</div>'+(N.exam.mcq?'<div class="blk">'+quiz(N.exam.mcq,'examq')+'</div>':'')+'</section>';
if(N.next)html+='<div class="blk card" style="text-align:center"><b>Up next:</b> '+N.next+'</div>';
app.innerHTML=html;
$('#nav').innerHTML='<a href="#top">Start</a>'+STEPS.map((s,i)=>'<a href="#'+s.id+'" data-m="'+s.id+'q">'+(i+1)+'. '+esc(s.nav||s.t)+'</a>').join('')+(N.board?'<a href="#b3" data-m="b3">3D board</a>':'')+(N.summary?'<a href="#sum">Summary</a>':'')+(N.exam?'<a href="#exam" data-m="exam">Exam corner</a>':'');
document.querySelectorAll('.exq input[type=checkbox]').forEach(c=>c.addEventListener('change',()=>{const i=c.dataset.ex,all=document.querySelectorAll('[data-ex="'+i+'"]'),n=[...all].filter(x=>x.checked).length;document.querySelector('[data-sc="'+i+'"]').textContent='Ticked: '+n+' / '+all.length;if(n)xp('exam',10)}));
gwrap(app);
const mio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.on){e.target.dataset.on=1;Motion(e.target,MSPEC[e.target.dataset.spec])}}),{rootMargin:'200px'});
document.querySelectorAll('.mo').forEach(m=>mio.observe(m));
$('#thm').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('#thm').textContent=d?'🌙':'☀️'};
if(N.board&&window.Board3D)window.Board3D(N.board,xp);
})();
</script>
