{"id": "d", "k": "emoji", "x": 620, "y": 250, "t": "🐕", "fs": 50, "o": 0}, {"id": "r", "k": "emoji", "x": 700, "y": 250, "t": "🏃", "fs": 50, "o": 0}, {"id": "m", "k": "text", "x": 420, "y": 80, "t": "", "fs": 22, "c": "#0f1e3d"}], "steps": [{"t": 200, "c": "Poster: find my dog, get ₹5,000", "do": [{"id": "p", "to": {"o": 1}}]}, {"t": 2000, "c": "An offer to the <b>whole public<\/b>", "do": [{"id": "m", "text": "GENERAL OFFER"}]}, {"t": 3800, "c": "Someone who KNOWS the offer finds the dog", "do": [{"id": "d", "to": {"o": 1}}, {"id": "r", "to": {"o": 1}}, {"id": "r", "to": {"x": 560}, "ms": 900}]}, {"t": 6000, "c": "Doing the act = <b>acceptance<\/b> ✅", "big": 1, "do": [{"pulse": "p"}]}]}, "m4": {"aria": "Acceptance letter posted; complete against proposer on posting, against acceptor on arrival", "sky": ["#0f1e3d", "#0a1428"], "ground": "#1c1f26", "objs": [{"id": "A", "k": "box", "x": 130, "y": 200, "w": 150, "h": 80, "c": "#2f6f8f", "e": "🧑", "t": "A (proposer)"}, {"id": "B", "k": "box", "x": 670, "y": 200, "w": 150, "h": 80, "c": "#9a7228", "e": "👩", "t": "B (acceptor)"}, {"id": "l", "k": "emoji", "x": 600, "y": 150, "t": "✉️", "fs": 44, "o": 0}, {"id": "s", "k": "text", "x": 400, "y": 330, "t": "", "fs": 20, "c": "#c9a54b"}], "steps": [{"t": 200, "c": "B posts her acceptance ✉️", "do": [{"id": "l", "to": {"o": 1}}]}, {"t": 1800, "c": "Now complete <b>against A<\/b>", "do": [{"id": "s", "text": "A can no longer revoke"}, {"id": "l", "to": {"x": 400}, "ms": 1500}]}, {"t": 4200, "c": "Letter <b>reaches A<\/b>", "do": [{"id": "l", "to": {"x": 200}, "ms": 1200}]}, {"t": 5800, "c": "Now complete <b>against B<\/b> too ✅", "big": 1, "do": [{"id": "s", "text": "B can no longer revoke"}, {"pulse": "A"}]}]}}, "steps": [{"id": "s1", "e": "📜", "t": "Agreement and Contract", "nav": "Agreement vs contract", "motion": ["From offer to contract", "m1"], "ks": {"title": "Agreement vs contract", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Offer plus acceptance makes an agreement; add enforceability and it becomes a contract\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#eee3c8\"/><g font-family=\"Poppins,sans-serif\" font-weight=\"700\" text-anchor=\"middle\"><rect x=\"14\" y=\"30\" width=\"78\" height=\"46\" rx=\"10\" fill=\"#0f1e3d\"/><text x=\"53\" y=\"58\" fill=\"#fff\" font-size=\"13\">Offer<\/text><text x=\"111\" y=\"60\" fill=\"#0f1e3d\" font-size=\"22\">+<\/text><rect x=\"128\" y=\"30\" width=\"96\" height=\"46\" rx=\"10\" fill=\"#2f6f8f\"/><text x=\"176\" y=\"58\" fill=\"#fff\" font-size=\"13\">Acceptance<\/text><text x=\"252\" y=\"60\" fill=\"#0f1e3d\" font-size=\"22\">=<\/text><rect x=\"70\" y=\"100\" width=\"160\" height=\"34\" rx=\"10\" fill=\"#fff\" stroke=\"#c9a54b\" stroke-width=\"3\"/><text x=\"150\" y=\"122\" fill=\"#0f1e3d\" font-size=\"13\">AGREEMENT s.2(e)<\/text><path d=\"M150 136 v14\" stroke=\"#0f1e3d\" stroke-width=\"3\"/><rect x=\"40\" y=\"152\" width=\"220\" height=\"38\" rx=\"10\" fill=\"#9a7228\"/><text x=\"150\" y=\"176\" fill=\"#fff\" font-size=\"12.5\">+ enforceable by law = CONTRACT s.2(h)<\/text><\/g><text x=\"276\" y=\"40\" font-size=\"26\">⚖️<\/text><\/svg>", "simple": "<b>Contract = agreement + enforceability by law.<\/b> An agreement is a promise or set of promises forming consideration for each other (s.2(e)).", "pts": [["🤝", "<b>Offer + acceptance = agreement<\/b>. An accepted proposal is a <b>promise<\/b> (s.2(b))."], ["⚖️", "An agreement <b>enforceable by law<\/b> is a <b>contract<\/b> (s.2(h))."], ["🚫", "An agreement <b>not<\/b> enforceable by law is <b>void<\/b> (s.2(g))."], ["🎯", "“All contracts are agreements, but all agreements are not contracts.”"]], "an": "Every contract is an agreement, like every cricketer is a sportsperson — but not every sportsperson plays cricket.", "ex": "<details><summary>📝 Exam-ready answer · 6 points · tap to open ▾<\/summary><ul><li>According to Section 2(h) of the Indian Contract Act, 1872, a contract is an agreement enforceable by law.<\/li><li>According to Section 2(e), every promise and every set of promises forming consideration for each other is an agreement.<\/li><li>Thus a contract = agreement + enforceability.<\/li><li>An agreement becomes enforceable only when it fulfils the essentials of Section 10.<\/li><li>Hence all contracts are agreements, but all agreements are not contracts<\/li><li>For example, a social agreement to go for a movie is not a contract.<\/li><\/ul><\/details>"}, "words": ["agreement", "contract", "promise", "void agreement"], "flips": {"h": "Agreement or contract? · tap to check", "items": [["🎬", "“Let’s go for a movie on Friday.”", "Social promise. No intention to create legal relations.", "Agreement only — not a contract."], ["📱", "You buy a phone online and pay ₹15,000", "Both sides intend legal results; lawful price and object.", "Contract."], ["🍽️", "A father promises his son pocket money", "A domestic arrangement. Courts presume no intention to be legally bound.", "Agreement only (compare Balfour v Balfour, English case, 1919)."], ["🏠", "Rent agreement for a flat", "Clear terms, money in return, both want it legally binding.", "Contract."], ["💊", "Agreement to sell banned drugs", "Object is unlawful (s.23).", "Void agreement — never a contract."], ["🚌", "School bus fee for the term", "Service in return for a fee.", "Contract."]]}, "act": {"type": "dragsort", "id": "s1g", "h": "🎮 Courtroom sorter · contract or just an agreement?", "try": "Drag (or tap) each situation into the right box. Think: would a court enforce it?", "learn": "Courts enforce agreements that create <b>legal obligations<\/b>. Social and domestic promises, and agreements with unlawful objects, are <b>not contracts<\/b>.", "bins": [{"t": "Contract (court enforces)", "e": "⚖️"}, {"t": "Only an agreement / void", "e": "🚫"}], "items": [["Booking a cab and paying online", 0, "Service for money, both intend legal effect.", "🚕"], ["Promise to attend a friend’s wedding", 1, "Social promise — no legal intention.", "💐"], ["Hiring a tutor for ₹3,000 a month", 0, "Clear exchange of service and fee.", "📚"], ["Agreement to fix a cricket match for money", 1, "Unlawful object — void (s.23).", "🏏"], ["A shop sells you a bicycle for cash", 0, "Sale of goods: lawful contract.", "🚲"], ["Husband promises wife a monthly household allowance", 1, "Domestic arrangement — presumed no legal intention.", "🏡"], ["A company buys 500 laptops from a dealer", 0, "Commercial deal — legal intention presumed.", "💻"], ["Agreement to cheat an exam board", 1, "Unlawful and against public policy — void.", "📝"]]}, "extra": [{"type": "cmp", "h": "Agreement vs Contract", "heads": ["Basis", "Agreement", "Contract"], "rows": [["Meaning", "Promise(s) forming consideration for each other — s.2(e)", "Agreement enforceable by law — s.2(h)"], ["Scope", "Wider: social, domestic, legal", "Narrower: only legally enforceable ones"], ["Enforceability", "Not necessarily enforceable", "Always enforceable"], ["Legal obligation", "May or may not create one", "Always creates one"], ["Relation", "Not every agreement is a contract", "Every contract is an agreement"]]}], "quiz": [["Under the Indian Contract Act, 1872, a contract is…", ["An agreement enforceable by law", "Any promise", "Any agreement", "A written document"], "s.2(h)."], ["An agreement not enforceable by law is…", ["Void", "Voidable", "Valid", "Illegal in all cases"], "s.2(g)."], ["“A proposal when accepted becomes a…”", ["Promise", "Contract", "Consideration", "Agreement"], "s.2(b)."]], "line": "<b>Offer + acceptance = agreement<\/b>; <b>agreement + enforceability = contract<\/b>."}, {"id": "s2", "e": "🚪", "t": "Essentials of a Valid Contract", "nav": "Essentials (s.10)", "motion": ["One failed gate", "m2"], "ks": {"title": "Section 10: the essentials", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Seven gates an agreement must pass to become a contract\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#0f1e3d\"/><g font-size=\"20\" text-anchor=\"middle\"><rect x=\"12\" y=\"70\" width=\"34\" height=\"60\" rx=\"8\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"29\" y=\"108\">🤝<\/text><rect x=\"52\" y=\"70\" width=\"34\" height=\"60\" rx=\"8\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"69\" y=\"108\">🎯<\/text><rect x=\"92\" y=\"70\" width=\"34\" height=\"60\" rx=\"8\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"109\" y=\"108\">👤<\/text><rect x=\"132\" y=\"70\" width=\"34\" height=\"60\" rx=\"8\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"149\" y=\"108\">🕊️<\/text><rect x=\"172\" y=\"70\" width=\"34\" height=\"60\" rx=\"8\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"189\" y=\"108\">💰<\/text><rect x=\"212\" y=\"70\" width=\"34\" height=\"60\" rx=\"8\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"229\" y=\"108\">⚖️<\/text><rect x=\"252\" y=\"70\" width=\"34\" height=\"60\" rx=\"8\" fill=\"#ffffff14\" stroke=\"#c9a54b\" stroke-width=\"2\"/><text x=\"269\" y=\"108\">📏<\/text><\/g><text x=\"150\" y=\"40\" fill=\"#f6f1e4\" font-family=\"Playfair Display,Georgia,serif\" font-weight=\"700\" font-size=\"18\" text-anchor=\"middle\">Section 10: pass every gate<\/text><text x=\"150\" y=\"165\" fill=\"#c9a54b\" font-family=\"Poppins,sans-serif\" font-weight=\"700\" font-size=\"12\" text-anchor=\"middle\">Fail one → void, voidable or no contract<\/text><text font-size=\"24\"><animateMotion dur=\"5s\" repeatCount=\"indefinite\" path=\"M6 150 H290\"/>📜<\/text><\/svg>", "simple": "<b>s.10:<\/b> All agreements are contracts if made by the <b>free consent<\/b> of <b>competent<\/b> parties, for a <b>lawful consideration<\/b> and with a <b>lawful object<\/b>, and not expressly declared <b>void<\/b>.", "pts": [["🤝", "A lawful <b>offer and acceptance<\/b>, with <b>intention to create legal relations<\/b>."], ["👤", "<b>Competent parties<\/b> (s.11): major (18+), sound mind, not disqualified by law."], ["🕊️💰", "<b>Free consent<\/b> (s.14) and <b>lawful consideration<\/b> (s.2(d), s.23)."], ["⚖️📏", "<b>Lawful object<\/b>, <b>certain<\/b> terms (s.29), <b>possible<\/b> to perform (s.56), not declared void."]], "an": "Like a school ID check at the exam hall: miss one thing — admit card, ID, uniform — and you don’t get in.", "ex": "<details><summary>📝 Exam-ready answer · 11 points · tap to open ▾<\/summary><ul><li>Section 10 of the Indian Contract Act, 1872 lays down the essentials of a valid contract: (1) offer and acceptance<\/li><li>(2) intention to create legal relations<\/li><li>(3) free consent of the parties<\/li><li>(4) capacity of the parties to contract (s.11)<\/li><li>(5) lawful consideration<\/li><li>(6) lawful object<\/li><li>(7) agreement not expressly declared void<\/li><li>(8) certainty and possibility of performance<\/li><li>(9) legal formalities, such as writing or registration, where required by law.<\/li><li>An agreement lacking any of these is not a valid contract<\/li><li>It may be void or voidable.<\/li><\/ul><\/details>"}, "words": ["free consent", "competent", "consideration", "voidable contract", "intention to create legal relations"], "codes": [{"type": "memcode", "id": "mc2", "h": "Memory code · the seven gates", "phrase": "Only Intelligent Children Find Clever Legal Clues", "tip": "O-I-C-F-C-L-C: walk through the gates in this order.", "letters": [["O", "Offer & acceptance", "lawful offer, lawful acceptance"], ["I", "Intention", "to create legal relations"], ["C", "Capacity", "s.11 — 18+, sound mind, not disqualified"], ["F", "Free consent", "s.14 — no coercion, fraud, etc."], ["C", "Consideration", "lawful, s.2(d) and s.25"], ["L", "Lawful object", "s.23 — not illegal, immoral, against public policy"], ["C", "Certainty & possibility", "s.29 and s.56"]]}], "flips": {"h": "What happens if a gate fails? · tap", "items": [["👶", "Party is a minor", "A minor is not competent (s.11).", "Agreement is void from the start (Mohori Bibee v Dharmodas Ghose, Privy Council, 1903 — Part 2)."], ["🔫", "Consent by threat (coercion)", "Consent is not free (s.14, s.15).", "Contract is voidable at the option of the threatened party (s.19)."], ["🎁", "No consideration", "Promise to give something for nothing.", "Void (s.25), except for listed exceptions (Part 2)."], ["🚫", "Unlawful object", "Object forbidden by law, fraudulent, immoral or against public policy (s.23).", "Void (s.24)."], ["❓", "Terms uncertain", "“I will sell you some oil.” Which oil? How much?", "Void for uncertainty (s.29)."], ["🌋", "Impossible act", "“I will bring the dead back to life.”", "Void (s.56)."]]}, "act": {"type": "gate", "id": "s2g", "h": "🚪 The Contract Gate Machine", "try": "Read each <b>case file<\/b>. Tap the <b>first gate the agreement fails<\/b> — or the gold button if it passes all seven. Watch the scroll walk through.", "learn": "Section 10 is a checklist. Fail any gate and the agreement is <b>not a valid contract<\/b> — it may be void (minor, no consideration, unlawful object, uncertain, impossible) or voidable (no free consent).", "gates": [["🤝", "Offer & acceptance", "s.2(a), (b), s.7", "Offer"], ["🎯", "Intention", "legal relations", "Intent"], ["👤", "Capacity", "s.11", "Capac."], ["🕊️", "Free consent", "s.14", "Consent"], ["💰", "Consideration", "s.2(d), s.25", "Consid."], ["⚖️", "Lawful object", "s.23", "Lawful"], ["📏", "Certain & possible", "s.29, s.56", "Certain"]], "scenarios": [{"e": "🛵", "t": "Ravi (32) agrees to sell his scooter to Tara (25) for ₹40,000. Both agree freely and sign.", "fail": -1, "why": "Every essential is present."}, {"e": "🎮", "t": "Kunal, aged 16, agrees to buy a gaming console from a shop on instalments.", "fail": 2, "result": "void", "why": "A minor is not competent (s.11). The agreement is void from the start."}, {"e": "🔪", "t": "Sanjay signs a sale deed for his shop only because the buyer threatened to harm his family.", "fail": 3, "result": "voidable at Sanjay’s option", "why": "Consent caused by coercion is not free (s.14, s.15). Contract is voidable (s.19)."}, {"e": "🎁", "t": "Neha promises in writing to give her laptop to a classmate, asking nothing in return. No registration, no natural love and affection between near relatives.", "fail": 4, "result": "void", "why": "No consideration (s.25). Exceptions come in Part 2."}, {"e": "💸", "t": "Amit pays Rohit ₹50,000 to leak a board exam paper.", "fail": 5, "result": "void", "why": "The object is unlawful and against public policy (s.23). Void (s.24)."}, {"e": "🛢️", "t": "Priya agrees to sell Mohan “some oil” — no type, no quantity, no price mechanism.", "fail": 6, "result": "void", "why": "Terms are not certain (s.29)."}, {"e": "🍵", "t": "Two friends agree to meet for tea on Sunday; one does not turn up.", "fail": 1, "result": "no contract", "why": "A social arrangement — no intention to create legal relations."}, {"e": "📦", "t": "A shop offers a TV for ₹30,000. Ali replies: “I accept, but at ₹25,000.” The shop says nothing more.", "fail": 0, "result": "no agreement", "why": "This is a counter offer, not an acceptance (s.7: acceptance must be absolute). No agreement yet."}], "endText": "Remember the order: <b>Only Intelligent Children Find Clever Legal Clues<\/b>."}, "quiz": [["Which section lists what agreements are contracts?", ["Section 10", "Section 2(h)", "Section 23", "Section 56"], "s.10."], ["A contract induced by coercion is…", ["Voidable", "Void", "Valid", "Illegal"], "s.19."], ["Which of these is NOT an essential under s.10?", ["Writing in every case", "Free consent", "Lawful object", "Competent parties"], "Writing is needed only where a law requires it (e.g. some property transfers)."]], "line": "Pass all gates of <b>s.10<\/b> → contract. Fail one → <b>void<\/b> or <b>voidable<\/b>."}, {"id": "s3", "e": "🏷️", "t": "Offer (Proposal)", "nav": "Offer", "motion": ["A general offer in action", "m3"], "ks": {"title": "Offer / proposal", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"An offer is a definite proposal; a price tag only invites offers\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#eee3c8\"/><g font-family=\"Poppins,sans-serif\" font-weight=\"700\"><rect x=\"14\" y=\"22\" width=\"130\" height=\"150\" rx=\"14\" fill=\"#fff\" stroke=\"#2f6f8f\" stroke-width=\"3\"/><text x=\"79\" y=\"52\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2f6f8f\">OFFER<\/text><text x=\"79\" y=\"96\" text-anchor=\"middle\" font-size=\"34\">🤝<\/text><text x=\"79\" y=\"128\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#0f1e3d\">“I will sell you my<\/text><text x=\"79\" y=\"142\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#0f1e3d\">bat for ₹900.”<\/text><rect x=\"156\" y=\"22\" width=\"130\" height=\"150\" rx=\"14\" fill=\"#fff\" stroke=\"#a63d32\" stroke-width=\"3\" stroke-dasharray=\"7 5\"/><text x=\"221\" y=\"52\" text-anchor=\"middle\" font-size=\"12\" fill=\"#a63d32\">INVITATION<\/text><text x=\"221\" y=\"96\" text-anchor=\"middle\" font-size=\"34\">🏷️<\/text><text x=\"221\" y=\"128\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#0f1e3d\">Price tag, menu,<\/text><text x=\"221\" y=\"142\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#0f1e3d\">catalogue, tender ad<\/text><\/g><text x=\"150\" y=\"192\" text-anchor=\"middle\" font-family=\"Poppins\" font-size=\"10\" fill=\"#0f1e3d\">Only an offer can be accepted.<\/text><\/svg>", "simple": "<b>s.2(a):<\/b> When one person signifies to another his willingness to do or to abstain from doing anything, with a view to obtaining the other’s assent, he makes a <b>proposal<\/b>.", "pts": [["🎯", "Must show <b>intention to create legal relations<\/b> and have <b>definite<\/b> terms."], ["📣", "Must be <b>communicated<\/b>: complete when it reaches the knowledge of the offeree (s.4)."], ["🗣️", "May be <b>express<\/b> (words) or <b>implied<\/b> (conduct) — s.9."], ["🏷️", "An <b>invitation to offer<\/b> is not an offer: price tags, menus, catalogues, tender notices."]], "an": "A shop’s price tag is like a “Swipe right if interested” — it invites you to make an offer at the counter.", "ex": "<details><summary>📝 Exam-ready answer · 3 points · tap to open ▾<\/summary><ul><li>According to Section 2(a) of the Indian Contract Act, 1872, when one person signifies to another his willingness to do or to abstain from doing anything, with a view to obtaining the assent of that other to such act or abstinence, he is said to make a proposal.<\/li><li>The person making the proposal is the proposer and the person to whom it is made is the offeree.<\/li><li>Essentials of a valid offer: it must intend to create legal relations, its terms must be definite, it must be communicated to the offeree, and it must be distinguished from an invitation to offer.<\/li><\/ul><\/details>"}, "words": ["proposal", "proposer", "offeree", "general offer", "specific offer", "cross offers", "counter offer", "standing offer", "invitation to offer"], "pics": [{"type": "manga", "id": "mg3", "h": "Picture strip · kinds of offer", "cast": {"zoya": {"name": "Zoya", "hair": "#2b1d3a", "outfit": "#2f6f8f", "skin": "m"}, "raj": {"name": "Raj", "hair": "#3a2418", "outfit": "#9a7228", "skin": "d"}}, "panels": [{"bg": ["#0f1e3d", "#0a1428"], "chars": [{"ch": "zoya", "x": 400, "y": 300, "mood": "happy"}], "props": [{"e": "📢", "x": 640, "y": 150, "fs": 70}], "bubbles": [{"x": 80, "y": 60, "w": 300, "t": "“₹2,000 to anyone who finds my cat!”", "tail": "r"}], "cap": "<b>General offer<\/b> — to the whole public. Anyone who knows it and finds the cat accepts by doing the act."}, {"bg": ["#2f6f8f", "#0f1e3d"], "chars": [{"ch": "zoya", "x": 220, "y": 300}, {"ch": "raj", "x": 580, "y": 300}], "bubbles": [{"x": 120, "y": 50, "w": 270, "t": "“Raj, my cycle is yours for ₹3,000.”", "tail": "l"}], "cap": "<b>Specific offer<\/b> — made to one person. Only Raj can accept it."}, {"bg": ["#9a7228", "#0f1e3d"], "chars": [{"ch": "zoya", "x": 220, "y": 300}, {"ch": "raj", "x": 580, "y": 300}], "props": [{"e": "✉️", "x": 400, "y": 160, "fs": 50}, {"e": "✉️", "x": 400, "y": 240, "fs": 50}], "cap": "<b>Cross offers<\/b> — Zoya offers to sell, Raj offers to buy on the same terms, letters cross in the post. No contract until one accepts."}, {"bg": ["#a63d32", "#0f1e3d"], "chars": [{"ch": "raj", "x": 580, "y": 300, "mood": "smug"}], "bubbles": [{"x": 110, "y": 60, "w": 320, "t": "“OK, but only at ₹2,500.”", "tail": "r"}], "cap": "<b>Counter offer<\/b> — changes the terms. It rejects the first offer and is a fresh offer."}, {"bg": ["#c9a54b", "#0f1e3d"], "props": [{"e": "🥛", "x": 300, "y": 220, "fs": 80}, {"e": "🏫", "x": 520, "y": 220, "fs": 80}], "cap": "<b>Standing offer<\/b> — a dairy offers to supply milk to a hostel as and when ordered for a year. Each order is an acceptance."}]}], "flips": {"h": "Offer or invitation to offer? · tap", "items": [["🏷️", "Price tag in a mall", "Displays goods; you make the offer at the counter.", "Invitation to offer."], ["📋", "A restaurant menu", "Lists dishes and prices; the order is your offer.", "Invitation to offer."], ["📰", "Government tender notice", "Invites bids. Each bid is an offer.", "Invitation to offer."], ["💬", "“The lowest price is ₹50,000.”", "Only information — no willingness to be bound. Compare Harvey v Facey (Privy Council, 1893).", "Not an offer."], ["📢", "Reward poster for a lost dog", "Willingness to pay whoever performs the act.", "General offer."], ["🤲", "Bus stops; you board it", "Conduct shows the offer to carry you for the fare.", "Implied offer (s.9)."]]}, "act": {"type": "dragsort", "id": "s3g", "h": "🎮 Offer or invitation? Sort the evidence", "try": "Drag each item into the right box. Ask: can someone simply say “I accept” and create a deal?", "learn": "Only an <b>offer<\/b> can be accepted. Price tags, menus, catalogues, tender notices and auction announcements are <b>invitations to offer<\/b>; the customer, bidder or buyer makes the offer.", "bins": [{"t": "Offer", "e": "🤝"}, {"t": "Invitation to offer", "e": "🏷️"}], "items": [["“I will sell you my guitar for ₹6,000.”", 0, "Definite terms, made to get your assent.", "🎸"], ["Online shopping catalogue", 1, "Lists products; your order is the offer.", "🛒"], ["Auction notice in a newspaper", 1, "Invites bids; each bid is an offer.", "🔨"], ["Reward notice for finding a lost bag", 0, "General offer, accepted by performance.", "👜"], ["Price list on a canteen board", 1, "Invites buyers to make offers.", "🧾"], ["Tender notice for building a school wall", 1, "Invites contractors to submit offers.", "🧱"], ["“Will you buy my bike for ₹20,000?”", 0, "Clear willingness to sell on stated terms.", "🚲"]]}, "extra": [{"type": "casebrief", "id": "cb1", "h": "Real case · Lalman Shukla v. Gauri Dutt", "try": "Open each tab in order. At tab 4 you decide the case before you see the court’s answer.", "name": "Lalman Shukla v. Gauri Dutt", "court": "Allahabad High Court", "year": "1913 (decided 17 April 1913)", "cite": "(1913) 11 ALJ 489", "bench": "Banerji J.", "label": "Real Indian case · Offer must be known to be accepted", "facts": "<p>Gauri Dutt’s nephew went missing from home in Kanpur. Gauri Dutt sent his servant (munim) <b>Lalman Shukla<\/b> to search for the boy. <b>After Lalman had left<\/b>, Gauri Dutt issued handbills announcing a cash reward for anyone who found the boy.<\/p><p>Lalman traced the boy at Haridwar and brought him back. He <b>did not know about the reward<\/b> when he found the boy. Later he learnt of it and sued Gauri Dutt for the reward.<\/p>", "issue": "<p>Can a person accept an offer — and claim its benefit — when he did not know the offer existed at the time he did the act?<\/p><p>Sections in play: s.2(a), s.2(b) and s.4 (communication of a proposal is complete when it comes to the knowledge of the person to whom it is made).<\/p>", "args": [["For Lalman (plaintiff)", "The reward was a general offer to the public. He performed exactly the act asked for — finding the boy — so the offer was accepted by performance."], ["For Gauri Dutt (defendant)", "Lalman went as a servant, doing his duty. He did not know of the offer, so he could not have accepted it. No acceptance, no contract."]], "predict": {"q": "Is Lalman entitled to the reward?", "opts": ["No — he did not know of the offer, so there was no acceptance", "Yes — performing the act is acceptance, knowledge does not matter", "Yes — servants are always entitled to rewards", "No — rewards can never be claimed in court"], "why": "Acceptance means assent to a known proposal. You cannot assent to something you do not know about."}, "decision": "<p>The High Court <b>dismissed<\/b> Lalman’s claim. He had no knowledge of the reward when he found the boy, so there was no acceptance of the offer and no contract.<\/p>", "principle": "<p><b>An offer cannot be accepted unless it has been communicated to, and is known by, the offeree.<\/b> Knowledge of the offer is essential for acceptance — even for a general offer accepted by performance.<\/p>", "exam": "“Communication of offer is essential: in <i>Lalman Shukla v. Gauri Dutt<\/i> (1913), the Allahabad High Court held that a person who performs the act without knowledge of the offer cannot claim the reward.”", "today": "An app rewards users who refer five friends. A user who referred five friends before the scheme was announced cannot claim it as a contract — he did not know of the offer.", "src": [["Manupatra case guide (MANU/UP/0388/1913)", "https://manupatracademy.com/assets/pdf/subjectwise-case-guide/MANU-UP-0388-1913.pdf"], ["Indian Contract Act, 1872 — India Code", "https://indiacode.nic.in/bitstream/123456789/2187/2/A187209.pdf"]]}, {"type": "casebrief", "id": "cb0", "h": "Connected case · Carlill v. Carbolic Smoke Ball Co.", "name": "Carlill v. Carbolic Smoke Ball Co.", "court": "Court of Appeal, England", "year": "1893", "cite": "[1893] 1 QB 256", "label": "English case · followed in India · general offer", "facts": "<p>A company advertised that it would pay £100 to anyone who used its smoke ball as directed and still caught influenza. It said it had deposited £1,000 in a bank to show it was serious. Mrs Carlill read the advert, used the ball as directed, and caught influenza.<\/p>", "issue": "<p>Was the advert a mere boast, or a general offer that Mrs Carlill accepted by doing what it asked — without telling the company first?<\/p>", "args": [["For Mrs Carlill", "The advert was a definite promise to the public. She performed the conditions, which was acceptance."], ["For the company", "It was just advertising puff. No contract can be made with the whole world, and she never told them she accepted."]], "predict": {"q": "Was there a contract?", "opts": ["Yes — a general offer is accepted by performing its conditions; no separate notice needed", "No — an advert can never be an offer", "No — acceptance must always be told to the offeror first", "Yes — but only if she bought ten smoke balls"], "why": "The bank deposit showed serious intention, and the offer itself made performance the mode of acceptance."}, "decision": "<p>The Court of Appeal held the company liable to pay Mrs Carlill £100.<\/p>", "principle": "<p>A <b>general offer<\/b> can be made to the world at large and is accepted by anyone who performs its conditions. Where the offer says so (expressly or impliedly), <b>performance itself is acceptance<\/b> — compare s.8 of the Indian Contract Act.<\/p>", "exam": "Use it with s.8: “Performance of the conditions of a proposal is an acceptance of the proposal” — e.g. Carlill v. Carbolic Smoke Ball Co. (English case, 1893).", "src": [["Indian Contract Act s.8 — India Code", "https://indiacode.nic.in/bitstream/123456789/2187/2/A187209.pdf"]]}], "quiz": [["A price tag on goods in a shop is…", ["An invitation to offer", "An offer", "An acceptance", "A contract"], "The customer makes the offer at the counter."], ["Lalman Shukla v. Gauri Dutt (1913) is about…", ["Knowledge of the offer for acceptance", "Minor’s agreement", "Frustration", "Telephone contracts"], "No acceptance without knowledge of the offer."], ["A reply that changes the terms of an offer is a…", ["Counter offer", "Cross offer", "Standing offer", "General offer"], "It rejects the original offer."]], "line": "An <b>offer<\/b> is definite, communicated and meant to be binding. A price tag only <b>invites<\/b> offers."}, {"id": "s4", "e": "✉️", "t": "Acceptance and Its Communication", "nav": "Acceptance", "motion": ["When is acceptance complete?", "m4"], "ks": {"title": "Acceptance & communication", "art": "<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"Acceptance travels from acceptor to proposer; section 4 times it\"><rect width=\"300\" height=\"200\" rx=\"16\" fill=\"#0f1e3d\"/><g font-family=\"Poppins,sans-serif\" font-weight=\"700\" font-size=\"11\" text-anchor=\"middle\" fill=\"#f6f1e4\"><circle cx=\"50\" cy=\"90\" r=\"30\" fill=\"#2f6f8f\"/><text x=\"50\" y=\"96\" font-size=\"22\">🧑<\/text><text x=\"50\" y=\"140\">Proposer A<\/text><circle cx=\"250\" cy=\"90\" r=\"30\" fill=\"#9a7228\"/><text x=\"250\" y=\"96\" font-size=\"22\">👩<\/text><text x=\"250\" y=\"140\">Acceptor B<\/text><path d=\"M220 90 H80\" stroke=\"#c9a54b\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/><text x=\"150\" y=\"80\" fill=\"#c9a54b\">acceptance posted →<\/text><text x=\"150\" y=\"170\">Complete vs A: when POSTED<\/text><text x=\"150\" y=\"188\">Complete vs B: when it REACHES A<\/text><\/g><text font-size=\"22\"><animateMotion dur=\"3.5s\" repeatCount=\"indefinite\" path=\"M214 98 H78\"/>✉️<\/text><\/svg>", "simple": "<b>s.2(b):<\/b> When the offeree signifies his assent, the proposal is <b>accepted<\/b>. <b>s.7:<\/b> acceptance must be <b>absolute and unqualified<\/b> and expressed in a usual and reasonable manner (or the prescribed manner).", "pts": [["✅", "<b>Absolute & unqualified<\/b> — any change is a counter offer (s.7(1))."], ["📣", "Must be <b>communicated<\/b>. Mere silence is not acceptance."], ["⏱️", "<b>s.4:<\/b> complete against the <b>proposer<\/b> when put in course of transmission; against the <b>acceptor<\/b> when it comes to the proposer’s knowledge."], ["↩️", "<b>s.5:<\/b> proposal revocable until acceptance is complete against the proposer; acceptance revocable until it is complete against the acceptor."]], "an": "Posting your acceptance is like hitting “Send” on a message you can’t unsend for the other side — but you can still call before they read it.", "ex": "<details><summary>📝 Exam-ready answer · 8 points · tap to open ▾<\/summary><ul><li>According to Section 2(b), when the person to whom the proposal is made signifies his assent thereto, the proposal is said to be accepted<\/li><li>A proposal when accepted becomes a promise.<\/li><li>Rules of a valid acceptance: (1) it must be absolute and unqualified (s.7)<\/li><li>(2) it must be expressed in the usual and reasonable manner or the manner prescribed by the proposer (s.7)<\/li><li>(3) it must be communicated to the proposer — mere silence is not acceptance<\/li><li>(4) it must be given by the offeree with knowledge of the offer<\/li><li>(5) it must be given while the offer is still in force.<\/li><li>Under Section 4, communication of acceptance is complete as against the proposer when it is put in the course of transmission to him, and as against the acceptor when it comes to the knowledge of the proposer.<\/li><\/ul><\/details>"}, "words": ["acceptance", "revocation", "promise"], "flips": {"h": "Section 6 · four ways a proposal ends · tap", "items": [["📨", "Notice of revocation", "Proposer communicates the withdrawal before acceptance is complete against him.", "s.6(1)"], ["⌛", "Lapse of time", "The time fixed in the offer, or a reasonable time, passes without acceptance.", "s.6(2)"], ["📋", "Condition not fulfilled", "The acceptor fails to fulfil a condition precedent to acceptance.", "s.6(3)"], ["🕯️", "Death or insanity of proposer", "If it comes to the acceptor’s knowledge before acceptance.", "s.6(4)"]]}, "act": {"type": "revclock", "id": "s4t", "h": "⏱️ The Revocation Clock · offer by post", "try": "Move through the events with <b>Next event<\/b>. Watch the five status lights. At each ⚖️ pause, rule on the question before moving on.", "learn": "Under <b>s.4<\/b>, a posted acceptance binds the <b>proposer<\/b> as soon as it is posted, but binds the <b>acceptor<\/b> only when it reaches the proposer. So under <b>s.5<\/b>, the acceptor can still revoke until then — this is where Indian law differs from English law.", "title": "A offers by letter to sell his house to B", "lights": ["Offer communicated to B", "Acceptance complete against A", "Acceptance complete against B", "A can still revoke the offer", "B can still revoke acceptance"], "events": [{"t": "DAY 1 · 10:00", "e": "✉️", "text": "A posts a letter to B: “I offer to sell you my house for ₹40 lakh.”", "s": [0, 0, 0, 1]}, {"t": "DAY 3 · 11:00", "e": "📬", "text": "B receives and reads the letter.", "s": [1, 0, 0, 1], "q": ["Can B now accept the offer?", ["Yes — the offer is communicated once it comes to B’s knowledge (s.4)", "No — A must first send a reminder", "No — a house offer must be made in court"], "Communication of a proposal is complete when it comes to the knowledge of the person to whom it is made (s.4)."]}, {"t": "DAY 4 · 09:00", "e": "📮", "text": "B posts a letter of acceptance to A.", "s": [1, 1, 0, 0, 1], "q": ["At noon on Day 4, A sends a message: “I withdraw my offer.” Is the revocation valid?", ["No — acceptance became complete against A when B posted it, so A can no longer revoke (s.4, s.5)", "Yes — A has not received the acceptance yet", "Yes — an offer can be withdrawn at any time before payment"], "Once the acceptance is put in course of transmission, it is complete against the proposer. A proposal cannot be revoked after that (s.5)."]}, {"t": "DAY 5 · 08:00", "e": "📧", "text": "B changes her mind and e-mails A: “I revoke my acceptance.” A reads it at 08:05. The posted letter is still on the way.", "s": [1, 1, 0, 0, 1], "q": ["Is B’s revocation of acceptance valid?", ["Yes — acceptance can be revoked until it is complete against the acceptor, i.e. until it reaches A (s.5)", "No — a posted acceptance can never be withdrawn", "Only if A agrees to it"], "s.5: an acceptance may be revoked at any time before the communication of the acceptance is complete as against the acceptor, but not afterwards."]}, {"t": "DAY 6 · 10:00", "e": "⚖️", "text": "The acceptance letter reaches A — but the revocation reached him first. <b>Result: no contract.<\/b> (Fictional facts based on the illustrations to ss.4–5.)", "s": [1, 0, 0, 0, 0]}]}, "extra": [{"type": "casebrief", "id": "cb2", "h": "Real case · Bhagwandas Goverdhandas Kedia v. Girdharilal Parshottamdas & Co.", "try": "Instant communication (telephone) — where is the contract made? Decide before the court does.", "name": "Bhagwandas Goverdhandas Kedia v. M/s Girdharilal Parshottamdas & Co.", "court": "Supreme Court of India", "year": "Decided 30 August 1965", "cite": "AIR 1966 SC 543 · (1966) 1 SCR 656", "bench": "K.N. Wanchoo, M. Hidayatullah, J.C. Shah JJ. (majority by Shah J.; Hidayatullah J. dissenting)", "label": "Real Indian case · Telephone contracts", "facts": "<p>Girdharilal Parshottamdas & Co. of <b>Ahmedabad<\/b> made an offer by <b>long-distance telephone<\/b> to buy cotton-seed cake from the Kedia Ginning Factory at <b>Khamgaon<\/b>. The Khamgaon party accepted over the phone. The goods were not supplied, and the Ahmedabad firm sued in the City Civil Court at Ahmedabad for damages of ₹31,150.<\/p><p>The Khamgaon party argued the Ahmedabad court had no jurisdiction because the contract was made at Khamgaon.<\/p>", "issue": "<p>When an offer and acceptance are made by telephone, <b>where<\/b> is the contract formed — where the acceptance is <b>spoken<\/b> (Khamgaon) or where it is <b>heard<\/b> by the proposer (Ahmedabad)? This decides which court can hear the case.<\/p>", "args": [["For the Khamgaon party (appellant)", "Under s.4, acceptance is complete against the proposer when put in course of transmission. Speaking into the phone at Khamgaon was that moment, so the contract was made at Khamgaon."], ["For the Ahmedabad firm (respondent)", "Telephone talk is instantaneous, like talking face to face. The acceptance is complete only when the proposer hears it — at Ahmedabad."]], "predict": {"q": "Where was the contract made?", "opts": ["At Ahmedabad — where the proposer heard the acceptance", "At Khamgaon — where the acceptance was spoken", "Nowhere — telephone contracts are not valid", "At both places, so either court can hear it"], "why": "For instantaneous communication, the rule for posted letters does not fit; the acceptance must actually reach the proposer."}, "decision": "<p>By majority, the Supreme Court held that the contract was made at <b>Ahmedabad<\/b>, where the acceptance was heard by the proposer, so the Ahmedabad court had jurisdiction. Justice Hidayatullah dissented, reading s.4 to mean the contract was complete at Khamgaon.<\/p>", "principle": "<p>In <b>instantaneous communication<\/b> (telephone, and by extension live chat or video call), the contract is complete when, and where, the <b>acceptance is received by the proposer<\/b>. The “post rule” does not apply.<\/p>", "exam": "“In Bhagwandas Goverdhandas Kedia v. Girdharilal Parshottamdas (1966), the Supreme Court held that a contract made over telephone is complete at the place where the acceptance is heard by the proposer.”", "today": "You accept a seller’s offer on a live video call from Pune while the seller is in Jaipur: the contract is made where the seller hears your “yes”.", "src": [["Supreme Court of India — judgment (JUDIS PDF)", "https://main.sci.gov.in/jonew/judis/2902.pdf"], ["Indian Contract Act s.4 — India Code", "https://indiacode.nic.in/bitstream/123456789/2187/2/A187209.pdf"]]}, {"type": "fixarg", "id": "s4f", "h": "🖍️ Correct the lawyer’s argument", "try": "A junior lawyer drafted this argument. <b>Tap every line that is legally wrong<\/b>, press Check, then choose the correct version.", "who": "Draft argument for Ishaan (buyer)", "facts": "Kriti offered to sell her drone to Ishaan for ₹18,000 and said, “Reply by WhatsApp only.” Ishaan sent an e-mail: “I accept, but deliver it free to my home.” Kriti did not reply. Ishaan now sues for the drone.", "lines": [{"t": "Kriti made a valid offer because her terms were definite and communicated to Ishaan.", "wrong": false}, {"t": "Ishaan’s e-mail is a valid acceptance because acceptance can add small new conditions.", "wrong": true, "fix": ["Ishaan’s e-mail is a counter offer: acceptance must be absolute and unqualified (s.7), so adding free delivery rejected Kriti’s offer", "Ishaan’s e-mail is a cross offer", "Ishaan’s e-mail is a standing offer"], "why": "Any change in terms makes it a counter offer, not an acceptance."}, {"t": "Kriti’s silence after the e-mail means she accepted Ishaan’s terms.", "wrong": true, "fix": ["Silence is not acceptance; Kriti must communicate her acceptance of the counter offer", "Silence is acceptance if it lasts more than 24 hours", "Silence is acceptance in all online deals"], "why": "Acceptance must be communicated; mere silence does not create a contract."}, {"t": "The prescribed mode was WhatsApp; Kriti could insist on that mode within a reasonable time.", "wrong": false}, {"t": "Therefore a valid contract exists and Ishaan is entitled to the drone.", "wrong": true, "fix": ["Therefore no contract exists; Ishaan only made a counter offer, which Kriti never accepted", "Therefore a voidable contract exists at Ishaan’s option", "Therefore the contract is void because drones are unlawful"], "why": "No absolute acceptance → no agreement → no contract."}], "end": "Rules used: s.7 (absolute acceptance, prescribed manner) and communication of acceptance."}, {"type": "docfill", "id": "s4d", "h": "📝 Draft it right · letter of acceptance", "try": "Complete the letter so that it creates a <b>binding contract<\/b>. Each blank is a legal choice.", "title": "Letter of Acceptance", "doc": "Date: 12 March 2027<br>To: Mr. Farhan Ali, Ali Furnishings, Lucknow<br><br>Dear Sir,<br>With reference to your {0} dated 10 March 2027 to supply 40 classroom desks at ₹2,500 each, I hereby {1} your proposal {2}. As required in your letter, this acceptance is sent {3}. Kindly treat this letter as {4}.<br><br>Yours faithfully,<br>Principal, Green Valley School", "blanks": [["proposal (offer)", "invitation to offer", "advertisement", "A letter offering definite terms to the school is a proposal, s.2(a)."], ["accept", "consider", "negotiate", "Only a clear “accept” is assent under s.2(b)."], ["without any change in its terms", "subject to a 10% discount", "if you deliver by tomorrow", "s.7: acceptance must be absolute and unqualified; any condition = counter offer."], ["by registered post, the mode you prescribed", "by any mode I prefer", "through a friend orally", "s.7(2): follow the prescribed manner of acceptance."], ["our acceptance, completing the agreement between us", "a fresh offer from the school", "a request for a quotation", "The letter communicates acceptance; with the s.10 essentials it is a contract."]], "done": "The letter is an absolute, communicated acceptance in the prescribed mode — a binding agreement."}], "quiz": [["Acceptance must be…", ["Absolute and unqualified", "Conditional", "Silent", "Always in writing"], "s.7(1)."], ["Communication of acceptance is complete against the proposer when…", ["It is put in course of transmission to him", "It reaches the proposer", "The acceptor decides to accept", "The goods are delivered"], "s.4."], ["In Bhagwandas Kedia (1966), a telephone contract was held to be made…", ["Where the acceptance was heard", "Where the acceptance was spoken", "Where the goods were stored", "Nowhere"], "Ahmedabad."]], "line": "Acceptance: <b>absolute<\/b>, <b>communicated<\/b>, in the <b>right mode<\/b>. Post: binds the proposer on posting. Phone: complete where it is <b>heard<\/b>."}], "board": {"after": 3, "title": "Deal Map in 3D", "try": "Tap the buildings and the moving tokens. Switch flows on and off to see which messages bind whom.", "modes": [{"id": "flow", "label": "✉️ Offer & acceptance", "kit": "flow", "tag": "SECTIONS 4 & 5", "title": "Who is bound, and when?", "intro": "Gold tokens are the <b>offer<\/b>, teal tokens the <b>acceptance<\/b>, red tokens a <b>revocation<\/b>. Tap anything.", "nodes": [{"id": "a", "label": "Proposer A", "emoji": "🧑", "x": -15, "z": 0, "shape": "house", "color": "#2f6f8f", "info": "Makes the proposal. Bound once B <b>posts<\/b> the acceptance (s.4). Can revoke only before that (s.5)."}, {"id": "po", "label": "Post / network", "emoji": "📮", "x": 0, "z": -8, "shape": "tower", "color": "#c9a54b", "info": "Once acceptance is “in course of transmission” and out of B’s power, it is complete against A."}, {"id": "b", "label": "Acceptor B", "emoji": "👩", "x": 15, "z": 0, "shape": "house", "color": "#9a7228", "info": "Bound only when the acceptance <b>reaches A<\/b>. Until then she may revoke her acceptance (s.5)."}, {"id": "ct", "label": "Civil court", "emoji": "🏛️", "x": 0, "z": 10, "shape": "govt", "color": "#323338", "info": "Enforces the contract if all s.10 essentials are met — damages or other remedies."}], "edges": [{"from": "a", "to": "b", "color": "#c9a54b", "label": "offer (s.2(a))", "group": "off"}, {"from": "b", "to": "po", "color": "#2f6f8f", "label": "acceptance posted", "group": "acc"}, {"from": "po", "to": "a", "color": "#2f6f8f", "label": "acceptance reaches A", "group": "acc"}, {"from": "b", "to": "a", "color": "#a63d32", "label": "revocation of acceptance", "group": "rev", "side": 1}, {"from": "a", "to": "ct", "color": "#323338", "label": "suit for breach", "group": "court"}], "groups": [{"id": "off", "label": "Offer", "say": ["Offer travels to B", "Offer hidden"]}, {"id": "acc", "label": "Acceptance", "say": ["Acceptance on its way", "Acceptance hidden"]}, {"id": "rev", "label": "Revocation", "say": ["B revokes before it reaches A — valid (s.5)", "Revocation hidden"]}, {"id": "court", "label": "Court", "say": ["Breach taken to court", "Court hidden"]}], "note": "Facts are fictional; rules are from ss.4–6 of the Indian Contract Act, 1872."}]}, "summary": {"blocks": [{"type": "speed", "id": "sp1", "h": "⚡ 60-second Rapid Ruling", "secs": 60, "items": [["Contract is defined in…", ["s.2(h)", "s.2(e)", "s.10", "s.4"], ""], ["Agreement is defined in…", ["s.2(e)", "s.2(h)", "s.2(a)", "s.7"], ""], ["A proposal when accepted becomes a…", ["Promise", "Contract", "Tender", "Consideration"], ""], ["A menu card is…", ["An invitation to offer", "An offer", "An acceptance", "A contract"], ""], ["Acceptance must be…", ["Absolute and unqualified", "Conditional", "Implied only", "Written only"], ""], ["Silence is…", ["Not acceptance", "Always acceptance", "A counter offer", "A revocation"], ""], ["Agreement with a minor is…", ["Void", "Voidable", "Valid", "Illegal"], ""], ["Contract induced by coercion is…", ["Voidable", "Void", "Valid", "Illegal"], ""], ["Telephone contract is complete where acceptance is…", ["Heard by the proposer", "Spoken", "Written down", "Paid for"], ""], ["Knowledge of offer is essential — case?", ["Lalman Shukla v. Gauri Dutt", "Bhagwandas Kedia", "Mohori Bibee", "Satyabrata Ghose"], ""]]}, {"type": "memmatch", "id": "mm1", "h": "🃏 Case-law flashcards · match case to principle", "pairs": [["Lalman Shukla (1913)", "No acceptance without knowledge of offer"], ["Bhagwandas Kedia (1966)", "Phone contract made where acceptance is heard"], ["Carlill (Eng., 1893)", "General offer accepted by performance"], ["Harvey v Facey (PC, 1893)", "Quoting lowest price is not an offer"], ["Balfour v Balfour (Eng., 1919)", "Domestic promise: no legal intention"]]}, {"type": "cmp", "h": "Frequently confused", "heads": ["Pair", "First", "Second"], "rows": [["Offer vs invitation to offer", "Can be accepted to make an agreement", "Only invites offers (price tag, menu, tender notice)"], ["Counter offer vs cross offer", "Reply that changes terms; rejects the offer", "Two identical offers that cross; no acceptance yet"], ["General vs specific offer", "To the public; accepted by performing", "To a definite person; only that person accepts"], ["Void vs voidable", "Not enforceable at all (s.2(g))", "Enforceable at the option of one party (s.2(i))"], ["Acceptance complete vs proposer / acceptor", "When put in course of transmission", "When it comes to the proposer’s knowledge"]]}, {"type": "cmp", "h": "Important provisions · Indian Contract Act, 1872", "heads": ["Section", "Says", "Use in exam"], "rows": [["2(a)", "Proposal", "Define offer"], ["2(b)", "Acceptance; promise", "Define acceptance"], ["2(e) / 2(h)", "Agreement / contract", "Agreement vs contract"], ["4", "Communication when complete", "Post & phone questions"], ["5 / 6", "Revocation: when and how", "Revocation questions"], ["7", "Acceptance absolute; manner", "Counter-offer questions"], ["10", "What agreements are contracts", "Essentials"], ["11", "Who is competent", "Minors (Part 2)"]]}], "line": "<b>Offer → acceptance → agreement → (s.10 essentials) → contract.<\/b> Know s.2, s.4, s.5, s.7 and s.10, plus Lalman Shukla and Bhagwandas Kedia."}, "exam": {"qs": [{"m": 1, "q": "Define a contract as per the Indian Contract Act, 1872.", "pts": ["An agreement enforceable by law — Section 2(h)"]}, {"m": 1, "q": "What is an invitation to offer? Give one example.", "pts": ["An invitation to others to make an offer; it cannot be accepted", "Example: price tag / menu / catalogue / tender notice"]}, {"m": 2, "q": "“All contracts are agreements but all agreements are not contracts.” Explain.", "pts": ["Contract = agreement + enforceability (s.2(h)); agreement = s.2(e)", "Agreements lacking s.10 essentials (e.g. social agreements) are not contracts"]}, {"m": 3, "q": "State any three rules of a valid acceptance.", "pts": ["Absolute and unqualified (s.7(1))", "Expressed in the usual/reasonable or prescribed manner (s.7(2))", "Communicated to the proposer; silence is not acceptance (any one more: by the offeree, with knowledge of offer, while offer in force)"]}, {"m": 4, "q": "Explain when the communication of a proposal and of an acceptance is complete under Section 4, with an example.", "pts": ["Proposal: complete when it comes to the knowledge of the offeree", "Acceptance vs proposer: when put in course of transmission, out of acceptor’s power", "Acceptance vs acceptor: when it comes to the knowledge of the proposer", "Example: offer by letter; B posts acceptance — A bound on posting, B bound on receipt"]}, {"m": 4, "tag": "Case-based", "q": "Arjun lost his phone and announced on a college group a reward of ₹1,000 for anyone who returned it. Simran, who was not on the group and had not seen the message, found and returned the phone. Later she learnt of the reward and claimed it. Can she claim? Support your answer with a decided case.", "pts": ["Reward announcement is a general offer", "Acceptance requires knowledge of the offer", "Simran did not know of the offer at the time — no acceptance", "Not entitled: Lalman Shukla v. Gauri Dutt (Allahabad HC, 1913)"]}, {"m": 6, "q": "Discuss the essentials of a valid contract under Section 10 of the Indian Contract Act, 1872.", "pts": ["Offer and acceptance; intention to create legal relations", "Free consent (s.14)", "Competent parties (s.11)", "Lawful consideration and lawful object (s.23)", "Not expressly declared void; certainty (s.29) and possibility of performance (s.56)", "Legal formalities where required; conclusion: absence makes agreement void/voidable"]}, {"m": 6, "tag": "Competency-based", "q": "A firm in Delhi offered on a phone call to buy rice from a mill in Karnal. The mill accepted on the call. Later the mill failed to supply. (a) Where was the contract made? (b) Which principle and case apply? (c) How would the answer differ if the acceptance had been sent by post?", "pts": ["(a) At Delhi, where the acceptance was heard by the proposer", "(b) Instantaneous communication: contract complete where acceptance is received — Bhagwandas Goverdhandas Kedia v. Girdharilal Parshottamdas (SC, 1966)", "(c) By post: complete against the proposer when posted (s.4), so the post rule applies; acceptor bound when it reaches the proposer", "Delhi court has jurisdiction for the phone contract"]}], "mcq": [["Assertion (A): A price tag on a shirt is an offer. Reason (R): An invitation to offer cannot be accepted to form a contract.", ["A is false, but R is true", "Both A and R are true, and R explains A", "Both A and R are true, but R does not explain A", "A is true, but R is false"], "A price tag is an invitation to offer.", "A–R"], ["Assertion (A): Under Indian law, an acceptor may revoke a posted acceptance before it reaches the proposer. Reason (R): Communication of acceptance is complete as against the acceptor only when it comes to the knowledge of the proposer.", ["Both A and R are true, and R explains A", "Both A and R are true, but R does not explain A", "A is true, but R is false", "A is false, but R is true"], "s.4 read with s.5.", "A–R"], ["Meena offers to sell her laptop to Tarun for ₹30,000. Tarun replies, “I’ll take it for ₹28,000.” Meena refuses. Tarun then says, “Fine, ₹30,000.” Which is correct?", ["Tarun’s second reply is a fresh offer; Meena is free to refuse", "A contract was formed at ₹30,000", "A contract was formed at ₹28,000", "Meena is bound because she made the first offer"], "The counter offer killed the original offer.", "Case-based"], ["Match: (i) s.2(a) (ii) s.2(h) (iii) s.7 (iv) s.10 with (P) Contract (Q) Essentials (R) Proposal (S) Absolute acceptance", ["i-R, ii-P, iii-S, iv-Q", "i-P, ii-R, iii-Q, iv-S", "i-R, ii-Q, iii-S, iv-P", "i-S, ii-P, iii-R, iv-Q"], "", "Match"]]}, "next": "Part 2 · Capacity, Free Consent, Consideration · Void and Voidable Agreements"};window.NF_IMG={};const MSPEC=window.NOTE.mspec||{};</script>

  host.querySelector('.fbx').innerHTML='<div class="fb '+(exact?'ok':'no')+'">'+(exact?'🎉 Correct! '+(a.okMsg||'Only final goods counted')+': <b>'+fm(right)+'</b>. '+(a.win||''):t>right?'❌ Too much! You counted <b>'+fm(t-right)+'</b> extra. '+(a.overMsg||'That is <b>double counting</b>.')+' Green = count, red = remove.':'❌ '+(a.missMsg||'You missed some final goods.')+' The right total is <b>'+fm(right)+'</b>. Green boxes are the ones to count.')+'</div>';if(exact){xp(a.id,10);confetti(host.querySelector('.ctmeter'))}}};
/* water tank: stock vs flow simulator */
W.tank=(host,a)=>{const v={s0:a.s0||100,fin:a.fin||20,fout:a.fout||5,t:0};let n=0;
 host.innerHTML='<div class="tk"><svg viewBox="0 0 320 260" class="tksvg"><text x="70" y="40" font-size="40">🚰</text><g class="drops"></g><rect x="60" y="70" width="200" height="160" rx="12" fill="#fff" stroke="var(--navy)" stroke-width="4"/><rect class="wl" x="64" y="226" width="192" height="0" fill="var(--teal)" opacity=".85"/><text class="wt" x="160" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="var(--navy)"></text><text x="275" y="250" font-size="26">🚿</text></svg><div class="tkc">'+
 [['fin','Water IN (litres per minute)',0,50],['fout','Water OUT (litres per minute)',0,50],['t','Time passed (minutes)',0,30]].map(q=>'<label>'+q[1]+': <b data-o="'+q[0]+'"></b><input type="range" min="'+q[2]+'" max="'+q[3]+'" value="'+v[q[0]]+'" data-k="'+q[0]+'"></label>').join('')+'<div class="tkout"></div><div class="row"><button class="btn sm" type="button">▶ Run 10 minutes</button></div></div></div>';
 const g=s=>host.querySelector(s);
 function upd(){host.querySelectorAll('[data-o]').forEach(b=>b.textContent=v[b.dataset.o]);const s=Math.max(0,v.s0+(v.fin-v.fout)*v.t),cap=v.s0+50*30;const h=Math.min(152,s/cap*152*2.2);g('.wl').setAttribute('y',226-h);g('.wl').setAttribute('height',h);g('.wt').textContent=Math.round(s)+' L';
  g('.tkout').innerHTML='<div class="fb ok">🚰 <b>Flow</b> = '+v.fin+' L per minute in, '+v.fout+' L per minute out (needs a <b>period</b>: “per minute”).<br>🪣 <b>Stock</b> at minute '+v.t+' = '+v.s0+' + ('+v.fin+' − '+v.fout+') × '+v.t+' = <b>'+Math.round(s)+' litres</b> (at a <b>point</b> of time).</div>';
  g('.drops').innerHTML=v.fin>0?'<text x="80" y="60" font-size="16">💧<animate attributeName="y" values="55;210" dur="'+(1.6-v.fin/50).toFixed(2)+'s" repeatCount="indefinite"/></text>':'';if(++n>4)xp(a.id,10)}
 host.querySelectorAll('input').forEach(i=>i.oninput=()=>{v[i.dataset.k]=+i.value;upd()});
 g('.btn').onclick=()=>{let k=0;const id=setInterval(()=>{if(k++>=10||v.t>=30)return clearInterval(id);v.t++;host.querySelector('[data-k=t]').value=v.t;upd()},250)};upd()};
/* timed speed round: items mcq [q,[correct,..],why], secs, lives */
W.speed=(host,a)=>{const secs=a.secs||60;
 function intro(){host.innerHTML='<div class="sp"><div class="big">⏱️</div><b>'+(a.items.length)+' questions · '+secs+' seconds · 3 lives ❤️❤️❤️</b><p>Answer fast. Each right answer gives +1. Ready?</p><button class="btn" type="button">▶ Start</button></div>';host.querySelector('.btn').onclick=go}
 function go(){const Q=a.items.map(x=>x).sort(()=>Math.random()-.5);let i=0,sc=0,lives=3,left=secs,end=false;
  host.innerHTML='<div class="sp run"><div class="sphd"><span class="spl"></span><span class="sps"></span><span class="spt"></span></div><div class="sptb"><i></i></div><div class="spq"></div></div>';
  const tick=setInterval(()=>{left--;hd();if(left<=0)fin()},1000);
  function hd(){host.querySelector('.spl').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);host.querySelector('.sps').textContent='Score '+sc;host.querySelector('.spt').textContent=left+'s';host.querySelector('.sptb i').style.width=(left/secs*100)+'%'}
  function q(){if(end)return;if(i>=Q.length)return fin();const x=Q[i],ord=x[1].map((_,k)=>k).sort(()=>Math.random()-.5);host.querySelector('.spq').innerHTML='<div class="qq">'+x[0]+'</div><div class="spo">'+ord.map(k=>'<button type="button" class="opt" data-k="'+k+'">'+x[1][k]+'</button>').join('')+'</div>';
   host.querySelectorAll('.spo .opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;host.querySelectorAll('.spo .opt').forEach(o=>{o.disabled=true;if(+o.dataset.k===0)o.classList.add('ok')});if(k===0){sc++;confetti(b)}else{b.classList.add('no');lives--}hd();setTimeout(()=>{i++;lives<=0?fin():q()},k===0?450:1100)})}
  function fin(){if(end)return;end=true;clearInterval(tick);host.innerHTML='<div class="sp"><div class="big">'+(sc>=Q.length*.8?'🏆':sc>=Q.length*.5?'🥈':'💪')+'</div><b>Score: '+sc+' / '+Q.length+'</b><p>'+(sc>=Q.length*.8?'Champion! You know this part.':'Good try. Revise the one-liners and play again.')+'</p><button class="btn" type="button">↺ Play again</button></div>';host.querySelector('.btn').onclick=go;if(sc>=Q.length*.6)xp(a.id,15)}
  hd();q()}
 intro()};
/* memory match: pairs:[[term, meaning]...] 4-6 */
W.memmatch=(host,a)=>{const n=a.pairs.length;let first=null,lock=false,moves=0,done=0;
 const cards=[];a.pairs.forEach((p,k)=>{cards.push({k,t:p[0],side:'a'});cards.push({k,t:p[1],side:'b'})});cards.sort(()=>Math.random()-.5);
 host.innerHTML='<div class="mm"><div class="mmhd"><span class="mmm">Moves 0</span><span class="mmp">Pairs 0 / '+n+'</span></div><div class="mmg">'+cards.map((c,i)=>'<button type="button" class="mmc" data-i="'+i+'"><span class="mmf">❓</span><span class="mmb">'+c.t+'</span></button>').join('')+'</div><div class="fbx"></div></div>';
 const els=[...host.querySelectorAll('.mmc')];
 els.forEach((el,i)=>el.onclick=()=>{if(lock||el.classList.contains('up')||el.classList.contains('ok'))return;el.classList.add('up');
  if(first===null){first=i;return}
  moves++;host.querySelector('.mmm').textContent='Moves '+moves;const A=cards[first],B=cards[i];
  if(A.k===B.k&&A.side!==B.side){els[first].classList.add('ok');el.classList.add('ok');confetti(el);done++;first=null;host.querySelector('.mmp').textContent='Pairs '+done+' / '+n;
   if(done===n){const st=moves<=n+2?'⭐⭐⭐':moves<=n*2?'⭐⭐':'⭐';host.querySelector('.fbx').innerHTML='<div class="fb ok">🎉 All pairs found in <b>'+moves+'</b> moves! '+st+'</div>'}}
  else{lock=true;const f=first;first=null;setTimeout(()=>{els[f].classList.remove('up');el.classList.remove('up');lock=false},900)}})};
/* true/false rush: items:[[statement, true|false, why]] */
W.tfrush=(host,a)=>{function go(){const Q=a.items.map(x=>x).sort(()=>Math.random()-.5);let i=0,sc=0,lives=3,streak=0,best=0;
  function show(){if(i>=Q.length||lives<=0){const w=sc>=Q.length*.8;host.innerHTML='<div class="tf"><div class="big">'+(w?'🏆':sc>=Q.length*.5?'🥈':'💪')+'</div><b>'+sc+' / '+Q.length+' right · best streak '+best+'</b><p>'+(w?'Sharp eyes! Nothing fools you.':'Read the reasons and try again.')+'</p><button class="btn sm" type="button">↺ Play again</button></div>';host.querySelector('.btn').onclick=go;return}
   const x=Q[i];host.innerHTML='<div class="tf"><div class="tfhd"><span>'+'❤️'.repeat(lives)+'🤍'.repeat(3-lives)+'</span><span>'+(streak>=2?'🔥 '+streak:'')+'</span><span>'+(i+1)+' / '+Q.length+'</span></div><div class="tfq">'+x[0]+'</div><div class="tfb"><button type="button" class="tfy">✅ True</button><button type="button" class="tfn">❌ False</button></div><div class="fbx"></div></div>';
   let busy=false;const ans=v=>{if(busy)return;busy=true;const ok=v===!!x[1];if(ok){sc++;streak++;best=Math.max(best,streak);confetti(host.querySelector(v?'.tfy':'.tfn'))}else{lives--;streak=0}
    host.querySelector('.fbx').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✅ Correct! ':'❌ It is <b>'+(x[1]?'True':'False')+'</b>. ')+(x[2]||'')+'</div>';setTimeout(()=>{i++;show()},ok?900:1900)};
   host.querySelector('.tfy').onclick=()=>ans(true);host.querySelector('.tfn').onclick=()=>ans(false)}
  show()}go()};
/* boss battle: name, emoji, items mcq [q,[correct,...],why] */
W.boss=(host,a)=>{function go(){const Q=a.items.map(x=>x).sort(()=>Math.random()-.5);const hp0=Q.length;let i=0,hp=hp0,lives=3;
  function show(){if(hp<=0||lives<=0||i>=Q.length){const win=hp<=0||(lives>0&&hp<=Math.ceil(hp0*.2));host.innerHTML='<div class="bs"><div class="big">'+(win?'🏆':'💥')+'</div><b>'+(win?(a.name||'Boss')+' defeated!':(a.name||'Boss')+' wins this round')+'</b><p>'+(win?'You beat the boss. Revise one more time to stay sharp.':'Review the tips and fight again.')+'</p><button class="btn sm" type="button">↺ Fight again</button></div>';host.querySelector('.btn').onclick=go;return}
   const x=Q[i],ord=x[1].map((_,k)=>k).sort(()=>Math.random()-.5);
   host.innerHTML='<div class="bs"><div class="bshd"><span class="bsl">'+'❤️'.repeat(lives)+'🤍'.repeat(3-lives)+'</span><span class="bsn">'+(a.emoji||'👾')+' '+(a.name||'Boss')+'</span></div><div class="bshp"><i style="width:'+(hp/hp0*100)+'%"></i></div><div class="bsq"><div class="qq">'+x[0]+'</div><div class="spo">'+ord.map(k=>'<button type="button" class="opt" data-k="'+k+'">'+x[1][k]+'</button>').join('')+'</div></div><div class="fbx"></div></div>';
   host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;host.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.k===0)o.classList.add('ok')});
    if(k===0){hp--;confetti(b);host.querySelector('.bsn').classList.add('hit')}else{b.classList.add('no');lives--}
    host.querySelector('.fbx').innerHTML='<div class="fb '+(k===0?'ok':'no')+'">'+(k===0?'💥 Direct hit! ':'❌ Ouch! ')+(x[2]||'')+'</div>';setTimeout(()=>{i++;show()},k===0?900:1900)})}
  show()}go()};
/* ---------- render ---------- */
const app=$('#app');let html='',M=N.meta||{};
html+='<section class="hero" id="top"><div><span class="kick">'+esc(M.kicker||'')+'</span><h1>'+M.titleHtml+'</h1><p class="lead">'+M.lead+'</p><div class="row"><a class="btn" href="#'+(STEPS[0]?STEPS[0].id:'top')+'" style="text-decoration:none">Start the journey →</a>'+(false?'<a class="btn teal" href="#b3" style="text-decoration:none">🧊 Open the 3D board</a>':'')+'</div></div><div class="heroart">'+(N.hero||'')+'</div></section>';
(N.opener||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
if(N.points&&N.points.length)html+='<div class="blk card mp"><div class="ttl"><span class="ic">🎯</span>Main points of this part</div><ol class="mpl">'+N.points.map(p=>'<li><b>'+p[0]+'</b><span>'+p[1]+'</span></li>').join('')+'</ol></div>';
else if(N.hook)html+='<div class="blk">'+predict(N.hook)+'</div>';
(N.intro||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
html+='<div class="blk"><div class="ttl"><span class="ic">🗺️</span>Today’s journey</div>'+journey(-1)+'</div>';
if(N.showCast&&N.cast&&N.cast.length)html+='<div class="blk card"><div class="ttl"><span class="ic">🎭</span>The cast</div><div class="row" style="gap:14px">'+N.cast.map(c=>'<div class="row" style="gap:8px">'+face(c.key)+'<div><b>'+esc(c.name)+'</b><br><small style="color:var(--mut)">'+esc(c.role)+'</small></div></div>').join('')+'</div></div>';
const boardAfter=false?(N.board.after==null?0:N.board.after):-9;
function boardHtml(){const b=N.board;return '<section class="step" id="b3"><div class="sh"><span class="no">3D</span><div><small>INTERACTIVE BOARD</small><h2>'+b.title+'</h2></div></div><div class="card" data-mission="b3"><div class="try">'+b.try+'</div><div class="modes">'+b.modes.map((m,i)=>'<button class="'+(i?'':'on')+'" data-m="'+m.id+'" type="button">'+m.label+'</button>').join('')+'</div><div class="b3"><div class="cv" id="cv"><div class="lbls" id="lbls"></div><div class="help">Drag to rotate · scroll or pinch to zoom · tap an object</div></div><div class="panel card" id="pan"></div></div></div></section>'}
function extraBlock(x){if(window.NFX&&NFX[x.type]){const id='x-'+uid();setTimeout(()=>{const h=document.getElementById(id);h.innerHTML='<div class="card" data-mission="'+(x.id||id)+'"><div class="ttl"><span class="ic">'+(NFX_IC[x.type]||'✨')+'</span>'+(x.h||'')+'</div>'+(x.try?'<div class="try">'+x.try+'</div>':'')+'<div class="s"></div></div>';NFX[x.type](h.querySelector('.s'),x)},0);return '<div id="'+id+'"></div>'}
 if(x.type==='cmp')return cmp(x);if(x.type==='formula')return formula(x);if(x.type==='timeline')return timeline(x);if(x.type==='story')return story(x);if(x.type==='flips')return flips(x);if(x.type==='html')return x.html;
 if(W[x.type]){const id='x-'+uid();setTimeout(()=>{const h=document.getElementById(id);h.innerHTML=actWrap(x,'<div class="s"></div>');W[x.type](h.querySelector('.s'),x)},0);return '<div id="'+id+'"></div>'}return ''}
STEPS.forEach((s,i)=>{
 html+='<section class="step" id="'+s.id+'"><div class="sh"><span class="no">'+(i+1)+'</span><div><small>STEP '+(i+1)+' OF '+STEPS.length+'</small><h2>'+esc(s.t)+'</h2></div></div>';
 if(s.ks)html+='<div class="blk">'+keyslide(s.ks,i)+'</div>';
 (s.pics||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.motion)html+='<div class="blk"><div class="ttl"><span class="ic">🎬</span>See it: '+esc(s.motion[0])+'</div><div class="mo" data-spec="'+s.motion[1]+'"></div></div>';
 if(s.pred)html+='<div class="blk">'+predict(s.pred)+'</div>';if(s.words&&s.words.length)html+='<div class="blk">'+words(s.words)+'</div>';if(s.flips)html+='<div class="blk">'+flips(s.flips)+'</div>';(s.codes||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 (s.before||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.act)html+='<div class="blk">'+extraBlock(s.act)+'</div>';
 (s.extra||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');
 if(s.quiz)html+='<div class="blk">'+quiz(s.quiz,s.id+'q')+'</div>';if(s.line)html+='<div class="blk">'+oneline(s.line)+'</div>';html+='</section>';
 if(i===boardAfter)html+=boardHtml()});
if(N.summary){html+='<section class="step" id="sum"><div class="sh"><span class="no">★</span><div><small>REVISION</small><h2>The Ultimate Summary</h2></div></div>';(N.summary.blocks||[]).forEach(x=>html+='<div class="blk">'+extraBlock(x)+'</div>');if(N.summary.line)html+='<div class="blk">'+oneline(N.summary.line)+'</div>';html+='</section>'}
if(N.exam)html+='<section class="step" id="exam"><div class="sh"><span class="no">✍️</span><div><small>BOARD PRACTICE</small><h2>Exam Corner</h2></div></div><div class="blk">'+exam(N.exam)+'</div>'+(N.exam.mcq?'<div class="blk">'+quiz(N.exam.mcq,'examq')+'</div>':'')+'</section>';
if(N.next)html+='<div class="blk card" style="text-align:center"><b>Up next:</b> '+N.next+'</div>';
app.innerHTML=html;
$('#nav').innerHTML='<a href="#top">Start</a>'+STEPS.map((s,i)=>'<a href="#'+s.id+'" data-m="'+s.id+'q">'+(i+1)+'. '+esc(s.nav||s.t)+'</a>').join('')+(false?'<a href="#b3" data-m="b3">3D board</a>':'')+(N.summary?'<a href="#sum">Summary</a>':'')+(N.exam?'<a href="#exam" data-m="exam">Exam corner</a>':'');
document.querySelectorAll('.exq input[type=checkbox]').forEach(c=>c.addEventListener('change',()=>{const i=c.dataset.ex,all=document.querySelectorAll('[data-ex="'+i+'"]'),n=[...all].filter(x=>x.checked).length;document.querySelector('[data-sc="'+i+'"]').textContent='Ticked: '+n+' / '+all.length;if(n)xp('exam',10)}));
gwrap(app);
const mio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.on){e.target.dataset.on=1;Motion(e.target,MSPEC[e.target.dataset.spec])}}),{rootMargin:'200px'});
document.querySelectorAll('.mo').forEach(m=>mio.observe(m));
$('#thm').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('#thm').textContent=d?'🌙':'☀️'};
if(false&&window.Board3D)window.Board3D(N.board,xp);
})();
</script>
